# Bun owns the workspace manifests and root bun.lock. Version updates remain
# disabled; security updates are repaired by dependabot-sync.yml so root pins
# and generated documentation follow the same upgrade.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns:
          - "*"
