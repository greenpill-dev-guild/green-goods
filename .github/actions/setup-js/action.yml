name: Setup Green Goods JavaScript
description: Pin Node and Bun, then install the frozen lockfile

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: "22.22.1"

    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: "1.3.14"

    # Deliberately uncached. Measured on this repository (PR #719, run
    # 31963610888): restoring the ~878 MB Bun download store cost 20.7s
    # (4s transfer, 16.6s extraction) to make `bun install` 21.8s -> 6.9s,
    # a net loss of ~6s per job. The store also consumed 1.02 GB of an
    # already-over-quota 10 GB repository cache, evicting the per-commit
    # Foundry build caches that do pay for themselves. Reintroduce only with
    # fresh before/after evidence that restore cost is below install savings.
    - name: Install dependencies from frozen lockfile
      shell: bash
      run: bun install --frozen-lockfile
