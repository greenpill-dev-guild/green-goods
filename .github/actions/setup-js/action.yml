name: Setup Green Goods JavaScript
description: Pin Node and Bun, restore Bun's download cache, and install the frozen lockfile

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: "22.22.1"

    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: "1.3.14"

    # Cache only Bun's content-addressed download store. node_modules, generated
    # files, coverage, and build output are always reconstructed from the lockfile.
    - name: Cache Bun dependency downloads
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ~/.bun/install/cache
        key: bun-js-${{ runner.os }}-${{ runner.arch }}-node-22.22.1-bun-1.3.14-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-js-${{ runner.os }}-${{ runner.arch }}-node-22.22.1-bun-1.3.14-

    - name: Install dependencies from frozen lockfile
      shell: bash
      run: bun install --frozen-lockfile
