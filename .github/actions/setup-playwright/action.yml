name: Setup Playwright Chromium
description: Install Playwright's Chromium browser and system dependencies from a package cache, with bounded, retried network access

runs:
  using: composite
  steps:
    # `playwright install --with-deps` shells out to `apt-get update`, which has
    # no default overall timeout. On 2026-08-18 (admin run 32097509859) the Azure
    # regional mirror returned Ign for every noble index, apt failed over to
    # archive.ubuntu.com, then stalled after the last InRelease fetch with zero
    # output for 28m47s until the 30-minute job timeout killed it. The same step
    # normally finishes in ~22s. Bounding the transfer turns a silent 30-minute
    # hang into a fast failure that the retry below usually recovers on its own.
    #
    # `APT::Get::Upgrade "false"` keeps the libraries the runner image already
    # ships. install-deps names every library on its command line, so each
    # Ubuntu update to one of them was downloaded on every run until the image
    # caught up: the 2026-11-17 mesa update added 11 MB to every setup. Only
    # missing packages (fonts, on ubuntu-24.04) are fetched now, which keeps the
    # package cache below valid for a whole runner image.
    - name: Configure apt for Playwright system dependencies
      shell: bash
      run: |
        sudo tee /etc/apt/apt.conf.d/99-green-goods-playwright >/dev/null <<'EOF'
        Acquire::http::Timeout "20";
        Acquire::https::Timeout "20";
        Acquire::Retries "2";
        APT::Get::Upgrade "false";
        APT::Keep-Downloaded-Packages "true";
        EOF

    # Since 2026-11-17 some ubuntu-24.04 jobs run on AWS and download from
    # us-east-2.ec2.archive.ubuntu.com, which can serve the font packages at
    # tens of kB/s: 19 of 19 setup failures on 17 and 18 November were on that
    # mirror. Keeping the .deb files in the Actions cache means a slow mirror
    # only costs time when the runner image or Playwright version changes.
    # The image and Playwright version together fix which packages are
    # missing, so they key the cache.
    - name: Key the system package cache
      id: apt-cache-key
      shell: bash
      run: |
        playwright_version="$(node -p 'require("@playwright/test/package.json").version')"
        os_prefix="playwright-apt-v1-${ImageOS:-unknown}-${RUNNER_ARCH}-"
        {
          echo "dir=$HOME/.cache/green-goods-playwright-apt"
          echo "os-prefix=$os_prefix"
          echo "prefix=$os_prefix$playwright_version-"
          echo "key=$os_prefix$playwright_version-${ImageVersion:-unknown}"
        } >> "$GITHUB_OUTPUT"

    # A stalled restore is a cache miss, not a failure: the segment timeout
    # bounds it, and the install below falls back to the mirror.
    - name: Restore cached system packages
      id: apt-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: "1"
      with:
        path: ${{ steps.apt-cache-key.outputs.dir }}
        key: ${{ steps.apt-cache-key.outputs.key }}
        restore-keys: |
          ${{ steps.apt-cache-key.outputs.prefix }}
          ${{ steps.apt-cache-key.outputs.os-prefix }}

    # Split from the browser download so the log names which half stalled: the
    # apt leg (system libraries) or the CDN leg (Chromium itself).
    #
    # Retry budget must stay under the caller's `timeout-minutes`, which covers
    # this whole action. `--kill-after` extends each attempt, so one attempt costs
    # up to ATTEMPT_TIMEOUT + KILL_GRACE, and a dependency retry first spends up
    # to REPAIR_TIMEOUT + 5s repairing dpkg. Worst case is the cache restore
    # timing out, then one leg nearly exhausting its budget before succeeding,
    # then the other failing outright:
    #   60 + (180 + 35 + 30 + 149) + (2*180 + 30) = 844s, against a 900s cap.
    # Keep that inequality true if any value here or `timeout-minutes` changes.
    - name: Install Playwright Chromium and system dependencies
      shell: bash
      env:
        ATTEMPT_TIMEOUT: 150s
        KILL_GRACE: 30s
        REPAIR_TIMEOUT: 30s
        RETRY_BACKOFF: 30
        MAX_ATTEMPTS: 2
        PACKAGE_CACHE: ${{ steps.apt-cache-key.outputs.dir }}
        APT_ARCHIVES: /var/cache/apt/archives
      run: |
        prepare_dependency_retry() {
          local mirrors=/etc/apt/apt-mirrors.txt mirror
          # An attempt killed while dpkg unpacks leaves it interrupted, and every
          # later apt-get refuses to run until `dpkg --configure -a` finishes the
          # job (Storybook run 44221461566 failed its retry this way).
          sudo timeout --kill-after=5s "$REPAIR_TIMEOUT" dpkg --configure -a ||
            echo "::warning::dpkg --configure -a did not finish within ${REPAIR_TIMEOUT}"
          # The runner's regional mirror (Azure's or AWS's) can keep transferring
          # data below the throughput needed to finish within the attempt budget.
          # Retry on Ubuntu's own archive.
          if [ -f "$mirrors" ]; then
            mirror="$(grep -oE '^https?://[^/[:space:]]+\.archive\.ubuntu\.com' "$mirrors" | head -n 1 || true)"
            if [ -n "$mirror" ]; then
              sudo sed -i -E 's#^https?://[^/[:space:]]+\.archive\.ubuntu\.com/ubuntu/?([[:space:]]|$)#https://archive.ubuntu.com/ubuntu/\1#' "$mirrors"
              echo "Retrying system dependencies via the Ubuntu archive instead of ${mirror}"
            fi
          fi
        }
        retry() {
          local label="$1" on_retry="$2" attempt
          shift 2
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            if "$@"; then
              return 0
            fi
            # Only back off when another attempt actually follows.
            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              echo "::warning::${label} attempt ${attempt} failed or timed out after ${ATTEMPT_TIMEOUT}; retrying"
              "$on_retry"
              sleep "$RETRY_BACKOFF"
            fi
          done
          echo "::error title=Playwright environment setup::${label} failed after ${MAX_ATTEMPTS} bounded attempts; browser tests have not started"
          return 1
        }
        # apt reuses a .deb already in its archive directory when the size and
        # hash match the index, so seeded packages are not downloaded again.
        shopt -s nullglob
        cached=("$PACKAGE_CACHE"/*.deb)
        if [ "${#cached[@]}" -gt 0 ]; then
          sudo cp "${cached[@]}" "$APT_ARCHIVES"/
          echo "Seeded apt with ${#cached[@]} cached packages"
        fi
        PLAYWRIGHT_NODE_BINARY="$(command -v node)"
        PLAYWRIGHT_CLI="$(node -p 'require("node:path").join(require("node:path").dirname(require.resolve("@playwright/test/package.json")), "cli.js")')"
        # The timeout must own the same privilege as apt's children. With sudo
        # inside an unprivileged timeout, timed-out root children can retain
        # the dpkg lock. This targets only this attempt's process group.
        retry "playwright install-deps" prepare_dependency_retry sudo timeout --kill-after="$KILL_GRACE" "$ATTEMPT_TIMEOUT" "$PLAYWRIGHT_NODE_BINARY" "$PLAYWRIGHT_CLI" install-deps chromium
        retry "playwright install chromium" : timeout --kill-after="$KILL_GRACE" "$ATTEMPT_TIMEOUT" bunx playwright install chromium

    # Save only after a successful install that missed the exact key, so the
    # cache holds a complete package set for this runner image.
    - name: Stage system packages for the cache
      id: apt-cache-stage
      if: steps.apt-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        PACKAGE_CACHE: ${{ steps.apt-cache-key.outputs.dir }}
        APT_ARCHIVES: /var/cache/apt/archives
      run: |
        shopt -s nullglob
        downloaded=("$APT_ARCHIVES"/*.deb)
        if [ "${#downloaded[@]}" -eq 0 ]; then
          echo "apt kept no packages to cache"
          exit 0
        fi
        rm -rf "$PACKAGE_CACHE"
        mkdir -p "$PACKAGE_CACHE"
        cp "${downloaded[@]}" "$PACKAGE_CACHE"/
        echo "Staged ${#downloaded[@]} packages ($(du -sh "$PACKAGE_CACHE" | cut -f1)) for the cache"
        echo "ready=true" >> "$GITHUB_OUTPUT"

    - name: Save system packages to the cache
      if: steps.apt-cache-stage.outputs.ready == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ steps.apt-cache-key.outputs.dir }}
        key: ${{ steps.apt-cache-key.outputs.key }}
