name: Supply Chain Guardrails

on:
  pull_request:
    paths:
      - "package.json"
      - "**/package.json"
      - "bun.lock"
      - "bun.lockb"
      - "package-lock.json"
      - "pnpm-lock.yaml"
      - "yarn.lock"
      - "bunfig.toml"
      - ".npmrc"
      - "pnpm-workspace.yaml"
      - ".yarnrc.yml"
      - ".github/workflows/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "ONBOARDING.md"
      - ".codex/**"
      - ".claude/**"
      - ".plans/**"
      - "docs/routines/**"
      - "scripts/quality/**"
      - "scripts/harness/**"
  push:
    branches: [main, develop]
    paths:
      - "package.json"
      - "**/package.json"
      - "bun.lock"
      - "bun.lockb"
      - "package-lock.json"
      - "pnpm-lock.yaml"
      - "yarn.lock"
      - "bunfig.toml"
      - ".npmrc"
      - "pnpm-workspace.yaml"
      - ".yarnrc.yml"
      - ".github/workflows/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "ONBOARDING.md"
      - ".codex/**"
      - ".claude/**"
      - ".plans/**"
      - "docs/routines/**"
      - "scripts/quality/**"
      - "scripts/harness/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Supply-chain guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout consumer repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: consumer
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout guardrail source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: greenpill-dev-guild/.github
          ref: 5d33cf1e11c0ed1fae08edd65a09ec390f2aca3b
          path: _guild-defaults
          fetch-depth: 1
          persist-credentials: false

      - name: Run supply-chain guardrails audit
        shell: bash
        run: |
          set -euo pipefail
          node "$GITHUB_WORKSPACE/_guild-defaults/scripts/audit-supply-chain-guardrails.mjs" \
            --mode=ci \
            --fail-on-warning=false \
            "$GITHUB_WORKSPACE/consumer"

  guidance:
    name: Guidance integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check Codex guidance parity
        run: node scripts/quality/check-codex-docs.js

      - name: Check guidance links and retired references
        run: node scripts/quality/check-guidance-links.mjs

      - name: Validate plan hubs
        run: node scripts/harness/plan-hub.mjs validate

      - name: Run plan-hub tests
        run: node --test scripts/harness/plan-hub.test.mjs
