name: Supply Chain Guardrails

on:
  pull_request:
    paths:
      - "package.json"
      - "**/package.json"
      - "bun.lock"
      - "bun.lockb"
      - "package-lock.json"
      - "pnpm-lock.yaml"
      - "yarn.lock"
      - "bunfig.toml"
      - ".npmrc"
      - "pnpm-workspace.yaml"
      - ".yarnrc.yml"
      - ".github/workflows/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".codex/**"
      - ".claude/**"
  push:
    branches: [main, develop]
    paths:
      - "package.json"
      - "**/package.json"
      - "bun.lock"
      - "bun.lockb"
      - "package-lock.json"
      - "pnpm-lock.yaml"
      - "yarn.lock"
      - "bunfig.toml"
      - ".npmrc"
      - "pnpm-workspace.yaml"
      - ".yarnrc.yml"
      - ".github/workflows/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".codex/**"
      - ".claude/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Supply-chain guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout consumer repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: consumer
          fetch-depth: 1

      - name: Checkout guardrail source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: greenpill-dev-guild/.github
          ref: 5d33cf1e11c0ed1fae08edd65a09ec390f2aca3b
          path: _guild-defaults
          fetch-depth: 1

      - name: Run supply-chain guardrails audit
        shell: bash
        run: |
          set -euo pipefail
          node "$GITHUB_WORKSPACE/_guild-defaults/scripts/audit-supply-chain-guardrails.mjs" \
            --mode=ci \
            --fail-on-warning=false \
            "$GITHUB_WORKSPACE/consumer"
