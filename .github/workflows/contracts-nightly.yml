name: Contracts Nightly

# Deep fuzz + invariant lane. PR CI (contracts.yml) runs the capped `test`
# profile for fast feedback; this scheduled lane restores full depth
# (fuzz 10k runs, invariants 256x500) via the `ci` profile.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: contracts-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deep-fuzz:
    name: Deep Fuzz And Invariants
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.7.1
          cache: false # explicit actions/cache step below owns Foundry caching

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Same restore-newest/save-per-commit pattern as contracts.yml, in its own
      # lineage: the ci profile compiles with the optimizer on, so its artifacts
      # never mix with the optimizer-off `test` profile caches.
      - name: Cache Foundry build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            packages/contracts/.generated/foundry/cache
            packages/contracts/.generated/foundry/out
          key: foundry-nightly-${{ runner.os }}-${{ hashFiles('packages/contracts/foundry.toml') }}-${{ github.sha }}
          restore-keys: |
            foundry-nightly-${{ runner.os }}-${{ hashFiles('packages/contracts/foundry.toml') }}-

      - name: Run deep fuzz and invariant suite
        working-directory: packages/contracts
        run: bun run test:deep
        env:
          CI: true
