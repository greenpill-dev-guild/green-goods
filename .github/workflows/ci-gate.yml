name: CI Gate

# Single required-status aggregator for branch protection.
#
# Why this exists: the per-package workflows (client / admin / shared / agent /
# contracts / indexer / design / docs / supply-chain) are path-filtered, so each
# only runs when its package changes. That means they cannot be set as
# branch-protection required checks directly — an unrelated PR would block
# forever on a check that never reports.
#
# This gate derives the workflows expected from the PR's changed files, then
# fails as soon as a registered expected workflow completes without success. It
# otherwise waits for every expected workflow run to register and report
# success. A missing workflow is a failure, so trigger drift and workflow-name
# typos cannot silently weaken branch protection.
#
# Maintenance: workflow selection lives in scripts/data/validation-policy.json
# and is rendered by scripts/quality/select-validation.mjs. Standard-library
# selector, local-runner, and polling fixtures run before the live gate.
#
# Base branches are deliberately unfiltered: stacked pull requests target
# another feature branch as their base, and a base filter here (and in the
# per-package workflows) used to leave stacked layers with no CI at all —
# required checks then showed blocked forever. Push triggers keep their
# main/develop filters; PR-triggered CI runs for every layer of a stack.

on:
  pull_request:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: ci-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.22.1"

      - name: Test validation selection and polling
        run: node --test scripts/quality/select-validation.test.mjs scripts/dev/ci-local.test.mjs scripts/quality/ci-gate.test.mjs

      - name: Verify all expected CI workflows pass
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/quality/ci-gate.mjs
