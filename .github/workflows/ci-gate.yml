name: CI Gate

# Single required-status aggregator for branch protection.
#
# Why this exists: the per-package workflows (client / admin / shared / agent /
# contracts / indexer / design / docs / supply-chain) are path-filtered, so each
# only runs when its package changes. That means they cannot be set as
# branch-protection required checks directly — an unrelated PR would block
# forever on a check that never reports.
#
# This gate derives the workflows expected from the PR's changed files, then
# waits for every expected workflow run to register and report success. A
# missing workflow is a failure, so trigger drift and workflow-name typos cannot
# silently weaken branch protection.
#
# Maintenance: keep scripts/quality/ci-gate.mjs in sync with workflow path
# filters. Its fixture tests run before the live gate.

on:
  pull_request:
    branches: [main, develop]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: ci-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Test CI Gate path mappings
        run: node --test scripts/quality/ci-gate.test.mjs

      - name: Verify all expected CI workflows pass
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/quality/ci-gate.mjs
