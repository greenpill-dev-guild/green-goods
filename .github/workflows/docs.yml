permissions:
  contents: read

concurrency:
  group: docs-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup JavaScript toolchain and dependencies
        uses: ./.github/actions/setup-js

      - name: Test deterministic docs generators
        run: node --test scripts/docs/generate.test.mjs scripts/docs/mermaid-parse.test.mjs docs/scripts/docs-audit.test.mjs docs/scripts/developer-guides.test.mjs docs/scripts/check-search-index.test.mjs scripts/quality/task-routing-contract.test.mjs

      - name: Audit documentation authority
        run: node docs/scripts/docs-audit.mjs --ci

      - name: Check em dashes
        run: bun run check --only em-dashes

      - name: Check generated documentation
        run: bun run check --only docs-generated

      - name: Check ontology projections
        run: bun run check --only ontology

      - name: Check task-to-skill routing
        run: bun run check --only skill-behavior

      - name: Test docs
        run: bun run --cwd docs test

      - name: Build docs
        run: bun run --cwd docs build

      - name: Verify search index
        run: bun run --cwd docs check:search-index
