name: Dependabot Sync

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions: {}

concurrency:
  group: dependabot-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.event.pull_request.head.ref, 'dependabot/npm_and_yarn/') ||
       startsWith(github.event.pull_request.head.ref, 'dependabot/bun/'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout trusted automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false

      - name: Checkout candidate without write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false

      - name: Setup pinned toolchain without installing candidate dependencies
        uses: ./trusted/.github/actions/setup-js
        with:
          install-dependencies: "false"

      - name: Validate dependency-only changes and synchronize derived files
        id: sync
        run: node trusted/scripts/ops/dependabot-sync.mjs candidate trusted sync.json

      - name: Upload repair data
        if: steps.sync.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dependabot-sync
          path: sync.json
          if-no-files-found: error
          overwrite: true
          retention-days: 1
