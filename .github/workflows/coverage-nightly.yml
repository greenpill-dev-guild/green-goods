name: Coverage Nightly

# Client and Admin pull requests already hold their coverage floors; Shared's
# sharded PR tests run plain. This lane enforces every package's measured
# floors nightly and after every push to main.
on:
  schedule:
    - cron: "43 8 * * *"
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: coverage-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: ${{ matrix.name }} Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Shared
            package: shared
            args: --scope all-configured --coverage
          - name: Client
            package: client
            args: --coverage
          - name: Admin
            package: admin
            args: --coverage
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup JavaScript toolchain and dependencies
        uses: ./.github/actions/setup-js

      - name: Run ${{ matrix.name }} coverage
        working-directory: packages/${{ matrix.package }}
        run: bun run test ${{ matrix.args }}
        env:
          CI: true

  # forge coverage keeps every test's hit maps until its last test ends, so one run over the whole
  # suite outgrew the runner's 16 GB (PRD-1624). Each shard runs on its own runner, and the
  # Contracts Coverage job below merges their LCOV and applies the floors.
  contracts:
    name: Contracts Coverage (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        shard: [unit, rest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf
        with:
          version: v1.7.1
          cache: false

      - name: Setup JavaScript toolchain and dependencies
        uses: ./.github/actions/setup-js

      # Each shard still compiles all of src and script, plus its own tests, with --ir-minimum in
      # one solc process. One build of every file outgrew the runner's 16 GB and the image's 3 GB
      # swapfile mid-compile (PRD-1624).
      - name: Add swap for the compile
        run: |
          sudo fallocate -l 20G /coverage.swap
          sudo chmod 600 /coverage.swap
          sudo mkswap /coverage.swap
          sudo swapon /coverage.swap
          free -m
          df -h /

      # A cold runner compiles every source with --ir-minimum before any test runs, so the
      # audit's 15-minute local default is too short.
      - name: Run the ${{ matrix.shard }} coverage shard
        working-directory: packages/contracts
        run: bun run test:audit coverage
        env:
          CI: true
          CONTRACT_COVERAGE_SHARD: ${{ matrix.shard }}
          COVERAGE_TIMEOUT_SECONDS: "5100"

      - name: Upload the shard's coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: contracts-coverage-${{ matrix.shard }}
          path: |
            output/contracts-test-audit/lcov-${{ matrix.shard }}.info
            output/contracts-test-audit/coverage-${{ matrix.shard }}.log
            output/contracts-test-audit/coverage-${{ matrix.shard }}.error
          if-no-files-found: warn

  contracts-floors:
    name: Contracts Coverage
    needs: contracts
    # Also after a failed shard, so the summary names what failed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup JavaScript toolchain and dependencies
        uses: ./.github/actions/setup-js

      - name: Download the shards' coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: contracts-coverage-*
          merge-multiple: true
          path: output/contracts-test-audit

      # A shard with no LCOV fails the floors by name, so run them even when nothing downloaded.
      - name: Apply the contract coverage floors
        if: ${{ !cancelled() }}
        working-directory: packages/contracts
        run: bun run test:audit coverage
        env:
          CI: true
          CONTRACT_COVERAGE_SHARD: policy

      - name: Publish coverage summary
        if: always()
        run: |
          if [[ -f output/contracts-test-audit/coverage-summary.md ]]; then
            cat output/contracts-test-audit/coverage-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: contracts-coverage
          path: |
            output/contracts-test-audit/coverage-summary.md
            output/contracts-test-audit/coverage-summary.json
            output/contracts-test-audit/lcov-local.info
            output/contracts-test-audit/coverage-*.log
          if-no-files-found: warn
