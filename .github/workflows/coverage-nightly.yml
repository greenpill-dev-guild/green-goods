name: Coverage Nightly

# Client and Admin pull requests already hold their coverage floors; Shared's
# sharded PR tests run plain. This lane enforces every package's measured
# floors nightly and after every push to main.
on:
  schedule:
    - cron: "43 8 * * *"
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: coverage-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: ${{ matrix.name }} Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Shared
            package: shared
            args: --scope all-configured --coverage
          - name: Client
            package: client
            args: --coverage
          - name: Admin
            package: admin
            args: --coverage
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup JavaScript toolchain and dependencies
        uses: ./.github/actions/setup-js

      - name: Run ${{ matrix.name }} coverage
        working-directory: packages/${{ matrix.package }}
        run: bun run test ${{ matrix.args }}
        env:
          CI: true

  contracts:
    name: Contracts Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf
        with:
          version: v1.7.1
          cache: false

      - name: Setup JavaScript toolchain and dependencies
        uses: ./.github/actions/setup-js

      # The coverage run outgrows the runner's 16 GB twice: solc builds every source with
      # --ir-minimum in one process, and forge then keeps each test's hit maps until the last test
      # ends. With only the image's 3 GB swapfile the runner shut down mid-compile (PRD-1624).
      # Swap lets the kernel page out what each holds but no longer reads.
      - name: Add swap for the coverage run
        run: |
          sudo fallocate -l 20G /coverage.swap
          sudo chmod 600 /coverage.swap
          sudo mkswap /coverage.swap
          sudo swapon /coverage.swap
          swapon --show

      # One LCOV run compiles every source with --ir-minimum before any test runs, so the
      # audit's 15-minute local default is too short for a cold runner.
      - name: Run contract coverage gates
        working-directory: packages/contracts
        run: bun run test:audit coverage
        env:
          CI: true
          COVERAGE_TIMEOUT_SECONDS: "5100"

      - name: Publish coverage summary
        if: always()
        run: |
          if [[ -f output/contracts-test-audit/coverage-summary.md ]]; then
            cat output/contracts-test-audit/coverage-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: contracts-coverage
          path: |
            output/contracts-test-audit/coverage-summary.md
            output/contracts-test-audit/coverage-summary.json
            output/contracts-test-audit/lcov-local.info
            output/contracts-test-audit/coverage-local.log
          if-no-files-found: warn
