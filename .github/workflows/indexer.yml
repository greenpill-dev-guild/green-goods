name: Indexer

on:
  push:
    branches: [main, develop]
    paths:
      - "package.json"
      - "bun.lock"
      - "biome.json"
      - ".env.schema"
      - "packages/indexer/**"
      - "packages/contracts/src/**"
      - "packages/contracts/abis/**"
      - "packages/contracts/deployments/**"
      - "scripts/quality/check-source-structure.js"
      - ".github/workflows/indexer.yml"
  pull_request:
    paths:
      - "package.json"
      - "bun.lock"
      - "biome.json"
      - ".env.schema"
      - "packages/indexer/**"
      - "packages/contracts/src/**"
      - "packages/contracts/abis/**"
      - "packages/contracts/deployments/**"
      - "scripts/quality/check-source-structure.js"
      - ".github/workflows/indexer.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check indexing boundary
        working-directory: packages/indexer
        run: bun run check:indexing-boundary

      - name: Generate indexer code
        working-directory: packages/indexer
        run: bun run codegen

      - name: Run indexer tests
        working-directory: packages/indexer
        run: bun run test
        env:
          CI: true

      - name: Generate coverage report
        working-directory: packages/indexer
        run: bun run test:coverage
        continue-on-error: true
        env:
          CI: true

  lint-build:
    name: Lint And Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check source structure
        env:
          SOURCE_STRUCTURE_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: node scripts/quality/check-source-structure.js

      - name: Check indexing boundary
        working-directory: packages/indexer
        run: bun run check:indexing-boundary

      - name: Generate indexer code
        working-directory: packages/indexer
        run: bun run codegen

      - name: Run indexer lint
        working-directory: packages/indexer
        run: bun run lint

      - name: Build indexer
        working-directory: packages/indexer
        run: bun run build
