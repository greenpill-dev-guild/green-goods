name: Indexer

on:
  push:
    branches: [main, develop]
    paths:
      - "package.json"
      - ".env.schema"
      - "packages/indexer/**"
      - "packages/contracts/abis/**"
      - "packages/contracts/deployments/**"
      - "scripts/quality/check-source-structure.js"
      - ".github/actions/setup-js/action.yml"
      - ".github/workflows/indexer.yml"
  pull_request:
    paths:
      - "package.json"
      - ".env.schema"
      - "packages/indexer/**"
      - "packages/contracts/abis/**"
      - "packages/contracts/deployments/**"
      - "scripts/quality/check-source-structure.js"
      - ".github/actions/setup-js/action.yml"
      - ".github/workflows/indexer.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup JavaScript toolchain and dependencies
        uses: ./.github/actions/setup-js

      - name: Check indexing boundary
        working-directory: packages/indexer
        run: bun run check:indexing-boundary

      - name: Generate indexer code
        working-directory: packages/indexer
        run: bun run codegen

      - name: Run indexer tests with coverage
        working-directory: packages/indexer
        run: bun run test:coverage:ci
        env:
          CI: true

  lint-build:
    name: Lint And Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup JavaScript toolchain and dependencies
        uses: ./.github/actions/setup-js

      - name: Check source structure
        env:
          SOURCE_STRUCTURE_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: node scripts/quality/check-source-structure.js

      - name: Check indexing boundary
        working-directory: packages/indexer
        run: bun run check:indexing-boundary

      - name: Run indexer lint
        working-directory: packages/indexer
        run: bun run lint

      - name: Build indexer
        working-directory: packages/indexer
        run: bun run build
