permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ontology-drift:
    name: Ontology Drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.22.1"

      # No dependency install on purpose: check-ontology.mjs uses only the Node
      # standard library, which keeps this gate sub-minute and lets the ci-gate
      # matcher exclude package.json/bun.lock from its path filter.
      - name: Ontology checker unit tests
        run: node --test scripts/quality/check-ontology.test.mjs

      - name: Ontology drift gate
        run: node scripts/quality/check-ontology.mjs
