name: Agent

on:
  push:
    branches: [main, develop]
    paths:
      - "package.json"
      - "biome.json"
      - ".env.schema"
      - "packages/agent/**"
      - "packages/shared/**"
      - "!packages/shared/**/__tests__/**"
      - "!packages/shared/**/*.test.*"
      - "!packages/shared/**/*.spec.*"
      - "!packages/shared/**/*.stories.*"
      - "!packages/shared/.storybook/**"
      - "scripts/quality/check-source-structure.js"
      - ".github/actions/setup-js/action.yml"
      - ".github/workflows/agent.yml"
  pull_request:
    paths:
      - "package.json"
      - "biome.json"
      - ".env.schema"
      - "packages/agent/**"
      - "packages/shared/**"
      - "!packages/shared/**/__tests__/**"
      - "!packages/shared/**/*.test.*"
      - "!packages/shared/**/*.spec.*"
      - "!packages/shared/**/*.stories.*"
      - "!packages/shared/.storybook/**"
      - "scripts/quality/check-source-structure.js"
      - ".github/actions/setup-js/action.yml"
      - ".github/workflows/agent.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup JavaScript toolchain and dependencies
        uses: ./.github/actions/setup-js

      - name: Run agent tests with coverage
        working-directory: packages/agent
        run: bun run test:coverage
        env:
          CI: true
          ENCRYPTION_SECRET: "test-secret-for-ci-encryption-32chars"
          TELEGRAM_BOT_TOKEN: "test-bot-token"
          VITE_RPC_URL_11155111: "http://localhost:3009"

  lint-typecheck-build:
    name: Lint Typecheck And Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup JavaScript toolchain and dependencies
        uses: ./.github/actions/setup-js

      - name: Check source structure
        env:
          SOURCE_STRUCTURE_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: node scripts/quality/check-source-structure.js

      - name: Run agent lint
        working-directory: packages/agent
        run: bun run lint

      - name: Typecheck agent
        working-directory: packages/agent
        run: bun run typecheck

      - name: Build agent
        working-directory: packages/agent
        run: bun run build
