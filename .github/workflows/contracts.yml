name: Contracts

on:
  push:
    branches: [main, develop]
    paths:
      - "package.json"
      - ".env.schema"
      - "packages/contracts/**"
      - "scripts/contracts/**"
      - "scripts/lib/git-guardrails.mjs"
      - "scripts/quality/check-source-structure.js"
      - ".github/actions/setup-js/action.yml"
      - ".github/workflows/contracts.yml"
  pull_request:
    paths:
      - "package.json"
      - ".env.schema"
      - "packages/contracts/**"
      - "scripts/contracts/**"
      - "scripts/lib/git-guardrails.mjs"
      - "scripts/quality/check-source-structure.js"
      - ".github/actions/setup-js/action.yml"
      - ".github/workflows/contracts.yml"
  workflow_call:
    inputs:
      operation:
        description: "Contracts operation to run"
        required: true
        type: string
        default: fork-readiness

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit Tests
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'ci' || inputs.operation == 'all'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.7.1
          cache: false # explicit actions/cache steps below own Foundry caching; the action's built-in cache only saved empty strays

      - name: Setup JavaScript toolchain and dependencies
        uses: ./.github/actions/setup-js

      # Restore the newest Foundry build for this compiler config, then save a
      # fresh entry per commit; forge recompiles only what changed since the
      # restored snapshot. Per-job key prefixes keep each job's profile
      # artifacts in their own cache lineage. This lineage holds two profile
      # subdirectories (out/test and out/production) because the required gate
      # below compiles both.
      - name: Cache Foundry build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            packages/contracts/.generated/foundry/cache
            packages/contracts/.generated/foundry/out
          key: foundry-unit-${{ runner.os }}-${{ hashFiles('packages/contracts/foundry.toml') }}-${{ github.sha }}
          restore-keys: |
            foundry-unit-${{ runner.os }}-${{ hashFiles('packages/contracts/foundry.toml') }}-

      # `bun run test` is the required PR gate and chains, in order:
      #   1. TypeScript typecheck
      #   2. optimizer-off `test`-profile unit suite (the three source-acknowledgment
      #      boundary fixtures are excluded by exact name — their gas is meaningless
      #      outside release codegen)
      #   3. `test:gas:release` — the production-profile (via_ir, optimizer_runs = 1)
      #      cold-path proof of the frozen batch-size boundary, run with per-call
      #      transaction isolation; this is release gas evidence, the nightly deep
      #      lane's optimizer-200 numbers are not
      #   4. script tests (vitest), including the release-lock derivation and the
      #      gas-gate routing guardrail
      - name: Run contract unit tests
        working-directory: packages/contracts
        run: bun run test
        env:
          CI: true

  lint-build:
    name: Lint And Build
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'ci' || inputs.operation == 'all'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.7.1
          cache: false # explicit actions/cache steps below own Foundry caching; the action's built-in cache only saved empty strays

      - name: Setup JavaScript toolchain and dependencies
        uses: ./.github/actions/setup-js

      - name: Cache Foundry build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            packages/contracts/.generated/foundry/cache
            packages/contracts/.generated/foundry/out
          key: foundry-lint-build-${{ runner.os }}-${{ hashFiles('packages/contracts/foundry.toml') }}-${{ github.sha }}
          restore-keys: |
            foundry-lint-build-${{ runner.os }}-${{ hashFiles('packages/contracts/foundry.toml') }}-

      - name: Check source structure
        env:
          SOURCE_STRUCTURE_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: node scripts/quality/check-source-structure.js

      - name: Check new Solidity test names
        env:
          SOLIDITY_TEST_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before || '') }}
        run: bun run check:solidity-test-names

      - name: Run Solidity naming guardrail tests
        run: node --test scripts/contracts/check-solidity-test-names.test.mjs

      - name: Run contract lint
        working-directory: packages/contracts
        run: bun run lint:check

      - name: Build contracts
        working-directory: packages/contracts
        run: bun run build

      - name: Check deployed bytecode sizes (EIP-170)
        working-directory: packages/contracts
        run: bun run check:sizes

  realism-audit:
    name: Test Realism Audit
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'ci' || inputs.operation == 'all'
    runs-on: ubuntu-latest
    # Static source/test audit; run beside unit tests so Contracts CI is not
    # gated by unit duration plus a second setup/install pass.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.22.1"

      - name: Resolve realism gate phase
        id: realism-phase
        run: |
          TODAY="$(date -u +%F)"
          if [[ "$TODAY" < "2026-02-26" ]]; then
            MODE="advisory"
            THRESHOLD="0.70"
            PHASE="phase-0"
          elif [[ "$TODAY" < "2026-03-05" ]]; then
            MODE="enforce-must-fix"
            THRESHOLD="0.70"
            PHASE="phase-1"
          elif [[ "$TODAY" < "2026-03-19" ]]; then
            MODE="enforce-should-fix"
            THRESHOLD="0.80"
            PHASE="phase-2"
          else
            MODE="enforce-should-fix"
            THRESHOLD="0.90"
            PHASE="phase-3"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "revert_threshold=$THRESHOLD" >> "$GITHUB_OUTPUT"
          echo "phase=$PHASE" >> "$GITHUB_OUTPUT"
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"

      - name: Validate realism audit tooling
        run: bash scripts/contracts/validate-test-realism-tooling.sh

      - name: Run contracts realism audit
        run: >-
          bash scripts/contracts/check-test-realism.sh
          --mode "${{ steps.realism-phase.outputs.mode }}"
          --report-md output/contracts-test-audit/realism-report-ci.md
          --report-json output/contracts-test-audit/realism-report-ci.json
        env:
          CI: true
          REALISM_REVERT_THRESHOLD: ${{ steps.realism-phase.outputs.revert_threshold }}

      - name: Upload realism audit artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: contracts-test-realism-audit
          path: output/contracts-test-audit/
          retention-days: 14

  fork-readiness-core:
    name: Fork Readiness / ${{ matrix.label }}
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.operation == 'fork-readiness' || inputs.operation == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: sepolia
            label: Sepolia
            script: test:fork:sepolia:ci
          - shard: ethereum
            label: Ethereum ENS
            script: test:fork:ethereum:ci
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.7.1
          cache: false # explicit actions/cache steps below own Foundry caching; the action's built-in cache only saved empty strays

      - name: Setup JavaScript toolchain and dependencies
        uses: ./.github/actions/setup-js

      - name: Resolve fork RPCs and block pins
        env:
          ARBITRUM_RPC_URL: ${{ secrets.ARBITRUM_RPC_URL }}
          ARBITRUM_FORK_BLOCK_NUMBER: ${{ vars.ARBITRUM_FORK_BLOCK_NUMBER || '466388412' }}
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          SEPOLIA_FORK_BLOCK_NUMBER: ${{ vars.SEPOLIA_FORK_BLOCK_NUMBER || '10917257' }}
          ETHEREUM_RPC_URL: ${{ secrets.ETHEREUM_RPC_URL }}
          ETHEREUM_FORK_BLOCK_NUMBER: ${{ vars.ETHEREUM_FORK_BLOCK_NUMBER || '25170563' }}
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
          ALCHEMY_KEY: ${{ secrets.ALCHEMY_KEY }}
          VITE_ALCHEMY_API_KEY: ${{ secrets.VITE_ALCHEMY_API_KEY }}
          PUBLIC_ARBITRUM_RPC_URL: https://arbitrum-one.public.blastapi.io
          PUBLIC_SEPOLIA_RPC_URL: https://sepolia.drpc.org
          PUBLIC_ETHEREUM_RPC_URL: https://ethereum.drpc.org
        run: |
          set -euo pipefail

          ALCHEMY_KEY_VALUE="${ALCHEMY_API_KEY:-$ALCHEMY_KEY}"
          ALCHEMY_KEY_VALUE="${ALCHEMY_KEY_VALUE:-$VITE_ALCHEMY_API_KEY}"

          if [[ -z "$ARBITRUM_RPC_URL" ]]; then
            if [[ -n "$ALCHEMY_KEY_VALUE" ]]; then
              ARBITRUM_RPC_URL="https://arb-mainnet.g.alchemy.com/v2/$ALCHEMY_KEY_VALUE"
              echo "::notice::ARBITRUM_RPC_URL secret is not configured; using derived Alchemy Arbitrum RPC from existing key secret."
            else
              ARBITRUM_RPC_URL="$PUBLIC_ARBITRUM_RPC_URL"
              echo "::warning::ARBITRUM_RPC_URL secret is not configured; using public Arbitrum RPC fallback."
            fi
          fi

          if [[ -z "$SEPOLIA_RPC_URL" ]]; then
            if [[ -n "$ALCHEMY_KEY_VALUE" ]]; then
              SEPOLIA_RPC_URL="https://eth-sepolia.g.alchemy.com/v2/$ALCHEMY_KEY_VALUE"
              echo "::notice::SEPOLIA_RPC_URL secret is not configured; using derived Alchemy Sepolia RPC from existing key secret."
            else
              SEPOLIA_RPC_URL="$PUBLIC_SEPOLIA_RPC_URL"
              echo "::warning::SEPOLIA_RPC_URL secret and Alchemy key secrets are not configured; using public Sepolia RPC fallback."
            fi
          fi

          if [[ -z "$ETHEREUM_RPC_URL" ]]; then
            if [[ -n "$ALCHEMY_KEY_VALUE" ]]; then
              ETHEREUM_RPC_URL="https://eth-mainnet.g.alchemy.com/v2/$ALCHEMY_KEY_VALUE"
              echo "::notice::ETHEREUM_RPC_URL secret is not configured; using derived Alchemy Ethereum RPC from existing key secret."
            else
              ETHEREUM_RPC_URL="$PUBLIC_ETHEREUM_RPC_URL"
              echo "::warning::ETHEREUM_RPC_URL secret and Alchemy key secrets are not configured; using public Ethereum RPC fallback."
            fi
          fi

          echo "::add-mask::$ARBITRUM_RPC_URL"
          echo "::add-mask::$SEPOLIA_RPC_URL"
          echo "::add-mask::$ETHEREUM_RPC_URL"
          echo "ARBITRUM_RPC_URL=$ARBITRUM_RPC_URL" >> "$GITHUB_ENV"
          echo "ARBITRUM_FORK_RPC_URL=$ARBITRUM_RPC_URL" >> "$GITHUB_ENV"
          echo "ARBITRUM_FORK_BLOCK_NUMBER=$ARBITRUM_FORK_BLOCK_NUMBER" >> "$GITHUB_ENV"
          echo "SEPOLIA_RPC_URL=$SEPOLIA_RPC_URL" >> "$GITHUB_ENV"
          echo "SEPOLIA_FORK_RPC_URL=$SEPOLIA_RPC_URL" >> "$GITHUB_ENV"
          echo "SEPOLIA_FORK_BLOCK_NUMBER=$SEPOLIA_FORK_BLOCK_NUMBER" >> "$GITHUB_ENV"
          echo "ETHEREUM_RPC_URL=$ETHEREUM_RPC_URL" >> "$GITHUB_ENV"
          echo "ETHEREUM_FORK_RPC_URL=$ETHEREUM_RPC_URL" >> "$GITHUB_ENV"
          echo "MAINNET_RPC_URL=$ETHEREUM_RPC_URL" >> "$GITHUB_ENV"
          echo "ETHEREUM_FORK_BLOCK_NUMBER=$ETHEREUM_FORK_BLOCK_NUMBER" >> "$GITHUB_ENV"
          echo "MAINNET_FORK_BLOCK_NUMBER=$ETHEREUM_FORK_BLOCK_NUMBER" >> "$GITHUB_ENV"
          echo "::notice::Fork shard=${{ matrix.shard }} blocks: arbitrum=$ARBITRUM_FORK_BLOCK_NUMBER sepolia=$SEPOLIA_FORK_BLOCK_NUMBER ethereum=$ETHEREUM_FORK_BLOCK_NUMBER"

      # Also cache Foundry's RPC response cache: fork tests pin block numbers,
      # so remote chain state is fully reusable across runs.
      - name: Cache Foundry build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            packages/contracts/.generated/foundry/cache
            packages/contracts/.generated/foundry/out
            ~/.foundry/cache
          key: foundry-fork-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('packages/contracts/foundry.toml') }}-${{ github.sha }}
          restore-keys: |
            foundry-fork-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('packages/contracts/foundry.toml') }}-

      - name: Run ${{ matrix.label }} fork shard
        working-directory: packages/contracts
        run: bun run ${{ matrix.script }}
        env:
          COOKIE_JAR_FACTORY_ADDRESS: ${{ secrets.COOKIE_JAR_FACTORY_ADDRESS }}
          CI: true

  fork-readiness-arbitrum:
    name: Fork Readiness / Arbitrum Sequential
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.operation == 'fork-readiness' || inputs.operation == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.7.1
          cache: false # explicit actions/cache steps below own Foundry caching; the action's built-in cache only saved empty strays

      - name: Setup JavaScript toolchain and dependencies
        uses: ./.github/actions/setup-js

      - name: Resolve fork RPCs and block pins
        env:
          ARBITRUM_RPC_URL: ${{ secrets.ARBITRUM_RPC_URL }}
          ARBITRUM_FORK_BLOCK_NUMBER: ${{ vars.ARBITRUM_FORK_BLOCK_NUMBER || '466388412' }}
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          SEPOLIA_FORK_BLOCK_NUMBER: ${{ vars.SEPOLIA_FORK_BLOCK_NUMBER || '10917257' }}
          ETHEREUM_RPC_URL: ${{ secrets.ETHEREUM_RPC_URL }}
          ETHEREUM_FORK_BLOCK_NUMBER: ${{ vars.ETHEREUM_FORK_BLOCK_NUMBER || '25170563' }}
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
          ALCHEMY_KEY: ${{ secrets.ALCHEMY_KEY }}
          VITE_ALCHEMY_API_KEY: ${{ secrets.VITE_ALCHEMY_API_KEY }}
          PUBLIC_ARBITRUM_RPC_URL: https://arbitrum-one.public.blastapi.io
          PUBLIC_SEPOLIA_RPC_URL: https://sepolia.drpc.org
          PUBLIC_ETHEREUM_RPC_URL: https://ethereum.drpc.org
        run: |
          set -euo pipefail

          ALCHEMY_KEY_VALUE="${ALCHEMY_API_KEY:-$ALCHEMY_KEY}"
          ALCHEMY_KEY_VALUE="${ALCHEMY_KEY_VALUE:-$VITE_ALCHEMY_API_KEY}"

          if [[ -z "$ARBITRUM_RPC_URL" ]]; then
            if [[ -n "$ALCHEMY_KEY_VALUE" ]]; then
              ARBITRUM_RPC_URL="https://arb-mainnet.g.alchemy.com/v2/$ALCHEMY_KEY_VALUE"
              echo "::notice::ARBITRUM_RPC_URL secret is not configured; using derived Alchemy Arbitrum RPC from existing key secret."
            else
              ARBITRUM_RPC_URL="$PUBLIC_ARBITRUM_RPC_URL"
              echo "::warning::ARBITRUM_RPC_URL secret is not configured; using public Arbitrum RPC fallback."
            fi
          fi

          if [[ -z "$SEPOLIA_RPC_URL" ]]; then
            if [[ -n "$ALCHEMY_KEY_VALUE" ]]; then
              SEPOLIA_RPC_URL="https://eth-sepolia.g.alchemy.com/v2/$ALCHEMY_KEY_VALUE"
              echo "::notice::SEPOLIA_RPC_URL secret is not configured; using derived Alchemy Sepolia RPC from existing key secret."
            else
              SEPOLIA_RPC_URL="$PUBLIC_SEPOLIA_RPC_URL"
              echo "::warning::SEPOLIA_RPC_URL secret and Alchemy key secrets are not configured; using public Sepolia RPC fallback."
            fi
          fi

          if [[ -z "$ETHEREUM_RPC_URL" ]]; then
            if [[ -n "$ALCHEMY_KEY_VALUE" ]]; then
              ETHEREUM_RPC_URL="https://eth-mainnet.g.alchemy.com/v2/$ALCHEMY_KEY_VALUE"
              echo "::notice::ETHEREUM_RPC_URL secret is not configured; using derived Alchemy Ethereum RPC from existing key secret."
            else
              ETHEREUM_RPC_URL="$PUBLIC_ETHEREUM_RPC_URL"
              echo "::warning::ETHEREUM_RPC_URL secret and Alchemy key secrets are not configured; using public Ethereum RPC fallback."
            fi
          fi

          echo "::add-mask::$ARBITRUM_RPC_URL"
          echo "::add-mask::$SEPOLIA_RPC_URL"
          echo "::add-mask::$ETHEREUM_RPC_URL"
          echo "ARBITRUM_RPC_URL=$ARBITRUM_RPC_URL" >> "$GITHUB_ENV"
          echo "ARBITRUM_FORK_RPC_URL=$ARBITRUM_RPC_URL" >> "$GITHUB_ENV"
          echo "ARBITRUM_FORK_BLOCK_NUMBER=$ARBITRUM_FORK_BLOCK_NUMBER" >> "$GITHUB_ENV"
          echo "SEPOLIA_RPC_URL=$SEPOLIA_RPC_URL" >> "$GITHUB_ENV"
          echo "SEPOLIA_FORK_RPC_URL=$SEPOLIA_RPC_URL" >> "$GITHUB_ENV"
          echo "SEPOLIA_FORK_BLOCK_NUMBER=$SEPOLIA_FORK_BLOCK_NUMBER" >> "$GITHUB_ENV"
          echo "ETHEREUM_RPC_URL=$ETHEREUM_RPC_URL" >> "$GITHUB_ENV"
          echo "ETHEREUM_FORK_RPC_URL=$ETHEREUM_RPC_URL" >> "$GITHUB_ENV"
          echo "MAINNET_RPC_URL=$ETHEREUM_RPC_URL" >> "$GITHUB_ENV"
          echo "ETHEREUM_FORK_BLOCK_NUMBER=$ETHEREUM_FORK_BLOCK_NUMBER" >> "$GITHUB_ENV"
          echo "MAINNET_FORK_BLOCK_NUMBER=$ETHEREUM_FORK_BLOCK_NUMBER" >> "$GITHUB_ENV"
          echo "::notice::Arbitrum sequential fork shards blocks: arbitrum=$ARBITRUM_FORK_BLOCK_NUMBER sepolia=$SEPOLIA_FORK_BLOCK_NUMBER ethereum=$ETHEREUM_FORK_BLOCK_NUMBER"

      - name: Cache Foundry build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            packages/contracts/.generated/foundry/cache
            packages/contracts/.generated/foundry/out
            ~/.foundry/cache
          key: foundry-fork-arbitrum-${{ runner.os }}-${{ hashFiles('packages/contracts/foundry.toml') }}-${{ github.sha }}
          restore-keys: |
            foundry-fork-arbitrum-${{ runner.os }}-${{ hashFiles('packages/contracts/foundry.toml') }}-

      - name: Run Arbitrum fork shards sequentially
        working-directory: packages/contracts
        run: |
          set +e

          bun run test:fork:arbitrum:ci
          arbitrum_status=$?

          bun run test:fork:gardens:ci
          gardens_status=$?

          bun run test:fork:octant:ci
          octant_status=$?

          bun run test:fork:settlement-lane
          settlement_lane_status=$?

          set -e

          failed=0
          if [[ "$arbitrum_status" -ne 0 ]]; then
            echo "::error::Arbitrum fork shard failed with exit code $arbitrum_status"
            failed=1
          fi
          if [[ "$gardens_status" -ne 0 ]]; then
            echo "::error::Gardens fork shard failed with exit code $gardens_status"
            failed=1
          fi
          if [[ "$octant_status" -ne 0 ]]; then
            echo "::error::Octant fork shard failed with exit code $octant_status"
            failed=1
          fi
          if [[ "$settlement_lane_status" -ne 0 ]]; then
            echo "::error::Settlement lane fork shard failed with exit code $settlement_lane_status"
            failed=1
          fi

          exit "$failed"
        env:
          COOKIE_JAR_FACTORY_ADDRESS: ${{ secrets.COOKIE_JAR_FACTORY_ADDRESS }}
          CI: true
