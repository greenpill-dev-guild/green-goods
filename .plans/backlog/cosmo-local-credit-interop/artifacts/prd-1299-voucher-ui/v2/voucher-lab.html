<title>Cosmo-Local Voucher Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: contents on the left, the screens in a fixed stage that always fits, every control in a side panel on the right. */
:root {
  --bg: #ECE7DF; --panel: #FFFFFF; --panel-2: #F5F1EA; --ink: #1F1B17; --muted: #625C55; --line: #DCD5CA;
  --accent: #1A7544; --accent-ink: #FFFFFF; --accent-soft: #DCF1E3; --steward: #1E40AF; --steward-soft: #DBEAFE;
  --danger: #B91C1C; --scrim: rgba(31, 27, 23, .38); --shadow: 0 1px 2px rgba(31, 27, 23, .06), 0 10px 28px rgba(31, 27, 23, .10);
  --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13100C; --panel: #211B15; --panel-2: #2B241D; --ink: #EEE8E0; --muted: #ADA59C; --line: #3B3229;
    --accent: #8BE0B2; --accent-ink: #0C0A09; --accent-soft: rgba(139, 224, 178, .16); --steward: #93C5FD; --steward-soft: rgba(147, 197, 253, .16);
    --danger: #FCA5A5; --scrim: rgba(0, 0, 0, .6); --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px rgba(0, 0, 0, .4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13100C; --panel: #211B15; --panel-2: #2B241D; --ink: #EEE8E0; --muted: #ADA59C; --line: #3B3229;
  --accent: #8BE0B2; --accent-ink: #0C0A09; --accent-soft: rgba(139, 224, 178, .16); --steward: #93C5FD; --steward-soft: rgba(147, 197, 253, .16);
  --danger: #FCA5A5; --scrim: rgba(0, 0, 0, .6); --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px rgba(0, 0, 0, .4); color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }

.lab { height: 100%; display: grid; grid-template-columns: 256px minmax(0, 1fr) 360px; gap: 20px; box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px; }
.lab *, .lab *::before, .lab *::after { box-sizing: border-box; }
.lab :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.lab-card, .lab-nav, .lab-panel { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; }

/* Contents */
.lab-nav { height: 100%; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 18px; }
.lab-brand { display: flex; align-items: center; gap: 12px; }
.lab-mark { width: 40px; height: 40px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: 0 0 40px; }
.lab-brand b { display: block; font-size: 16px; font-weight: 800; letter-spacing: -0.01em; }
.lab-brand span { display: block; font-size: 12px; color: var(--muted); }
.lab-group { display: flex; flex-direction: column; gap: 2px; }
.lab-group h2, .lab-group summary { margin: 0 0 6px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.lab-group summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; }
.lab-group summary::-webkit-details-marker { display: none; }
.lab-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; align-items: center; width: 100%; text-align: left; border: 0; background: none;
  color: var(--ink); font: inherit; padding: 8px 10px; border-radius: 12px; cursor: pointer; min-height: 44px; }
.lab-item:hover { background: var(--panel-2); }
.lab-item[aria-current="true"] { background: var(--accent-soft); }
.lab-item .t { font-size: 13.5px; font-weight: 600; line-height: 18px; }
.lab-item .m { grid-column: 1; font-size: 12px; color: var(--muted); }
.lab-badge { grid-row: 1 / span 2; grid-column: 2; font-size: 12px; font-weight: 700; min-width: 26px; height: 24px; padding: 0 7px; border-radius: 999px; display: grid; place-items: center;
  border: 1px dashed var(--line); color: var(--muted); }
.lab-badge.on { border: 0; background: var(--accent); color: var(--accent-ink); }
.lab-navfoot { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 8px; margin-top: auto; }
.lab-count, .lab-status { font-size: 12.5px; color: var(--muted); }
.lab-copybox { width: 100%; min-height: 120px; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); color: var(--ink); padding: 8px; }
.lab-scrim { display: none; position: fixed; inset: 0; background: var(--scrim); z-index: 39; border: 0; padding: 0; }

/* Stage: a fixed box; screens scale to fit it, so nothing is cut off or moves around */
.lab-stagewrap { min-width: 0; min-height: 0; height: 100%; display: flex; }
.lab-stage { flex: 1; min-width: 0; min-height: 0; display: grid; place-content: center; justify-items: center; align-items: start; gap: 20px; overflow: hidden; }
.lab-stage.is-doc { display: block; overflow-y: auto; }
.lab-frame { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 0; }
.lab-cap { height: 26px; max-width: 100%; display: flex; align-items: center; gap: 8px; white-space: nowrap; overflow: hidden; font-size: 13px; font-weight: 700; }
.lab-cap span { overflow: hidden; text-overflow: ellipsis; }
.lab-letter { width: 24px; height: 24px; flex: 0 0 24px; border-radius: 7px; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-size: 12px; font-weight: 800; }
.lab-side { display: inline-flex; align-items: center; flex: 0 0 auto; height: 24px; padding: 0 9px; border-radius: 7px; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
.lab-side.now { background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); }
.lab-side.next { background: var(--accent); color: var(--accent-ink); }
.lab-capsub { font-weight: 600; color: var(--muted); }
.lab-tick { color: var(--accent); display: inline-flex; }
.lab-scale { position: relative; overflow: hidden; background: var(--panel-2); border: 1px solid var(--line); box-shadow: var(--shadow); }
.lab-host { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.lab-err { padding: 16px; color: var(--danger); font-size: 14px; }

/* Side panel */
.lab-panel { height: 100%; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
.lab-ptop { display: flex; gap: 8px; flex-wrap: wrap; }
.lab-ptop:empty { display: none; }
@media (min-width: 1200px) { .lab-ptop:not(:has(> :not(.lab-contents))) { display: none; } }
.lab-ptop .lab-contents { display: none; }
.lab-head { display: flex; flex-direction: column; gap: 4px; }
.lab-eyebrow { margin: 0; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.lab-head h1 { margin: 0; font-size: 21px; line-height: 27px; font-weight: 800; letter-spacing: -0.015em; min-height: 54px; text-wrap: balance;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.lab-flownav { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.lab-flownav .count { text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 14px; }
.lab-controls { display: flex; flex-direction: column; gap: 14px; }
.lab-ctl { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.lab-label { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.lab-seg { display: flex; flex-wrap: wrap; gap: 4px; background: var(--panel-2); border-radius: 13px; padding: 4px; }
.lab-seg button { flex: 1 1 auto; border: 0; background: none; color: var(--muted); font: inherit; font-size: 13px; font-weight: 600; padding: 0 12px; min-height: 40px; border-radius: 10px; cursor: pointer; }
.lab-seg button:hover { color: var(--ink); }
.lab-seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
.lab-seg button.lab-cmp[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.lab-stepper { display: grid; grid-template-columns: 40px minmax(0, 1fr) 40px; gap: 6px; align-items: center; }
.lab-stepper select { height: 40px; min-width: 0; width: 100%; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: inherit; font-size: 13.5px; font-weight: 600; padding: 0 10px; }
.lab-stepn { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.lab-icon { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); display: grid; place-items: center; cursor: pointer; padding: 0; }
.lab-icon:hover { background: var(--panel-2); }
.lab-switch { display: flex; align-items: center; gap: 8px; min-height: 40px; font-size: 13.5px; font-weight: 600; cursor: pointer; }
.lab-switch input { width: 18px; height: 18px; accent-color: var(--accent); }
.lab-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--accent);
  background: var(--accent); color: var(--accent-ink); font: inherit; font-size: 13.5px; font-weight: 700; cursor: pointer; }
.lab-btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.lab-btn.ghost:hover { background: var(--panel-2); }
.lab-btn:disabled { opacity: .4; cursor: not-allowed; }
.lab-about { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 16px; background: var(--panel-2); }
.lab-about p { margin: 0; font-size: 14.5px; line-height: 22px; }
.lab-who { align-self: flex-start; display: inline-block; padding: 4px 11px; border-radius: 12px; font-size: 12.5px; line-height: 18px; font-weight: 700; background: var(--accent-soft); color: var(--accent); }
.lab-who.steward { background: var(--steward-soft); color: var(--steward); }
.lab-stats { display: flex; flex-wrap: wrap; gap: 6px; }
.lab-stat { display: inline-flex; align-items: baseline; gap: 6px; padding: 5px 10px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-size: 12.5px; }
.lab-stat b { font-weight: 600; color: var(--muted); }
.lab-stat .from { text-decoration: line-through; color: var(--muted); font-variant-numeric: tabular-nums; }
.lab-stat .to { font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
.lab-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.lab-steps button { width: 100%; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 0 8px; align-items: center; text-align: left; padding: 7px 8px; border-radius: 10px; border: 0; background: none; color: var(--ink); font: inherit; cursor: pointer; }
.lab-steps button:hover { background: var(--panel-2); }
.lab-steps button[aria-current="step"] { background: var(--accent-soft); }
.lab-steps .k { grid-row: 1 / span 2; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 11.5px; font-weight: 700; background: var(--panel-2); color: var(--muted); font-variant-numeric: tabular-nums; }
.lab-steps button[aria-current="step"] .k { background: var(--accent); color: var(--accent-ink); }
.lab-steps .t { font-size: 13px; font-weight: 600; line-height: 17px; }
.lab-steps .s { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lab-sec { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line); padding-top: 14px; }
.lab-h2 { margin: 0; font-size: 15px; font-weight: 800; }
.lab-picks { display: flex; flex-direction: column; gap: 6px; }
.lab-pick { display: flex; align-items: center; gap: 8px; min-height: 42px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  font: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer; text-align: left; }
.lab-pick[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.lab-p { margin: 0; font-size: 13.5px; line-height: 20px; color: var(--muted); }
.lab-p b { color: var(--ink); }
.lab-ta { width: 100%; min-height: 84px; resize: vertical; border-radius: 12px; border: 1px solid var(--line); background: var(--panel-2); color: var(--ink); font: inherit; font-size: 14px; line-height: 20px; padding: 10px 12px; }
.lab-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.lab-notes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.lab-notes li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 8px; padding: 10px 12px; border-radius: 12px; background: var(--panel-2); }
.lab-notes li p { margin: 0; font-size: 14px; line-height: 20px; white-space: pre-wrap; overflow-wrap: anywhere; }
.lab-notes li span { grid-column: 1; font-size: 12px; color: var(--muted); }
.lab-notes li button { grid-row: 1 / span 2; grid-column: 2; width: 36px; height: 36px; border-radius: 10px; border: 0; background: none; color: var(--muted); cursor: pointer; display: grid; place-items: center; }
.lab-notes li button:hover { color: var(--danger); background: var(--panel); }
.lab-notes li.lab-empty { display: block; color: var(--muted); font-size: 13px; }

/* Written pages */
.lab-doc { max-width: 820px; margin: 0 auto; padding: 22px 24px 40px; display: flex; flex-direction: column; gap: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; }
.lab-doc h2 { margin: 14px 0 0; font-size: 19px; font-weight: 800; text-wrap: balance; }
.lab-doc h3 { margin: 6px 0 0; font-size: 16px; font-weight: 800; }
.lab-doc p, .lab-doc li { margin: 0; font-size: 15px; line-height: 23px; max-width: 70ch; }
.lab-doc ol, .lab-doc ul { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 10px; }
.lab-doc b { font-weight: 700; }
.lab-doc .rm { display: block; color: var(--muted); font-size: 14px; line-height: 21px; margin-top: 2px; }
.lab-doc blockquote { margin: 0; padding: 14px 16px; border-radius: 14px; background: var(--accent-soft); font-size: 16px; line-height: 24px; max-width: 70ch; }
.lab-doc .lab-btn { align-self: flex-start; }
.lab-scen { display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; border-radius: 16px; background: var(--panel-2); }
.lab-scen ol { gap: 6px; }

@media (prefers-reduced-motion: no-preference) {
  .lab-item, .lab-seg button, .lab-pick, .lab-btn, .lab-icon, .lab-steps button { transition: background-color .15s, color .15s, box-shadow .15s; }
  .lab-nav { transition: transform .2s ease; }
}
@media (max-width: 1199px) {
  .lab { grid-template-columns: minmax(0, 1fr) 340px; }
  .lab-nav { position: fixed; z-index: 40; top: 0; bottom: 0; left: 0; width: min(320px, 88vw); height: auto; border-radius: 0 20px 20px 0; transform: translateX(-105%);
    padding-top: calc(16px + env(safe-area-inset-top, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
  .lab-nav.is-open { transform: none; }
  .lab-scrim.is-open { display: block; }
  .lab-ptop .lab-contents { display: inline-flex; }
}
@media (max-width: 859px) {
  .lab { height: auto; min-height: 100%; grid-template-columns: minmax(0, 1fr); }
  .lab-stagewrap { height: 74vh; }
  .lab-panel { height: auto; overflow: visible; }
}

/* Green Goods screen kit, as used in the app */
/* Green Goods Warm Earth kit for the voucher lab: the installed app's tokens and shapes
   (linen ground, white 24px cards, 88px item rows, capsule chips, Plus Jakarta Sans) and the
   cockpit at its denser setting. Dark mode is the .dark class on an artboard's root. */
.gg {
  --bg: #FAF8F5; --card: #FFFFFF; --fg: #292524; --strong: #0C0A09; --muted: #6B655F;
  --line: #E7E5E4; --line2: #D6D3D1; --accent: #1A7544; --accent-ink: #FFFFFF;
  --accent-soft: rgba(31, 193, 107, .12); --on: #1A7544; --av: #D0FBE9; --av-ink: #14532D;
  --ok-bg: #DCFCE7; --ok: #166534; --warn-bg: #FEF3C7; --warn: #92400E; --err-bg: #FEE2E2; --err: #991B1B;
  --info-bg: #DBEAFE; --info: #1E40AF; --neu-bg: #F5F5F4; --neu: #44403C; --scrim: rgba(12, 10, 9, .42);
  --tile: #EFE9DF; --shadow: 0 1px 2px rgba(12, 10, 9, .05); --danger: #B91C1C; --danger-ink: #FFFFFF;
  --reh-bg: #FEF3C7; --reh: #78350F; --edge-ok: #22C55E; --edge-warn: #F59E0B; --edge-err: #EF4444; --edge-info: #3B82F6;
  --t-action: #166534; --t-action-ink: #FFFFFF; --t-cont: #DCFCE7; --t-on: #14532D; --t-text: #166534;
  --dock: rgba(255, 255, 255, .88); --paper: #FFFDF8; --sun: #B45309; --sun-soft: #FDF0DC; --seed: #3F6212; --seed-soft: #ECF5DA;
  font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color: var(--fg); background: var(--bg); position: relative; overflow: hidden; box-sizing: border-box;
  line-height: 1.3; font-size: 16px; -webkit-font-smoothing: antialiased;
}
.gg.dark {
  --bg: #110C08; --card: #2A231C; --fg: #D6D3D1; --strong: #FAFAF9; --muted: #A8A29E;
  --line: rgba(250, 250, 249, .10); --line2: rgba(250, 250, 249, .18); --accent: #C2F5DA; --accent-ink: #0C0A09;
  --accent-soft: rgba(194, 245, 218, .14); --on: #C2F5DA; --av: rgba(194, 245, 218, .18); --av-ink: #C2F5DA;
  --ok-bg: rgba(34, 197, 94, .18); --ok: #86EFAC; --warn-bg: rgba(245, 158, 11, .18); --warn: #FCD34D;
  --err-bg: rgba(239, 68, 68, .18); --err: #FCA5A5; --info-bg: rgba(59, 130, 246, .2); --info: #93C5FD;
  --neu-bg: #342C24; --neu: #D6D3D1; --scrim: rgba(0, 0, 0, .62); --tile: #3A3028; --shadow: none;
  --reh-bg: rgba(245, 158, 11, .2); --reh: #FDE68A; --t-action: #BBF7D0; --t-action-ink: #052E16;
  --t-cont: rgba(134, 239, 172, .16); --t-on: #BBF7D0; --t-text: #86EFAC; --dock: rgba(42, 35, 28, .92);
  --paper: #2A231C; --sun: #FCD34D; --sun-soft: rgba(252, 211, 77, .14); --seed: #BEF264; --seed-soft: rgba(190, 242, 100, .14);
}
.gg *, .gg *::before, .gg *::after { box-sizing: border-box; }
.gg button, .gg a { font: inherit; color: inherit; }
.gg a { text-decoration: none; }
.gg .i { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; display: block; flex: 0 0 auto; }
.gg :focus-visible { outline: 2px solid var(--on); outline-offset: 2px; }

/* Screen scaffolding */
.gg .scr { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; padding-bottom: 112px; scrollbar-width: none; }
.gg .offl { position: absolute; left: 0; right: 0; top: 0; height: 24px; z-index: 8; background: rgba(12, 10, 9, .95); color: #FAFAF9; font-size: 12px; font-weight: 500; display: flex; align-items: center; justify-content: center; }
.gg .hdr { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 24px 8px 8px 16px; background: var(--bg); position: sticky; top: 0; z-index: 4; }
.gg .gchip { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px 0 5px; border-radius: 999px; background: var(--card); border: 1px solid var(--line2); font-size: 14px; font-weight: 500; color: var(--strong); min-width: 0; cursor: pointer; }
.gg .gchip .lbl { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 116px; }
.gg .gchip .av, .gg .avatar { width: 22px; height: 22px; border-radius: 50%; background: var(--av); color: var(--av-ink); display: grid; place-items: center; flex: 0 0 22px; font-size: 10px; font-weight: 700; }
.gg .launchers { display: flex; align-items: center; }
.gg .hit { width: 48px; height: 48px; display: grid; place-items: center; background: none; border: 0; padding: 0; color: var(--on); cursor: pointer; }
.gg .hit .ic { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line2); background: var(--card); display: grid; place-items: center; position: relative; }
.gg .badge { position: absolute; top: -4px; right: -6px; min-width: 16px; height: 16px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 600; display: grid; place-items: center; padding: 0 4px; box-shadow: 0 0 0 2px var(--bg); line-height: 1; }
.gg .dotbadge { position: absolute; top: 4px; right: 14px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--card); }
.gg .sec { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 20px 16px 8px; }
.gg .sec h2 { margin: 0; font-size: 16px; font-weight: 600; color: var(--strong); }
.gg .lnk { font-size: 14px; font-weight: 600; color: var(--on); }

.gg .sb.info { background: var(--info-bg); color: var(--info); } .gg .sb.neu { background: var(--neu-bg); color: var(--neu); } .gg .sb.pol { background: var(--reh-bg); color: var(--reh); font-weight: 700; }

.gg .dlg .dh p { margin: 4px 0 0; font-size: 14px; color: var(--muted); }

.gg .ckr.wait .cm { background: var(--info-bg); color: var(--info); } .gg .ckr.pol .cm { background: var(--reh-bg); color: var(--reh); }

.gg .dock { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; gap: 2px; padding: 4px 6px; border-radius: 999px; background: var(--dock); border: 1px solid var(--line2); box-shadow: 0 8px 24px rgba(20, 14, 8, .10); z-index: 4; }
.gg .dock .ni { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 84px; padding: 4px 8px; color: var(--muted); font-size: 12px; font-weight: 500; }

.gg .dock .ni.on { color: var(--t-on); font-weight: 600; } .gg .dock .ni.on .nic { background: var(--t-cont); }
.gg .wash { position: absolute; left: 0; right: 0; top: 0; height: 320px; background: linear-gradient(to bottom, var(--t-cont), transparent); opacity: .5; pointer-events: none; }

.gg .fieldA .inp { height: 40px; border: 1px solid var(--line2); border-radius: 12px; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; color: var(--strong); background: var(--card); }

.gg .xrow .xin { background: var(--card); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.gg .metric { display: flex; flex-direction: column; gap: 2px; padding: 4px 16px 0 0; }
.gg .metric b { font-size: 24px; font-weight: 700; color: var(--strong); font-variant-numeric: tabular-nums; }
.gg .metric span { font-size: 12px; color: var(--muted); }
.gg .meter { height: 8px; border-radius: 999px; background: var(--neu-bg); overflow: hidden; }
.gg .meter span { display: block; height: 100%; border-radius: 999px; background: var(--edge-info); }
.gg .rail { border-right: 1px solid var(--line); padding: 16px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.gg .rail .rs { display: flex; gap: 8px; align-items: center; padding: 8px; border-radius: 10px; color: var(--muted); }
.gg .rail .rs.on { background: var(--t-cont); color: var(--t-on); font-weight: 600; }
.gg .rail .rs b { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; background: var(--neu-bg); color: var(--strong); }
.gg .rail .rs.on b { background: var(--t-action); color: var(--t-action-ink); }
.gg .rail .tgt { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }

/* ================= Design-system alignment (v2 audit) =================
   Overrides above this line where the audit found drift from packages/shared tokens,
   the client PWA primitives and the admin cockpit primitives. See design-audit.md. */
.gg {
  --muted: #57534E; --soft: #78716C; --weak: #FAFAF9; --stroke-soft: #F5F5F4; --danger: #D02533;
  --ok-bg: #E0FAEC; --ok: #0B4627; --ok-bd: #C2F5DA; --warn-bg: #FFF3EB; --warn: #71330A; --warn-bd: #FFD9C0;
  --err-bg: #FFEBEC; --err: #681219; --err-bd: #FFC0C5; --info-bg: #EBF1FF; --info: #122368; --info-bd: #C0D5FF;
  --neu-bg: #F5F5F4; --neu: #57534E; --neu-bd: #F5F5F4;
  --edge-ok: #1FC16B; --edge-warn: #FA7319; --edge-err: #FB3748; --edge-info: #335CFF;
  --t-action: #1A7544; --t-action-ink: #FFFFFF; --t-cont: #D0FBE9; --t-on: #16643B; --t-text: #1A7544;
  --accent-10: rgba(31, 193, 107, .10); --wash: rgb(31 193 107 / 5%); --sscrim: rgba(12, 10, 9, .22); --dscrim: rgba(12, 10, 9, .36);
  --dlg: #ECE9E2; --el1: 0 1px 2px rgba(12, 10, 9, .06), 0 1px 3px rgba(12, 10, 9, .08); --el2: 0 4px 12px rgba(12, 10, 9, .10), 0 12px 32px rgba(12, 10, 9, .12);
}
.gg.dark {
  --muted: #A8A29E; --soft: #A8A29E; --weak: #1A140F; --stroke-soft: rgba(250, 250, 249, .08); --danger: #E93544;
  --ok-bg: rgba(31, 193, 107, .16); --ok: #3EE089; --ok-bd: rgba(31, 193, 107, .24);
  --warn-bg: rgba(250, 115, 25, .16); --warn: #FFA468; --warn-bd: rgba(250, 115, 25, .24);
  --err-bg: rgba(251, 55, 72, .16); --err: #FF6875; --err-bd: rgba(251, 55, 72, .24);
  --info-bg: rgba(51, 92, 255, .16); --info: #6895FF; --info-bd: rgba(51, 92, 255, .24);
  --neu-bg: #342C24; --neu: #D6D3D1; --neu-bd: rgba(250, 250, 249, .10);
  --edge-ok: #1DAF61; --edge-warn: #E16614; --edge-err: #E93544;
  --t-action: #C2F5DA; --t-action-ink: #16643B; --t-cont: #16643B; --t-on: #D0FBE9; --t-text: #C2F5DA;
  --accent-10: rgba(194, 245, 218, .10); --wash: rgb(194 245 218 / 10%); --sscrim: rgba(0, 0, 0, .40); --dscrim: rgba(0, 0, 0, .56);
  --dlg: #2A231C; --el1: none; --el2: 0 12px 32px rgba(0, 0, 0, .45);
}
/* Remix Icon glyphs are filled shapes */
.gg .i { fill: currentColor; stroke: none; }
.gg .spin { animation: gg-spin 1s linear infinite; }
@keyframes gg-spin { to { transform: rotate(360deg); } }

/* Type scale: amounts cap at 24/32 semibold; titles semibold */
.gg .h2 { font-size: 18px; font-weight: 600; line-height: 24px; }
.gg .ident h1, .gg .gtitle h1 { font-size: 22px; font-weight: 600; line-height: 28px; }
.gg .rtitle { font-weight: 500; }
.gg .detail { font-weight: 400; }
.gg .price .amt, .gg .bucket .bn, .gg .ticket .ta, .gg .escrow .ea, .gg .metric b { font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: 0; }
.gg .hero .ht { font-size: 18px; font-weight: 600; line-height: 24px; }
.gg .receipt .rl.big { font-size: 16px; font-weight: 600; }

/* Fact rows: 12px label, 14px value, 10px vertical padding */
.gg .fact { min-height: 0; padding: 10px 16px; align-items: center; }
.gg .fact .k { font-size: 12px; color: var(--muted); }
.gg .fact .v { font-size: 14px; }
.gg .fact.total { font-weight: 600; }

/* Alert notices: tone fill, tone border, tone-dark text, 20px icon. No neutral variant, so plain is info. */
.gg .notice { gap: 4px; padding: 12px; border-radius: 16px; border: 1px solid var(--info-bd); background: var(--info-bg); color: var(--info); }
.gg .notice .nt { color: inherit; font-size: 14px; font-weight: 600; line-height: 20px; }
.gg .notice .nt .i { width: 20px; height: 20px; color: inherit !important; }
.gg .notice p { color: inherit; font-size: 14px; line-height: 20px; padding-left: 28px; }
.gg .notice.ok { background: var(--ok-bg); border-color: var(--ok-bd); color: var(--ok); }
.gg .notice.warn { background: var(--warn-bg); border-color: var(--warn-bd); color: var(--warn); }
.gg .notice.err { background: var(--err-bg); border-color: var(--err-bd); color: var(--err); }
.gg .notice.info { background: var(--info-bg); border-color: var(--info-bd); color: var(--info); }
.gg .pill.ok, .gg .sb.ok { box-shadow: inset 0 0 0 1px var(--ok-bd); } .gg .pill.warn, .gg .sb.warn { box-shadow: inset 0 0 0 1px var(--warn-bd); }
.gg .pill.err, .gg .sb.err { box-shadow: inset 0 0 0 1px var(--err-bd); } .gg .pill.info, .gg .sb.info { box-shadow: inset 0 0 0 1px var(--info-bd); }

/* Buttons: medium weight, white secondary face, grey text action, disabled at .6 */
.gg .btn { font-weight: 500; }
.gg .btn.sec { background: var(--card); border: 1px solid var(--line2); color: var(--strong); }
.gg .btn.txt { color: var(--muted); }
.gg .btn.off, .gg .abtn.off { opacity: .6; }
.gg .btn .spin { width: 20px; height: 20px; }

/* Page action bar: two equal halves, primary on the right */
.gg .fbar { flex-direction: row-reverse; gap: 12px; padding: 16px; border-top: 1px solid var(--stroke-soft); }
.gg .fbar .btn { flex: 1 1 0; width: auto; min-width: 0; height: 48px; }

/* Top nav: no title, 32px outlined back button with the green filled arrow */
.gg .topnav { padding: 24px 16px 8px; }
.gg .topnav .mid { display: none; }
.gg .topnav .close { width: 32px; height: 32px; flex: 0 0 32px; border: 1px solid var(--line2); background: var(--card); color: var(--on); }
.gg .topnav .close .i { width: 16px; height: 16px; }

/* Sheets: 16px top corners, green grip, tiers 50/70/85, light scrim, borderless action bar */
.gg .scrim { background: var(--sscrim); }
.gg .sheet { border-radius: 16px 16px 0 0; }
.gg .sheet.half { height: 50%; } .gg .sheet.tall { height: 70%; } .gg .sheet.full { height: 85%; }
.gg .grip { width: 40px; height: 4px; border-radius: 2px; background: rgba(31, 193, 107, .32); margin: 12px auto 4px; }
.gg .shead { padding: 4px 8px 12px 16px; align-items: center; }
.gg .sacts { border-top: 0; padding: 12px 16px 16px; }
.gg .sacts .btn { height: 44px; }

/* Sheet tabs: rail on the weak surface, 12/500 labels, 16px icons, 10% active fill */
.gg .stabs { background: var(--weak); border-bottom: 1px solid var(--stroke-soft); }
.gg .stabs span, .gg .stabs button { flex: 1; height: 44px; font-size: 12px; font-weight: 500; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-bottom: 2px solid transparent; background: none; min-width: 0; padding: 0 4px; cursor: pointer; }
.gg .stabs span.on, .gg .stabs button.on { color: var(--on); background: var(--accent-10); border-bottom-color: var(--on); font-weight: 600; }
.gg .stabs .i { width: 16px; height: 16px; }

/* Status band (was the held-funds card): neutral, 16px, hairline */
.gg .escrow { border-radius: 16px; background: var(--weak); border: 1px solid var(--line); }
.gg .escrow .etop { background: none; padding: 14px 16px; }
.gg .escrow .elock { width: 40px; height: 40px; flex: 0 0 40px; border-radius: 12px; background: var(--card); color: var(--on); border: 1px solid var(--line); }
.gg .escrow .eband { padding: 12px 16px; border-top: 1px solid var(--line); }

/* Garden banner and visit header */
.gg .banner { height: 144px; border-radius: 0 0 24px 24px; }
.gg .banner .over { left: 16px; right: 16px; top: 16px; }
.gg .rb { width: 32px; height: 32px; border: 1px solid var(--line2); color: var(--on); }
.gg .rb .i { width: 16px; height: 16px; }
.gg .meta { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.gg .meta .i { color: var(--soft); }
.gg .gtabs span { font-size: 14px; font-weight: 500; }
.gg .gtabs span.on { background: var(--accent-10); }

/* Member app bar: 24px Line/Fill glyphs, grey inactive, no dot */
.gg .appbar { border-top: 1px solid var(--stroke-soft); }
.gg .tabb { color: var(--soft); font-size: 14px; }
.gg .tabb .i { width: 24px; height: 24px; }
.gg .tabb.on { color: var(--on); font-weight: 600; } .gg .tabb.on .pbg { background: var(--accent-10); }
.gg .gchip .av, .gg .avatar { background: var(--av); color: var(--on); }
.gg .gchip .av .i { width: 14px; height: 14px; }

/* Promise rows: 3px edge, green offers, blue requests */
.gg .row .edge { width: 3px; }
.gg .row.offer::before, .gg .row.req::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; z-index: 1; background: var(--edge-ok); }
.gg .row.req::before { background: var(--edge-info); }
.gg .tile.req { background: var(--info-bg); }

/* ================= Cockpit alignment ================= */
.gg .wash { background: var(--wash); opacity: 1; height: 100%; }
.gg .c-icons { color: var(--muted); gap: 4px; }
.gg .c-icons .i { width: 20px; height: 20px; }
.gg .c-head h1 { font-size: 18px; font-weight: 600; }
.gg .c-tabs span { height: 36px; gap: 6px; }
.gg .c-tabs span.on { background: var(--accent-10); }
.gg .c-tabs .cnt { background: var(--t-action); color: var(--t-action-ink); }
.gg .acard .ah { padding: 16px; border-bottom: 1px solid var(--line); }
.gg .acard .ah h2 { font-size: 16px; }
.gg .acard .ab { padding: 14px 16px 16px; }
.gg .arow:first-of-type { border-top: 0; }
.gg .arow > .l1, .gg .arow > .l2 { grid-column: 1; }
.gg .stabs .cnt, .gg .c-tabs .cnt { flex: 0 0 auto; display: grid; place-items: center; height: 16px; min-width: 16px; max-width: none; padding: 0 4px; border: 0; border-radius: 999px; font-size: 11px; font-weight: 600; background: var(--accent); color: var(--accent-ink); }
.gg .c-tabs .cnt { background: var(--t-action); color: var(--t-action-ink); }
.gg .arow.offer { box-shadow: inset 3px 0 0 var(--edge-ok); } .gg .arow.req { box-shadow: inset 3px 0 0 var(--edge-info); }
.gg .scope { display: flex; gap: 8px; padding: 12px 16px 4px; }

/* Admin buttons: outlined labels in the tone text colour on a stone border; filled adds elevation */
.gg .abtn { border-color: var(--soft); color: var(--t-text); padding: 0 16px; border-radius: 999px; }
.gg .abtn.lg { padding: 0 20px; }
.gg .abtn.fill { box-shadow: var(--el1); }
.gg .abtn.txt { border-color: transparent; color: var(--muted); }
.gg .abtn .spin { width: 16px; height: 16px; }

/* Dialogs: 448 / 880 wide, warm surface, hairlines, 40px close circle */
.gg .dscrim { background: var(--dscrim); }
.gg .dlg { width: 448px; background: var(--dlg); border-radius: 16px; box-shadow: var(--el2); }
.gg .dlg.lg { width: 880px; }
.gg .dlg .dh { position: relative; padding: 16px 64px 12px 24px; border-bottom: 1px solid var(--line); }
.gg .dlg .dh h2 { font-size: 18px; line-height: 24px; }
.gg .dlg .dh .close { position: absolute; right: 12px; top: 6px; width: 40px; height: 40px; flex: none; border-radius: 50%; }
.gg .dlg .db { padding: 16px 24px; }
.gg .dlg .df { border-top: 1px solid var(--line); padding: 12px 24px; }

/* PoolTarget: "Writing to" label above the pool. The protocol pool uses a warning notice instead. */
.gg .ptarget { display: flex; flex-direction: column; gap: 2px; }
.gg .ptarget .dl { font-size: 12px; font-weight: 500; color: var(--soft); }
.gg .ptarget b { font-size: 14px; font-weight: 600; color: var(--strong); }
.gg .target { border: 1px solid var(--neu-bd); }
.gg .target.protocol { border-color: var(--warn-bd); }

/* FlowStatusRow: icon column, title says what the write does, line under it says the consequence */
.gg .fsr { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 12px; align-items: start; min-height: 96px; padding: 16px 12px; border-radius: 12px; border: 1px solid var(--neu-bd); background: var(--neu-bg); color: var(--strong); }
.gg .fsr b { display: block; font-size: 14px; font-weight: 600; line-height: 20px; }
.gg .fsr small { display: block; font-size: 12px; line-height: 16px; color: var(--muted); margin-top: 2px; }
.gg .fsr.ok { background: var(--ok-bg); border-color: var(--ok-bd); } .gg .fsr.ok .i { color: var(--ok); }
.gg .fsr.err { background: var(--err-bg); border-color: var(--err-bd); } .gg .fsr.err .i { color: var(--err); }
.gg .fsr.info { background: var(--info-bg); border-color: var(--info-bd); } .gg .fsr.info .i { color: var(--info); }
.gg .flowrow { border: 1px solid var(--neu-bd); }
.gg .flowrow.ok { border-color: var(--ok-bd); } .gg .flowrow.err { border-color: var(--err-bd); } .gg .flowrow.info { border-color: var(--info-bd); }

/* Filter chips: 14/500, selected is a solid action capsule */
.gg .chipf { font-size: 14px; font-weight: 500; border-color: var(--line2); }
.gg .chipf.on { background: var(--t-action); color: var(--t-action-ink); border-color: var(--t-action); font-weight: 500; }

/* Filled text fields, 40px */
.gg .fieldA label { font-size: 12px; font-weight: 500; color: var(--muted); }
.gg .fieldA .inp { background: var(--stroke-soft); border-color: transparent; border-radius: 12px; }

/* Setting row with a switch */
.gg .setrow { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; width: 100%; padding: 12px 0 0; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; cursor: pointer; }
.gg .setrow b { display: block; font-size: 14px; font-weight: 500; color: var(--strong); line-height: 20px; }
.gg .setrow small { display: block; font-size: 12px; color: var(--muted); line-height: 16px; margin-top: 2px; }
.gg .switch { flex: 0 0 auto; width: 40px; height: 24px; border-radius: 999px; background: var(--line2); position: relative; margin-top: 2px; transition: background .15s; }
.gg .switch::after { content: ""; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: #FFFFFF; box-shadow: var(--el1); transition: transform .15s; }
.gg .setrow.on .switch { background: var(--t-action); } .gg .setrow.on .switch::after { transform: translateX(16px); }
.gg.dark .setrow.on .switch::after { background: #16643B; }

/* Cockpit dock: 56px pill, 85% surface with blur, 94px items, 20px icons */
.gg .dock { height: 56px; align-items: center; padding: 0 6px; background: color-mix(in srgb, var(--card) 85%, transparent); backdrop-filter: blur(12px); border-color: var(--line); }
.gg .dock .ni { min-width: 94px; padding: 0 8px; font-size: 12px; font-weight: 500; color: var(--muted); }
.gg .dock .ni .i { width: 20px; height: 20px; }
.gg .dock .ni.on { color: var(--strong); font-weight: 600; } .gg .dock .ni.on .nic { background: var(--t-cont); color: var(--t-on); }


/* Screen kit additions for the simplified screens */
.gg .st.warn .dot { background: var(--warn-bg); color: var(--warn); border-color: var(--warn); }
.gg .lessons { display: flex; gap: 4px; margin-top: 6px; }
.gg .lessons span { flex: 1; height: 8px; border-radius: 999px; background: var(--neu-bg); border: 1px solid var(--line2); }
.gg .lessons span.d { background: var(--edge-ok); border-color: transparent; }
.gg details.tech summary { color: var(--strong); }
</style>

th=\"18\" height=\"18\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><use href=\"#ri-pause-circle-line\"/><\/svg>Sunroot isn't taking new voucher promises right now<\/span><p>Vouchers you already placed in escrow are not affected.<\/p><\/div><\/sc-if>\n    <\/div>\n\n    <div class=\"sec\"><h2>How it works<\/h2><\/div>\n    <div class=\"mx16 card\">\n      <div class=\"facts\">\n        <div class=\"fact\"><span class=\"k\">Sunroot accepts within<\/span><span class=\"v\">3 days after your vouchers are in escrow<\/span><\/div>\n        <div class=\"fact\"><span class=\"k\">Starts<\/span><span class=\"v\">Within 2 weeks of acceptance<\/span><\/div>\n        <div class=\"fact\"><span class=\"k\">If lessons are missed<\/span><span class=\"v\">The final split returns vouchers to you, up to all 100, as Sunroot authorizes<\/span><\/div>\n      <\/div>\n    <\/div>\n    <p class=\"small mx16\" style=\"margin-top: 10px\">Lessons and vouchers are counted separately. The split isn't a price per lesson.<\/p>\n  <\/div>\n  <div class=\"fbar\">\n    <sc-if value=\"{{canGo}}\" hint-placeholder-val=\"{{true}}\"><a class=\"btn\" href=\"VSetup.dc.html\">Take Up with Vouchers<\/a><\/sc-if>\n    <sc-if value=\"{{short}}\" hint-placeholder-val=\"{{false}}\"><button type=\"button\" class=\"btn off\" disabled>Take Up with Vouchers<\/button><a class=\"btn sec\" href=\"Exchange.dc.html\">Get Sunroot Vouchers<\/a><\/sc-if>\n    <sc-if value=\"{{noWallet}}\" hint-placeholder-val=\"{{false}}\"><button type=\"button\" class=\"btn\">Connect Gnosis Wallet<\/button><\/sc-if>\n    <sc-if value=\"{{paused}}\" hint-placeholder-val=\"{{false}}\"><button type=\"button\" class=\"btn off\" disabled>Paused<\/button><\/sc-if>\n  <\/div>\n<\/div>","js":"\nclass Component extends DCLogic {\n  renderVals() {\n    var st = this.props.state ?? 'Open';\n    var dark = this.props.dark ?? false;\n    var held = { 'Open': '120 in your Gnosis wallet', 'Not enough': '80 in your Gnosis wallet', 'No wallet': 'Wallet not \/sc-for>\n    <\/div>\n    <div class=\"sbody\">\n      <sc-if value=\"{{isTerms}}\" hint-placeholder-val=\"{{true}}\">\n        <p class=\"h3\">Before Sunroot accepts<\/p>\n        <div class=\"card\"><div class=\"ladder\">\n          <div class=\"ls\"><span class=\"lm\"><svg class=\"i\" width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><use href=\"#ri-lock-line\"/><\/svg><\/span><span class=\"lt\"><b>Your vouchers wait in a Green Goods escrow on Gnosis<\/b><span>Held for this promise only<\/span><\/span><\/div>\n          <div class=\"ls\"><span class=\"lm\"><svg class=\"i\" width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><use href=\"#ri-time-line\"/><\/svg><\/span><span class=\"lt\"><b>Sunroot has 3 days to accept<\/b><span>Counted from when the escrow is ready<\/span><\/span><\/div>\n          <div class=\"ls\"><span class=\"lm\"><svg class=\"i\" width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><use href=\"#ri-arrow-go-back-line\"/><\/svg><\/span><span class=\"lt\"><b>You can cancel until then<\/b><span>Vouchers come back once the cancellation is confirmed. Running out of time doesn't return them on its own.<\/span><\/span><\/div>\n        <\/div><\/div>\n        <p class=\"h3\">After Sunroot accepts<\/p>\n        <div class=\"card\"><div class=\"ladder\">\n          <div class=\"ls\"><span class=\"lm\"><svg class=\"i\" width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><use href=\"#ri-close-line\"/><\/svg><\/span><span class=\"lt\"><b>Setup can't be canceled<\/b><span>If lessons are missed, the agreed remedy returns vouchers through the final split.<\/span><\/span><\/div>\n          <div class=\"ls\"><span class=\"lm\"><svg class=\"i\" width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><use href=\"#ri-pencil-line\"/><\/svg><\/span><span class=\"lt\"><b>New terms need you again<\/b><span>If Sunroot changes them, you agree before anything continues.<\/span><\/spa span><span class=\"lt\"><b>Setup prepared on Green Goods<\/b><span>Today, 11:02 AM<\/span><\/span><\/div>\n          <div class=\"ls now\"><span class=\"lm\"><svg class=\"i\" width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><use href=\"#ri-time-line\"/><\/svg><\/span><span class=\"lt\"><b>Sunroot approves this setup<\/b><span>Sunroot Skills Hub's stewards sign this on Gnosis<\/span><\/span><\/div>\n          <div class=\"ls todo\"><span class=\"lm\">3<\/span><span class=\"lt\"><b>You deposit 100 Sunroot vouchers<\/b><span>From your Gnosis wallet<\/span><\/span><\/div>\n        <\/div><\/div>\n        <div class=\"notice info\"><span class=\"nt\"><svg class=\"i\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><use href=\"#ri-time-line\"/><\/svg>Waiting for Sunroot<\/span><p>Sunroot approves each setup before the escrow takes vouchers. You'll get a notification; you can close this.<\/p><\/div>\n      <\/sc-if>\n\n      <sc-if value=\"{{isDeposit}}\" hint-placeholder-val=\"{{false}}\">\n        <div class=\"card\"><div class=\"ladder\">\n          <div class=\"ls done\"><span class=\"lm\"><svg class=\"i\" width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><use href=\"#ri-check-line\"/><\/svg><\/span><span class=\"lt\"><b>Sunroot approved this setup<\/b><span>Ade · 11:05 AM<\/span><\/span><\/div>\n          <div class=\"ls now\"><span class=\"lm\">3<\/span><span class=\"lt\"><b>You deposit 100 Sunroot vouchers<\/b><span>Two prompts from your wallet<\/span><\/span><\/div>\n        <\/div><\/div>\n        <div class=\"card\"><div class=\"facts\">\n          <div class=\"fact\"><span class=\"k\">Network<\/span><span class=\"v\">Gnosis<\/span><\/div>\n          <div class=\"fact\"><span class=\"k\">From<\/span><span class=\"v\"><span>Your Gnosis wallet<\/span><small class=\"mono\">0x9A40…41bD<\/small><\/span><\/div>\n          <div class=\"fact\"><span class=\"k\">To<\/span><span class=\"v\">Green Goods voucher         var S = SCREENS[sd.screen]; if (!S) { errs.push(p.id + ': no screen ' + sd.screen); return; }
        Object.keys(sd.props).forEach(function (k) { var m = S.meta[k]; if (!m || (m.options && m.options.indexOf(sd.props[k]) < 0)) errs.push(p.id + ': bad ' + k + '=' + sd.props[k]); });
        if (sd.variant && (variantOptions(sd.screen) || []).indexOf(sd.variant) < 0) errs.push(p.id + ': bad variant ' + sd.variant);
      });
    });
    Object.keys(DOCS).forEach(function (d) { DOCS[d].blocks.forEach(function (bl) { var fid = bl[0] === 'go' ? bl[2] : bl[0] === 'scen' ? bl[3] : undefined; if (fid && !FMAP[fid]) errs.push(d + ': no flow ' + fid); }); });
    Object.keys(REMAP).forEach(function (k) { if (!SCREENS[k] || !SCREENS[REMAP[k]]) errs.push('remap ' + k); });
    Object.keys(SCREENS).forEach(function (id) { if (!SHORT[id]) errs.push(id + ': no short name'); });
    QUESTIONS.forEach(function (q) {
      var o = variantOptions(q.screen); if (!o || o.indexOf(q.suggest) < 0) errs.push(q.id + ': suggestion not an option');
      Object.keys(q.preset || {}).forEach(function (k) { var m = SCREENS[q.screen].meta[k]; if (!m || (m.options && m.options.indexOf(q.preset[k]) < 0)) errs.push(q.id + ': bad preset ' + k); });
    });
    errorsLog.slice(before).forEach(function (e) { errs.push(e); });
    box.remove();
    return errs;
  };

  /* ---------- Start ---------- */
  var start = location.hash.replace('#', '');
  var last = lsGet('vlab.view3', null);
  if (QMAP[start]) openQuestion(start);
  else if (FMAP[start]) openFlow(start, 0);
  else if (PMAP[start]) openPair(start);
  else if (DOCS[start]) openDoc(start);
  else if (last && last.mode === 'question' && QMAP[last.id]) openQuestion(last.id);
  else if (last && last.mode === 'flow' && FMAP[last.id]) openFlow(last.id, last.step || 0);
  else if (last && last.mode === 'pair' && PMAP[last.id]) openPair(last.id);
  else if (last && last.mode === 'doc' && DOCS[last.id]) openDoc(last.id);
  else if (last && last.mode === 'screen' && SCREENS[last.id]) openScreen(last.id);
  else openPair('p-pay');
  window.__lab = { openPair: openPair, openQuestion: openQuestion, openFlow: openFlow, openScreen: openScreen, openDoc: openDoc };
  store.connect();
})();
</script>
