<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wallet</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./gg.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="gg {{themeCls}}" lang="{{lang}}" data-density="{{density}}" data-chain="{{chain}}" data-font="{{font}}" data-ground="{{ground}}" data-corners="{{corners}}" data-gap="{{gap}}" data-darkcards="{{darkcards}}" style="width: 390px; height: 844px; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: {{ink}}">
  <div class="scr" aria-hidden="true"><header class="hdr"><span class="gchip"><span class="av"><svg class="i" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><use href="#ri-seedling-fill"/></svg></span><span class="lbl">{{garden}}</span></span></header></div>
  <div class="scrim"></div>
  <section class="sheet full" role="dialog" aria-modal="true" aria-labelledby="wl-title">
    <div class="grip"></div>
    <div class="shead"><div><h2 class="stitle" id="wl-title">{{title}}</h2><p class="sdesc">{{sub}}</p></div><a class="close" href="Main.dc.html" aria-label="{{closeLabel}}"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><use href="#ri-close-line"/></svg></a></div>
    <div class="stabs" role="tablist">
      <button type="button" role="tab" aria-selected="false"><svg class="i" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><use href="#ri-coins-line"/></svg>{{tTokens}}</button>
      <button type="button" role="tab" class="{{vTab}}" aria-selected="{{vSel}}" onClick="{{showVouchers}}"><svg class="i" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><use href="#ri-coupon-3-line"/></svg>{{tVouchers}}</button>
      <button type="button" role="tab" class="{{pTab}}" aria-selected="{{pSel}}" onClick="{{showPurchases}}"><svg class="i" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><use href="#ri-shopping-bag-3-line"/></svg>{{tPurchases}}<span class="cnt">2</span></button>
      <button type="button" role="tab" aria-selected="false"><svg class="i" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><use href="#ri-stack-line"/></svg>{{tCookies}}</button>
    </div>
    <div class="sbody" style="padding-left: 0; padding-right: 0">
      <sc-if value="{{isVouchers}}" hint-placeholder-val="{{true}}">
        <p class="hsec">{{holdTitle}}</p>
        <div class="hlist">
          <sc-for list="{{hold}}" as="h" hint-placeholder-count="2">
            <a class="hrow" href="{{h.href}}"><span class="ht {{h.tile}}"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><use href="{{h.icon}}"/></svg></span><span class="hb"><span class="hn">{{h.name}}</span><span class="hd">{{h.sub}}</span></span><span class="ha"><b>{{h.amt}}</b><small>{{h.unit}}</small></span></a>
          </sc-for>
        </div>
        <sc-if value="{{hasPending}}" hint-placeholder-val="{{true}}">
          <p class="hsec">{{pendTitle}}</p>
          <div class="hlist">
            <sc-for list="{{pending}}" as="h" hint-placeholder-count="1">
              <a class="hrow" href="SRedeem.dc.html"><span class="ht {{h.tile}}"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><use href="{{h.icon}}"/></svg></span><span class="hb"><span class="hn">{{h.name}}</span><span class="hd">{{h.sub}}</span></span><span class="ha"><span class="pill {{h.cls}}">{{h.state}}</span></span></a>
            </sc-for>
          </div>
        </sc-if>
        <p class="hsec">{{useTitle}}</p>
        <div class="hlist">
          <a class="hrow" href="SOffer.dc.html"><span class="ht"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><use href="#ri-hand-heart-line"/></svg></span><span class="hb"><span class="hn">{{offers}}</span><span class="hd">{{offersS}}</span></span><span class="ha"><svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><use href="#ri-arrow-right-s-line"/></svg></span></a>
          <a class="hrow" href="SExchange.dc.html"><span class="ht"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><use href="#ri-exchange-line"/></svg></span><span class="hb"><span class="hn">{{ex}}</span><span class="hd">{{exS}}</span></span><span class="ha"><svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><use href="#ri-arrow-right-s-line"/></svg></span></a>
        </div>
      </sc-if>
      <sc-if value="{{isPurchases}}" hint-placeholder-val="{{false}}">
        <p class="hsec">{{inProgress}}</p>
        <div class="hlist">
          <sc-for list="{{open}}" as="h" hint-placeholder-count="2">
            <a class="hrow" href="{{h.href}}"><span class="ht {{h.tile}}"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><use href="{{h.icon}}"/></svg></span><span class="hb"><span class="hn">{{h.name}}</span><span class="hd">{{h.sub}}</span></span><span class="ha"><span class="pill {{h.cls}}">{{h.state}}</span></span></a>
          </sc-for>
        </div>
        <p class="hsec">{{closedTitle}}</p>
        <div class="hlist">
          <sc-for list="{{closed}}" as="h" hint-placeholder-count="2">
            <a class="hrow" href="{{h.href}}"><span class="ht {{h.tile}}"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><use href="{{h.icon}}"/></svg></span><span class="hb"><span class="hn">{{h.name}}</span><span class="hd">{{h.sub}}</span></span><span class="ha"><span class="pill {{h.cls}}">{{h.state}}</span></span></a>
          </sc-for>
        </div>
      </sc-if>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tab":{"editor":"enum","options":["Vouchers","Vouchers, return pending","Purchases"],"default":"Vouchers","section":"State"},"dark":{"editor":"boolean","default":false,"section":"Look"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var t = GGT(this.props.lang);
    var self = this;
    var tab = (this.state && this.state.tab) || (this.props.tab ?? 'Vouchers');
    var dark = this.props.dark ?? false;
    var later = tab === 'Vouchers, return pending';
    var purch = tab === 'Purchases';
    var hold = [
      { tile: 'sun', icon: '#ri-sun-line', name: t('who.sun'), sub: t('wl.sunS'), amt: t.n(later ? 0 : 30), unit: t('wl.avail'), href: 'SOffer.dc.html' },
      { tile: 'tool', icon: '#ri-tools-line', name: t('who.hill'), sub: t('wl.hillS'), amt: later ? t.g(86.4) : t.n(250), unit: t('wl.avail'), href: 'SExchange.dc.html' }
    ];
    var pending = later ? [{ tile: 'sun', icon: '#ri-arrow-go-back-line', name: t('wl.back', { n: t.n(60) }), sub: t('wl.backS'), cls: 'info', state: t('wl.pending') }] : [];
    return Object.assign(GGTW(this.props), {
      themeCls: dark ? 'dark' : '', ink: dark ? '#D6D3D1' : '#292524', lang: t.code, garden: t('who.rc'),
      title: t('wl.title'), sub: t('wl.sub'), closeLabel: t('c.close'),
      tTokens: t('wl.t.tokens'), tVouchers: t('wl.t.vouchers'), tPurchases: t('wl.t.purchases'), tCookies: t('wl.t.cookies'),
      vTab: purch ? '' : 'on', vSel: purch ? 'false' : 'true', pTab: purch ? 'on' : '', pSel: purch ? 'true' : 'false',
      showVouchers: function () { self.setState({ tab: 'Vouchers' }); }, showPurchases: function () { self.setState({ tab: 'Purchases' }); },
      isVouchers: !purch, isPurchases: purch,
      holdTitle: t('wl.hold'), hold: hold, hasPending: pending.length > 0, pendTitle: t('wl.heldTitle'), pending: pending,
      useTitle: t('wl.use'), offers: t('wl.offers'), offersS: t('wl.offersS'), ex: t('wl.ex'), exS: t('wl.exS'),
      inProgress: t('wl.inProgress'), closedTitle: t('wl.closed'),
      open: [{ tile: 'gd', icon: '#ri-coins-line', name: t('wl.p.ai'), sub: t('wl.p.aiS', { amt: t.g(450) }), cls: 'info', state: t('wl.p.aiPill'), href: 'SPurchase.dc.html' },
        { tile: 'sun', icon: '#ri-coupon-3-line', name: t('wl.p.course'), sub: t('wl.p.courseS'), cls: 'info', state: t('wl.p.coursePill'), href: 'SRedeem.dc.html' }],
      closed: [{ tile: 'sun', icon: '#ri-coupon-3-line', name: t('wl.p.session'), sub: t('wl.p.sessionS'), cls: 'ok', state: t('wl.p.sessionPill'), href: 'SRedeem.dc.html' },
        { tile: 'gd', icon: '#ri-coins-line', name: t('wl.p.journal'), sub: t('wl.p.journalS', { amt: t.g(120) }), cls: 'ok', state: t('wl.p.journalPill'), href: '#' }]
    });
  }
}
</script>
</body>
</html>
