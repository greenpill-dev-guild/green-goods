<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Services</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./gg.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="gg {{themeCls}}" lang="{{lang}}" data-density="{{density}}" data-chain="{{chain}}" data-font="{{font}}" data-ground="{{ground}}" data-corners="{{corners}}" data-gap="{{gap}}" data-darkcards="{{darkcards}}" style="width: 390px; height: 844px; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: {{ink}}">
  <div class="scr" style="padding-bottom: 40px">
    <div class="topnav">
      <a class="close" href="Main.dc.html" aria-label="{{backLabel}}"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><use href="#ri-arrow-left-fill"/></svg></a>
    </div>
    <div class="ident">
      <span class="kind"><svg class="i" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><use href="#ri-hand-heart-line"/></svg>{{kindLine}}</span>
      <h1>{{title}}</h1>
      <p class="para">{{desc}}</p>
    </div>
    <sc-if value="{{loading}}" hint-placeholder-val="{{false}}">
      <p class="hsec" role="status">{{loadingText}}</p>
      <div class="hlist" aria-hidden="true">
        <div class="hrow skel"><span class="ht"></span><span class="hb"><span class="hn bar"></span><span class="hd bar"></span></span></div>
        <div class="hrow skel"><span class="ht"></span><span class="hb"><span class="hn bar"></span><span class="hd bar"></span></span></div>
        <div class="hrow skel"><span class="ht"></span><span class="hb"><span class="hn bar"></span><span class="hd bar"></span></span></div>
      </div>
    </sc-if>
    <sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
      <div class="stack" style="margin-top: 12px">
        <div class="notice info" role="status"><span class="nt"><svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><use href="#ri-information-line"/></svg>{{emptyT}}</span><p>{{emptyB}}</p></div>
      </div>
    </sc-if>
    <sc-if value="{{hasRows}}" hint-placeholder-val="{{true}}">
      <div class="chips mx16" style="margin-top: 12px" role="group" aria-label="{{filterLabel}}">
        <span class="chip on">{{fAll}}</span><span class="chip">{{fHold}}</span><span class="chip">{{fEx}}</span>
      </div>
      <p class="hsec">{{secTitle}}</p>
      <div class="hlist">
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
          <a class="hrow" href="{{r.href}}"><span class="ht {{r.tile}}"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><use href="{{r.icon}}"/></svg></span><span class="hb"><span class="hn">{{r.name}}</span><span class="hd">{{r.by}}</span><span class="hd">{{r.sub}}</span></span><span class="ha"><span class="pill {{r.cls}}">{{r.pill}}</span></span></a>
        </sc-for>
      </div>
      <div class="mx16 card" style="margin-top: 14px"><div class="pad"><h2 class="h3">{{whoT}}</h2><p class="small" style="font-size: 13px; line-height: 18px">{{whoB}}</p></div></div>
      <p class="hsec">{{ownSec}}</p>
      <div class="hlist">
        <a class="hrow" href="SOnboard.dc.html"><span class="ht person"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><use href="#ri-pencil-line"/></svg></span><span class="hb"><span class="hn">{{own}}</span><span class="hd">{{ownS}}</span></span><span class="ha"><svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><use href="#ri-arrow-right-s-line"/></svg></span></a>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["Browse","Issuer paused","Delisted","Loading","Empty"],"default":"Browse","section":"State"},"dark":{"editor":"boolean","default":false,"section":"Look"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var t = GGT(this.props.lang);
    var st = this.props.state ?? 'Browse';
    var dark = this.props.dark ?? false;
    var paused = st === 'Issuer paused', delisted = st === 'Delisted';
    // Each row says who promises delivery: a named member, or a garden. The pill says whether Lina can redeem now.
    var rows = [
      { tile: 'person', icon: '#ri-user-line', name: t('sv.s.lesson'), by: t('sv.by.member', { name: t('who.teoFull'), garden: t('who.sun') }), sub: paused ? t('sv.pausedS') : t('sv.s.lessonS'),
        cls: paused ? 'warn' : 'ok', pill: paused ? t('sv.p.paused') : t('sv.p.hold', { n: t.v(1) }), href: 'SOffer.dc.html' },
      { tile: 'person', icon: '#ri-user-line', name: t('sv.s.coach'), by: t('sv.by.member', { name: t('who.mayaFull'), garden: t('who.sun') }), sub: delisted ? t('sv.delistedS') : t('sv.s.coachS'),
        cls: 'neu', pill: delisted ? t('sv.p.delisted') : t('sv.p.ex'), href: 'SExchange.dc.html' },
      { tile: 'sun', icon: '#ri-sun-line', name: t('of.s.title'), by: t('sv.by.garden', { garden: t('who.sun') }), sub: t('sv.s.sessionS'), cls: 'ok', pill: t('sv.p.hold', { n: t.n(30) }), href: 'SOffer.dc.html' },
      { tile: 'sun', icon: '#ri-sun-line', name: t('of.c.title'), by: t('sv.by.garden', { garden: t('who.sun') }), sub: t('sv.s.courseS', { date: t.d('2026-10-30') }), cls: 'neu', pill: t('sv.p.ex'), href: 'SOffer.dc.html' },
      { tile: 'gd', icon: '#ri-seedling-line', name: t('of.g.title'), by: t('sv.by.garden', { garden: t('who.gg') }), sub: t('sv.s.aiS', { amt: t.g(450) }), cls: 'neu', pill: t('sv.p.gd'), href: 'SOffer.dc.html' }
    ];
    return Object.assign(GGTW(this.props), {
      themeCls: dark ? 'dark' : '', ink: dark ? '#D6D3D1' : '#292524', lang: t.code, backLabel: t('c.back'),
      kindLine: t('sv.kind'), title: t('sv.title'), desc: t('sv.desc'),
      loading: st === 'Loading', loadingText: t('sv.loading'), empty: st === 'Empty', emptyT: t('sv.empty.t'), emptyB: t('sv.empty.b'),
      hasRows: st !== 'Loading' && st !== 'Empty', filterLabel: t('sv.filter'), fAll: t('sv.f.all'), fHold: t('sv.f.hold'), fEx: t('sv.f.ex'),
      secTitle: t('sv.sec'), rows: rows, whoT: t('sv.who.t'), whoB: t('sv.who.b'),
      ownSec: t('sv.ownSec'), own: t('sv.own'), ownS: t('sv.ownS')
    });
  }
}
</script>
</body>
</html>
