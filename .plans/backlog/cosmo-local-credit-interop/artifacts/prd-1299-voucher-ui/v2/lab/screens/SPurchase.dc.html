<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>G$ purchase</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./gg.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="gg {{themeCls}}" lang="{{lang}}" style="width: 390px; height: 844px; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: {{ink}}">
  <div class="scr" style="padding-bottom: {{padBottom}}">
    <div class="topnav">
      <a class="close" href="SWallet.dc.html" aria-label="{{backLabel}}"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><use href="#ri-arrow-left-fill"/></svg></a>
    </div>
    <div class="ident">
      <span class="kind"><svg class="i" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><use href="#ri-seedling-line"/></svg>{{kindLine}}</span>
      <h1>{{title}}</h1>
    </div>
    <div class="escrow" style="margin-top: 14px">
      <div class="etop">
        <span class="elock"><svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><use href="{{bandIcon}}"/></svg></span>
        <span><span class="ea">{{bandAmt}}</span><span class="eu" style="display: block">{{bandLabel}}</span></span>
      </div>
    </div>
    <div class="stack" style="margin-top: 12px">
      <div class="notice {{nextCls}}" role="status"><span class="nt"><svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><use href="{{nextIcon}}"/></svg>{{nextT}}</span><p>{{nextB}}</p></div>
    </div>
    <div class="sec"><h2>{{progressTitle}}</h2></div>
    <div class="mx16 card">
      <ol class="ladder ph" style="margin: 0; padding-left: 0; list-style: none">
        <sc-for list="{{phases}}" as="p" hint-placeholder-count="4">
          <li class="ls {{p.cls}}">
            <span class="lm"><svg class="i" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><use href="{{p.icon}}"/></svg></span>
            <span class="lt"><b>{{p.title}}</b><span class="who">{{p.who}}</span>
              <span class="subs"><sc-for list="{{p.subs}}" as="s" hint-placeholder-count="2"><span class="sub {{s.cls}}"><svg class="i" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><use href="{{s.icon}}"/></svg><span>{{s.text}}</span><span class="st2">{{s.state}}</span></span></sc-for></span>
            </span>
          </li>
        </sc-for>
      </ol>
    </div>
    <div class="sec"><h2>{{detailsTitle}}</h2></div>
    <div class="mx16 card">
      <div class="facts">
        <sc-for list="{{facts}}" as="f" hint-placeholder-count="3"><div class="fact"><span class="k">{{f.k}}</span><span class="v"><span>{{f.v}}</span><small>{{f.s}}</small></span></div></sc-for>
        <div class="fact"><span class="k">{{termsLabel}}</span><span class="v"><a class="tlink" href="#">{{readTerms}}</a></span></div>
      </div>
      <details class="tech">
        <summary style="cursor: pointer; font-weight: 600">{{techLabel}}</summary>
        <sc-for list="{{tech}}" as="x" hint-placeholder-count="3"><span>{{x}}</span></sc-for>
      </details>
    </div>
  </div>
  <sc-if value="{{hasActs}}" hint-placeholder-val="{{false}}">
    <div class="fbar col"><div class="fbtns">
      <sc-if value="{{hasPrimary}}" hint-placeholder-val="{{false}}"><a class="btn" href="{{primaryHref}}">{{primary}}</a></sc-if>
      <sc-if value="{{hasSecondary}}" hint-placeholder-val="{{false}}"><a class="btn sec" href="#">{{secondary}}</a></sc-if>
    </div></div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["Waiting for check","Waiting for acceptance","Accepted","Access active","Ready to confirm","Kept, paying out","Paid out","Declined","Refund sent","Refunded","Refund failed","Canceled","Terms changed","Problem reported"],"default":"Waiting for check","section":"State"},"dark":{"editor":"boolean","default":false,"section":"Look"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var t = GGT(this.props.lang);
    var st = this.props.state ?? 'Waiting for check';
    var dark = this.props.dark ?? false;
    var price = 450, fee = 0.45, gross = 450.45;
    var IC = { done: '#ri-check-line', now: '#ri-time-line', warn: '#ri-alert-line', fail: '#ri-close-line', todo: '#ri-checkbox-blank-circle-line' };
    var ORDER = ['Waiting for check', 'Waiting for acceptance', 'Accepted', 'Access active', 'Ready to confirm', 'Kept, paying out', 'Paid out'];
    var refund = { 'Declined': 1, 'Refund sent': 1, 'Refunded': 1, 'Refund failed': 1, 'Canceled': 1 }[st];
    var pos = ORDER.indexOf(st);
    if (st === 'Terms changed') pos = 1;
    if (st === 'Problem reported') pos = 3;
    function sub(text, state, label) { return { text: text, cls: state === 'todo' ? '' : state, icon: IC[state], state: label || t('pu.s.' + state) }; }
    function phase(title, who, subs) {
      var c = subs.some(function (s) { return s.cls === 'fail'; }) ? 'fail' : subs.some(function (s) { return s.cls === 'warn'; }) ? 'warn'
        : subs.every(function (s) { return s.cls === 'done'; }) ? 'done' : subs.some(function (s) { return s.cls === 'now' || s.cls === 'done'; }) ? 'now' : 'todo';
      return { title: title, who: who, subs: subs, cls: c, icon: IC[c] };
    }
    var s = function (i) { return pos > i ? 'done' : pos === i ? 'now' : 'todo'; };
    var phases = [phase(t('pu.p.paid'), t('pu.who.you'), [sub(t('pu.sub.agreed', { date: t.d('2026-10-22') }), 'done'), sub(t('pu.sub.sent', { gross: t.g(gross) }), 'done'),
      sub(t('pu.sub.checked', { price: t.g(price) }), pos >= 1 || refund ? 'done' : 'now')])];
    if (refund) {
      var declined = st !== 'Canceled';
      phases.push(phase(declined ? t('pu.p.declined') : t('pu.p.canceled'), declined ? t('pu.who.gg') : t('pu.who.you'), [sub(declined ? t('pu.sub.declined', { date: t.d('2026-10-23') }) : t('pu.sub.canceled', { date: t.d('2026-10-23') }), 'done')]));
      var q = st === 'Declined' || st === 'Canceled' ? 'now' : 'done';
      var sent = st === 'Refund sent' ? 'now' : st === 'Refunded' ? 'done' : st === 'Refund failed' ? 'fail' : 'todo';
      phases.push(phase(t('pu.p.refund'), t('pu.who.rc'), [sub(t('pu.sub.queued', { price: t.g(price) }), q), sub(t('pu.sub.refundSent'), sent), sub(t('pu.sub.refunded'), st === 'Refunded' ? 'done' : 'todo')]));
    } else {
      var acc = st === 'Terms changed' ? 'warn' : pos >= 2 ? 'done' : pos === 1 ? 'now' : 'todo';
      phases.push(phase(t('pu.p.accepted'), t('pu.who.both'), [sub(t('pu.sub.accepted'), acc), sub(t('pu.sub.assigned'), pos >= 3 ? 'done' : pos === 2 ? 'now' : 'todo')]));
      phases.push(phase(t('pu.p.month'), t('pu.who.gg'), [sub(t('pu.sub.access', { date: t.d('2026-10-24') }), st === 'Problem reported' ? 'warn' : pos >= 3 ? 'done' : pos === 2 ? 'now' : 'todo', st === 'Problem reported' ? t('pu.s.disputed') : ''), sub(t('pu.sub.ready', { date: t.d('2026-11-24') }), pos >= 4 && st !== 'Problem reported' ? 'done' : 'todo')]));
      phases.push(phase(t('pu.p.kept'), t('pu.who.youThen'), [sub(t('pu.sub.confirmed'), pos >= 5 ? 'done' : pos === 4 ? 'now' : 'todo'), sub(t('pu.sub.paid', { price: t.g(price) }), pos >= 6 ? 'done' : pos === 5 ? 'now' : 'todo')]));
    }
    var B = {
      'Waiting for check': ['#ri-time-line', t.g(gross) + ' G$', t('pu.b.sent')],
      'Kept, paying out': ['#ri-send-plane-line', t.g(price) + ' G$', t('pu.b.paying')],
      'Paid out': ['#ri-check-line', t.g(price) + ' G$', t('pu.b.paid')],
      'Declined': ['#ri-arrow-go-back-line', t.g(price) + ' G$', t('pu.b.owed')], 'Canceled': ['#ri-arrow-go-back-line', t.g(price) + ' G$', t('pu.b.owed')],
      'Refund sent': ['#ri-arrow-go-back-line', t.g(price) + ' G$', t('pu.b.coming')], 'Refunded': ['#ri-check-line', t.g(price) + ' G$', t('pu.b.back')],
      'Refund failed': ['#ri-alert-line', t.g(price) + ' G$', t('pu.b.failed')], 'Terms changed': ['#ri-lock-line', t.g(price) + ' G$', t('pu.b.old')]
    }[st] || ['#ri-lock-line', t.g(price) + ' G$', t('pu.b.held')];
    var N = {
      'Waiting for check': ['info', '#ri-time-line', 'check', null, 'cancel'],
      'Waiting for acceptance': ['info', '#ri-time-line', 'decide', null, 'cancel'],
      'Accepted': ['info', '#ri-time-line', 'accepted', null, 'report'],
      'Access active': ['ok', '#ri-check-line', 'access', null, 'report'],
      'Ready to confirm': ['info', '#ri-question-line', 'confirm', 'confirm', 'report'],
      'Kept, paying out': ['info', '#ri-send-plane-line', 'paying'],
      'Paid out': ['ok', '#ri-check-line', 'paid'],
      'Declined': ['info', '#ri-information-line', 'declined'],
      'Refund sent': ['info', '#ri-time-line', 'refundSent'],
      'Refunded': ['ok', '#ri-check-line', 'refunded'],
      'Refund failed': ['warn', '#ri-alert-line', 'refundFailed'],
      'Canceled': ['info', '#ri-information-line', 'canceled'],
      'Terms changed': ['warn', '#ri-alert-line', 'changed', 'newTerms', 'cancel'],
      'Problem reported': ['warn', '#ri-alert-line', 'problem', null, 'addDetails']
    }[st];
    var vars = { price: t.g(price), fee: t.g(fee), gross: t.g(gross), newPrice: t.g(480), newGross: t.g(480.48), quote: t('pu.quote'),
      d1: t.d('2026-10-24'), d2: t.d('2026-11-24'), d3: t.d('2026-11-25'), d4: t.d('2026-11-26'), d5: t.d('2026-10-23') };
    var hasPrimary = !!N[3], hasSecondary = !!N[4];
    return {
      themeCls: dark ? 'dark' : '', ink: dark ? '#D6D3D1' : '#292524', lang: t.code, backLabel: t('c.back'),
      kindLine: t('who.gg'), title: t('of.g.title'),
      bandIcon: B[0], bandAmt: B[1], bandLabel: B[2],
      nextCls: N[0], nextIcon: N[1], nextT: t('pu.n.' + N[2] + '.t', vars), nextB: t('pu.n.' + N[2] + '.b', vars),
      progressTitle: t('pu.progress'), phases: phases,
      detailsTitle: t('c.details'),
      facts: [{ k: t('pu.f.paid'), v: t('pu.f.paidV', { gross: t.g(gross), date: t.d('2026-10-22') }), s: t('pu.f.paidS', { fee: t.g(fee) }) },
        { k: t('pu.f.recorded'), v: pos >= 1 || refund ? t.g(price) + ' G$' : t('pu.f.notYet'), s: t('pu.f.recordedS') },
        { k: t('pu.f.refund'), v: t.g(price) + ' G$', s: t('pu.f.refundS') }],
      termsLabel: t('c.terms'), readTerms: t('c.readTerms'),
      techLabel: t('c.tech'), tech: [t('pu.x.held'), t('pu.x.payment'), t('pu.x.record')],
      hasActs: hasPrimary || hasSecondary, hasPrimary: hasPrimary, hasSecondary: hasSecondary,
      primary: hasPrimary ? t('pu.a.' + N[3]) : '', primaryHref: N[3] === 'newTerms' ? 'SPay.dc.html' : '#',
      secondary: hasSecondary ? t('pu.a.' + N[4]) : '',
      padBottom: hasPrimary || hasSecondary ? '104px' : '40px'
    };
  }
}
</script>
</body>
</html>
