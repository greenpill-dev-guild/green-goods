<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Offer</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./gg.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="gg {{themeCls}}" lang="{{lang}}" data-density="{{density}}" data-chain="{{chain}}" data-font="{{font}}" data-ground="{{ground}}" data-corners="{{corners}}" data-gap="{{gap}}" data-darkcards="{{darkcards}}" style="width: 390px; height: 844px; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: {{ink}}">
  <sc-if value="{{offline}}" hint-placeholder-val="{{false}}"><div class="offl"><svg class="i" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><use href="#ri-cloud-off-line"/></svg>&nbsp;{{offlineMode}}</div></sc-if>
  <div class="scr" style="padding-bottom: {{padBottom}}">
    <div class="topnav">
      <a class="close" href="Visit.dc.html" aria-label="{{backLabel}}"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><use href="#ri-arrow-left-fill"/></svg></a>
    </div>
    <div class="ident">
      <span class="kind"><svg class="i" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><use href="#ri-hand-heart-line"/></svg>{{kindLine}}</span>
      <h1>{{title}}</h1>
      <p class="para">{{desc}}</p>
    </div>
    <div class="mx16" style="margin-top: 12px"><div class="price"><span class="amt">{{amt}}</span><span class="unit">{{unit}}</span></div></div>
    <div class="mx16 card" style="margin-top: 12px">
      <div class="pad" style="padding-bottom: 6px"><h2 class="h3">{{routeTitle}}</h2></div>
      <div class="qa">
        <sc-for list="{{qa}}" as="q" hint-placeholder-count="5">
          <div class="qrow"><span class="qi"><svg class="i" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><use href="{{q.icon}}"/></svg></span><span class="qt"><span class="qk">{{q.k}}</span><span class="qv">{{q.v}}</span><span class="qs">{{q.s}}</span></span></div>
        </sc-for>
      </div>
    </div>
    <div class="sec"><h2>{{detailsTitle}}</h2></div>
    <div class="mx16 card">
      <div class="facts">
        <sc-for list="{{facts}}" as="f" hint-placeholder-count="3"><div class="fact"><span class="k">{{f.k}}</span><span class="v"><span>{{f.v}}</span><small>{{f.s}}</small></span></div></sc-for>
        <div class="fact"><span class="k">{{termsLabel}}</span><span class="v"><a class="tlink" href="#">{{readTerms}}</a></span></div>
      </div>
    </div>
  </div>
  <div class="fbar col">
    <sc-if value="{{hasWhy}}" hint-placeholder-val="{{false}}">
      <div class="why {{whyCls}}" role="status"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><use href="{{whyIcon}}"/></svg><span><b>{{whyT}}</b> {{whyB}}</span></div>
    </sc-if>
    <div class="fbtns">
      <sc-if value="{{canGo}}" hint-placeholder-val="{{true}}"><a class="btn" href="SPay.dc.html">{{cta}}</a></sc-if>
      <sc-if value="{{blocked}}" hint-placeholder-val="{{false}}"><button type="button" class="btn off" disabled>{{cta}}</button></sc-if>
      <sc-if value="{{hasAlt}}" hint-placeholder-val="{{false}}"><a class="btn {{altCls}}" href="{{altHref}}">{{alt}}</a></sc-if>
      <sc-if value="{{hasAlt2}}" hint-placeholder-val="{{false}}"><a class="btn sec" href="{{alt2Href}}">{{alt2}}</a></sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["G$ purchase","Voucher session","Voucher course"],"default":"G$ purchase","section":"State"},"state":{"editor":"enum","options":["Open","Not a gardener","Not enough","Gardens only","No places","Offline"],"default":"Open","section":"State"},"dark":{"editor":"boolean","default":false,"section":"Look"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var t = GGT(this.props.lang);
    var kind = this.props.kind ?? 'G$ purchase';
    var st = this.props.state ?? 'Open';
    var dark = this.props.dark ?? false;
    var I = { give: '#ri-wallet-3-line', get: '#ri-gift-line', held: '#ri-lock-line', next: '#ri-user-follow-line', back: '#ri-arrow-go-back-line' };
    var gd = kind === 'G$ purchase', course = kind === 'Voucher course';
    var price = 450, fee = 0.45;
    var held = st === 'Not enough' ? (course ? 20 : 6) : (course ? 100 : 30);
    var K;
    if (gd) {
      K = {
        garden: t('who.gg'), title: t('of.g.title'), desc: t('of.g.desc'), amt: t.g(price), unit: t('of.g.unit'), cta: t('of.cta.pay'),
        qa: [
          [I.get, t('of.q.get'), t('of.g.get'), t('of.g.getS')],
          [I.give, t('of.q.give'), t('of.g.give', { gross: t.g(price + fee) }), t('of.g.giveS', { price: t.g(price), fee: t.g(fee) })],
          [I.held, t('of.q.held'), t('of.g.held'), t('of.g.heldS')],
          [I.next, t('of.q.next'), t('of.g.next'), t('of.g.nextS')],
          [I.back, t('of.q.back'), t('of.g.back', { price: t.g(price) }), t('of.g.backS', { fee: t.g(fee) })]
        ],
        facts: [[t('of.f.starts'), t('of.g.starts'), t('of.g.startsS')], [t('of.f.who'), t('of.f.whoV'), t('of.f.whoS')], [t('of.f.places'), t('of.g.places'), t('of.f.placesS')]]
      };
    } else {
      K = {
        garden: t('who.sun'), title: t(course ? 'of.c.title' : 'of.s.title'), desc: t(course ? 'of.c.desc' : 'of.s.desc'),
        amt: t.n(course ? 100 : 10), unit: t('u.sunMany'), cta: t('of.cta.redeem', { n: t.n(course ? 100 : 10) }),
        qa: [
          [I.get, t('of.q.get'), t(course ? 'of.c.get' : 'of.s.get'), t(course ? 'of.c.getS' : 'of.s.getS')],
          [I.give, t('of.q.give'), t('of.v.give', { n: t.n(course ? 100 : 10) }), t('of.v.giveS', { held: t.n(held) })],
          [I.held, t('of.q.held'), t('of.v.held'), t('of.v.heldS')],
          [I.next, t('of.q.next'), t('of.v.next'), t('of.v.nextS')],
          [I.back, t('of.q.back'), t('of.v.back'), t(course ? 'of.c.backS' : 'of.s.backS')]
        ],
        facts: [[t('of.f.starts'), t('of.v.starts'), t(course ? 'of.c.startsS' : 'of.s.startsS')], [t('of.f.who'), t('of.f.whoVv'), t('of.f.whoSv')], [t('of.f.places'), t(course ? 'of.c.places' : 'of.s.places'), t('of.f.placesS')]]
      };
    }
    var W = {
      'Not a gardener': ['info', '#ri-information-line', t('of.r.noGarden.t'), t('of.r.noGarden.b'), [t('of.a.findGarden'), '#', '']],
      'Not enough': gd ? ['warn', '#ri-alert-line', t('of.r.shortG.t', { have: t.g(300.12) }), t('of.r.shortG.b', { gross: t.g(price + fee) }), [t('of.a.getGd'), 'SWallet.dc.html', '']]
        : ['warn', '#ri-alert-line', t('of.r.shortV.t', { have: t.n(held) }), t(course ? 'of.r.shortV.bc' : 'of.r.shortV.bs'), [t('of.a.exchange'), 'SExchange.dc.html', ''], [t('of.a.earn'), 'SWallet.dc.html']],
      'Gardens only': ['info', '#ri-information-line', t('of.r.gardens.t'), t('of.r.gardens.b', { garden: K.garden }), [t('of.a.back'), 'Visit.dc.html', 'sec']],
      'No places': ['info', '#ri-information-line', t('of.r.full.t'), t('of.r.full.b', { garden: K.garden }), [t('of.a.back'), 'Visit.dc.html', 'sec']],
      'Offline': ['info', '#ri-cloud-off-line', t('of.r.offline.t'), t('of.r.offline.b')]
    };
    var w = W[st];
    var a1 = w && w[4], a2 = w && w[5];
    // The lab's copy density dial: minimal keeps three answers and moves the other two under Details
    var qa = K.qa, facts = K.facts;
    if ((this.props.density ?? 'full') === 'minimal') {
      qa = [K.qa[0], K.qa[1], K.qa[4]];
      facts = [[K.qa[2][1], K.qa[2][2], K.qa[2][3]], [K.qa[3][1], K.qa[3][2], K.qa[3][3]]].concat(K.facts);
    }
    return Object.assign(GGTW(this.props), {
      themeCls: dark ? 'dark' : '', ink: dark ? '#D6D3D1' : '#292524', lang: t.code,
      offline: st === 'Offline', offlineMode: t('c.offline'), backLabel: t('c.back'),
      kindLine: t('of.kind', { garden: K.garden }), title: K.title, desc: K.desc, amt: K.amt, unit: K.unit,
      routeTitle: t('of.route'), qa: qa.map(function (q) { return { icon: q[0], k: q[1], v: q[2], s: q[3] }; }),
      detailsTitle: t('c.details'), facts: facts.map(function (f) { return { k: f[0], v: f[1], s: f[2] }; }),
      termsLabel: t('c.terms'), readTerms: t('c.readTerms'),
      hasWhy: !!w, whyCls: w ? w[0] : '', whyIcon: w ? w[1] : '', whyT: w ? w[2] : '', whyB: w ? w[3] : '',
      cta: K.cta, canGo: st === 'Open', blocked: st === 'Offline',
      hasAlt: !!a1, alt: a1 ? a1[0] : '', altHref: a1 ? a1[1] : '#', altCls: a1 ? a1[2] : '',
      hasAlt2: !!a2, alt2: a2 ? a2[0] : '', alt2Href: a2 ? a2[1] : '#',
      padBottom: w ? '176px' : '112px'
    });
  }
}
</script>
</body>
</html>
