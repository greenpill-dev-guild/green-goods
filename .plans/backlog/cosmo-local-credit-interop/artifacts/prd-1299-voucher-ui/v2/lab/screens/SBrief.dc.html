<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Project brief</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./gg.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="gg {{themeCls}}" lang="{{lang}}" data-density="{{density}}" data-chain="{{chain}}" data-font="{{font}}" data-ground="{{ground}}" data-corners="{{corners}}" data-gap="{{gap}}" data-darkcards="{{darkcards}}" style="width: 390px; height: 844px; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: {{ink}}">
  <div class="scr" style="padding-bottom: 40px">
    <div class="topnav">
      <a class="close" href="Visit.dc.html" aria-label="{{backLabel}}"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><use href="#ri-arrow-left-fill"/></svg></a>
    </div>
    <div class="ident">
      <span class="kind"><svg class="i" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><use href="#ri-git-branch-line"/></svg>{{kindLine}}</span>
      <h1>{{title}}</h1>
      <p class="para">{{desc}}</p>
    </div>
    <div class="stack" style="margin-top: 12px">
      <div class="notice info" role="status"><span class="nt"><svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><use href="#ri-information-line"/></svg>{{noteT}}</span><p>{{noteB}}</p></div>
    </div>
    <p class="hsec">{{promisesT}}</p>
    <div class="hlist">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
        <a class="hrow" href="SReward.dc.html"><span class="ht {{r.tile}}"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><use href="{{r.icon}}"/></svg></span><span class="hb"><span class="hn">{{r.name}}</span><span class="hd">{{r.sub}}</span></span><span class="ha"><span class="pill {{r.cls}}">{{r.pill}}</span></span></a>
      </sc-for>
    </div>
    <div class="sec"><h2>{{detailsTitle}}</h2></div>
    <div class="mx16 card"><div class="facts">
      <sc-for list="{{facts}}" as="f" hint-placeholder-count="2"><div class="fact"><span class="k">{{f.k}}</span><span class="v"><span>{{f.v}}</span><small>{{f.s}}</small></span></div></sc-for>
    </div></div>
    <p class="hsec">{{peerT}}</p>
    <p class="small mx16" style="font-size: 13px; line-height: 18px; margin-bottom: 8px">{{peerS}}</p>
    <div class="hlist">
      <a class="hrow" href="SRedeem.dc.html"><span class="ht person"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><use href="#ri-user-line"/></svg></span><span class="hb"><span class="hn">{{peerRow}}</span><span class="hd">{{peerRowS}}</span></span><span class="ha"><span class="pill {{peerCls}}">{{peerPill}}</span></span></a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["Open","In progress","One kept"],"default":"Open","section":"State"},"dark":{"editor":"boolean","default":false,"section":"Look"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var t = GGT(this.props.lang);
    var st = this.props.state ?? 'Open';
    var dark = this.props.dark ?? false;
    // Three separate requests under one brief; each row carries its own reward and its own state
    var P = { open: ['neu', t('br.p.open')], prog: ['info', t('br.p.prog')], review: ['info', t('br.p.review')], kept: ['ok', t('br.p.kept')], wait: ['neu', t('br.p.wait')] };
    var S = { 'Open': ['prog', 'open', 'wait'], 'In progress': ['review', 'prog', 'open'], 'One kept': ['kept', 'prog', 'open'] }[st];
    var rows = [
      { tile: 'person', icon: '#ri-pencil-line', name: t('br.r.design'), sub: t('br.r.designS'), cls: P[S[0]][0], pill: P[S[0]][1] },
      { tile: 'sun', icon: '#ri-eye-line', name: t('br.r.analysis'), sub: t('br.r.analysisS'), cls: P[S[1]][0], pill: P[S[1]][1] },
      { tile: 'gd', icon: '#ri-hammer-line', name: t('br.r.build'), sub: t('br.r.buildS'), cls: P[S[2]][0], pill: P[S[2]][1] }
    ];
    var kept = st === 'One kept';
    return Object.assign(GGTW(this.props), {
      themeCls: dark ? 'dark' : '', ink: dark ? '#D6D3D1' : '#292524', lang: t.code, backLabel: t('c.back'),
      kindLine: t('br.kind', { garden: t('who.sun') }), title: t('br.title'), desc: t('br.desc'),
      noteT: t('br.n.t'), noteB: t('br.n.b'), promisesT: t('br.promises'), rows: rows,
      detailsTitle: t('c.details'),
      facts: [{ k: t('br.f.coord'), v: t('br.f.coordV'), s: t('br.f.coordS') }, { k: t('br.f.rewards'), v: t('br.f.rewardsV'), s: t('br.f.rewardsS') }],
      peerT: t('br.peer'), peerS: t('br.peerS'), peerRow: t('br.peerRow'), peerRowS: t('br.peerRowS'),
      peerCls: kept ? 'warn' : 'info', peerPill: kept ? t('br.p.partial') : t('ms.t.booked')
    });
  }
}
</script>
</body>
</html>
