<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PWA Garden Home Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: a stage of real-size phones on the left, a sticky control rail on the right, a hint line at the foot. */
:root {
  --lab-bg: #F3F1EC;
  --lab-panel: #FFFFFF;
  --lab-fg: #1C1917;
  --lab-muted: #6B655F;
  --lab-line: #E3DFD8;
  --lab-accent: #1A7544;
  --lab-accent-ink: #FFFFFF;
  --lab-soft: rgba(26, 117, 68, 0.10);
  --lab-font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --lab-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --lab-bg: #14110E; --lab-panel: #1F1B17; --lab-fg: #ECE9E4; --lab-muted: #A39E97; --lab-line: #2E2924; --lab-accent: #9FE3BF; --lab-accent-ink: #0C0A09; --lab-soft: rgba(159, 227, 191, 0.14); color-scheme: dark }
}
:root[data-theme="dark"] { --lab-bg: #14110E; --lab-panel: #1F1B17; --lab-fg: #ECE9E4; --lab-muted: #A39E97; --lab-line: #2E2924; --lab-accent: #9FE3BF; --lab-accent-ink: #0C0A09; --lab-soft: rgba(159, 227, 191, 0.14); color-scheme: dark }
html, body { height: 100% }
body { margin: 0; background: var(--lab-bg); color: var(--lab-fg); font-family: var(--lab-font); font-size: 14px; line-height: 1.4; -webkit-font-smoothing: antialiased }
*, *::before, *::after { box-sizing: border-box }
button { font: inherit }
.lab { display: flex; flex-direction: column; min-height: 100%; padding-inline: 16px; padding-block: 0 }
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; padding-block: 14px 10px; border-bottom: 1px solid var(--lab-line) }
.top h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.01em }
.top p { margin: 2px 0 0; color: var(--lab-muted); font-size: 13px }
.presets { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.pbtn { height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--lab-line); background: var(--lab-panel); color: var(--lab-fg); cursor: pointer }
.pbtn:hover { border-color: var(--lab-muted) }
.pbtn.primary { background: var(--lab-accent); color: var(--lab-accent-ink); border-color: var(--lab-accent) }
.pbtn:focus-visible, .seg button:focus-visible { outline: 2px solid var(--lab-accent); outline-offset: 2px }
.work { display: flex; gap: 24px; align-items: flex-start; flex: 1; padding-block: 16px; min-width: 0 }
.stage { flex: 1 1 auto; min-width: 0; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; justify-content: center }
.phonewrap { position: relative }
.phonewrap .cap { position: absolute; left: 0; top: -22px; font-size: 12px; color: var(--lab-muted); font-variant-numeric: tabular-nums }
.rail { flex: 0 0 300px; width: 300px; position: sticky; top: env(safe-area-inset-top, 0px); max-height: calc(100vh - 24px); overflow-y: auto; background: var(--lab-panel); border: 1px solid var(--lab-line); border-radius: 16px; padding: 12px 14px 16px; display: flex; flex-direction: column; gap: 14px }
.grp { display: flex; flex-direction: column; gap: 6px }
.grp h3 { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--lab-muted) }
.grp .ttl { font-size: 13px; font-weight: 600 }
.grp .ttl small { font-weight: 500; color: var(--lab-muted); margin-left: 6px }
.seg { display: flex; flex-wrap: wrap; gap: 6px }
.seg button { height: 30px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--lab-line); background: transparent; color: var(--lab-fg); cursor: pointer; font-size: 13px }
.seg button[aria-pressed="true"] { background: var(--lab-soft); border-color: var(--lab-accent); color: var(--lab-accent); font-weight: 600 }
.hint { position: sticky; bottom: env(safe-area-inset-bottom, 0px); background: var(--lab-panel); border-top: 1px solid var(--lab-line); padding-block: 8px; margin-inline: -16px; padding-inline: 16px; font-size: 13px; color: var(--lab-muted); min-height: 36px; display: flex; align-items: center; justify-content: space-between; gap: 12px }
.hint code { font-family: var(--lab-mono); font-size: 12px; color: var(--lab-fg); user-select: all; word-break: break-all }
@media (max-width: 1040px) { .work { flex-direction: column } .rail { position: static; width: 100%; flex-basis: auto; max-height: none } }

/* The phone. Tokens live on the frame so the lab's own theme and the app's theme stay independent.
   Light: the unification hub's linen canvas and white cards. Dark: one warm ladder, the card one step above the canvas (F2, F13). */
.frame { position: relative; overflow: hidden; font-family: var(--lab-font); font-size: 16px; line-height: 1.3; background: var(--bg); color: var(--fg); border-radius: 36px; box-shadow: 0 0 0 1px rgba(12, 10, 9, 0.12), 0 24px 48px rgba(12, 10, 9, 0.18); transform-origin: top left }
.frame[data-theme="light"] { --bg: #FAF8F5; --card: #FFFFFF; --fg: #292524; --strong: #0C0A09; --muted: #6B655F; --line: #E7E5E4; --line2: #D6D3D1; --accent: #1A7544; --accent-ink: #FFFFFF; --accent-soft: rgba(31, 193, 107, .12); --accent-on: #1A7544; --chip-av: #D0FBE9; --chip-av-ink: #14532D; --ok-bg: #DCFCE7; --ok: #166534; --warn-bg: #FEF3C7; --warn: #92400E; --err-bg: #FEE2E2; --err: #991B1B; --info-bg: #DBEAFE; --info: #1E40AF; --neu-bg: #F5F5F4; --neu: #44403C; --scrim: rgba(12, 10, 9, .4); --tile: #EFE9DF; --shadow: 0 1px 2px rgba(12, 10, 9, .05); --edge-ok: #22C55E; --edge-warn: #F59E0B; --edge-err: #EF4444; --edge-info: #3B82F6; --offl-bg: rgba(12, 10, 9, .95); --offl-fg: #FAFAF9; --tag-bg: rgba(255, 255, 255, .94); --tag-fg: #0C0A09 }
.frame[data-theme="dark"] { --bg: #110C08; --card: #2A231C; --fg: #D6D3D1; --strong: #FAFAF9; --muted: #A8A29E; --line: rgba(250, 250, 249, .10); --line2: rgba(250, 250, 249, .18); --accent: #C2F5DA; --accent-ink: #0C0A09; --accent-soft: rgba(194, 245, 218, .14); --accent-on: #C2F5DA; --chip-av: rgba(194, 245, 218, .18); --chip-av-ink: #C2F5DA; --ok-bg: rgba(34, 197, 94, .18); --ok: #86EFAC; --warn-bg: rgba(245, 158, 11, .18); --warn: #FCD34D; --err-bg: rgba(239, 68, 68, .18); --err: #FCA5A5; --info-bg: rgba(59, 130, 246, .18); --info: #93C5FD; --neu-bg: #342C24; --neu: #D6D3D1; --scrim: rgba(0, 0, 0, .62); --tile: #3A3028; --shadow: none; --edge-ok: #4ADE80; --edge-warn: #FBBF24; --edge-err: #F87171; --edge-info: #60A5FA; --offl-bg: rgba(250, 250, 249, .95); --offl-fg: #0C0A09; --tag-bg: rgba(42, 35, 28, .94); --tag-fg: #FAFAF9 }
/* Zero specificity, so every component below keeps its own colour (the first lab let this rule beat .btn, .hit and .link, which is the light-on-light button in dark mode). */
:where(.frame) button { color: inherit }
.i { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; display: block; flex: 0 0 auto }
.art { width: 100%; height: 100%; display: block; object-fit: cover }
.fb { position: absolute; inset: 0; background: linear-gradient(135deg, var(--tile), var(--accent-soft)); display: grid; place-items: center; color: var(--accent-on); opacity: .9 }
.fb .i { opacity: .45 }
.avimg { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block }
.screen { position: absolute; left: 0; right: 0; top: 0; bottom: 0; overflow-y: auto; overflow-x: hidden; padding-bottom: 96px; scrollbar-width: none }
/* The shell's offline strip: fixed over the top padding of whatever header is there, so nothing moves when it comes or goes. */
.offl { position: absolute; left: 0; right: 0; top: 0; height: 24px; z-index: 8; background: var(--offl-bg); color: var(--offl-fg); font-size: 12px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 6px; pointer-events: none }
.hdr { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 24px 8px 8px 16px; background: var(--bg) }
.hdr.sticky { position: sticky; top: 0; z-index: 4 }
.hdr.sticky.scrolled { box-shadow: 0 1px 0 var(--line) }
.hdr .lead { min-width: 0; flex: 1; display: flex; align-items: center; height: 48px }
.h1 { margin: 0; font-size: 18px; font-weight: 600; color: var(--strong) }
/* The garden chip at the app's size: 32px like the compact icon buttons beside it, so the row keeps one height. */
.chip { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px 0 5px; border-radius: 999px; background: var(--card); border: 1px solid var(--line2); font-size: 14px; font-weight: 500; color: var(--strong); max-width: 100%; cursor: pointer; text-align: left }
.chip .lbl { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.chip .av { width: 22px; height: 22px; border-radius: 50%; background: var(--chip-av); color: var(--chip-av-ink); display: grid; place-items: center; flex: 0 0 22px; overflow: hidden }
.chip .caret { color: var(--muted); display: grid; place-items: center }
.launchers { display: flex; align-items: center; flex: 0 0 auto }
.hit { width: 48px; height: 48px; display: grid; place-items: center; background: none; border: 0; padding: 0; cursor: pointer; color: var(--accent-on) }
.hit .ic { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line2); background: var(--card); display: grid; place-items: center; position: relative }
.badge { position: absolute; top: -4px; right: -6px; min-width: 16px; height: 16px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 600; display: grid; place-items: center; padding: 0 4px; box-shadow: 0 0 0 2px var(--bg); line-height: 1 }
.gactions { display: flex; justify-content: flex-end; padding: 0 8px 4px }
.sec { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 20px 16px 8px }
.sec h2 { margin: 0; font-size: 16px; font-weight: 600; color: var(--strong) }
.link { font-size: 14px; font-weight: 600; color: var(--accent-on); background: none; border: 0; padding: 4px 0; cursor: pointer; white-space: nowrap }
.sub { padding: 0 16px 8px; font-size: 12px; color: var(--muted) }
.list { display: flex; flex-direction: column; gap: 12px; padding: 0 16px }
.row { display: flex; align-items: stretch; height: 88px; flex-shrink: 0; background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; text-align: left; padding: 0; width: 100%; cursor: pointer; position: relative; box-shadow: var(--shadow) }
.row.selected { box-shadow: inset 0 0 0 3px var(--accent) }
/* Home rows, an exploration for the 20 October discussion: the locked item cards (F7), one surface per section with hairlines, or open rows with no boxes. */
.frame[data-rows="grouped"] .list { gap: 0; margin: 0 16px; padding: 0; background: var(--card); border: 1px solid var(--line); border-radius: 24px; overflow: hidden; box-shadow: var(--shadow) }
.frame[data-rows="grouped"] .sbody .list { margin: 0 }
.frame[data-rows="grouped"] .row { border: 0; border-top: 1px solid var(--line); border-radius: 0; box-shadow: none; background: transparent }
.frame[data-rows="grouped"] .row:first-child { border-top: 0 }
.frame[data-rows="open"] .row { background: transparent; border: 0; box-shadow: none }
.frame[data-rows="open"] .row .edge { display: none }
.frame[data-rows="open"] .row .tile { border-radius: 16px }
.frame[data-rows="open"] .list { gap: 16px }
.frame[data-rows="divided"] .list { gap: 0 }
.frame[data-rows="divided"] .row { border: 0; border-top: 1px solid var(--line); border-radius: 0; box-shadow: none; background: transparent }
.frame[data-rows="divided"] .row:first-child { border-top: 0 }
.frame[data-rows="divided"] .row .edge { display: none }
.frame[data-rows="divided"] .row .tile { width: 72px; height: 72px; flex-basis: 72px; border-radius: 12px; margin: 8px 0 8px 16px }
.row .edge { position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: transparent }
.edge.ok { background: var(--edge-ok) } .edge.warn { background: var(--edge-warn) } .edge.err { background: var(--edge-err) } .edge.info { background: var(--edge-info) }
.tile { width: 88px; height: 88px; flex: 0 0 88px; background: var(--tile); overflow: hidden; position: relative }
.icontile { display: grid; place-items: center; color: var(--accent-on) }
.row .body { flex: 1; min-width: 0; padding: 10px 12px; display: flex; flex-direction: column; justify-content: center; gap: 4px }
.title { font-size: 15px; font-weight: 600; color: var(--strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 20px }
.pill { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 500; width: fit-content; max-width: 100%; white-space: nowrap }
.pill.ok { background: var(--ok-bg); color: var(--ok) } .pill.warn { background: var(--warn-bg); color: var(--warn) } .pill.err { background: var(--err-bg); color: var(--err) } .pill.info { background: var(--info-bg); color: var(--info) } .pill.neu { background: var(--neu-bg); color: var(--neu) }
.detail { font-size: 11px; font-weight: 500; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 14px }
.slot { display: grid; place-items: center; padding: 0 10px 0 4px; color: var(--muted) }
.slot .btn.compact { height: 32px }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 24px; box-shadow: var(--shadow) }
.fact { display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 48px; padding: 0 16px; border: 0; border-top: 1px solid var(--line); font-size: 14px; color: var(--strong); background: none; width: 100%; cursor: pointer; text-align: left }
.fact.first { border-top: 0 }
.fact .val { color: var(--muted); display: flex; align-items: center; gap: 6px; font-size: 14px }
.bar { position: absolute; left: 0; right: 0; bottom: 0; height: 76px; background: var(--card); border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; display: flex; justify-content: space-evenly; align-items: center; padding-bottom: 10px }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; background: none; border: 0; color: var(--muted); font-size: 14px; min-width: 72px; padding: 4px 0; cursor: pointer }
.tab .pillbg { width: 56px; height: 32px; border-radius: 999px; display: grid; place-items: center }
.tab.active { color: var(--accent-on) } .tab.active .pillbg { background: var(--accent-soft) }
.btn { height: 48px; border-radius: 16px; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 16px; border: 0; width: 100%; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 16px }
.btn.secondary { background: transparent; border: 1px solid var(--line2); color: var(--strong) }
.btn.compact { height: 32px; font-size: 14px; padding: 0 12px; width: auto; border-radius: 12px }
.scrim { position: absolute; left: 0; right: 0; top: 0; bottom: 0; background: var(--scrim); border: 0; padding: 0; cursor: pointer; z-index: 9 }
.scrim.clear { background: transparent }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; height: 70%; background: var(--card); border-radius: 24px 24px 0 0; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 -8px 24px rgba(12, 10, 9, .12); z-index: 10 }
.sheet.half { height: 52% }
.sheet.full { height: 85% }
.grip { width: 40px; height: 6px; border-radius: 3px; background: var(--line2); margin: 8px auto 0 }
.shead { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; padding: 8px 8px 8px 20px }
.stitle { font-size: 18px; font-weight: 600; color: var(--strong); line-height: 24px; margin: 0 }
.sdesc { font-size: 14px; color: var(--muted); line-height: 20px; margin: 2px 0 0 }
.close { width: 44px; height: 44px; border: 0; background: none; color: var(--strong); display: grid; place-items: center; border-radius: 50%; cursor: pointer; flex: 0 0 44px }
.tabs { display: flex; border-bottom: 1px solid var(--line) }
.tabs button { flex: 1; height: 44px; border: 0; background: none; font-size: 14px; font-weight: 500; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 6px; border-bottom: 2px solid transparent; cursor: pointer; padding: 0 4px; min-width: 0 }
.tabs button .tl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.tabs button.active { color: var(--accent-on); background: var(--accent-soft); border-bottom-color: var(--accent-on); font-weight: 600 }
.cnt { min-width: 16px; height: 16px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 600; display: grid; place-items: center; padding: 0 4px; line-height: 1 }
.sbody { flex: 1; overflow-y: auto; padding: 12px 16px 24px; display: flex; flex-direction: column; gap: 12px; scrollbar-width: none }
.sbody > * { flex-shrink: 0 }
.sbody .sec { padding: 8px 0 0 }
.countline { display: flex; align-items: center; justify-content: space-between; font-size: 14px; color: var(--muted); padding: 0 0 4px }
.para { margin: 0; font-size: 14px; line-height: 20px; color: var(--fg) }
.grow { display: flex; align-items: center; gap: 12px; height: 64px; padding: 0 12px; border-radius: 16px; border: 0; background: none; width: 100%; text-align: left; cursor: pointer; color: var(--strong) }
.grow.active { background: var(--accent-soft) }
.grow .av2 { width: 40px; height: 40px; border-radius: 50%; background: var(--chip-av); color: var(--chip-av-ink); display: grid; place-items: center; flex: 0 0 40px; overflow: hidden }
.grow .gtxt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px }
.grow .nm { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.grow .gs { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.rolechip { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: var(--neu-bg); color: var(--neu); flex: 0 0 auto }
.divider { height: 1px; background: var(--line); margin: 4px 0 }
.menu { position: absolute; left: 16px; top: 68px; width: 300px; max-width: calc(100% - 32px); background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 12px 32px rgba(12, 10, 9, .18); padding: 6px; display: flex; flex-direction: column; gap: 2px; z-index: 10 }
.menu .grow { height: 52px; border-radius: 12px }
.menu .grow .av2 { width: 32px; height: 32px; flex-basis: 32px }
.media { height: 160px; background: var(--tile); overflow: hidden; position: relative }
/* A mark on the photo, never a row of its own: every garden card keeps one height (the 18 October rule). */
.tag { position: absolute; top: 8px; right: 8px; height: 22px; padding: 0 8px; border-radius: 999px; background: var(--tag-bg); color: var(--tag-fg); font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; max-width: calc(100% - 16px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.gcard { display: flex; flex-direction: column; overflow: hidden; padding: 0; border: 1px solid var(--line); border-radius: 24px; background: var(--card); width: 100%; cursor: pointer; text-align: left; color: inherit; box-shadow: var(--shadow) }
.gcard .gb { display: flex; flex-direction: column; gap: 4px; padding: 12px 16px 14px; height: 60px }
.gname { font-size: 15px; font-weight: 600; color: var(--strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.gmeta { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.banner { height: 144px; position: relative; background: var(--tile); overflow: hidden; border-radius: 0 0 24px 24px }
.banner .art { position: absolute; inset: 0 }
.banner .over { position: absolute; left: 8px; right: 8px; top: 12px; display: flex; align-items: flex-start; justify-content: space-between; gap: 8px }
.banner .stack { display: flex; flex-direction: column; gap: 4px; align-items: flex-end }
.topnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 24px 8px 8px }
.topnav .mid { flex: 1; min-width: 0; text-align: center; font-size: 16px; font-weight: 600; color: var(--strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.gtitle { padding: 12px 16px 0; display: flex; flex-direction: column; gap: 6px }
.gtitle h1 { margin: 0; font-size: 24px; font-weight: 700; color: var(--strong); line-height: 30px }
.meta { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); min-width: 0 }
.meta span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.metarow { display: flex; align-items: center; justify-content: space-between; gap: 8px }
.metacol { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1 }
.gtabs { margin-top: 12px; position: sticky; top: 0; background: var(--bg); z-index: 2 }
.steps { display: flex; align-items: flex-start; gap: 4px; flex: 1; justify-content: center }
.step { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); width: 60px }
.step .dot { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line2); display: grid; place-items: center; font-size: 13px; font-weight: 600; background: var(--card); color: var(--strong) }
.step.active { color: var(--strong); font-weight: 600 } .step.active .dot { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.info { display: flex; gap: 12px; align-items: center; padding: 16px; border-radius: 24px; background: var(--neu-bg); margin: 0 16px }
.info .ic { width: 44px; height: 44px; border-radius: 50%; background: var(--card); display: grid; place-items: center; color: var(--accent-on); flex: 0 0 44px }
.info h3 { margin: 0; font-size: 16px; font-weight: 600; color: var(--strong) }
.info p { margin: 2px 0 0; font-size: 13px; color: var(--muted) }
.hscroll { display: flex; gap: 12px; overflow-x: auto; padding: 0 16px 4px; scroll-snap-type: x mandatory; scrollbar-width: none }
.acard { flex: 0 0 256px; border-radius: 24px; overflow: hidden; background: var(--card); border: 1px solid var(--line); scroll-snap-align: start; box-shadow: var(--shadow); cursor: pointer; text-align: left; padding: 0; color: inherit }
.acard.selected { box-shadow: inset 0 0 0 3px var(--accent) }
.acard .media { height: 96px }
.acard .ab { padding: 12px 14px 14px; display: block }
.acard h4 { margin: 0; font-size: 15px; font-weight: 600; color: var(--strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.acard p { margin: 4px 0 0; font-size: 12px; color: var(--muted); line-height: 16px; height: 32px; overflow: hidden }
/* Highlights strip: one row of equal cards, 280×112, with the next card peeking so the swipe is visible. */
.hcard { flex: 0 0 280px; height: 112px; border-radius: 24px; overflow: hidden; background: var(--card); border: 1px solid var(--line); scroll-snap-align: start; box-shadow: var(--shadow); cursor: pointer; text-align: left; padding: 0; color: inherit; display: flex; align-items: stretch }
.hcard .hm { width: 96px; flex: 0 0 96px; background: var(--tile); position: relative; overflow: hidden }
.hcard .hb { flex: 1; min-width: 0; padding: 12px 14px; display: flex; flex-direction: column; justify-content: center; gap: 4px }
.hcard .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.hcard .big { font-size: 20px; font-weight: 700; color: var(--strong); line-height: 24px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }

.chips { display: flex; gap: 8px; padding: 0 16px 12px; overflow-x: auto; scrollbar-width: none }
.chip2 { height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line2); background: var(--card); font-size: 13px; font-weight: 500; color: var(--strong); white-space: nowrap; cursor: pointer; flex: 0 0 auto }
.chip2.on { background: var(--accent-soft); border-color: var(--accent-on); color: var(--accent-on); font-weight: 600 }
.rtabs { display: flex; gap: 4px; padding: 0 16px; align-items: flex-end }
.rtab { height: 40px; padding: 0 14px; border: 1px solid var(--line); border-bottom: 0; border-radius: 12px 12px 0 0; background: var(--neu-bg); color: var(--muted); font-size: 14px; font-weight: 500; cursor: pointer; position: relative; top: 1px }
.rtab.on { background: var(--card); color: var(--strong); font-weight: 600; z-index: 1 }
.rpanel { margin: 0 16px; background: var(--card); border: 1px solid var(--line); border-radius: 0 16px 16px 16px; padding: 12px 0 }
.rpanel .hscroll { padding: 0 12px 4px }
.agrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 16px }
.atile { display: flex; flex-direction: column; overflow: hidden; border-radius: 16px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); padding: 0; text-align: left; cursor: pointer; color: inherit; height: 148px }
.atile.selected { box-shadow: inset 0 0 0 3px var(--accent) }
.atile .media { height: 80px; flex: 0 0 80px }
.atile .ab { padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0 }
.keeps { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 12px 16px 0; min-height: 44px; padding: 8px 12px 8px 16px; border-radius: 16px; background: var(--accent-soft); font-size: 13px; color: var(--strong) }
.keeps span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.ctx { display: flex; align-items: center; gap: 8px; padding: 0 16px 12px; font-size: 13px; color: var(--muted) }
.ctx .av { width: 22px; height: 22px; border-radius: 50%; overflow: hidden; background: var(--chip-av); color: var(--chip-av-ink); display: grid; place-items: center; flex: 0 0 22px }
.ctx b { color: var(--strong); font-weight: 600 }
.pin { display: flex; align-items: center; gap: 12px; height: 64px; padding: 0 16px; border-radius: 16px; background: var(--accent-soft); border: 1px solid var(--line); margin: 0 16px }
.pin .av2 { width: 40px; height: 40px; border-radius: 50%; background: var(--card); color: var(--accent-on); display: grid; place-items: center; flex: 0 0 40px; overflow: hidden }
.pin .ptxt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px }
.pin .eyebrow { font-size: 12px; color: var(--muted) }
.pin .pn { font-size: 15px; font-weight: 600; color: var(--strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.flow { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 20px; background: var(--bg); border-top: 1px solid var(--line); z-index: 3 }
.promo { margin: 0 16px; padding: 20px; display: flex; flex-direction: column; gap: 12px }

.featcap { display: flex; flex-direction: column; gap: 6px; padding: 12px 16px 14px }
.season { margin: 0 16px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px }
.season .sl { display: flex; flex-direction: column; gap: 2px; min-width: 0 }
.season .sl b { font-size: 15px; font-weight: 600; color: var(--strong) }
.season .sl span { font-size: 12px; color: var(--muted) }
.ring { width: 44px; height: 44px; border-radius: 50%; background: conic-gradient(var(--accent) 0 0%, var(--neu-bg) 0 100%); display: grid; place-items: center; flex: 0 0 44px }
.ring span { width: 34px; height: 34px; border-radius: 50%; background: var(--card); display: grid; place-items: center; font-size: 11px; font-weight: 600; color: var(--strong) }
@media (prefers-reduced-motion: no-preference) { .frame button { transition: background-color 120ms ease } }

    const offline = picks.offline === "yes";
    const pendingRequest = picks.pendingRequest === "yes";
    const hasDeposit = picks.hasDeposit === "yes";
    const byId = (id) => GARDENS.find((g) => g.id === id) || null;
    const SHEETS = ["switcher", "yourWork", "promises", "notifications", "work", "insights", "gardeners"];

    let derivedScreen = "home"; let derivedSheet = null;
    if (SHEETS.includes(picks.screen)) derivedSheet = picks.screen; else derivedScreen = picks.screen;
    const screen = nav.screen !== null ? nav.screen : derivedScreen;
    const sheetChosen = nav.sheet !== null ? nav.sheet : derivedSheet;

    const myIds = membership === "none" ? [] : membership === "one" ? ["tas"] : ["tas", "ilhas", "aiye"];
    const roleOf = (id) => (id === "tas" ? role : "gardener");
    let activeId;
    if (nav.activeId !== undefined) activeId = nav.activeId;
    else if (membership === "one" || membership === "several") activeId = "tas";
    else activeId = null;
    if (activeId && !myIds.includes(activeId)) activeId = null;
    const active = activeId ? byId(activeId) : null;
    const isNone = membership === "none";
    const isFirstRun = membership === "several-first" && !active;
    const sheet = sheetChosen || ((isFirstRun && picks.firstRun === "chooser" && !nav.dismissed && screen === "home") ? "switcher" : null);
    const several = myIds.length > 1;
    const pendingGarden = byId(PENDING_ID);

    const pillOf = (status) => ({
      pending: { pill: t.pending, pillClass: "warn", edgeClass: "warn" },
      approved: { pill: t.approved, pillClass: "ok", edgeClass: "ok" },
      rejected: { pill: t.rejected, pillClass: "err", edgeClass: "err" },
      inReview: { pill: t.inReview, pillClass: "neu", edgeClass: "" },
      toUpload: { pill: t.toUpload, pillClass: "info", edgeClass: "info" },
      draft: { pill: t.draft, pillClass: "warn", edgeClass: "" },
      toReview: { pill: t.toReview, pillClass: "info", edgeClass: "info" },
      offered: { pill: t.offered, pillClass: "ok", edgeClass: "ok" },
      asked: { pill: t.asked, pillClass: "info", edgeClass: "info" },
      newN: { pill: t.newTag, pillClass: "info", edgeClass: "info" },
      seen: { pill: t.seenTag, pillClass: "neu", edgeClass: "" },
      published: { pill: t.published, pillClass: "ok", edgeClass: "" },
      requested: { pill: t.requested, pillClass: "warn", edgeClass: "warn" }
    })[status];

    const activityAll = [
      { title: "Workshop Delivered", detail: "abhitant.eth · " + t.a5h + " · " + t.onePhoto, status: "pending", scene: "sc-people" },
      { title: "Hub Service Session", detail: "0x6855…Ac02 · " + t.a2d + " · " + t.fourPhotos, status: "approved", scene: "sc-solar" },
      { title: "Node Operation Log", detail: "afo.eth · " + t.a1w + " · " + t.onePhoto, status: "rejected", scene: "sc-seedlings" },
      { title: "Energy Audit", detail: "0xaC35…65B6 · " + t.a1w + " · " + t.fourPhotos, status: "approved", scene: "sc-compost" },
      { title: "Hub Service Session", detail: "abhitant.eth · " + t.a1w + " · " + t.onePhoto, status: "approved", scene: "sc-forest" },
      { title: "Node Operation Log", detail: "0x6855…Ac02 · " + t.a1w + " · " + t.onePhoto, status: "approved", scene: "sc-solar" }
    ].map((r) => Object.assign({ act: "openWork" }, r, pillOf(r.status)));
    const activity = activityAll.slice(0, parseInt(picks.activityRows, 10) || 3);

    const duties = [];
    if (isSteward) duties.push({ title: fmt(t.needsReview, { n: 3 }), detail: (active ? active.name : "") + " · " + t.a2d, status: "toReview", ic: "ic-shield", act: "yourWork" });
    if (isEvaluator) duties.push({ title: t.assessmentDue, detail: t.season, status: "toReview", ic: "ic-clip", act: "insights" });
    const continueRows = duties.concat([
      { title: "Compost Turn", detail: offline ? t.savedPhone : t.savedToday, status: "toUpload", ic: "ic-upload", act: "yourWork" },
      { title: "Mulching", detail: t.stepOf, status: "draft", ic: "ic-draft", act: "submit" }
    ]).slice(0, parseInt(picks.continueCap, 10) || 3).map((r) => Object.assign({}, r, pillOf(r.status)));

    const takePart = [
      { title: "Workshop photos", detail: t.dueJan + " · " + fmt(t.ofN, { a: 0, b: 12 }), status: "asked", ic: "ic-ask" },
      { title: "Solar install help", detail: "afo.eth · " + t.twoTaken, status: "offered", ic: "ic-promise" }
    ].map((r) => Object.assign({ act: "promises" }, r, pillOf(r.status)));

    // The garden's open asks, each with the action that keeps it, and the garden's actions. Workshop Delivered has
    // one ask, Node Operation Log two, the rest none, so every attach state can be seen.
    const prog = (a, b) => fmt(t.ofN, { a, b });
    const asks = (picks.asks === "no" ? [] : [
      { id: "ask1", title: "Workshop photos", action: "a1", progress: prog(0, 12), detail: "Workshop Delivered · " + prog(0, 12) + " · " + t.dueJan, status: "asked", ic: "ic-ask" },
      { id: "ask2", title: "Node uptime log", action: "a2", progress: prog(3, 8), detail: "Node Operation Log · " + prog(3, 8) + " · " + t.dueDec, status: "asked", ic: "ic-ask" },
      { id: "ask3", title: "Outage log", action: "a2", progress: prog(1, 4), detail: "Node Operation Log · " + prog(1, 4) + " · " + t.dueNov, status: "asked", ic: "ic-ask" }
    ]).map((r) => Object.assign({}, r, pillOf(r.status)));
    const domainLabel = { solar: t.dSolar, edu: t.dEdu, waste: t.dWaste, agro: t.dAgro };
    const actions = [
      { id: "a1", title: "Workshop Delivered", desc: t.actionWs, scene: "sc-people", domain: "edu", asksFor: t.twoPhotos },
      { id: "a2", title: "Node Operation Log", desc: t.action1d, scene: "sc-solar", domain: "solar", asksFor: t.oneShot },
      { id: "a3", title: t.action2, desc: t.action2d, scene: "sc-solar", domain: "solar", asksFor: t.fourPhotos },
      { id: "a4", title: "Panel Cleaning", desc: t.actionPanel, scene: "sc-solar", domain: "solar", asksFor: t.twoPhotos },
      { id: "a5", title: "Hub Service Session", desc: t.actionHub, scene: "sc-people", domain: "edu", asksFor: t.onePhoto },
      { id: "a6", title: "Mentoring Session", desc: t.actionMentor, scene: "sc-seedlings", domain: "edu", asksFor: t.onePhoto },
      { id: "a7", title: "Compost Turn", desc: t.actionCompost, scene: "sc-compost", domain: "waste", asksFor: t.twoPhotos }
    ].map((a) => Object.assign({}, a, { domainLabel: domainLabel[a.domain] }));

    const aboutRows = [
      { label: t.insights, value: "", act: "insights" },
      { label: t.gardeners, value: active ? String(active.members) : "", count: isSteward ? 2 : 0, act: "gardeners" },
      { label: t.share, value: "", act: "noop" }
    ];
    if (isSteward || hasDeposit) aboutRows.push({ label: t.endowment, value: hasDeposit ? t.yourDeposit : "", act: "noop" });
    if (isSteward) aboutRows.push({ label: t.governance, value: "", act: "noop" });

    const roleLabel = (r) => (r === "steward" ? t.steward : r === "evaluator" ? t.evaluator : t.gardener);
    const myGardens = myIds.map((id) => Object.assign({}, byId(id), { roleLabel: roleLabel(roleOf(id)), isActive: activeId === id }));

    // Explore: every garden the app lists, the member's own first; the two family test gardens only for their members.
    const exploreList = GARDENS.filter((g) => !g.test || myIds.includes(g.id)).map((g) => {
      const mine = myIds.includes(g.id);
      const pend = g.id === PENDING_ID && pendingRequest && !mine;
      const tag = mine ? t.member : pend ? t.awaiting : g.open ? t.open : "";
      return Object.assign({}, g, { meta: fmt(t.members, { n: g.members }) + " · " + g.place, tag, mine });
    }).sort((a, b) => (b.mine ? 1 : 0) - (a.mine ? 1 : 0));

    const vg = byId(nav.visitingId) || pendingGarden;
    const vgMine = myIds.includes(vg.id);
    const vgPending = vg.id === PENDING_ID && pendingRequest && !vgMine;
    const tabDefs = [["work", t.work], ["pool", t.promises], ["insights", t.insights], ["gardeners", t.gardeners]];

    const ywBase = [];
    if (isSteward) ywBase.push({ title: "Hub Service Session", detail: "0xaC35…65B6 · " + t.a3d, status: "toReview", scene: "sc-solar" });
    ywBase.push({ title: "Compost Turn", detail: offline ? t.savedPhone : t.savedToday, status: "toUpload", scene: "sc-compost" });
    ywBase.push({ title: "Mulching", detail: t.stepOf, status: "draft", ic: "ic-draft" });
    ywBase.push({ title: "Path Edging", detail: t.waitingReview, status: "inReview", scene: "sc-seedlings" });
    const ywRows = ywBase.map((r) => Object.assign({}, r, pillOf(r.status)));
    const ywDone = [
      { title: "Hub Service Session", detail: "0x6855…Ac02 · " + t.a2d, status: "approved", scene: "sc-solar" },
      { title: "Node Operation Log", detail: "afo.eth · " + t.a1w, status: "rejected", scene: "sc-seedlings" }
    ].map((r) => Object.assign({}, r, pillOf(r.status)));

    const prRows = [
      { title: "Workshop photos", detail: t.dueJan + " · " + t.byYou, status: "asked", ic: "ic-ask" },
      { title: "Solar install help", detail: "afo.eth · " + t.twoTaken, status: "offered", ic: "ic-promise" }
    ].map((r) => Object.assign({}, r, pillOf(r.status)));
    const prTabs = [["live", t.live, 2], ["history", t.history, 0]].concat(isSteward ? [["toConfirm", t.toConfirm, 1]] : []);

    // What is new for you in this garden: the bell's sheet. Unread first; the badge counts them.
    const notifs = [];
    if (isSteward) notifs.push({ title: fmt(t.nReview, { n: 3 }), detail: t.a2d, status: "newN", ic: "ic-shield", act: "yourWork" });
    if (isSteward) notifs.push({ title: fmt(t.joinReqs, { n: 2 }), detail: t.a3d, status: "newN", ic: "ic-users", act: "gardeners" });
    notifs.push({ title: t.nApproved, detail: "Hub Service Session · " + t.a2d, status: "newN", ic: "ic-check", act: "openWork" });
    notifs.push({ title: t.nTaken, detail: "Solar install help · " + t.a3d, status: isSteward ? "seen" : "newN", ic: "ic-promise", act: "promises" });
    notifs.push({ title: t.nFeedback, detail: "Node Operation Log · " + t.a1w, status: "seen", ic: "ic-msg", act: "openWork" });
    notifs.push({ title: t.nSeason, detail: (active ? active.name : "") + " · " + t.a1w, status: "seen", ic: "ic-clip", act: "insights" });
    const notifRows = notifs.map((r) => Object.assign({}, r, pillOf(r.status)));
    const unread = notifRows.filter((r) => r.status === "newN").length;

    const people = [
      { name: "afo.eth", role: "steward", since: 1772207894 },
      { name: "abhitant.eth", role: "steward", since: 1772207894 },
      { name: "0x6855…Ac02", role: "gardener", since: 1773000000 },
      { name: "0xaC35…65B6", role: "gardener", since: 1774000000 },
      { name: "0x9f1D…77e0", role: "gardener", since: 1775000000 }
    ];
    const joinRequests = isSteward ? [
      { name: "0x4B2a…91cC", detail: t.a2d, status: "requested" },
      { name: "0xE0d1…3fA8", detail: t.a1w, status: "requested" }
    ].map((r) => Object.assign({}, r, pillOf(r.status))) : [];

    const scopeName = active ? active.name : t.home;
    return {
      t, lang, theme: picks.theme === "dark" ? "dark" : "light", offline, pendingRequest, hasDeposit, isSteward, isEvaluator,
      screen, sheet, isNone, isFirstRun, several, active, activeId, myGardens, exploreList, pendingGarden,
      composition: picks.composition, aboutPlacement: picks.aboutPlacement, switcherStyle: picks.switcherStyle,
      sections: picks.sections, notif: picks.notif, stickyHeader: picks.header === "sticky", strip: picks.strip, startStep: picks.startStep, rows: picks.rows, workFor: picks.workFor, chooser: picks.chooser, attach: picks.attach,
      activity, activityAll, continueRows, takePart, aboutRows, asks, actions,
      vg, vgMine, vgPending, tabDefs,
      ywRows, ywDone, prRows, prTabs, notifRows, unread, people, joinRequests,
      chipLabel: isNone ? t.noneChip : active ? active.name : t.chooseGarden,
      chipCaret: !isNone && (several || isFirstRun),
      ywBadge: 2 + (isSteward ? 1 : 0), prBadge: 2,
      scopeName,
      showBar: (screen === "home" || screen === "explore") && !sheet,
      showChoosePrompt: screen === "home" && isFirstRun && !sheet
    };
  }

  // ---------- phone markup ----------
  function rowHTML(r, actAttr, extra) {
    const tile = r.scene ? '<span class="tile">' + art(r.scene) + "</span>" : r.avatarOf ? '<span class="tile icontile" style="background: var(--chip-av); color: var(--chip-av-ink)">' + icon("ic-user", 28) + "</span>" : '<span class="tile icontile">' + icon(r.ic || "ic-draft", 28) + "</span>";
    const slot = r.slotHTML !== undefined ? r.slotHTML : '<span class="slot">' + icon("ic-chev", 18) + "</span>";
    const tag = r.slotButton ? "div" : "button";
    const open = r.slotButton ? '<div role="button" tabindex="0" class="row' + (extra || "") + '" ' + (actAttr || "") + ">" : '<button type="button" class="row' + (extra || "") + '" ' + (actAttr || "") + ">";
    return open + '<span class="edge ' + (r.edgeClass || "") + '"></span>' + tile +
      '<span class="body"><span class="title">' + esc(r.title) + '</span><span class="pill ' + r.pillClass + '">' + esc(r.pill) + '</span><span class="detail">' + esc(r.detail) + "</span></span>" + slot + "</" + tag + ">";
  }
  function hitHTML(ic, act, label, badge) {
    return '<button type="button" class="hit" ' + (act ? 'data-act="' + act + '"' : "") + ' aria-label="' + esc(label) + '"><span class="ic">' + icon(ic, 16) + (badge ? '<span class="badge">' + badge + "</span>" : "") + "</span></button>";
  }
  function chipHTML(m) {
    return '<button type="button" class="chip" data-act="switcher" aria-label="' + esc(m.t.chooseGarden) + '"><span class="av">' + avatar(m.active, 14) + '</span><span class="lbl">' + esc(m.chipLabel) + "</span>" + (m.chipCaret ? '<span class="caret">' + icon("ic-caret", 12) + "</span>" : "") + "</button>";
  }
  function launchersHTML(m) {
    const bell = m.notif === "bell" && !m.isNone ? hitHTML("ic-bell", "notifications", m.t.notifications, m.unread) : "";
    return '<div class="launchers">' + bell + hitHTML("ic-wallet", "", m.t.wallet) + hitHTML("ic-promise", "promises", m.t.promises, m.isNone ? 0 : m.prBadge) + hitHTML("ic-work", "yourWork", m.t.yourWork, m.isNone ? 0 : m.ywBadge) + "</div>";
  }
  function headerHTML(m, lead) {
    return '<div class="hdr' + (m.stickyHeader ? " sticky" : "") + '"><div class="lead">' + lead + "</div>" + launchersHTML(m) + "</div>";
  }
  function gardenActionsHTML(m) {
    if (m.aboutPlacement !== "banner" || !m.active) return "";
    return '<div class="gactions">' + (m.isSteward ? hitHTML("ic-gov", "noop", m.t.governance) : "") + ((m.isSteward || m.hasDeposit) ? hitHTML("ic-bank", "noop", m.t.endowment) : "") + hitHTML("ic-share", "noop", m.t.share) + "</div>";
  }
  function tabsHTML(defs, current, actPrefix, extraClass) {
    return '<div class="tabs ' + (extraClass || "") + '">' + defs.map((d) => '<button type="button" class="' + (d[0] === current ? "active" : "") + '" data-act="' + actPrefix + ":" + d[0] + '"><span class="tl">' + esc(d[1]) + "</span>" + (d[2] ? '<span class="cnt">' + d[2] + "</span>" : "") + "</button>").join("") + "</div>";
  }
  function metaHTML(m, g) {
    return '<div class="metacol"><div class="meta"><span style="color: var(--accent-on); display: grid">' + icon("ic-pin", 16) + "</span><span>" + esc(g.place) + '</span></div><div class="meta"><span style="color: var(--accent-on); display: grid">' + icon("ic-cal", 16) + "</span><span>" + esc(fmt(m.t.founded, { d: dateOf(g.created, m.lang) })) + "</span></div></div>";
  }
  function seasonHTML(m) {
    const t = m.t;
    return '<div class="card season"><div class="sl"><b>' + esc(t.season) + "</b><span>" + esc(t.kept) + '</span></div><div class="ring"><span>0/12</span></div></div>';
  }
  function stripHTML(m) {
    if (m.strip !== "carousel" || !m.active) return "";
    const t = m.t;
    const cards = [];
    cards.push('<button type="button" class="hcard" data-act="insights"><span class="hb"><span class="eyebrow">' + esc(t.seasonShort) + '</span><span class="big">' + esc(t.kept) + '</span><span class="detail">' + esc(fmt(t.daysLeft, { n: 104 })) + "</span></span></button>");
    cards.push('<button type="button" class="hcard" data-act="openWork"><span class="hm">' + art("sc-people") + '</span><span class="hb"><span class="eyebrow">' + esc(t.recent) + '</span><span class="title">Workshop Delivered</span><span class="pill warn">' + esc(t.pending) + "</span></span></button>");
    if (m.isSteward) cards.push('<button type="button" class="hcard" data-act="yourWork"><span class="hb"><span class="eyebrow">' + esc(t.toReview) + '</span><span class="big">3</span><span class="detail">' + esc(fmt(t.needsReview, { n: 3 })) + "</span></span></button>");
    else cards.push('<button type="button" class="hcard" data-act="promises"><span class="hb"><span class="eyebrow">' + esc(t.asked) + '</span><span class="title">Workshop photos</span><span class="detail">' + esc(t.dueJan + " · " + fmt(t.ofN, { a: 0, b: 12 })) + "</span></span></button>");
    return '<div class="sec" style="padding-top: 8px"><h2>' + esc(t.highlights) + '</h2></div><div class="hscroll">' + cards.join("") + "</div>";
  }
  function sectionsHTML(m) {
    const t = m.t;
    let h = "";
    h += '<div class="sec"><h2>' + esc(t.continueT) + '</h2><button type="button" class="link" data-act="yourWork">' + esc(t.openYourWork) + "</button></div>";
    h += '<div class="list">' + m.continueRows.map((r) => rowHTML(r, 'data-act="' + r.act + '"')).join("") + "</div>";
    h += '<div class="sec"><h2>' + esc(t.takePart) + '</h2><button type="button" class="link" data-act="promises">' + esc(t.seeAll) + "</button></div>";
    h += '<div class="sub">' + esc(t.season + " · " + t.kept) + "</div>";
    h += '<div class="list">' + m.takePart.map((r) => rowHTML(r, 'data-act="promises"')).join("") + "</div>";
    if (m.aboutPlacement === "row") {
      h += '<div class="sec"><h2>' + esc(t.about) + "</h2></div>";
      h += '<div style="padding: 0 16px 8px"><div class="card" style="overflow: hidden">' + m.aboutRows.map((a, i) => '<button type="button" class="fact' + (i === 0 ? " first" : "") + '" data-act="' + a.act + '"><span>' + esc(a.label) + '</span><span class="val"><span>' + esc(a.value) + "</span>" + (a.count ? '<span class="cnt">' + a.count + "</span>" : "") + icon("ic-chev", 18) + "</span></button>").join("") + "</div></div>";
    }
    return h;
  }
  function homeHTML(m) {
    const t = m.t;
    let h = "";
    if (m.active && m.composition === "gardenPage") {
      h += '<div class="banner">' + photo(m.active) + '<div class="over">' + chipHTML(m) + '<div class="stack">' + hitHTML("ic-wallet", "", t.wallet) + hitHTML("ic-promise", "promises", t.promises, m.prBadge) + hitHTML("ic-work", "yourWork", t.yourWork, m.ywBadge) + "</div></div></div>";
      h += '<div class="gtitle"><h1>' + esc(m.active.name) + '</h1><div class="metarow">' + metaHTML(m, m.active) + "</div></div>";
      h += tabsHTML(m.tabDefs, nav.gpTab, "gpTab", "gtabs") + '<div style="height: 12px"></div>';
      h += tabBodyHTML(m, nav.gpTab, m.active);
      return h;
    }
    h += headerHTML(m, m.isNone ? '<h1 class="h1">' + esc(t.home) + "</h1>" : chipHTML(m)) + gardenActionsHTML(m);
    if (m.isNone) {
      h += '<div style="height: 8px"></div><div class="card promo"><h2>' + esc(t.findTitle) + "</h2><p>" + esc(t.findBody) + '</p><button type="button" class="btn" data-act="explore">' + icon("ic-search", 18) + "<span>" + esc(t.explore) + "</span></button></div>";
      if (m.pendingRequest) {
        h += '<div class="sec"><h2>' + esc(t.yourRequests) + '</h2></div><div class="list">' + rowHTML({ title: m.pendingGarden.name, pill: t.awaiting, pillClass: "warn", edgeClass: "warn", detail: m.pendingGarden.place, ic: "ic-seedling" }, 'data-act="visit:' + m.pendingGarden.id + '"') + "</div>";
      }
      return h;
    }
    if (m.showChoosePrompt) {
      h += '<div style="height: 8px"></div><div class="card promo"><h2>' + esc(t.chooseGarden) + "</h2><p>" + esc(t.chooseBody) + '</p><button type="button" class="btn secondary" data-act="switcher">' + esc(t.chooseGarden) + "</button></div>";
      return h;
    }
    if (!m.active) return h;
    h += stripHTML(m);
    if (m.composition === "journal") {
      h += '<div class="sec"><h2>' + esc(t.recent) + '</h2><button type="button" class="link" data-act="seeWork">' + esc(t.seeAll) + "</button></div>";
      h += '<div class="list">' + m.activity.map((r) => rowHTML(r, 'data-act="openWork"')).join("") + "</div>";
    } else {
      h += '<div class="sec"><h2>' + esc(t.recent) + '</h2><button type="button" class="link" data-act="seeWork">' + esc(t.moreActivity) + "</button></div>";
      h += '<div style="padding: 0 16px"><button type="button" class="gcard" data-act="openWork"><span class="media" style="height: 180px">' + art("sc-people") + '</span><span class="featcap"><span class="title">Workshop Delivered</span><span class="pill warn">' + esc(t.pending) + '</span><span class="detail">abhitant.eth · ' + esc(t.a5h + " · " + t.onePhoto) + "</span></span></button></div>";
    }
    h += sectionsHTML(m);
    return h;
  }
  // The content of one garden section, drawn the same whether it sits in a tab on the garden page or in a sheet over Home.
  function tabBodyHTML(m, tab, g) {
    const t = m.t;
    if (tab === "work") return '<div class="list">' + m.activityAll.map((r) => rowHTML(r, 'data-act="openWork"')).join("") + "</div>";
    if (tab === "pool") return '<div class="sub">' + esc(t.season + " · " + t.kept) + '</div><div class="list">' + m.takePart.map((r) => rowHTML(r)).join("") + "</div>";
    if (tab === "insights") return insightsBodyHTML(m, g, true);
    return gardenersBodyHTML(m, g, true);
  }
  function insightsBodyHTML(m, g, padded) {

  rail.addEventListener("click", (e) => { const b = e.target.closest("button[data-key]"); if (b) setPick(b.dataset.key, b.dataset.val); });
  rail.addEventListener("mouseover", (e) => { const s = e.target.closest("[data-hint]"); if (s) hint.textContent = s.dataset.hint; });
  rail.addEventListener("focusin", (e) => { const s = e.target.closest("[data-hint]"); if (s) hint.textContent = s.dataset.hint; });
  presetsEl.addEventListener("click", (e) => {
    const p = e.target.closest("button[data-preset]");
    if (p) { Object.assign(picks, PRESETS[p.dataset.preset].picks); nav = freshNav(); save(); renderRail(); renderStage(); hint.textContent = "Preset applied: " + PRESETS[p.dataset.preset].name + "."; return; }
    if (e.target.closest("#copy")) {
      const text = picksText();
      picksLine.textContent = text; picksLine.hidden = false;
      const done = () => { hint.textContent = "Picks copied."; };
      const fallback = () => { hint.textContent = "Select the line and copy it:"; const r = document.createRange(); r.selectNodeContents(picksLine); const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
    }
  });
  // A sticky header earns its hairline once the journal has scrolled under it.
  stage.addEventListener("scroll", (e) => { const s = e.target; if (s && s.classList && s.classList.contains("screen")) { const h = s.querySelector(".hdr.sticky"); if (h) h.classList.toggle("scrolled", s.scrollTop > 4); } }, true);
  stage.addEventListener("click", (e) => {
    const b = e.target.closest("[data-act]");
    if (!b) return;
    const act = b.dataset.act;
    const m = model();
    const openSection = (tab) => {
      if (!m.active) { nav.screen = "explore"; nav.sheet = null; return; }
      if (m.sections === "sheets" && m.composition !== "gardenPage") { nav.sheet = tab === "pool" ? "promises" : tab; return; }
      nav.screen = "garden"; nav.visitingId = m.active.id; nav.vgTab = tab; nav.sheet = null;
    };
    if (act === "noop" || act === "openWork") return;
    else if (act === "home") nav.screen = "home", nav.sheet = null;
    else if (act === "explore") nav.screen = "explore", nav.sheet = null;
    else if (act === "submit") nav.screen = "submit", nav.sheet = null;
    else if (act === "switcher") nav.sheet = "switcher";
    else if (act === "yourWork" || act === "promises" || act === "notifications") nav.sheet = act;
    else if (act === "close") nav.sheet = null, nav.dismissed = true;
    else if (act === "back") nav.screen = m.isNone ? "explore" : "home";
    else if (act === "seeWork") openSection("work");
    else if (act === "insights" || act === "gardeners") openSection(act);
    else if (act.startsWith("pick:")) { nav.activeId = act.slice(5); nav.sheet = null; }
    else if (act.startsWith("visit:")) { nav.screen = "garden"; nav.visitingId = act.slice(6); nav.vgTab = "work"; nav.sheet = null; }
    else if (act.startsWith("pickPromise:")) { const id = act.slice(12); const ask = m.asks.find((a) => a.id === id); if (nav.promiseSel === id && !nav.sheet) { nav.promiseSel = null; nav.actionSel = null; } else { nav.promiseSel = id; nav.actionSel = ask ? ask.action : null; } nav.unlinked = false; if (nav.sheet === "promisePicker") nav.sheet = null; }
    else if (act.startsWith("pickAction:")) { const id = act.slice(11); nav.actionSel = (nav.actionSel === id && !nav.sheet) ? null : id; nav.promiseSel = null; nav.unlinked = false; if (nav.sheet === "actions") nav.sheet = null; }
    else if (act === "unlink") { nav.promiseSel = null; nav.unlinked = true; }
    else if (act === "noPromise") { nav.promiseSel = null; nav.unlinked = true; nav.sheet = null; }
    else if (act === "promisePicker") nav.sheet = "promisePicker";
    else if (act === "actionsSheet") nav.sheet = "actions";
    else if (act.startsWith("gpTab:")) nav.gpTab = act.slice(6);
    else if (act.startsWith("vgTab:")) nav.vgTab = act.slice(6);
    else if (act.startsWith("ywTab:")) nav.ywTab = act.slice(6);
    else if (act.startsWith("prTab:")) nav.prTab = act.slice(6);
    else if (act.startsWith("wkTab:")) nav.wkTab = act.slice(6);
    else if (act.startsWith("domain:")) nav.domain = act.slice(7);
    renderStage();
  });
  window.addEventListener("resize", renderStage);
  renderPresets(); renderRail(); renderStage();
})();
</script>
</body>
</html>
