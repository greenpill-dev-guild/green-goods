<style>
/* Layout: a stage of real-size phones on the left, a sticky control rail on the right, a hint line at the foot. */

    { group: "Variations", key: "aboutPlacement", label: "About and manage", opts: [["row", "Row at the end"], ["menu", "Inside the switcher"], ["banner", "Icons in the header"]], hint: "Where Insights, Gardeners, Share, Endowment and Governance live: one About row after Take part, inside the switcher below the gardens, or today's icon stack beside the launchers." },
    { group: "Variations", key: "firstRun", label: "First run, several", opts: [["chooser", "Chooser opens"], ["prompt", "Prompt only"]], hint: "With several gardens and nothing remembered: the switcher opens by itself once, or Home shows a prompt card and waits." },

  ];
  const PRESETS = [
    { name: "Locked picks", picks: { membership: "several", role: "gardener", hasDeposit: "no", pendingRequest: "yes", offline: "no", screen: "home", composition: "journal", activityRows: "3", continueCap: "3", switcherStyle: "sheet", aboutPlacement: "row", firstRun: "chooser", sheetScope: "garden" } },
    { name: "Steward, first run", picks: { membership: "several-first", role: "steward", screen: "home", composition: "journal" } },
    { name: "No garden yet", picks: { membership: "none", role: "gardener", pendingRequest: "yes", screen: "home" } },
    { name: "Evaluator, offline", picks: { membership: "one", role: "evaluator", offline: "yes", screen: "home" } }
  ];

  let picks = Object.assign({}, DEFAULT_PICKS);
  let nav = freshNav();
  try { const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null"); if (saved && saved.picks) picks = Object.assign({}, DEFAULT_PICKS, saved.picks); } catch (e) { /* storage may be unavailable */ }

  function freshNav() { return { screen: null, sheet: null, activeId: undefined, dismissed: false, visitingId: "ligne", vgTab: "work", gpTab: "work", ywTab: "pending", prTab: "live", ywAll: false, prAll: false, domain: "solar" }; }
  function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify({ picks })); } catch (e) { /* ignore */ } }
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const fmt = (str, vals) => String(str).replace(/\{(\w+)\}/g, (m, k) => (vals && vals[k] !== undefined ? vals[k] : m));
  const icon = (id, size) => '<svg class="i" width="' + (size || 16) + '" height="' + (size || 16) + '" aria-hidden="true"><use href="#' + id + '"/></svg>';
  const art = (scene) => '<svg class="art" aria-hidden="true"><use href="#' + scene + '"/></svg>';

  function model() {
    const lang = T[picks.lang] ? picks.lang : "en";
    const t = T[lang];
    const membership = picks.membership;
    const role = picks.role;
    const isSteward = role === "steward";
    const isEvaluator = role === "evaluator";
    const offline = picks.offline === "yes";
    const pendingRequest = picks.pendingRequest === "yes";
    const hasDeposit = picks.hasDeposit === "yes";
    const byId = (id) => GARDENS.find((g) => g.id === id) || null;

    let derivedScreen = "home"; let derivedSheet = null;
    if (picks.screen === "switcher" || picks.screen === "yourWork" || picks.screen === "promises") derivedSheet = picks.screen; else derivedScreen = picks.screen;
    const screen = nav.screen !== null ? nav.screen : derivedScreen;
    const sheetChosen = nav.sheet !== null ? nav.sheet : derivedSheet;

    const myIds = membership === "none" ? [] : membership === "one" ? ["tas"] : ["tas", "bota", "ilhas"];
    const roleOf = (id) => (id === "tas" ? role : "gardener");
    let activeId;
    if (nav.activeId !== undefined) activeId = nav.activeId;
    else if (membership === "one" || membership === "several") activeId = "tas";
    else activeId = null;
    if (activeId && !myIds.includes(activeId)) activeId = null;
    const active = activeId ? byId(activeId) : null;
    const isNone = membership === "none";
    const isFirstRun = membership === "several-first" && !active;
    const chooserAuto = isFirstRun && picks.firstRun === "chooser" && !nav.dismissed && screen === "home" && sheetChosen === "" ;
    const sheet = sheetChosen || ((isFirstRun && picks.firstRun === "chooser" && !nav.dismissed && screen === "home") ? "switcher" : null);
    const several = myIds.length > 1;
    const scopeAll = picks.sheetScope === "all";

    const pillOf = (status) => ({
      pending: { pill: t.pending, pillClass: "warn", edgeClass: "warn" },
      approved: { pill: t.approved, pillClass: "ok", edgeClass: "ok" },
      rejected: { pill: t.rejected, pillClass: "err", edgeClass: "err" },
      inReview: { pill: t.inReview, pillClass: "neu", edgeClass: "" },
      toUpload: { pill: t.toUpload, pillClass: "info", edgeClass: "info" },
      draft: { pill: t.draft, pillClass: "warn", edgeClass: "" },
      toReview: { pill: t.toReview, pillClass: "info", edgeClass: "info" },
      offered: { pill: t.offered, pillClass: "ok", edgeClass: "ok" },
      asked: { pill: t.asked, pillClass: "info", edgeClass: "info" }
    })[status];

    const activityAll = [
      { title: "Workshop Delivered", detail: "abhitant.eth · " + t.a5h + " · " + t.onePhoto, status: "pending", scene: "sc-people" },
      { title: "Hub Service Session", detail: "0x6855…Ac02 · " + t.a2d + " · " + t.fourPhotos, status: "approved", scene: "sc-solar" },
      { title: "Node Operation Log", detail: "afo.eth · " + t.a1w + " · " + t.onePhoto, status: "rejected", scene: "sc-seedlings" }
    ].map((r) => Object.assign({ act: "seeWork" }, r, pillOf(r.status)));
    const activity = activityAll.slice(0, parseInt(picks.activityRows, 10) || 3);

    const duties = [];
    if (isSteward) duties.push({ title: fmt(t.needsReview, { n: 3 }), detail: (active ? active.name : "") + " · " + t.a2d, status: "toReview", ic: "ic-shield", act: "yourWork" });
    if (isEvaluator) duties.push({ title: t.assessmentDue, detail: t.season, status: "toReview", ic: "ic-clip", act: "insights" });
    const continueRows = duties.concat([
      { title: "Compost Turn", detail: offline ? t.savedPhone : t.savedToday, status: "toUpload", ic: "ic-upload", act: "yourWork" },
      { title: "Mulching", detail: t.stepOf, status: "draft", ic: "ic-draft", act: "submit" }
    ]).slice(0, parseInt(picks.continueCap, 10) || 3).map((r) => Object.assign({}, r, pillOf(r.status)));

    const takePart = [
      { title: "Workshop photos", detail: t.dueJan + " · 0 / 12", status: "asked", ic: "ic-ask" },
      { title: "Solar install help", detail: "afo.eth · " + t.twoTaken, status: "offered", ic: "ic-promise" }
    ].map((r) => Object.assign({ act: "seePromises" }, r, pillOf(r.status)));

    const aboutRows = [
      { label: t.insights, value: "", act: "insights" },
      { label: t.gardeners, value: active ? String(active.members) : "", count: isSteward ? 2 : 0, act: "gardeners" },
      { label: t.share, value: "", act: "noop" }
    ];
    if (isSteward || hasDeposit) aboutRows.push({ label: t.endowment, value: hasDeposit ? t.yourDeposit : "", act: "noop" });
    if (isSteward) aboutRows.push({ label: t.governance, value: "", act: "noop" });

    const roleLabel = (r) => (r === "steward" ? t.steward : r === "evaluator" ? t.evaluator : t.gardener);
    const myGardens = myIds.map((id) => Object.assign({}, byId(id), { roleLabel: roleLabel(roleOf(id)), isActive: activeId === id }));

    const exploreList = GARDENS.map((g) => {
      const mine = myIds.includes(g.id);
      const pend = g.id === "ligne" && pendingRequest;
      const pill = mine ? t.member : pend ? t.awaiting : g.open ? t.openJoin : "";
      const pillClass = mine ? "ok" : pend ? "warn" : g.open ? "info" : "neu";
      return Object.assign({}, g, { meta: g.place + " · " + fmt(t.members, { n: g.members }), pill, pillClass });
    });

    const vg = byId(nav.visitingId) || byId("ligne");
    const vgMine = myIds.includes(vg.id);
    const vgPending = vg.id === "ligne" && pendingRequest && !vgMine;
    const tabDefs = [["work", t.work], ["pool", t.promises], ["insights", t.insights], ["gardeners", t.gardeners]];

    const ywBase = [];
    if (isSteward) ywBase.push({ title: "Hub Service Session", detail: "0xaC35…65B6 · " + t.a3d, status: "toReview", scene: "sc-solar" });
    ywBase.push({ title: "Compost Turn", detail: offline ? t.savedPhone : t.savedToday, status: "toUpload", scene: "sc-compost" });
    ywBase.push({ title: "Mulching", detail: t.stepOf, status: "draft", ic: "ic-draft" });
    ywBase.push({ title: "Path Edging", detail: t.waitingReview, status: "inReview", scene: "sc-seedlings" });
    const ywOther = [
      { title: "Seed Library Count", detail: "Jardim Botafogo · " + t.savedToday, status: "toUpload", scene: "sc-forest" },
      { title: "Mulch Delivery Log", detail: "Ilhas de Abundância · " + t.waitingReview, status: "inReview", scene: "sc-people" }
    ];
    const ywShowAll = several && (scopeAll || nav.ywAll);
    const ywRows = (ywShowAll ? ywBase.concat(ywOther) : ywBase).map((r) => Object.assign({}, r, pillOf(r.status)));
    const ywDone = [
      { title: "Hub Service Session", detail: "0x6855…Ac02 · " + t.a2d, status: "approved", scene: "sc-solar" },
      { title: "Node Operation Log", detail: "afo.eth · " + t.a1w, status: "rejected", scene: "sc-seedlings" }
    ].map((r) => Object.assign({}, r, pillOf(r.status)));

    const prBase = [
      { title: "Workshop photos", detail: t.dueJan + " · " + t.byYou, status: "asked", ic: "ic-ask" },
      { title: "Solar install help", detail: "afo.eth · " + t.twoTaken, status: "offered", ic: "ic-promise" }
    ];
    const prOther = [{ title: "Seedling trays", detail: "Jardim Botafogo · " + t.dueJan, status: "offered", ic: "ic-promise" }];
    const prShowAll = several && (scopeAll || nav.prAll);
    const prRows = (prShowAll ? prBase.concat(prOther) : prBase).map((r) => Object.assign({}, r, pillOf(r.status)));
    const prTabs = [["live", t.live, 2], ["history", t.history, 0]].concat(isSteward ? [["toConfirm", t.toConfirm, 1]] : []);

    const scopeName = active ? active.name : t.home;
    return {
      t, lang, theme: picks.theme === "dark" ? "dark" : "light", offline, pendingRequest, hasDeposit, isSteward, isEvaluator,
      screen, sheet, isNone, isFirstRun, several, active, activeId, myGardens, exploreList, scopeAll,
      composition: picks.composition, aboutPlacement: picks.aboutPlacement, switcherStyle: picks.switcherStyle,
      activity, activityAll, continueRows, takePart, aboutRows,
      vg, vgMine, vgPending, tabDefs,
      ywRows, ywDone, ywShowAll, ywOtherCount: ywOther.length,
      prRows, prTabs, prShowAll, prOtherCount: prOther.length,
      chipLabel: isNone ? t.noneChip : active ? active.name : t.chooseGarden,
      chipCaret: !isNone && (several || isFirstRun),
      ywBadge: 2 + (isSteward ? 1 : 0), prBadge: 2,
      scopeName,
      showBar: (screen === "home" || screen === "explore") && !sheet,
      showChoosePrompt: screen === "home" && isFirstRun && !sheet
    };
  }

  // ---------- phone markup ----------
  function rowHTML(r, actAttr) {
    const tile = r.scene ? '<span class="tile">' + art(r.scene) + "</span>" : '<span class="tile icontile">' + icon(r.ic || "ic-draft", 28) + "</span>";
    return '<button type="button" class="row" ' + (actAttr || "") + '><span class="edge ' + r.edgeClass + '"></span>' + tile +
      '<span class="body"><span class="title">' + esc(r.title) + '</span><span class="pill ' + r.pillClass + '">' + esc(r.pill) + '</span><span class="detail">' + esc(r.detail) + "</span></span>" +
      '<span class="slot">' + icon("ic-chev", 18) + "</span></button>";
  }
  function hitHTML(ic, act, label, badge) {
    return '<button type="button" class="hit" ' + (act ? 'data-act="' + act + '"' : "") + ' aria-label="' + esc(label) + '"><span class="ic">' + icon(ic, 16) + (badge ? '<span class="badge">' + badge + "</span>" : "") + "</span></button>";
  }
  function chipHTML(m) {
    return '<button type="button" class="chip" data-act="switcher" aria-label="' + esc(m.t.chooseGarden) + '"><span class="av">' + icon("ic-seedling", 14) + '</span><span class="lbl">' + esc(m.chipLabel) + "</span>" + (m.chipCaret ? '<span class="caret">' + icon("ic-caret", 12) + "</span>" : "") + "</button>";
  }
  function launchersHTML(m) {
    return '<div class="launchers">' + hitHTML("ic-wallet", "", m.t.wallet) + hitHTML("ic-promise", "promises", m.t.promises, m.isNone ? 0 : m.prBadge) + hitHTML("ic-work", "yourWork", m.t.yourWork, m.isNone ? 0 : m.ywBadge) + "</div>";
  }
  function gardenActionsHTML(m) {
    if (m.aboutPlacement !== "banner" || !m.active) return "";
    return '<div class="gactions">' + (m.isSteward ? hitHTML("ic-bell", "noop", m.t.notifications, 1) : "") + (m.isSteward ? hitHTML("ic-gov", "noop", m.t.governance) : "") + ((m.isSteward || m.hasDeposit) ? hitHTML("ic-bank", "noop", m.t.endowment) : "") + hitHTML("ic-share", "noop", m.t.share) + "</div>";
  }
  function tabsHTML(defs, current, actPrefix, extraClass) {
    return '<div class="tabs ' + (extraClass || "") + '">' + defs.map((d) => '<button type="button" class="' + (d[0] === current ? "active" : "") + '" data-act="' + actPrefix + ":" + d[0] + '"><span class="tl">' + esc(d[1]) + "</span>" + (d[2] ? '<span class="cnt">' + d[2] + "</span>" : "") + "</button>").join("") + "</div>";
  }
  function metaHTML(m, g) {
    return '<div class="metacol"><div class="meta"><span style="color: var(--accent-on); display: grid">' + icon("ic-pin", 16) + "</span><span>" + esc(g.place) + '</span></div><div class="meta"><span style="color: var(--accent-on); display: grid">' + icon("ic-cal", 16) + "</span><span>" + esc(m.t.founded) + "</span></div></div>";
  }
  function sectionsHTML(m) {
    const t = m.t;
    let h = "";
    h += '<div class="sec"><h2>' + esc(t.continueT) + '</h2><button type="button" class="link" data-act="yourWork">' + esc(t.openYourWork) + "</button></div>";
    h += '<div class="list">' + m.continueRows.map((r) => rowHTML(r, 'data-act="' + r.act + '"')).join("") + "</div>";
    h += '<div class="sec"><h2>' + esc(t.takePart) + '</h2><button type="button" class="link" data-act="seePromises">' + esc(t.seeAll) + "</button></div>";
    h += '<div class="sub">' + esc(t.season + " · " + t.kept) + "</div>";
    h += '<div class="list">' + m.takePart.map((r) => rowHTML(r, 'data-act="seePromises"')).join("") + "</div>";
    if (m.aboutPlacement === "row") {
      h += '<div class="sec"><h2>' + esc(t.about) + "</h2></div>";
      h += '<div style="padding: 0 16px 8px"><div class="card" style="overflow: hidden">' + m.aboutRows.map((a, i) => '<button type="button" class="fact' + (i === 0 ? " first" : "") + '" data-act="' + a.act + '"><span>' + esc(a.label) + '</span><span class="val"><span>' + esc(a.value) + "</span>" + (a.count ? '<span class="cnt">' + a.count + "</span>" : "") + icon("ic-chev", 18) + "</span></button>").join("") + "</div></div>";
    }
    return h;
  }
  function homeHTML(m) {
    const t = m.t;
    let h = "";
    if (m.active && m.composition === "gardenPage") {
      h += '<div class="banner">' + art(m.active.scene) + '<div class="over">' + chipHTML(m) + '<div class="stack">' + hitHTML("ic-wallet", "", t.wallet) + hitHTML("ic-promise", "promises", t.promises, m.prBadge) + hitHTML("ic-work", "yourWork", t.yourWork, m.ywBadge) + "</div></div></div>";
      h += '<div class="gtitle"><h1>' + esc(m.active.name) + '</h1><div class="metarow">' + metaHTML(m, m.active) + "</div></div>";
      h += tabsHTML(m.tabDefs, nav.gpTab, "gpTab", "gtabs") + '<div style="height: 12px"></div>';
      if (nav.gpTab === "work") h += '<div class="list">' + m.activityAll.map((r) => rowHTML(r, 'data-act="seeWork"')).join("") + "</div>";

      else h += '<div class="sub" style="padding-top: 24px; text-align: center">' + esc(nav.gpTab === "insights" ? t.insightsLine : fmt(t.gardenersLine, { n: m.active.members })) + "</div>";

    if (m.isNone) {
      h += '<div style="height: 8px"></div><div class="card promo"><h2>' + esc(t.findTitle) + "</h2><p>" + esc(t.findBody) + '</p><button type="button" class="btn" data-act="explore">' + icon("ic-search", 18) + "<span>" + esc(t.explore) + "</span></button></div>";
      if (m.pendingRequest) {
        h += '<div class="sec"><h2>' + esc(t.yourRequests) + '</h2></div><div class="list">' + rowHTML({ title: "La Ligne Verte", pill: t.awaiting, pillClass: "warn", edgeClass: "warn", detail: "Grand-Bassam, Côte d’Ivoire", scene: "sc-solar" }, 'data-act="visit:ligne"') + "</div>";
      }
      return h;
    }
    if (m.showChoosePrompt) {
      h += '<div style="height: 8px"></div><div class="card promo"><h2>' + esc(t.chooseGarden) + "</h2><p>" + esc(t.chooseBody) + '</p><button type="button" class="btn secondary" data-act="switcher">' + esc(t.chooseGarden) + "</button></div>";

    } else {
      h += '<div class="sec"><h2>' + esc(t.recent) + '</h2><button type="button" class="link" data-act="seeWork">' + esc(t.moreActivity) + "</button></div>";
      h += '<div style="padding: 0 16px"><button type="button" class="gcard" data-act="seeWork"><span class="media" style="height: 180px">' + art("sc-people") + '</span><span class="featcap"><span class="title">Workshop Delivered</span><span class="pill warn">' + esc(t.pending) + '</span><span class="detail">abhitant.eth · ' + esc(t.a5h + " · " + t.onePhoto) + "</span></span></button></div>";
    }
    h += sectionsHTML(m);
    return h;
  }
  function exploreHTML(m) {
    const t = m.t;
    return '<div class="topnav">' + hitHTML("ic-back", "home", t.back) + '<div class="mid">' + esc(t.explore) + "</div>" + hitHTML("ic-filter", "noop", t.filters) + "</div>" +
      '<div class="sub" style="padding-bottom: 12px">' + esc(t.exploreSub) + '</div><div class="list">' +
      m.exploreList.map((g) => '<button type="button" class="gcard" data-act="visit:' + g.id + '"><span class="media" style="height: 120px">' + art(g.scene) + '</span><span class="gb"><span class="gname">' + esc(g.name) + '</span><span class="gmeta">' + esc(g.meta) + "</span>" + (g.pill ? '<span class="pill ' + g.pillClass + '">' + esc(g.pill) + "</span>" : "") + "</span></button>").join("") + "</div>";
  }
  function gardenHTML(m) {
    const t = m.t; const g = m.vg;
    let action = "";
    if (m.vgMine) action = '<span class="pill ok">' + esc(t.member) + "</span>";
    else if (m.vgPending) action = '<span class="pill warn">' + esc(t.awaiting) + "</span>";
    else if (g.open) action = '<button type="button" class="btn compact" data-act="noop">' + esc(t.joinGarden) + "</button>";
    else action = '<button type="button" class="btn compact secondary" data-act="noop">' + esc(t.requestJoin) + "</button>";
    let h = '<div class="banner">' + art(g.scene) + '<div class="over">' + hitHTML("ic-back", "back", t.back) + '<div class="stack">' + (m.vgMine && m.isSteward && g.id === "tas" ? hitHTML("ic-bell", "noop", t.notifications, 1) : "") + hitHTML("ic-share", "noop", t.share) + "</div></div></div>";
    h += '<div class="gtitle"><h1>' + esc(g.name) + '</h1><div class="metarow">' + metaHTML(m, g) + action + "</div></div>";
    h += tabsHTML(m.tabDefs, nav.vgTab, "vgTab", "gtabs") + '<div style="height: 12px"></div>';
    if (nav.vgTab === "work") h += '<div class="list">' + m.activityAll.map((r) => rowHTML(r)).join("") + "</div>";
    else if (nav.vgTab === "pool") h += '<div class="sub">' + esc(t.season + " · " + t.kept) + '</div><div class="list">' + m.takePart.map((r) => rowHTML(r)).join("") + "</div>";
    else h += '<div class="sub" style="padding-top: 24px; text-align: center">' + esc(nav.vgTab === "insights" ? t.insightsLine : fmt(t.gardenersLine, { n: g.members })) + "</div>";
    return h;
  }
  function submitHTML(m) {
    const t = m.t;
    const steps = [t.stStart, t.stMedia, t.stDetails, t.stReview].map((s, i) => '<div class="step' + (i === 0 ? " active" : "") + '"><span class="dot">' + (i + 1) + "</span><span>" + esc(s) + "</span></div>").join("");
    const domains = [["solar", t.dSolar], ["agro", t.dAgro], ["edu", t.dEdu], ["waste", t.dWaste]];
    let h = '<div class="topnav">' + hitHTML("ic-back", "home", t.back) + '<div class="steps">' + steps + '</div><div style="width: 48px"></div></div>';
    h += tabsHTML(domains, nav.domain, "domain") + '<div style="height: 16px"></div>';
    h += '<div class="info"><span class="ic">' + icon("ic-hammer", 22) + "</span><div><h3>" + esc(t.selectAction) + "</h3><p>" + esc(t.whatType) + "</p></div></div>" + '<div style="height: 12px"></div>';
    h += '<div class="hscroll"><div class="acard"><div class="media">' + art("sc-solar") + '</div><div class="ab"><h4>Node Operation Log</h4><p>' + esc(t.action1d) + '</p></div></div><div class="acard"><div class="media">' + art("sc-compost") + '</div><div class="ab"><h4>' + esc(t.action2) + "</h4><p>" + esc(t.action2d) + "</p></div></div></div>" + '<div style="height: 16px"></div>';
    if (m.active) h += '<div class="pin"><span class="av2">' + icon("ic-seedling", 18) + '</span><span class="ptxt"><span class="eyebrow">' + esc(t.workFor) + '</span><span class="pn">' + esc(m.active.name) + '</span></span><button type="button" class="link" data-act="switcher">' + esc(t.changeGarden) + "</button></div>";
    else h += '<div class="card promo"><h2>' + esc(t.joinCommunity) + "</h2><p>" + esc(t.joinCommunityBody) + '</p><button type="button" class="btn" data-act="noop">' + esc(t.joinGarden) + "</button></div>";
    h += '<div style="height: 24px"></div>';
    return h;
  }
  function switcherHTML(m) {
    const t = m.t;
    const rows = m.myGardens.map((g) => '<button type="button" class="grow' + (g.isActive ? " active" : "") + '" data-act="pick:' + g.id + '"><span class="av2">' + icon("ic-seedling", 18) + '</span><span class="gtxt"><span class="nm">' + esc(g.name) + '</span><span class="gs">' + esc(g.place) + '</span></span><span class="rolechip">' + esc(g.roleLabel) + "</span>" + (g.isActive ? '<span style="color: var(--accent-on); display: grid">' + icon("ic-check", 20) + "</span>" : "") + "</button>").join("");
    const explore = '<button type="button" class="grow" data-act="explore"><span class="av2" style="background: var(--neu-bg); color: var(--strong)">' + icon("ic-search", 18) + '</span><span class="gtxt"><span class="nm">' + esc(t.explore) + '</span><span class="gs">' + esc(t.exploreSub) + '</span></span><span class="slot">' + icon("ic-chev", 18) + "</span></button>";
    const aboutInMenu = (m.aboutPlacement === "menu" && m.active) ? '<div class="divider"></div><div class="sub" style="padding: 4px 12px">' + esc(t.about) + "</div>" + m.aboutRows.map((a) => '<button type="button" class="grow" style="height: 44px" data-act="' + a.act + '"><span class="gtxt"><span class="nm" style="font-weight: 500">' + esc(a.label) + '</span></span><span class="slot">' + (a.count ? '<span class="cnt">' + a.count + "</span>" : "") + icon("ic-chev", 18) + "</span></button>").join("") : "";
    if (m.switcherStyle === "popover" && !m.isFirstRun) {
      return '<button type="button" class="scrim clear" data-act="close" aria-label="' + esc(t.close) + '"></button><div class="menu" role="dialog">' + rows + '<div class="divider"></div>' + explore + aboutInMenu + "</div>";
    }
    return '<button type="button" class="scrim" data-act="close" aria-label="' + esc(t.close) + '"></button><div class="sheet" role="dialog" aria-modal="true"><div class="grip"></div><div class="shead"><div><h2 class="stitle">' + esc(m.isFirstRun ? t.chooseGarden : t.yourGardens) + '</h2><p class="sdesc">' + esc(m.isFirstRun ? t.chooseBody : fmt(t.belongTo, { n: m.myGardens.length })) + '</p></div><button type="button" class="close" data-act="close" aria-label="' + esc(t.close) + '">' + icon("ic-close", 22) + '</button></div><div class="sbody" style="gap: 4px">' + rows + '<div class="divider"></div>' + explore + aboutInMenu + "</div></div>";
  }
  function sheetHTML(m, kind) {
    const t = m.t;
    const title = kind === "yourWork" ? t.yourWork : t.promises;
    const showAll = kind === "yourWork" ? m.ywShowAll : m.prShowAll;
    const desc = showAll ? t.allGardens : fmt(t.inGarden, { g: m.scopeName });
    let tabs, body;
    if (kind === "yourWork") {
      tabs = tabsHTML([["pending", t.pendingTab, m.ywBadge], ["completed", t.completedTab, 0]], nav.ywTab, "ywTab");
      if (nav.ywTab === "pending") {
        body = '<div class="countline"><span>' + esc(fmt(t.items, { n: m.ywRows.length })) + '</span><button type="button" class="link" data-act="noop">' + esc(t.uploadAll) + "</button></div>" + m.ywRows.map((r) => rowHTML(r)).join("");
        if (m.several && !m.scopeAll) body += '<button type="button" class="fact first" data-act="ywAll" style="border: 1px solid var(--line); border-radius: 16px; margin-top: 4px"><span>' + esc(nav.ywAll ? fmt(t.onlyGarden, { g: m.scopeName }) : t.alsoOther + " (" + m.ywOtherCount + ")") + '</span><span class="val">' + icon("ic-chev", 18) + "</span></button>";
      } else body = m.ywDone.map((r) => rowHTML(r)).join("");
    } else {
      tabs = tabsHTML(m.prTabs, nav.prTab, "prTab");
      body = m.prRows.map((r) => rowHTML(r)).join("");
      if (m.several && !m.scopeAll) body += '<button type="button" class="fact first" data-act="prAll" style="border: 1px solid var(--line); border-radius: 16px; margin-top: 4px"><span>' + esc(nav.prAll ? fmt(t.onlyGarden, { g: m.scopeName }) : t.alsoOther + " (" + m.prOtherCount + ")") + '</span><span class="val">' + icon("ic-chev", 18) + "</span></button>";
    }
    return '<button type="button" class="scrim" data-act="close" aria-label="' + esc(t.close) + '"></button><div class="sheet full" role="dialog" aria-modal="true"><div class="grip"></div><div class="shead"><div><h2 class="stitle">' + esc(title) + '</h2><p class="sdesc">' + esc(desc) + '</p></div><button type="button" class="close" data-act="close" aria-label="' + esc(t.close) + '">' + icon("ic-close", 22) + "</button></div>" + tabs + '<div class="sbody">' + body + "</div></div>";
  }
  function phoneHTML(m, w, h) {
    const t = m.t;
    let inner = m.offline ? '<div class="offl">' + icon("ic-offline", 14) + "<span>" + esc(t.offlineLine) + "</span></div>" : "";
    if (m.screen === "home") inner += homeHTML(m);
    else if (m.screen === "explore") inner += exploreHTML(m);
    else if (m.screen === "garden") inner += gardenHTML(m);
    else if (m.screen === "submit") inner += submitHTML(m);
    let overlay = "";
    if (m.showBar) overlay += '<nav class="bar" aria-label="App"><button type="button" class="tab active" data-act="home"><span class="pillbg">' + icon("ic-home", 24) + "</span><span>" + esc(t.home) + '</span></button><button type="button" class="tab" data-act="submit"><span class="pillbg">' + icon("ic-plant", 24) + "</span><span>" + esc(t.garden) + '</span></button><button type="button" class="tab" data-act="noop"><span class="pillbg">' + icon("ic-user", 24) + "</span><span>" + esc(t.profile) + "</span></button></nav>";
    if (m.screen === "submit") overlay += '<div class="flow"><button type="button" class="btn" data-act="noop">' + esc(t.start) + " " + icon("ic-chev", 18) + "</button></div>";
    if (m.sheet === "switcher") overlay += switcherHTML(m);
    if (m.sheet === "yourWork") overlay += sheetHTML(m, "yourWork");
    if (m.sheet === "promises") overlay += sheetHTML(m, "promises");
    return '<div class="frame" data-theme="' + m.theme + '" style="width: ' + w + 'px; height: ' + h + 'px"><div class="screen">' + inner + "</div>" + overlay + "</div>";
  }

  // ---------- lab chrome ----------
  const stage = document.getElementById("stage");
  const rail = document.getElementById("rail");
  const hint = document.getElementById("hint");
  const picksLine = document.getElementById("picksline");
  const presetsEl = document.getElementById("presets");

  function renderStage() {
    const m = model();
    const frames = picks.show === "both" ? [[390, 844], [360, 800]] : picks.show === "390" ? [[390, 844]] : [[360, 800]];
    const avail = Math.max(420, window.innerHeight - 150);
    const scale = picks.fit === "fit" ? Math.min(1, avail / 844) : 1;
    stage.innerHTML = frames.map(([w, h]) => '<div class="phonewrap" style="width: ' + Math.round(w * scale) + 'px; height: ' + Math.round(h * scale) + 'px"><span class="cap">' + w + " × " + h + '</span><div style="transform: scale(' + scale + '); transform-origin: top left">' + phoneHTML(m, w, h) + "</div></div>").join("");
  }
  function renderRail() {
    const groups = [];
    CONTROLS.forEach((c) => { let g = groups.find((x) => x.name === c.group); if (!g) { g = { name: c.group, items: [] }; groups.push(g); } g.items.push(c); });
    rail.innerHTML = groups.map((g) => '<div class="grp"><h3>' + esc(g.name) + "</h3>" + g.items.map((c) => '<div class="ttl">' + esc(c.label) + '</div><div class="seg" role="group" aria-label="' + esc(c.label) + '" data-hint="' + esc(c.hint) + '">' + c.opts.map((o) => '<button type="button" id="pick-' + c.key + "-" + o[0] + '" data-key="' + c.key + '" data-val="' + o[0] + '" aria-pressed="' + (picks[c.key] === o[0]) + '">' + esc(o[1]) + "</button>").join("") + "</div>").join("") + "</div>").join("");
  }
  function renderPresets() {
    presetsEl.innerHTML = PRESETS.map((p, i) => '<button type="button" class="pbtn" data-preset="' + i + '">' + esc(p.name) + "</button>").join("") + '<button type="button" class="pbtn primary" id="copy">Copy picks</button>';
  }
  function picksText() {
    return "Lab picks: " + CONTROLS.filter((c) => c.group !== "Stage").map((c) => { const o = c.opts.find((x) => x[0] === picks[c.key]); return c.label + ": " + (o ? o[1] : picks[c.key]); }).join("; ");
  }
  function setPick(key, val) {
    const scenario = ["membership", "role", "screen", "firstRun"];
    picks[key] = val;
    if (scenario.includes(key)) nav = freshNav();
    save(); renderRail(); renderStage();
  }

  rail.addEventListener("click", (e) => { const b = e.target.closest("button[data-key]"); if (b) setPick(b.dataset.key, b.dataset.val); });
  rail.addEventListener("mouseover", (e) => { const s = e.target.closest("[data-hint]"); if (s) hint.textContent = s.dataset.hint; });
  rail.addEventListener("focusin", (e) => { const s = e.target.closest("[data-hint]"); if (s) hint.textContent = s.dataset.hint; });
  presetsEl.addEventListener("click", (e) => {
    const p = e.target.closest("button[data-preset]");
    if (p) { Object.assign(picks, PRESETS[p.dataset.preset].picks); nav = freshNav(); save(); renderRail(); renderStage(); hint.textContent = "Preset applied: " + PRESETS[p.dataset.preset].name + "."; return; }
    if (e.target.closest("#copy")) {
      const text = picksText();
      picksLine.textContent = text; picksLine.hidden = false;
      const done = () => { hint.textContent = "Picks copied."; };
      const fallback = () => { hint.textContent = "Select the line and copy it:"; const r = document.createRange(); r.selectNodeContents(picksLine); const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
    }
  });
  stage.addEventListener("click", (e) => {
    const b = e.target.closest("[data-act]");
    if (!b) return;
    const act = b.dataset.act;
    const m = model();
    if (act === "noop") return;
    else if (act === "home") nav.screen = "home", nav.sheet = null;
    else if (act === "explore") nav.screen = "explore", nav.sheet = null;
    else if (act === "submit") nav.screen = "submit", nav.sheet = null;
    else if (act === "switcher") nav.sheet = "switcher";
    else if (act === "yourWork") nav.sheet = "yourWork";
    else if (act === "promises") nav.sheet = "promises";
    else if (act === "close") nav.sheet = null, nav.dismissed = true;
    else if (act === "back") nav.screen = m.isNone ? "explore" : "home";
    else if (act === "ywAll") nav.ywAll = !nav.ywAll;
    else if (act === "prAll") nav.prAll = !nav.prAll;
    else if (act === "seeWork") { if (m.active) { nav.screen = "garden"; nav.visitingId = m.active.id; nav.vgTab = "work"; nav.sheet = null; } else nav.screen = "explore"; }
    else if (act === "seePromises") { if (m.active) { nav.screen = "garden"; nav.visitingId = m.active.id; nav.vgTab = "pool"; nav.sheet = null; } else nav.screen = "explore"; }
    else if (act === "insights" || act === "gardeners") { if (m.active) { nav.screen = "garden"; nav.visitingId = m.active.id; nav.vgTab = act; nav.sheet = null; } }
    else if (act.startsWith("pick:")) { nav.activeId = act.slice(5); nav.sheet = null; }
    else if (act.startsWith("visit:")) { nav.screen = "garden"; nav.visitingId = act.slice(6); nav.vgTab = "work"; nav.sheet = null; }
    else if (act.startsWith("gpTab:")) nav.gpTab = act.slice(6);
    else if (act.startsWith("vgTab:")) nav.vgTab = act.slice(6);
    else if (act.startsWith("ywTab:")) nav.ywTab = act.slice(6);
    else if (act.startsWith("prTab:")) nav.prTab = act.slice(6);
    else if (act.startsWith("domain:")) nav.domain = act.slice(7);
    renderStage();
  });
  window.addEventListener("resize", renderStage);
  renderPresets(); renderRail(); renderStage();
})();
</script>
</body></html>
