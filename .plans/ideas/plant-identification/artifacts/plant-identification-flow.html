  if (!work) return `<div class="app-inner">${offlineBar()}${header}<div class="padded col" style="padding-block:8px 24px;display:flex;flex-direction:column;gap:16px"><div class="empty">${icon('sprout')}<strong>No saved work yet</strong>Submit the draft to see how the work looks once it is saved.<div style="margin-top:12px">${btn({ label: 'Go to Review', act: 'nav.go', arg: 'review', emphasis: 'secondary', size: 'sm' })}</div></div></div></div>`;

  const pendingIds = work.pendingAnalyses.map((id) => S.idents[id]).filter(Boolean);
  const picker = works.length > 1 ? `<div class="field"><label class="field-label" for="saved-pick">Saved work</label><select class="control control-select" id="saved-pick" data-act="saved.select">${works.map((w) => `<option value="${w.id}" ${w.id === work.id ? 'selected' : ''}>${w.id} · ${esc(ACTIONS[w.actionId].title)}</option>`).join('')}</select></div>` : '';
  return `<div class="app-inner">${offlineBar()}${header}<div class="padded col" style="padding-block:8px 24px;display:flex;flex-direction:column;gap:16px">
    ${picker}
    <div class="saved-head">${statusPill(work.status)}<span class="section-hint">${esc(work.id)} · ${esc(fmtDateTime(work.submittedAt))}</span></div>
    <div class="form-info"><span class="form-info__icon">${icon('sprout')}</span><div><h3 style="font-size:16px;font-weight:600">Your work is in good hands</h3><p>${esc(a.title)} is saved. The garden’s stewards will take it from here. In the app this would be signed and uploaded; here it is only saved on this page.</p></div></div>
    ${pendingIds.length ? `<div class="notice" data-tone="info">${icon('loader', 'spin')}<div class="grow">Still identifying ${pendingIds.map((i) => photoLabel(i.photoId)).join(' and ')}. Any result shows up here as a later result and will not change what you submitted.<div class="row">${pendingIds.map((i) => (i.status === 'queued' || (i.health && i.health.status === 'queued')) ? btn({ label: `Cancel ${photoLabel(i.photoId)}`, act: 'saved.cancelPending', arg: { workId: work.id, identId: i.id }, emphasis: 'tertiary', size: 'compact' }) : '').join('')}</div></div></div>` : ''}

/* ---------- Steward preview (admin cockpit) ---------- */
function adminBadge(status) { return `<span class="admin-badge" data-tone="${status}">${icon(status === 'approved' ? 'check' : status === 'rejected' ? 'close' : 'clock')} ${status === 'approved' ? 'Approved' : status === 'rejected' ? 'Rejected' : 'Pending'}</span>`; }
function adminPlant(row, work, sec) {
  const idents = row.supports.map((id) => work.identSnapshot.find((i) => i.id === id) || S.idents[id]).filter(Boolean);
  const photoNums = idents.map((i) => work.photos.findIndex((p) => p.id === i.photoId) + 1).filter((n) => n > 0);
  const primary = idents[0];
  const score = primary && primary.suggestions && primary.suggestions.length ? primary.suggestions.find((s) => s.taxonId === primary.selectedTaxonId) : null;
  let identity;
  if (row.nameOrigin === 'manual') identity = idents.length && primary.originalTaxonId ? `Gardener entry · Kindwise suggested ${taxonById(primary.originalTaxonId).common}${score ? ` (synthetic ${pct(score.score)})` : ''}` : 'Gardener entry · no identification';
  else if (row.nameOrigin === 'plan-copy') identity = 'Copied by the gardener from Existing plants';
  else identity = `Kindwise suggestion${score ? ` · synthetic ${pct(score.score)}` : ''} · ${primary && primary.originalTaxonId !== primary.selectedTaxonId ? `corrected by gardener from ${taxonById(primary.originalTaxonId).common}` : 'accepted by gardener'}`;
  const qty = sec.measure ? (row.quantity !== '' ? `${fmtNum(Number(row.quantity))} ${sec.measure.unit}` : 'amount not recorded') : '';
  return `<div class="admin-plant"><div><span class="name">${esc(row.name)}</span> ${row.sci ? `<span class="sci">${esc(row.sci)}</span>` : ''} <span class="admin-badge" data-tone="neutral">${esc(RELATIONSHIP_LABEL[row.relationship])}</span></div><div class="line"><span>${esc(identity)}</span>${qty ? `<span>· ${esc(qty)}</span>` : ''}${photoNums.length ? `<span>· photo${photoNums.length > 1 ? 's' : ''} ${photoNums.join(', ')}</span>` : ''}</div>${row.notes ? `<div class="line"><span>Notes: ${esc(row.notes)}</span></div>` : ''}${row.health ? `<div class="line"><span class="admin-badge" data-tone="info">${icon('heartPulse')} Health note</span><span>${esc(row.health.text)}</span><span>· ${row.health.origin === 'gardener' ? 'gardener observation' : 'Kindwise suggestion included by gardener'} · not a diagnosis · no treatment recorded</span></div>` : ''}</div>`;
}
function renderSteward(work) {

    <div class="admin-field"><label for="rv-method">Verification method</label><select id="rv-method" data-bind="review.method"><option ${f.method === 'Human review' ? 'selected' : ''}>Human review</option><option ${f.method === 'Human review + agent' ? 'selected' : ''}>Human review + agent</option></select></div>
    <div class="admin-field"><label for="rv-feedback">Feedback to the gardener</label><textarea id="rv-feedback" rows="3" data-bind="review.feedback">${esc(f.feedback)}</textarea></div>

    <div class="admin-dialog__header"><div class="titles"><h2 id="adm-title">Review Work</h2><p>${esc(a.title)} · ${esc(work.id)} · ${adminBadge(work.status)}</p></div><button type="button" class="sheet-close" data-act="steward.close" aria-label="Close">${icon('close')}</button></div>
    <div class="admin-dialog__body"><div class="admin-grid"><div class="admin-col">
      <section class="surface-inset"><h3>Media Evidence</h3><div class="evidence-grid" style="margin-top:12px">${work.photos.map((p, i) => `<button type="button" data-act="viewer.open" data-arg="${arg(p.id)}" aria-label="View ${esc(a.title)} photo ${i + 1} of ${work.photos.length}">${artSvg(PHOTOS[p.fixture].art, p.seed)}</button>`).join('')}</div></section>

/* ---------- Report concept ---------- */
function reportWorks() {
  const session = S.saved.map((w) => { const a = ACTIONS[w.actionId]; return { id: w.id, date: w.submittedAt, actionId: w.actionId, gardener: w.gardener, status: w.status, session: true, totals: { seedlingsPlanted: w.fields.seedlingsPlanted, yieldKg: w.fields.yieldKg, plannedSeedlings: w.fields.plannedSeedlings }, photos: w.photos.map((p) => p.fixture),
    plants: w.plants.map((r) => ({ name: r.name, taxonId: r.taxonId, relationship: r.relationship, quantity: r.quantity === '' ? undefined : Number(r.quantity), unit: (a.sections.find((s) => s.key === r.section) || {}).measure ? a.sections.find((s) => s.key === r.section).measure.unit : undefined, origin: r.nameOrigin === 'manual' ? 'manual' : 'identification', health: r.health ? r.health.text : undefined })) }; });
  return [...PRIOR_WORKS, ...session];
}
function workAllocationLine(w) {
  const spec = w.actionId === 'planting' ? { total: Number(w.totals.seedlingsPlanted), unit: 'seedlings', rel: 'planted', label: 'planted' } : w.actionId === 'harvest' ? { total: Number(w.totals.yieldKg), unit: 'kg', rel: 'harvested', label: 'harvested' } : w.actionId === 'site' ? { total: Number(w.totals.plannedSeedlings), unit: 'seedlings', rel: 'planned', label: 'planned' } : null;
  if (!spec || !Number.isFinite(spec.total)) return '';
  const rows = w.plants.filter((p) => p.relationship === spec.rel);
  if (!rows.length) return `<div class="alloc" data-tone="neutral">${icon('scale')}<span>${fmtNum(spec.total)} ${spec.unit} ${spec.label} · species not recorded (unknown, not zero)</span></div>`;
  const entered = rows.filter((p) => typeof p.quantity === 'number');
  const sum = entered.reduce((s, p) => s + p.quantity, 0);
  return `<div class="alloc" data-tone="ok">${icon('scale')}<span>Of ${fmtNum(spec.total)} ${spec.unit} ${spec.label}: ${entered.map((p) => `${p.name} ${fmtNum(p.quantity)}`).join(' + ')}${entered.length ? ' = ' + fmtNum(sum) : ''} allocated · ${fmtNum(spec.total - sum)} unallocated${rows.length - entered.length ? ` · ${rows.length - entered.length} without an amount (unknown)` : ''}</span></div>`;
}
function renderReport() {
  const works = reportWorks();
  const filter = S.ui.reportFilter, source = S.ui.reportSource;
  const groups = new Map();
  for (const w of works) for (const pl of w.plants) {
    if (filter !== 'all' && pl.relationship !== filter) continue;
    if (source !== 'all' && (pl.origin === 'manual' ? 'manual' : 'identification') !== source) continue;
    const key = `${pl.taxonId || 'name:' + pl.name.toLowerCase()}|${pl.relationship}`;
    const g = groups.get(key) || { name: pl.name, taxonId: pl.taxonId, relationship: pl.relationship, qty: 0, unit: pl.unit, unknown: 0, works: new Set(), health: 0 };
    if (typeof pl.quantity === 'number') g.qty += pl.quantity; else if (pl.unit || pl.relationship === 'planted' || pl.relationship === 'harvested' || pl.relationship === 'planned') g.unknown++;
    if (pl.health) g.health++;
    g.works.add(w.id); groups.set(key, g);
  }
  const rows = [...groups.values()].sort((x, y) => x.name.localeCompare(y.name) || x.relationship.localeCompare(y.relationship));
  const planting = works.filter((w) => w.actionId === 'planting');
  const plantedTotal = planting.reduce((s, w) => s + (Number(w.totals.seedlingsPlanted) || 0), 0);
  const plantedAllocated = planting.flatMap((w) => w.plants).filter((p) => p.relationship === 'planted' && typeof p.quantity === 'number').reduce((s, p) => s + p.quantity, 0);
  const plantedUnknown = planting.filter((w) => !w.plants.some((p) => p.relationship === 'planted')).reduce((s, w) => s + (Number(w.totals.seedlingsPlanted) || 0), 0);
  const plantedUnallocated = plantedTotal - plantedAllocated - plantedUnknown;
  const harvest = works.filter((w) => w.actionId === 'harvest');
  const kgTotal = harvest.reduce((s, w) => s + (Number(w.totals.yieldKg) || 0), 0);
  const kgAllocated = harvest.flatMap((w) => w.plants).filter((p) => p.relationship === 'harvested' && typeof p.quantity === 'number').reduce((s, p) => s + p.quantity, 0);
  const kgUnknown = harvest.filter((w) => !w.plants.some((p) => p.relationship === 'harvested')).reduce((s, w) => s + (Number(w.totals.yieldKg) || 0), 0);
  const legacy = works.filter((w) => w.legacy);
  const rels = ['all', 'observed', 'planned', 'planted', 'checked', 'maintained', 'harvested'];
  return `<div class="app-inner">${offlineBar()}<div class="topnav"><div style="flex:1"><h2 id="screen-title" tabindex="-1" style="font-size:18px;font-weight:600;line-height:24px">Plants in this garden</h2><p class="section-hint">${esc(GARDEN.name)} · what gardeners recorded</p></div></div>
  <div class="padded col" style="padding-block:8px 24px;display:flex;flex-direction:column;gap:14px">
    <div class="rev-note"><b>Reviewer note</b>Future reporting design, not a shipped feature. Every number below comes from amounts gardeners typed in. Photos and confidence scores never add to a count.</div>
    <div class="stat-row"><div class="stat"><div class="n">${fmtNum(plantedTotal)}</div><div class="l">seedlings planted (${planting.length} planting works)</div></div><div class="stat"><div class="n">${fmtNum(plantedAllocated)}</div><div class="l">allocated to a species</div></div><div class="stat"><div class="n">${fmtNum(plantedUnallocated)}</div><div class="l">unallocated in works with species rows</div></div><div class="stat"><div class="n">${fmtNum(plantedUnknown)}</div><div class="l">species unknown (recorded before plant entries)</div></div></div>
    <div class="stat-row"><div class="stat"><div class="n">${fmtNum(kgTotal)} kg</div><div class="l">harvested (${harvest.length} harvest works)</div></div><div class="stat"><div class="n">${fmtNum(kgAllocated)} kg</div><div class="l">allocated to a crop · ${fmtNum(kgTotal - kgAllocated - kgUnknown)} kg unallocated${kgUnknown ? ` · ${fmtNum(kgUnknown)} kg crop unknown` : ''}</div></div></div>
    <div><div class="eyebrow">Show</div><div class="chips" role="group" aria-label="Relationship filter">${rels.map((r) => `<button type="button" class="chip" aria-pressed="${filter === r}" data-act="report.filter" data-arg="${arg(r)}">${r === 'all' ? 'All' : RELATIONSHIP_LABEL[r]}</button>`).join('')}</div></div>
    <div class="field"><label class="field-label" for="rep-source">Name source</label><select class="control control-select" id="rep-source" data-act="report.source"><option value="all" ${source === 'all' ? 'selected' : ''}>All entries</option><option value="identification" ${source === 'identification' ? 'selected' : ''}>Kindwise suggestions kept by gardeners</option><option value="manual" ${source === 'manual' ? 'selected' : ''}>Typed by gardeners</option></select></div>
    <table class="report-table"><caption>Grouped by plant and relationship. A plant seen, planted and checked appears three times on purpose.</caption><thead><tr><th scope="col">Plant</th><th scope="col">Relationship</th><th scope="col" class="num">Amount</th><th scope="col">Works</th></tr></thead><tbody>
      ${rows.length ? rows.map((g) => `<tr><td><strong>${esc(g.name)}</strong>${g.taxonId ? `<br><em style="color:rgb(var(--text-sub-600))">${esc(taxonById(g.taxonId).sci)}</em>` : '<br><span style="color:rgb(var(--text-sub-600))">typed name, no taxon</span>'}</td><td>${esc(RELATIONSHIP_LABEL[g.relationship])}${g.health ? `<br><span class="pill" data-tone="warning">${g.health} health note${g.health > 1 ? 's' : ''}</span>` : ''}</td><td class="num">${g.unit ? `${fmtNum(g.qty)} ${esc(g.unit)}${g.unknown ? `<br><span style="color:rgb(var(--text-sub-600))">+${g.unknown} unknown</span>` : ''}` : '—'}</td><td>${[...g.works].map((id) => `<button type="button" class="link" data-act="report.open" data-arg="${arg(id)}">${esc(id)}</button>`).join('<br>')}</td></tr>`).join('') : '<tr><td colspan="4" style="color:rgb(var(--text-sub-600))">Nothing matches these filters.</td></tr>'}
      ${filter === 'all' || filter === 'planted' ? legacy.map((w) => `<tr><td><strong>Unknown species</strong><br><span style="color:rgb(var(--text-sub-600))">recorded before plant entries existed</span></td><td>Planted</td><td class="num">${fmtNum(w.totals.seedlingsPlanted)} seedlings</td><td><button type="button" class="link" data-act="report.open" data-arg="${arg(w.id)}">${esc(w.id)}</button></td></tr>`).join('') : ''}
    </tbody></table>
    <p class="section-hint">Missing amounts stay unknown, never zero. Health notes are counted as notes, not as diagnoses. Per-species survival needs its own counts and is not shown.</p>
    <div>${btn({ label: 'Back to your work', act: 'nav.go', arg: 'saved', emphasis: 'tertiary', size: 'sm', icon: 'arrowLeft' })}</div>
  </div></div>`;
}
