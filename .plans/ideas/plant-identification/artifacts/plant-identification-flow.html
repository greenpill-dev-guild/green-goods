<!DOCTYPE html>

<head>

<title>Plant Identification Flow</title>
<meta name="description" content="Interactive design exploration for Green Goods plant identification: Media, Details, Review, saved work, steward preview and a future report concept. Synthetic fixtures only; nothing is sent anywhere.">
<style>
/* ============================================================
   Green Goods · Plant identification design mock
   Self-contained. Tokens mirror packages/shared/src/styles/theme.css
   (Warm Earth runtime projection) and packages/admin/src/styles/admin-m3-tokens.css.
   Light theme only (dark mode is a disclosed omission).
   ============================================================ */
:root {
  color-scheme: light;
  /* Page chrome around the device frame (theme-aware). The mock inside the frame is the product's light theme by design. */
  --page-bg: 231 229 228; --page-ink: 12 10 9; --panel-bg: 255 255 255; --panel-ink: 12 10 9; --panel-border: 168 162 158; --panel-muted: 87 83 78;
  /* Stone neutrals (warm gray) */
  --neutral-950: 12 10 9; --neutral-900: 28 25 23; --neutral-800: 41 37 36; --neutral-700: 68 64 60;
  --neutral-600: 87 83 78; --neutral-500: 120 113 108; --neutral-400: 168 162 158; --neutral-300: 214 211 209;
  --neutral-200: 231 229 228; --neutral-100: 245 245 244; --neutral-50: 250 250 249; --neutral-0: 255 255 255;
  /* Green (tertiary accent family) */
  --green-950: 11 70 39; --green-900: 22 100 59; --green-800: 26 117 68; --green-700: 23 140 78;
  --green-600: 29 175 97; --green-500: 31 193 107; --green-200: 194 245 218; --green-100: 208 251 233; --green-50: 224 250 236;
  /* State scales */
  --red-950: 104 18 25; --red-800: 173 31 43; --red-700: 208 37 51; --red-500: 251 55 72; --red-200: 255 192 197; --red-50: 255 235 236;
  --orange-950: 113 51 10; --orange-500: 250 115 25; --orange-200: 255 217 192; --orange-50: 255 243 235;
  --blue-950: 18 35 104; --blue-700: 37 71 208; --blue-500: 51 92 255; --blue-200: 192 213 255; --blue-50: 235 241 255;
  --yellow-900: 134 102 29; --yellow-100: 255 239 204;

  /* Semantic roles (client light) */
  --bg-white-0: var(--neutral-0); --bg-weak-50: var(--neutral-50); --bg-soft-200: var(--neutral-100); --bg-sub-300: var(--neutral-200);
  --text-strong-950: var(--neutral-950); --text-sub-600: var(--neutral-600); --text-soft-400: var(--neutral-500); --text-disabled-300: var(--neutral-300);
  --stroke-sub-300: var(--neutral-300); --stroke-soft-200: var(--neutral-100); --stroke-strong-950: var(--neutral-950);
  --primary-base: var(--green-500);            /* bright accent: icons, dots, bars only */
  --primary-action: var(--green-800);          /* fills that carry text (DL-017) */
  --primary-action-hover: var(--green-900);
  --primary-action-foreground: var(--neutral-0);
  --primary-on-surface: var(--green-800);      /* green text on a surface (DL-053) */
  --primary-alpha-10: 31 193 107 / 10%; --primary-alpha-24: 31 193 107 / 24%;
  --error-dark: var(--red-950); --error-base: var(--red-500); --error-light: var(--red-200); --error-lighter: var(--red-50); --error-action: var(--red-700); --error-action-hover: var(--red-800);
  --warning-dark: var(--orange-950); --warning-base: var(--orange-500); --warning-light: var(--orange-200); --warning-lighter: var(--orange-50);
  --information-dark: var(--blue-950); --information-base: var(--blue-500); --information-light: var(--blue-200); --information-lighter: var(--blue-50);
  --success-dark: var(--green-950); --success-base: var(--green-500); --success-light: var(--green-200); --success-lighter: var(--green-50);
  --static-white: var(--neutral-0); --static-black: var(--neutral-950);
  --color-scrim: rgba(12, 10, 9, 0.22);
  --color-scrim-obscure: rgb(12, 10, 9);
  /* Materials (thickness by content density). Thick carries text over photos. */
  --color-material-thick: oklch(0.97 0.004 85 / 0.88);
  --color-material-solid: rgb(var(--bg-white-0));
  --blur-material-thick: 8px;
  /* Shape scale (rounded.*) */
  --radius-md: 8px; --radius-squircle: 12px; --radius-lg: 16px; --radius-xl: 20px; --radius-2xl: 24px; --radius-full: 9999px;
  /* Spring tokens */
  --spring-spatial: cubic-bezier(0.16, 1, 0.3, 1) 300ms;
  --spring-spatial-fast: cubic-bezier(0.34, 1.56, 0.64, 1) 200ms;
  --spring-spatial-slow: cubic-bezier(0.16, 1, 0.3, 1) 400ms;
  --spring-spatial-exit: cubic-bezier(0.3, 0, 1, 1) 200ms;
  --spring-effects: cubic-bezier(0.2, 0, 0, 1) 250ms;
  --spring-effects-fast: cubic-bezier(0.2, 0, 0, 1) 150ms;
  --spring-effects-slow: cubic-bezier(0.2, 0, 0, 1) 500ms;
  /* Type: Inter in the PWA, Plus Jakarta Sans in the cockpit, system fallbacks (no CDN) */
  --font-app: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-admin: "Plus Jakarta Sans", Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  /* Admin cockpit tokens (garden workspace tone) */
  --m3-surface-container-low: 250 248 245; --m3-surface-container: 247 244 239; --m3-surface-container-high: 236 233 226; --m3-surface-container-highest: 226 222 213;
  --m3-outline: var(--neutral-500); --m3-outline-variant: var(--stroke-soft-200);
  --m3-elevation-1: 0 1px 2px rgba(0, 0, 0, 0.3), 0 1px 3px 1px rgba(0, 0, 0, 0.15);
  --m3-elevation-2: 0 1px 2px rgba(0, 0, 0, 0.3), 0 2px 6px 2px rgba(0, 0, 0, 0.15);
  --edge-rest: 0 0 0 1px rgba(0, 0, 0, 0.06);
  --admin-surface-0: 255 255 255;
  --tone-action: var(--green-800); --tone-on-action: 255 255 255;
  --tone-primary-container: var(--green-100); --tone-on-primary-container: var(--green-900);
  --tone-on-surface-accent: var(--green-800);
  --admin-radius-sm: 8px; --admin-radius-md: 12px; --admin-radius-lg: 16px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { color-scheme: dark; --page-bg: 12 10 9; --page-ink: 245 245 244; --panel-bg: 28 25 23; --panel-ink: 245 245 244; --panel-border: 68 64 60; --panel-muted: 168 162 158; }
}
:root[data-theme="dark"] { color-scheme: dark; --page-bg: 12 10 9; --page-ink: 245 245 244; --panel-bg: 28 25 23; --panel-ink: 245 245 244; --panel-border: 68 64 60; --panel-muted: 168 162 158; }
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: rgb(var(--page-bg)); color: rgb(var(--page-ink));
  font-family: var(--font-app); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, h4, p, ul, ol, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
img, svg { display: block; max-width: 100%; }
[hidden] { display: none !important; }
.visually-hidden:where(:not(:focus-within, :active)) {
  position: absolute !important; clip-path: inset(50%) !important; overflow: hidden !important;
  width: 1px !important; height: 1px !important; margin: -1px !important; padding: 0 !important; border: 0 !important; white-space: nowrap !important;
}
:focus-visible { outline: 3px solid rgb(var(--green-800)); outline-offset: 2px; box-shadow: 0 0 0 5px rgb(255 255 255 / 0.9); }
.ic { width: 1.125em; height: 1.125em; flex: none; vertical-align: -0.2em; }
#screen-title:focus-visible { outline: none; box-shadow: none; }
.skip { position: absolute; top: 8px; left: 8px; z-index: 50; padding: 8px 12px; background: rgb(var(--panel-bg)); color: rgb(var(--panel-ink)); border-radius: var(--radius-md); }
.skip:not(:focus) { clip-path: inset(50%); width: 1px; height: 1px; overflow: hidden; white-space: nowrap; }

/* ------------------------------------------------------------
   Reviewer bar: tooling outside the simulated gardener experience
   ------------------------------------------------------------ */
.rev {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: rgb(var(--neutral-900)); color: rgb(var(--neutral-100));
  font-size: 12.5px; line-height: 1.35; padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center;
  border-bottom: 1px solid rgb(255 255 255 / 0.08);
}
.rev__brand { font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase; font-size: 11px; color: rgb(var(--neutral-400)); margin-right: 4px; }
.rev-group { display: inline-flex; align-items: center; gap: 6px; }
.rev-group > .lbl { color: rgb(var(--neutral-400)); }
.seg { display: inline-flex; border: 1px solid rgb(255 255 255 / 0.2); border-radius: 8px; overflow: hidden; }
.seg button { background: transparent; color: inherit; border: 0; padding: 5px 9px; min-height: 30px; }
.seg button + button { border-left: 1px solid rgb(255 255 255 / 0.2); }
.seg button[aria-pressed="true"], .seg button[aria-checked="true"] { background: rgb(var(--neutral-100)); color: rgb(var(--neutral-950)); font-weight: 600; }
.rev select, .rev input[type="number"] { background: rgb(var(--neutral-800)); color: inherit; border: 1px solid rgb(255 255 255 / 0.2); border-radius: 8px; padding: 4px 8px; min-height: 30px; }
.rev input[type="number"] { width: 56px; }
.rev .rb { background: rgb(var(--neutral-800)); color: inherit; border: 1px solid rgb(255 255 255 / 0.2); border-radius: 8px; padding: 5px 10px; min-height: 30px; }
.rev .rb:hover { background: rgb(var(--neutral-700)); }
.rev .rb[aria-pressed="true"] { background: rgb(var(--neutral-100)); color: rgb(var(--neutral-950)); }
.rev .rb.danger { border-color: rgb(var(--red-500) / 0.6); }
.rev label.chk { display: inline-flex; gap: 5px; align-items: center; }
.rev .status { margin-left: auto; color: rgb(var(--neutral-300)); max-width: 40ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rev :focus-visible { outline-color: rgb(var(--green-500)); box-shadow: none; }

/* ------------------------------------------------------------
   Stage and device frame
   ------------------------------------------------------------ */
.stage { display: flex; gap: 16px; align-items: flex-start; justify-content: center; padding-block: 20px 40px; padding-inline: 16px; }
.device { position: relative; container-type: inline-size; color-scheme: light; background: rgb(var(--bg-white-0)); overflow: hidden; box-shadow: 0 24px 60px rgb(12 10 9 / 0.28), 0 0 0 1px rgb(12 10 9 / 0.12); flex: none; max-width: 100%; }
.device[data-preview="mobile"] { width: min(390px, 100%); height: min(844px, max(600px, calc(100vh - 150px))); border-radius: 40px; border: 10px solid rgb(var(--neutral-900)); }
.device[data-preview="desktop"] { width: min(1100px, 100%); height: min(780px, max(560px, calc(100vh - 150px))); border-radius: 12px; border: 1px solid rgb(var(--neutral-400)); }
.device[data-preview="mobile"]::before { content: ""; position: absolute; top: 0; left: 50%; translate: -50% 0; width: 120px; height: 26px; background: rgb(var(--neutral-900)); border-radius: 0 0 16px 16px; z-index: 5; pointer-events: none; }
.app { position: relative; height: 100%; overflow: auto; overscroll-behavior: contain; container-type: inline-size; background: rgb(var(--bg-white-0)); font-family: var(--font-app); font-size: 14px; }
.device[data-preview="mobile"] .app { padding-top: 0; }
.app-inner { min-height: 100%; display: flex; flex-direction: column; }
.padded { padding-inline: 16px; }
.col { width: 100%; max-width: 640px; margin-inline: auto; }
@container (min-width: 900px) { .col { max-width: 720px; } }

/* Top nav (composer): back + step progress */
.topnav { position: sticky; top: 0; z-index: 8; background: rgb(var(--bg-white-0) / 0.92); backdrop-filter: blur(8px); padding: 14px 16px 10px; display: flex; align-items: center; gap: 12px; }
.device[data-preview="mobile"] .topnav { padding-top: 40px; }
.progress { display: flex; flex: 1; gap: 8px; }
.progress__step { display: flex; align-items: center; flex: 1; gap: 8px; font-size: 12px; color: rgb(var(--text-sub-600)); }
.progress__dot { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; border: 1px solid rgb(var(--stroke-soft-200)); font-size: 12px; font-weight: 500; flex: none; }
.progress__dot[data-state="current"] { background: rgb(var(--primary-action)); color: rgb(var(--primary-action-foreground)); border: 0; font-weight: 600; }
.progress__dot[data-state="done"] { background: rgb(var(--primary-action)); color: rgb(var(--primary-action-foreground)); border: 0; }
.progress__line { flex: 1; height: 1px; background: rgb(var(--bg-soft-200)); }
.progress__line[data-state="done"] { background: rgb(var(--success-base)); }
.progress__step:last-child .progress__line { display: none; }

/* Form info header card (client FormInfo) */
.form-info { display: flex; gap: 14px; padding: 16px; border-radius: var(--radius-lg); background: rgb(var(--bg-weak-50)); }
.form-info__icon { width: 48px; height: 48px; flex: none; display: grid; place-items: center; border-radius: 50%; background: rgb(var(--bg-white-0)); border: 1px solid rgb(var(--stroke-soft-200)); color: rgb(var(--primary-base)); }
.form-info h2 { font-size: 16px; font-weight: 600; line-height: 1.3; }
.form-info p { font-size: 12px; line-height: 1.35; color: rgb(var(--text-sub-600)); margin-top: 2px; }
.eyebrow { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: rgb(var(--text-sub-600)); margin-bottom: 4px; }
.pills { display: flex; flex-wrap: wrap; gap: 4px; }
.pill svg { width: 14px; height: 14px; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: var(--radius-full); font-size: 12px; font-weight: 500; background: rgb(var(--primary-alpha-10)); color: rgb(var(--primary-on-surface)); }
.pill[data-tone="success"] { background: rgb(var(--success-lighter)); color: rgb(var(--success-dark)); }
.pill[data-tone="warning"] { background: rgb(var(--warning-lighter)); color: rgb(var(--warning-dark)); }
.pill[data-tone="neutral"] { background: rgb(var(--bg-soft-200)); color: rgb(var(--text-strong-950)); }
.pill[data-tone="info"] { background: rgb(var(--information-lighter)); color: rgb(var(--information-dark)); }
.pill[data-tone="error"] { background: rgb(var(--error-lighter)); color: rgb(var(--error-dark)); }

/* Buttons (shared Button: one 16px corner per surface, heights 48/44/40/32, compact 12px corner) */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; position: relative; border: 1px solid transparent; border-radius: var(--radius-lg); padding: 0 16px; min-height: 44px; font-size: 14px; font-weight: 400; line-height: 20px; text-align: center; white-space: nowrap; background: transparent; transition: background-color var(--spring-effects-fast), border-color var(--spring-effects-fast), color var(--spring-effects-fast), border-radius var(--spring-spatial-fast), transform var(--spring-spatial-fast); }
.btn:active { border-radius: var(--radius-squircle); transform: scale(0.985); }
.btn[data-size="lg"] { min-height: 48px; font-size: 16px; }
.btn[data-size="sm"] { min-height: 40px; }
.btn[data-size="compact"] { min-height: 32px; padding: 0 12px; border-radius: var(--radius-squircle); font-size: 14px; }
.btn[data-size="compact"]:active { border-radius: var(--radius-md); }
.btn[data-size="compact"]::after, .btn[data-size="sm"]::after { content: ""; position: absolute; inset: -8px 0; }
.btn[data-emphasis="primary"] { background: rgb(var(--primary-action)); color: rgb(var(--primary-action-foreground)); }
.btn[data-emphasis="primary"]:hover, .btn[data-emphasis="primary"]:active { background: rgb(var(--primary-action-hover)); }
.btn[data-emphasis="primary"][data-tone="danger"] { background: rgb(var(--error-action)); color: rgb(var(--static-white)); }
.btn[data-emphasis="secondary"] { border-color: rgb(var(--stroke-sub-300)); background: rgb(var(--bg-white-0)); color: rgb(var(--text-strong-950)); }
.btn[data-emphasis="secondary"]:hover, .btn[data-emphasis="secondary"]:active { background: rgb(var(--bg-weak-50)); }
.btn[data-emphasis="secondary"][data-tone="danger"] { border-color: rgb(var(--error-base)); color: rgb(var(--error-dark)); }
.btn[data-emphasis="tertiary"] { color: rgb(var(--text-sub-600)); }
.btn[data-emphasis="tertiary"]:hover, .btn[data-emphasis="tertiary"]:active { background: rgb(var(--bg-weak-50)); color: rgb(var(--text-strong-950)); }
.btn[data-emphasis="tertiary"][data-tone="danger"] { color: rgb(var(--error-dark)); }
.btn[aria-disabled="true"] { opacity: 0.6; cursor: not-allowed; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn.w-full { width: 100%; }
.btn .spin { animation: spin 900ms linear infinite; }
@keyframes spin { to { rotate: 360deg; } }
/* Icon button: a circle at 32px with a 48px hit area, tightens to the squircle on press */
.icon-btn { position: relative; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; border: 1px solid rgb(var(--stroke-sub-300)); background: rgb(var(--bg-white-0)); color: rgb(var(--text-strong-950)); transition: border-radius var(--spring-spatial-fast), background-color var(--spring-effects-fast); }
.icon-btn::after { content: ""; position: absolute; inset: -8px; border-radius: inherit; }
.icon-btn:hover { background: rgb(var(--bg-weak-50)); }
.icon-btn:active { border-radius: var(--radius-squircle); }
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn[data-size="md"] { width: 44px; height: 44px; }
.icon-btn[data-emphasis="tertiary"] { border-color: transparent; background: transparent; }
/* Chips: capsule toggles, selected = action fill (DL-017) */
.chip { position: relative; display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 5px 14px; border: 1px solid rgb(var(--stroke-sub-300)); border-radius: var(--radius-full); background: rgb(var(--bg-white-0)); color: rgb(var(--text-sub-600)); font-size: 14px; white-space: nowrap; transition: background-color var(--spring-effects-fast), color var(--spring-effects-fast); }
.chip::after { content: ""; position: absolute; inset: -7px -3px; border-radius: inherit; }
.chip:hover { background: rgb(var(--bg-weak-50)); color: rgb(var(--text-strong-950)); }
.chip[aria-pressed="true"], .chip[aria-checked="true"] { border-color: transparent; background: rgb(var(--primary-action)); color: rgb(var(--primary-action-foreground)); }
.chip svg { width: 16px; height: 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

/* Fields: 16px corner, 44px, hint slot reserves two lines (DL-018, DL-022, DL-023) */
.field { display: flex; flex-direction: column; gap: 6px; }
.field + .field, .field + fieldset, fieldset + .field { margin-top: 8px; }
.field-label, legend.field-label { font-size: 14px; font-weight: 500; color: rgb(var(--text-strong-950)); }
.req { color: rgb(var(--error-base)); margin-left: 2px; }
.control { display: block; width: 100%; min-height: 44px; border: 1px solid rgb(var(--stroke-sub-300)); border-radius: var(--radius-lg); background: rgb(var(--bg-white-0)); color: rgb(var(--text-strong-950)); font-size: 16px; line-height: 24px; padding: 9px 12px; transition: border-color var(--spring-effects-fast), box-shadow var(--spring-effects-fast); }
input.control { height: 44px; padding-block: 0; }
.control::placeholder { color: rgb(var(--text-soft-400)); }
.control:focus-visible { outline: none; border-color: rgb(var(--primary-base)); box-shadow: 0 0 0 3px rgb(var(--primary-base) / 0.16); }
.control[aria-invalid="true"] { border-color: rgb(var(--error-base)); }
.control-select { appearance: none; padding-right: 36px; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23575350'><path d='M12 15.5l-5-5 1.4-1.4 3.6 3.6 3.6-3.6L17 10.5z'/></svg>"); background-repeat: no-repeat; background-position: right 12px center; background-size: 18px; }
.hint { min-block-size: 2lh; font-size: 12px; line-height: 16px; color: rgb(var(--text-soft-400)); }
.hint[data-tone="error"] { color: rgb(var(--error-dark)); display: flex; gap: 4px; align-items: flex-start; }
.hint svg { width: 14px; height: 14px; flex: none; margin-top: 1px; }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
.switch-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-block: 8px; padding: 12px; border: 1px solid rgb(var(--stroke-sub-300)); background: rgb(var(--bg-weak-50)); border-radius: var(--radius-xl); }
.switch-row svg { width: 20px; height: 20px; color: rgb(var(--text-sub-600)); flex: none; }
.switch { position: relative; flex: none; width: 44px; height: 24px; border-radius: var(--radius-full); border: 0; background: rgb(var(--neutral-300)); transition: background-color var(--spring-effects-fast); align-self: center; }
.switch::before { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: rgb(var(--bg-white-0)); transition: translate var(--spring-spatial-fast); box-shadow: 0 1px 2px rgb(0 0 0 / 0.2); }
.switch[aria-checked="true"] { background: rgb(var(--primary-action)); }
.switch[aria-checked="true"]::before { translate: 20px 0; }
.switch::after { content: ""; position: absolute; inset: -10px 0; }

/* Status surfaces (pwaStatusStyles) */
.notice { display: flex; gap: 10px; align-items: flex-start; padding: 12px; border-radius: var(--radius-lg); border: 1px solid; font-size: 14px; }
.notice svg { width: 18px; height: 18px; flex: none; margin-top: 1px; }
.notice[data-tone="warning"] { background: rgb(var(--warning-lighter)); border-color: rgb(var(--warning-light)); color: rgb(var(--warning-dark)); }
.notice[data-tone="warning"] svg { color: rgb(var(--warning-base)); }
.notice[data-tone="info"] { background: rgb(var(--information-lighter)); border-color: rgb(var(--information-light)); color: rgb(var(--information-dark)); }
.notice[data-tone="info"] svg { color: rgb(var(--information-base)); }
.notice[data-tone="error"] { background: rgb(var(--error-lighter)); border-color: rgb(var(--error-light)); color: rgb(var(--error-dark)); }
.notice[data-tone="error"] svg { color: rgb(var(--error-base)); }
.notice[data-tone="success"] { background: rgb(var(--success-lighter)); border-color: rgb(var(--success-light)); color: rgb(var(--success-dark)); }
.notice[data-tone="success"] svg { color: rgb(var(--success-base)); }
.notice[data-tone="neutral"] { background: rgb(var(--bg-weak-50)); border-color: rgb(var(--stroke-soft-200)); color: rgb(var(--text-sub-600)); }
.notice .grow { flex: 1; min-width: 0; }
.notice .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.notice strong { font-weight: 600; }

/* Media step: photo cards */
.media-grid { display: flex; flex-direction: column; gap: 12px; }
@container (min-width: 640px) { .media-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } }
.photo-card { position: relative; }
.photo-preview { position: relative; display: block; width: 100%; padding: 0; border: 0; border-radius: var(--radius-lg); overflow: hidden; background: rgb(var(--bg-soft-200)); aspect-ratio: 4 / 3; }
@container (min-width: 640px) { .photo-preview { aspect-ratio: 1 / 1; } }
.photo-preview svg { width: 100%; height: 100%; }
.photo-preview .zoom { position: absolute; inset: 0; display: grid; place-items: center; background: var(--color-scrim); color: rgb(var(--static-white)); opacity: 0; transition: opacity var(--spring-effects-fast); }
.photo-preview:hover .zoom, .photo-preview:focus-visible .zoom { opacity: 1; }
.photo-preview .zoom svg { width: 44px; height: 44px; }
.photo-card .remove { position: absolute; top: 8px; right: 8px; z-index: 3; }
.photo-card .replace { position: absolute; top: 8px; right: 48px; z-index: 3; }
.overlay-slot { position: absolute; left: 8px; right: 8px; bottom: 8px; z-index: 2; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.identify-btn { background: var(--color-material-thick); backdrop-filter: blur(var(--blur-material-thick)); border-color: rgb(var(--neutral-950) / 0.18); box-shadow: 0 4px 14px rgb(12 10 9 / 0.18); }
.identify-btn svg { color: rgb(var(--primary-base)); }
/* The light card: thick material, concentric 12px corner inside the 16px photo */
.light-card { width: 100%; padding: 10px 12px; border-radius: var(--radius-squircle); background: var(--color-material-thick); backdrop-filter: blur(var(--blur-material-thick)); border: 1px solid rgb(255 255 255 / 0.7); box-shadow: 0 8px 24px rgb(12 10 9 / 0.22); color: rgb(var(--text-strong-950)); animation: rise var(--spring-spatial-fast) both; }
@keyframes rise { from { opacity: 0; translate: 0 8px; } to { opacity: 1; translate: 0 0; } }
.light-card__row { display: flex; align-items: center; gap: 10px; }
.light-card__icon { width: 28px; height: 28px; flex: none; display: grid; place-items: center; border-radius: 50%; background: rgb(var(--bg-white-0)); color: rgb(var(--primary-base)); border: 1px solid rgb(var(--stroke-soft-200)); }
.light-card__icon[data-tone="warning"] { color: rgb(var(--warning-base)); }
.light-card__icon[data-tone="error"] { color: rgb(var(--error-base)); }
.light-card__icon[data-tone="info"] { color: rgb(var(--information-base)); }
.light-card__icon[data-tone="neutral"] { color: rgb(var(--text-sub-600)); }
.light-card__icon svg { width: 16px; height: 16px; }
.light-card__names { flex: 1; min-width: 0; }
.light-card__common { font-size: 14px; font-weight: 600; line-height: 18px; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.light-card__sci { font-size: 12px; font-style: italic; color: rgb(var(--text-sub-600)); line-height: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.light-card__caption { font-size: 12px; color: rgb(var(--text-sub-600)); line-height: 16px; }
.light-card__actions { display: flex; gap: 4px; flex: none; }
.light-card__body { font-size: 13px; line-height: 18px; margin-top: 4px; }
.light-card__status { display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px; color: rgb(var(--text-sub-600)); margin-top: 6px; }
.light-card__status svg { width: 14px; height: 14px; flex: none; }
.light-card__status[data-tone="success"] { color: rgb(var(--success-dark)); }
.light-card__status[data-tone="success"] svg { color: rgb(var(--success-base)); }
.light-card__status[data-tone="warning"] { color: rgb(var(--warning-dark)); }
.light-card__status[data-tone="warning"] svg { color: rgb(var(--warning-base)); }
.light-card__foot { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: 6px; align-items: center; }
[data-layout="A"] .light-card__foot { margin-top: 4px; }
.light-card .btn[data-size="compact"] { padding: 0 8px; }
.measure-row { display: flex; gap: 8px; align-items: center; }
.measure-row .control { flex: 1; }
.measure-row .unit { font-size: 14px; color: rgb(var(--text-sub-600)); flex: none; }
.light-card__foot .spacer { flex: 1; }
.light-card[data-tone="warning"] { border-color: rgb(var(--warning-light)); }
.light-card[data-tone="error"] { border-color: rgb(var(--error-light)); }
.light-card .chips { margin-top: 8px; }
.light-card .chip { min-height: 32px; font-size: 13px; padding-inline: 12px; }
/* Layout A keeps the card to one row; layout B expands with status rows */
[data-layout="A"] .light-card { padding: 8px 10px; }
[data-layout="B"] .light-card { padding: 12px 12px 10px; }
.thumb { width: 44px; height: 44px; border-radius: var(--radius-md); overflow: hidden; border: 1px solid rgb(var(--stroke-soft-200)); background: rgb(var(--bg-soft-200)); flex: none; }
.thumb svg { width: 100%; height: 100%; }
.stand-in { position: absolute; top: 8px; left: 8px; z-index: 2; font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase; padding: 3px 8px; border-radius: var(--radius-full); background: rgb(12 10 9 / 0.55); color: rgb(var(--static-white)); pointer-events: none; }
.empty { padding: 32px 16px; text-align: center; color: rgb(var(--text-sub-600)); }
.empty svg { width: 48px; height: 48px; margin: 0 auto 8px; color: rgb(var(--primary-base)); }
.empty strong { display: block; color: rgb(var(--text-strong-950)); font-weight: 600; }

/* Details: plant rows */
.section-title { font-size: 14px; font-weight: 600; line-height: 20px; }
.section-hint { font-size: 12px; color: rgb(var(--text-sub-600)); line-height: 16px; }
.plant-section { display: flex; flex-direction: column; gap: 12px; padding: 12px; border: 1px solid rgb(var(--stroke-sub-300)); border-radius: var(--radius-xl); }
.plant-rows { display: flex; flex-direction: column; gap: 10px; }
.plant-row { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: var(--radius-lg); background: rgb(var(--bg-weak-50)); }
.plant-row__head { display: flex; align-items: flex-start; gap: 8px; }
.plant-row__head .field { flex: 1; }
.plant-row .meta { font-size: 12px; color: rgb(var(--text-sub-600)); line-height: 16px; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.plant-row .meta svg { width: 14px; height: 14px; color: rgb(var(--primary-base)); }
.plant-row .meta em { font-style: italic; }
.supports { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px; color: rgb(var(--text-sub-600)); }
.supports .thumb { width: 36px; height: 36px; }
.row-2 { display: grid; grid-template-columns: 1fr; gap: 8px; }
@container (min-width: 480px) { .row-2 { grid-template-columns: 1fr 1fr; } }
.measure { display: flex; gap: 8px; align-items: flex-end; }
.measure .field { flex: 1; }
.measure .unit { min-height: 44px; display: flex; align-items: center; font-size: 14px; color: rgb(var(--text-sub-600)); padding-bottom: 0; }
.alloc { display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; border-radius: var(--radius-lg); background: rgb(var(--bg-soft-200)); font-size: 13px; line-height: 18px; }
.alloc svg { width: 16px; height: 16px; flex: none; margin-top: 1px; color: rgb(var(--primary-base)); }
.alloc[data-tone="error"] { background: rgb(var(--error-lighter)); color: rgb(var(--error-dark)); }
.alloc[data-tone="error"] svg { color: rgb(var(--error-base)); }
.alloc[data-tone="neutral"] { color: rgb(var(--text-sub-600)); }
.alloc[data-tone="neutral"] svg { color: rgb(var(--text-soft-400)); }
.health-block { padding: 10px 12px; border-radius: var(--radius-lg); background: rgb(var(--bg-white-0)); border: 1px dashed rgb(var(--stroke-sub-300)); display: flex; flex-direction: column; gap: 6px; }
.health-block .ttl { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; }
.health-block .ttl svg { width: 16px; height: 16px; color: rgb(var(--warning-base)); }
.health-block textarea.control { font-size: 14px; line-height: 20px; min-height: 64px; }
.health-block .fine { font-size: 12px; color: rgb(var(--text-sub-600)); }

/* Review */
.form-card { border: 1px solid rgb(var(--stroke-soft-200)); border-radius: var(--radius-lg); overflow: hidden; }
.form-card__head { display: flex; gap: 8px; align-items: center; padding: 10px 12px; border-bottom: 1px solid rgb(var(--stroke-soft-200)); font-size: 15px; font-weight: 500; }
.form-card__head svg { width: 22px; height: 22px; color: rgb(var(--primary-base)); }
.form-card__body { padding: 6px 16px 12px; font-size: 14px; color: rgb(var(--text-sub-600)); white-space: pre-line; }
.review-plant { display: flex; gap: 12px; padding: 12px; border: 1px solid rgb(var(--stroke-soft-200)); border-radius: var(--radius-lg); }
.review-plant .thumbs { display: flex; flex-direction: column; gap: 4px; }
.review-plant .thumbs .thumb { width: 52px; height: 52px; }
.review-plant .body { flex: 1; min-width: 0; font-size: 13px; line-height: 18px; color: rgb(var(--text-sub-600)); }
.review-plant .body strong { display: block; font-size: 14px; color: rgb(var(--text-strong-950)); font-weight: 600; }
.review-plant .body em { font-style: italic; }
.media-strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.media-strip figure { flex: none; width: 140px; }
.media-strip .art { position: relative; aspect-ratio: 3 / 4; border-radius: var(--radius-lg); overflow: hidden; background: rgb(var(--bg-soft-200)); }
.media-strip .art svg { width: 100%; height: 100%; }
.media-strip figcaption { font-size: 12px; color: rgb(var(--text-sub-600)); margin-top: 4px; line-height: 16px; }
.garden-card { display: flex; gap: 12px; align-items: center; padding: 12px; border: 1px solid rgb(var(--stroke-soft-200)); border-radius: var(--radius-lg); }
.garden-card .avatar { width: 48px; height: 48px; border-radius: var(--radius-squircle); background: linear-gradient(135deg, rgb(var(--green-200)), rgb(var(--green-700))); flex: none; }
.garden-card strong { display: block; font-weight: 600; }
.garden-card span { font-size: 12px; color: rgb(var(--text-sub-600)); }

/* Composer bottom bar (sticky inside the device) */
.bottom-bar { position: sticky; bottom: 0; z-index: 8; margin-top: auto; background: rgb(var(--bg-white-0)); border-top: 1px solid rgb(var(--stroke-soft-200)); border-radius: var(--radius-lg) var(--radius-lg) 0 0; padding: 12px 16px calc(12px + 8px); display: flex; flex-direction: column; gap: 8px; }
.device[data-preview="mobile"] .bottom-bar { padding-bottom: 24px; }
.bottom-bar .row { display: flex; gap: 12px; }
.bottom-bar .row .btn { flex: 1; }
.bottom-bar .row .btn.fixed { flex: none; }
.bottom-bar .status { font-size: 12px; color: rgb(var(--text-sub-600)); padding-inline: 4px; }
.device[data-preview="mobile"] .offline-bar { padding-top: 34px; }
.device[data-preview="mobile"] .offline-bar + .topnav { padding-top: 10px; }
.offline-bar { display: flex; align-items: center; gap: 8px; padding: 6px 16px; background: rgb(var(--warning-lighter)); color: rgb(var(--warning-dark)); font-size: 12px; }
.offline-bar svg { width: 14px; height: 14px; color: rgb(var(--warning-base)); }

/* Sheets and dialogs inside the device (PwaSheet anatomy: grip, shared header, scroll body, pinned actions) */
.sheet-scrim { position: absolute; inset: 0; z-index: 20; background: var(--color-scrim); animation: fade var(--spring-effects) both; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 21; display: flex; flex-direction: column; max-height: 85%; background: rgb(var(--bg-white-0)); border-radius: var(--radius-2xl) var(--radius-2xl) 0 0; box-shadow: 0 -12px 40px rgb(12 10 9 / 0.2); animation: slide-up var(--spring-spatial-slow) both; outline: none; }
.sheet[data-tier="compact"] { max-height: 50%; }
.sheet[data-tier="tall"] { max-height: 70%; }
.sheet[data-tier="full"] { max-height: 85%; }
@keyframes slide-up { from { translate: 0 100%; } to { translate: 0 0; } }
.sheet-grip { width: 40px; height: 6px; border-radius: var(--radius-full); background: rgb(var(--neutral-300)); margin: 8px auto 0; flex: none; }
.sheet-header { display: flex; align-items: flex-start; gap: 8px; padding: 8px 12px 8px 16px; flex: none; }
.sheet-header .titles { flex: 1; min-width: 0; padding-top: 10px; }
.sheet-header h2 { font-size: 18px; font-weight: 600; line-height: 24px; }
.sheet-header p { font-size: 14px; line-height: 20px; color: rgb(var(--text-sub-600)); margin-top: 2px; }
.sheet-close { width: 44px; height: 44px; border: 0; background: transparent; border-radius: 50%; display: grid; place-items: center; color: rgb(var(--text-sub-600)); flex: none; }
.sheet-close:hover { background: rgb(var(--bg-weak-50)); }
.sheet-close svg { width: 20px; height: 20px; }
.sheet-body { overflow: auto; padding: 4px 16px 16px; flex: 1; display: flex; flex-direction: column; gap: 12px; }
.sheet-actions { flex: none; display: flex; flex-direction: column; gap: 8px; padding: 12px 16px 20px; border-top: 1px solid rgb(var(--stroke-soft-200)); }
.sheet-actions .btn { width: 100%; }
.sheet-heading { font-size: 14px; font-weight: 600; line-height: 20px; }
@container (min-width: 640px) {
  .sheet { left: 50%; right: auto; top: 50%; bottom: auto; translate: -50% -50%; width: min(560px, calc(100% - 48px)); max-height: 90%; border-radius: var(--radius-2xl); animation: pop var(--spring-spatial) both; }
  .sheet[data-tier] { max-height: 90%; }
  .sheet-grip { display: none; }
  .sheet-actions { flex-direction: row-reverse; justify-content: flex-start; padding-bottom: 16px; }
  .sheet-actions .btn { width: auto; }
}
@keyframes pop { from { opacity: 0; translate: -50% calc(-50% + 12px); } to { opacity: 1; translate: -50% -50%; } }
.choice-list { display: flex; flex-direction: column; gap: 8px; }
.choice { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid rgb(var(--stroke-sub-300)); border-radius: var(--radius-lg); background: rgb(var(--bg-white-0)); text-align: left; width: 100%; }
.choice[aria-checked="true"] { border-color: rgb(var(--primary-action)); background: rgb(var(--primary-alpha-10)); }
.choice .radio { width: 20px; height: 20px; border-radius: 50%; border: 2px solid rgb(var(--stroke-sub-300)); flex: none; display: grid; place-items: center; }
.choice[aria-checked="true"] .radio { border-color: rgb(var(--primary-action)); }
.choice[aria-checked="true"] .radio::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: rgb(var(--primary-action)); }
.choice .txt { flex: 1; min-width: 0; }
.choice .txt strong { display: block; font-weight: 600; }
.choice .txt span { font-size: 12px; color: rgb(var(--text-sub-600)); }
.choice .score { font-size: 12px; color: rgb(var(--text-sub-600)); font-variant-numeric: tabular-nums; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }
.kv dt { color: rgb(var(--text-sub-600)); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
details.ref { border: 1px solid rgb(var(--stroke-soft-200)); border-radius: var(--radius-lg); padding: 0 12px; }
details.ref summary { cursor: pointer; padding: 10px 0; font-weight: 500; list-style: none; display: flex; align-items: center; gap: 6px; }
details.ref summary::-webkit-details-marker { display: none; }
details.ref summary::before { content: ""; width: 8px; height: 8px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; rotate: -45deg; transition: rotate var(--spring-spatial-fast); margin-right: 2px; }
details.ref[open] summary::before { rotate: 45deg; }
details.ref p { padding-bottom: 12px; font-size: 13px; line-height: 18px; color: rgb(var(--text-sub-600)); }
.picker-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.picker-item { padding: 0; border: 1px solid rgb(var(--stroke-sub-300)); border-radius: var(--radius-lg); overflow: hidden; background: rgb(var(--bg-white-0)); text-align: left; }
.picker-item .art { aspect-ratio: 4 / 3; position: relative; }
.picker-item .art svg { width: 100%; height: 100%; }
.picker-item .cap { padding: 8px 10px; font-size: 13px; line-height: 17px; }
.picker-item .cap small { display: block; font-size: 11px; color: rgb(var(--text-soft-400)); }
.viewer { position: absolute; inset: 0; z-index: 22; background: var(--color-scrim-obscure); display: flex; flex-direction: column; color: rgb(var(--static-white)); }
.viewer .top { display: flex; align-items: center; justify-content: space-between; padding: 12px 12px 8px; }
.device[data-preview="mobile"] .viewer .top { padding-top: 40px; }
.viewer .top .icon-btn { background: rgb(255 255 255 / 0.12); border-color: transparent; color: rgb(var(--static-white)); width: 44px; height: 44px; }
.viewer .img { flex: 1; display: grid; place-items: center; padding: 12px; }
.viewer .img svg { width: 100%; max-height: 100%; border-radius: var(--radius-lg); }
.viewer .cap { padding: 12px 16px 28px; font-size: 14px; text-align: center; color: rgb(var(--neutral-300)); }
.toasts { position: absolute; left: 12px; right: 12px; bottom: 112px; z-index: 19; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.toast { pointer-events: auto; display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--radius-lg); background: rgb(var(--neutral-900)); color: rgb(var(--neutral-50)); font-size: 13px; line-height: 18px; box-shadow: 0 8px 24px rgb(12 10 9 / 0.3); animation: rise var(--spring-spatial) both; }
.toast svg { width: 16px; height: 16px; flex: none; margin-top: 1px; color: rgb(var(--green-500)); }
.toast[data-tone="warning"] svg { color: rgb(var(--orange-500)); }
.toast[data-tone="error"] svg { color: rgb(var(--red-500)); }

/* Saved work */
.saved-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.result-card { padding: 12px; border-radius: var(--radius-lg); border: 1px solid rgb(var(--information-light)); background: rgb(var(--information-lighter)); display: flex; flex-direction: column; gap: 8px; font-size: 13px; line-height: 18px; color: rgb(var(--information-dark)); }
.result-card strong { font-weight: 600; }
.result-card .row { display: flex; flex-wrap: wrap; gap: 8px; }
.update-card { padding: 12px; border-radius: var(--radius-lg); border: 1px solid rgb(var(--stroke-soft-200)); font-size: 13px; line-height: 18px; }
.view-toggle { display: inline-flex; border: 1px solid rgb(var(--stroke-sub-300)); border-radius: var(--radius-full); overflow: hidden; }
.view-toggle button { border: 0; background: transparent; padding: 6px 14px; min-height: 36px; font-size: 13px; color: rgb(var(--text-sub-600)); }
.view-toggle button[aria-pressed="true"] { background: rgb(var(--primary-action)); color: rgb(var(--primary-action-foreground)); }

/* Report concept (client garden page, future design) */
.report-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.report-table th, .report-table td { text-align: left; padding: 8px 6px; border-bottom: 1px solid rgb(var(--stroke-soft-200)); vertical-align: top; }
.report-table th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: rgb(var(--text-sub-600)); font-weight: 500; }
.report-table td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.report-table caption { text-align: left; font-size: 12px; color: rgb(var(--text-sub-600)); padding-bottom: 6px; caption-side: top; }
.report-table .link { background: none; border: 0; padding: 0; color: rgb(var(--primary-on-surface)); text-decoration: underline; font: inherit; }
.stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat { padding: 10px 12px; border-radius: var(--radius-lg); background: rgb(var(--bg-weak-50)); }
.stat .n { font-size: 20px; font-weight: 600; line-height: 24px; }
.stat .l { font-size: 12px; color: rgb(var(--text-sub-600)); line-height: 16px; }
.rev-note { border: 1px dashed rgb(var(--neutral-500)); border-radius: var(--radius-md); padding: 6px 10px; font-size: 12px; color: rgb(var(--neutral-700)); background: rgb(var(--neutral-50)); }
.rev-note b { font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; font-size: 10px; color: rgb(var(--neutral-600)); margin-right: 6px; }

/* ------------------------------------------------------------
   Steward preview: restrained cockpit, solid surfaces, Plus Jakarta Sans
   ------------------------------------------------------------ */
.admin { position: absolute; inset: 0; z-index: 12; font-family: var(--font-admin); font-size: 14px; color: rgb(var(--text-strong-950)); background: rgb(var(--m3-surface-container-low)); }
.admin-canvas { position: absolute; inset: 0; padding: 24px; background: linear-gradient(to bottom, rgb(var(--green-500) / 0.05), transparent 320px); }
.admin-appbar { height: 56px; display: flex; align-items: center; gap: 12px; }
.admin-chip-garden { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-radius: var(--radius-full); border: 1px solid rgb(var(--m3-outline)); background: rgb(var(--admin-surface-0)); font-size: 13px; }
.admin-chip-garden .dot { width: 10px; height: 10px; border-radius: 50%; background: rgb(var(--green-500)); }
.admin-scrim { position: absolute; inset: 0; background: rgb(0 0 0 / 0.32); z-index: 1; }
.admin-dialog { position: absolute; z-index: 2; background: rgb(var(--m3-surface-container-high)); box-shadow: var(--m3-elevation-2); display: flex; flex-direction: column; overflow: hidden; left: 0; right: 0; bottom: 0; max-height: 90%; border-radius: var(--admin-radius-lg) var(--admin-radius-lg) 0 0; outline: none; }
@container (min-width: 640px) { .admin-dialog { left: 50%; top: 50%; bottom: auto; right: auto; translate: -50% -50%; width: min(960px, calc(100% - 48px)); max-height: 85%; border-radius: var(--admin-radius-lg); } }
.admin-dialog__header { display: flex; align-items: flex-start; gap: 12px; padding: 20px 20px 12px; }
.admin-dialog__header h2 { font-size: 22px; font-weight: 600; line-height: 28px; }
.admin-dialog__header p { font-size: 14px; color: rgb(var(--text-sub-600)); margin-top: 2px; }
.admin-dialog__header .titles { flex: 1; }
.admin-dialog__body { overflow: auto; padding: 4px 20px 20px; display: flex; flex-direction: column; gap: 16px; }
.admin-grid { display: grid; grid-template-columns: 1fr; gap: 16px; align-items: start; }
@container (min-width: 900px) { .admin-grid { grid-template-columns: 3fr 2fr; } }
.admin-col { display: flex; flex-direction: column; gap: 16px; }
.surface-inset { border-radius: var(--admin-radius-sm); background: rgb(var(--admin-surface-0)); padding: 16px; box-shadow: var(--edge-rest), var(--m3-elevation-1); }
.admin h3 { font-size: 14px; font-weight: 600; line-height: 20px; }
.admin h4 { font-size: 12px; font-weight: 500; color: rgb(var(--text-sub-600)); line-height: 16px; }
.detail-row { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; font-size: 14px; padding: 4px 0; }
.detail-row .k { font-size: 12px; color: rgb(var(--text-soft-400)); flex: none; }
.detail-row .v { text-align: right; min-width: 0; }
.evidence-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
@container (min-width: 640px) { .evidence-grid { grid-template-columns: 1fr 1fr 1fr; } }
.evidence-grid button { padding: 0; border: 1px solid rgb(var(--stroke-soft-200)); border-radius: var(--admin-radius-sm); overflow: hidden; background: rgb(var(--bg-weak-50)); aspect-ratio: 1 / 1; position: relative; }
.evidence-grid button svg { width: 100%; height: 100%; }
.admin-plant { padding: 10px 0; border-top: 1px solid rgb(var(--m3-outline-variant)); font-size: 14px; }
.admin-plant:first-of-type { border-top: 0; }
.admin-plant .name { font-weight: 600; }
.admin-plant .sci { font-style: italic; color: rgb(var(--text-sub-600)); }
.admin-plant .line { font-size: 12px; color: rgb(var(--text-sub-600)); display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 2px; }
.admin-badge { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: var(--radius-full); font-size: 11px; font-weight: 500; }
.admin-badge[data-tone="pending"] { background: rgb(var(--warning-lighter)); color: rgb(var(--warning-dark)); }
.admin-badge[data-tone="approved"] { background: rgb(var(--success-lighter)); color: rgb(var(--success-dark)); }
.admin-badge[data-tone="rejected"] { background: rgb(var(--error-lighter)); color: rgb(var(--error-dark)); }
.admin-badge[data-tone="info"] { background: rgb(var(--information-lighter)); color: rgb(var(--information-dark)); }
.admin-badge[data-tone="neutral"] { background: rgb(var(--m3-surface-container-high)); color: rgb(var(--text-sub-600)); }
.admin-badge svg { width: 12px; height: 12px; }
.admin-btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 40px; padding: 0 20px; border-radius: var(--radius-full); border: 1px solid transparent; font-size: 14px; font-weight: 500; font-family: var(--font-admin); background: transparent; transition: box-shadow var(--spring-effects-fast), background-color var(--spring-effects-fast); }
.admin-btn[data-size="md"] { height: 32px; padding: 0 16px; }
.admin-btn[data-size="md"]::after { content: ""; position: absolute; inset: -6px 0; }
.admin-btn[data-variant="filled"] { background: rgb(var(--tone-action)); color: rgb(var(--tone-on-action)); box-shadow: var(--m3-elevation-1); }
.admin-btn[data-variant="filled"]:hover { box-shadow: var(--m3-elevation-2); }
.admin-btn[data-variant="outlined"] { border-color: rgb(var(--m3-outline)); color: rgb(var(--tone-on-surface-accent)); }
.admin-btn[data-variant="outlined"]:hover { background: rgb(var(--neutral-950) / 0.08); }
.admin-btn[data-variant="text"] { color: rgb(var(--tone-on-surface-accent)); }
.admin-btn[data-variant="text"]:hover { background: rgb(var(--neutral-950) / 0.08); }
.admin-btn[data-variant="outlined"][data-tone="error"] { color: rgb(var(--red-700)); }
.admin-btn[aria-disabled="true"] { opacity: 0.5; cursor: not-allowed; }
.admin-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
.admin-field { display: flex; flex-direction: column; gap: 4px; }
.admin-field label { font-size: 12px; color: rgb(var(--text-sub-600)); }
.admin-field textarea, .admin-field select { width: 100%; min-height: 44px; border: 0; border-bottom: 1px solid rgb(var(--m3-outline)); border-radius: var(--admin-radius-xs, 4px) var(--admin-radius-xs, 4px) 0 0; background: rgb(var(--m3-surface-container)); padding: 10px 12px; font-family: var(--font-admin); font-size: 14px; }
.admin-field textarea:focus-visible, .admin-field select:focus-visible { outline: none; border-bottom: 2px solid rgb(var(--tone-action)); }
.admin-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.admin-chip { height: 32px; padding: 0 12px; border-radius: var(--radius-md); border: 1px solid rgb(var(--m3-outline)); background: transparent; font-family: var(--font-admin); font-size: 13px; color: rgb(var(--text-strong-950)); display: inline-flex; align-items: center; gap: 4px; }
.admin-chip[aria-checked="true"] { background: rgb(var(--tone-primary-container)); color: rgb(var(--tone-on-primary-container)); border-color: transparent; }
.admin-chip::after { content: ""; position: absolute; }
.admin-note { font-size: 12px; color: rgb(var(--text-sub-600)); line-height: 16px; }
.admin-review-summary { padding: 12px; border-radius: var(--admin-radius-sm); background: rgb(var(--bg-weak-50)); font-size: 14px; }
.admin .sheet-close { color: rgb(var(--text-sub-600)); }

/* Metadata preview panel (reviewer-only) */
.meta-panel { width: min(460px, 100%); max-height: 780px; overflow: auto; background: rgb(var(--neutral-900)); color: rgb(var(--neutral-100)); border-radius: 12px; padding: 12px 14px; font-size: 12px; }
.meta-panel h2 { font-size: 13px; font-weight: 600; margin-bottom: 6px; }
.meta-panel pre { margin: 0; font-family: var(--font-mono); font-size: 11.5px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; color: rgb(var(--neutral-100)); }
.meta-panel .omit { margin-top: 10px; padding-top: 10px; border-top: 1px solid rgb(255 255 255 / 0.12); color: rgb(var(--neutral-300)); }
.meta-panel .omit ul { list-style: disc; padding-left: 18px; }
.recipes { width: min(420px, 100%); max-height: 780px; overflow: auto; background: rgb(var(--panel-bg)); color: rgb(var(--panel-ink)); border: 1px solid rgb(var(--panel-border)); border-radius: 12px; padding: 12px 14px; font-size: 12.5px; line-height: 1.45; }
.recipes h2 { font-size: 13px; font-weight: 600; margin-bottom: 8px; }
.recipes ol { list-style: decimal; padding-left: 18px; display: flex; flex-direction: column; gap: 8px; }
.recipes li strong { font-weight: 600; }
.recipes .fx { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin-top: 10px; padding-top: 10px; border-top: 1px solid rgb(var(--panel-border)); }
.recipes .fx dt { font-weight: 600; }
.recipes .fx dd { margin: 0; color: rgb(var(--panel-muted)); }

@media (max-width: 1200px) { .stage { flex-wrap: wrap; } }
@media (max-width: 700px) { .rev { position: static; } .rev .status { margin-left: 0; max-width: 100%; white-space: normal; } }
@media (max-width: 440px) { .device[data-preview="mobile"] { border-width: 6px; border-radius: 28px; } .device[data-preview="mobile"]::before { width: 96px; height: 20px; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
  .btn .spin { animation: none; opacity: 0.6; }
}
@media (prefers-contrast: more) {
  .light-card, .identify-btn { background: var(--color-material-solid); backdrop-filter: none; border-color: rgb(var(--neutral-950)); }
}
</style>
</head>
<body>
<a class="skip" href="#stage">Skip to the mock</a>
<header class="rev" aria-label="Reviewer tools">
  <span class="rev__brand">Reviewer tools</span>
  <div class="rev-group" role="group" aria-label="Overlay layout">
    <span class="lbl">Layout</span>
    <div class="seg">
      <button type="button" class="rv" data-act="ui.layout" data-arg="&quot;A&quot;" aria-pressed="true" title="A: compact name and source overlay; status lives in the disclosure">A · compact</button>
      <button type="button" class="rv" data-act="ui.layout" data-arg="&quot;A+&quot;" aria-pressed="false" title="A+: the compact overlay plus one status row for health and shared entries (recommended)">A+ · compact + status</button>
      <button type="button" class="rv" data-act="ui.layout" data-arg="&quot;B&quot;" aria-pressed="false" title="B: expanded light overlay with Added to Details and health state">B · expanded</button>
    </div>
  </div>
  <div class="rev-group" role="group" aria-label="Preview size">
    <span class="lbl">Preview</span>
    <div class="seg">
      <button type="button" class="rv" data-act="ui.preview" data-arg="&quot;mobile&quot;" aria-pressed="true">Mobile 390</button>
      <button type="button" class="rv" data-act="ui.preview" data-arg="&quot;desktop&quot;" aria-pressed="false">Desktop</button>
    </div>
  </div>
  <div class="rev-group">
    <label class="lbl" for="rev-action">Action</label>
    <select id="rev-action" data-act="ui.action">
      <option value="planting">Planting Event</option>
      <option value="site">Site Assessment &amp; Species Plan</option>
      <option value="survival">Survival Check</option>
      <option value="maintenance">Maintenance Activity</option>
      <option value="harvest">Harvest &amp; Yield Record</option>
      <option value="reflection">Learning Reflection (deferred)</option>
      <option value="solar">Solar Site Setup (unrelated)</option>
    </select>
  </div>
  <div class="rev-group" role="group" aria-label="Screen">
    <span class="lbl">Screen</span>
    <div class="seg" id="rev-screens">
      <button type="button" class="rv" data-act="ui.screen" data-arg="&quot;media&quot;" aria-pressed="true">Media</button>
      <button type="button" class="rv" data-act="ui.screen" data-arg="&quot;details&quot;" aria-pressed="false">Details</button>
      <button type="button" class="rv" data-act="ui.screen" data-arg="&quot;review&quot;" aria-pressed="false">Review</button>
      <button type="button" class="rv" data-act="ui.screen" data-arg="&quot;saved&quot;" aria-pressed="false">Saved work</button>
      <button type="button" class="rv" data-act="ui.screen" data-arg="&quot;report&quot;" aria-pressed="false">Report</button>
    </div>
  </div>
  <div class="rev-group" role="group" aria-label="Scenario controls">
    <span class="lbl">Scenario</span>
    <button type="button" class="rb" id="rev-online" data-act="ui.toggleOnline" aria-pressed="false">Offline</button>
    <button type="button" class="rb" data-act="sim.reconnect" title="Go online and run every queued request exactly once">Reconnect</button>
    <label class="lbl" for="rev-credits">Credits</label>
    <input id="rev-credits" type="number" min="0" max="99" value="5" data-act="ui.credits" aria-label="Identification credits remaining">
    <button type="button" class="rb" data-act="ui.creditsZero">Set 0</button>
    <label class="chk"><input type="checkbox" id="rev-slow" data-act="ui.toggleSlow"> Hold analyses</label>
    <button type="button" class="rb" data-act="sim.complete" title="Finish every held or in-flight analysis now">Complete held</button>
  </div>
  <div class="rev-group">
    <button type="button" class="rb" id="rev-meta" data-act="ui.toggleMeta" aria-pressed="false">Metadata preview</button>
    <button type="button" class="rb" id="rev-recipes" data-act="ui.toggleRecipes" aria-pressed="false">Recipes</button>
    <button type="button" class="rb danger" data-act="sim.reset">Reset</button>
  </div>
  <span class="status" id="rev-status" title="What the polite live region last announced">Last announcement: —</span>
</header>

<main id="stage" class="stage" tabindex="-1">
  <aside class="recipes" id="recipes" hidden aria-label="Review recipes"></aside>
  <div class="device" id="device" data-preview="mobile" data-layout="A">
    <div class="app" id="app"></div>
    <div id="overlays"></div>
    <div class="toasts" id="toasts" aria-live="off"></div>
  </div>
  <aside class="meta-panel" id="meta" hidden aria-label="Public-safe metadata preview"></aside>
</main>

<div id="live" role="status" aria-live="polite" aria-atomic="true" class="visually-hidden"></div>
<div id="alert" role="alert" aria-atomic="true" class="visually-hidden"></div>
<script>
'use strict';
/* ============================================================

   reference text and prior works for the report concept.
   Every score, taxon id, hash and health condition below is a
   synthetic UI example. None of it came from Kindwise.
   ============================================================ */

// Stroke icons approximating the Remixicon glyphs the product uses

const ICONS = {

  link: '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
  shield: '<path d="m12 3 8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="m9 12 2 2 4-4"/>',
  filter: '<path d="M3 5h18l-7 8v6l-4-2v-4z"/>',

function icon(name, cls) {
  return `<svg class="ic${cls ? ' ' + cls : ''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${ICONS[name] || ''}</svg>`;
}

// Synthetic taxa. The ids imitate the shape of a provider taxon reference; they are not real.
const TAXA = {
  'kw-taxon-1001': { id: 'kw-taxon-1001', common: 'Guava', sci: 'Psidium guajava', rank: 'species' },
  'kw-taxon-1002': { id: 'kw-taxon-1002', common: 'Strawberry guava', sci: 'Psidium cattleyanum', rank: 'species' },
  'kw-taxon-1003': { id: 'kw-taxon-1003', common: 'Rose apple', sci: 'Syzygium jambos', rank: 'species' },
  'kw-taxon-2001': { id: 'kw-taxon-2001', common: 'Mango', sci: 'Mangifera indica', rank: 'species' },
  'kw-taxon-2002': { id: 'kw-taxon-2002', common: 'Cashew', sci: 'Anacardium occidentale', rank: 'species' },

const taxonById = (id) => (id ? TAXA[id] || null : null);

const REFERENCE = {
  'kw-taxon-1001': { about: 'Small evergreen tree, usually 3 to 8 m, with oval leaves and round yellow-green fruit. Fruits within a couple of years from a cutting.', care: 'Full sun. Water regularly while fruiting, mulch the base, and prune lightly after harvest.' },

  'kw-taxon-2001': { about: 'Large evergreen tree with long, leathery leaves. Young leaves are often reddish and hang limp before they harden.', care: 'Deep, infrequent watering once established. Avoid waterlogged soil and heavy pruning.' },
  'kw-taxon-2002': { about: 'Spreading evergreen tree with rounded leaves; the nut hangs below a swollen stalk.', care: 'Drought-tolerant once rooted. Give it space.' },

const HEALTH_REFERENCE = {
  'Early blight (Alternaria)': 'Brown rings on the lower leaves that spread upward. Illustrative reference text.',
  'Nutrient deficiency': 'Pale or yellowing leaves between the veins. Illustrative reference text.',
  'Anthracnose (fungal)': 'Dark, sunken spots on leaves and fruit. Illustrative reference text.',
  'Leaf spot (fungal)': 'Small dark spots with a lighter centre. Illustrative reference text.',

// Photo stand-ins. `outcome` is the mock result; `outcomeSequence` varies by attempt.
const PHOTOS = {
  'guava-1': { label: 'Guava branch with fruit', art: 'guava', seed: 11, outcome: 'suggested',
    suggestions: [['kw-taxon-1001', 0.91], ['kw-taxon-1002', 0.06], ['kw-taxon-1003', 0.02]],
    health: { healthy: 0.9, issues: [['Leaf spot (fungal)', 0.08]] }, hint: 'Clear suggestion: guava' },
  'guava-2': { label: 'Guava, second angle', art: 'guava', seed: 23, outcome: 'suggested',
    suggestions: [['kw-taxon-1001', 0.88], ['kw-taxon-1002', 0.09]],
    health: { healthy: 0.86, issues: [['Leaf spot (fungal)', 0.11]] }, hint: 'Guava again: joins an existing entry' },

    suggestions: [['kw-taxon-2001', 0.79], ['kw-taxon-2002', 0.15], ['kw-taxon-1003', 0.04]],
    health: { healthy: 0.44, issues: [['Anthracnose (fungal)', 0.55]] }, hint: 'Clear suggestion: mango' },

    health: { healthy: 0.31, issues: [['Early blight (Alternaria)', 0.62], ['Nutrient deficiency', 0.21]] }, hint: 'Tomato; health check shows a possible issue' },

    health: { healthy: 0.7, issues: [['Nutrient deficiency', 0.25]] }, hint: 'Ambiguous: you must choose' },

const PHOTO_ORDER = ['guava-1', 'guava-2', 'mango-1', 'tomato-1', 'seedling-1', 'soil-1', 'blur-1'];

const SPECIES_TAGS = ['Native hardwood', 'Fruit tree', 'Nitrogen fixer', 'Timber species', 'Medicinal', 'Shade tree', 'Ornamental', 'Other'];

// Action configuration mirrors packages/shared/src/utils/action/templates/agro.ts (and solar.ts).
const ACTIONS = {
  planting: {
    title: 'Planting Event', slug: 'agro-planting-event', identify: true, health: false,
    media: { title: 'Capture Planting Photos', description: 'Take photos of the planting activity, showing seedlings, participants, and the planting site.', needed: ['Planting in progress', 'Planted seedlings'], optional: ['Participants', 'Site overview'], min: 1, max: 8 },

    ],
    sections: [
      { key: 'planted', title: 'Species planted', relationship: 'planted', hint: 'Names come from your photos or from you. The count for each species is optional; the total above stays the total.',

/* Validation and allocation */
function allocation(d, sec) {

  if (total === '' || total === undefined || Number.isNaN(Number(total))) return { tone: 'neutral', text: `Enter ${m.totalLabel} above to see what is left to allocate.` };
  const t = Number(total);
  if (sum > t) return { tone: 'error', text: `The amounts per entry add up to ${fmtNum(sum)} ${m.unit}, more than the ${fmtNum(t)} ${m.unit} in ${m.totalLabel}. Lower an amount or raise the total.` };
  const unknown = rows.length - entered.length;

  const retry = ident.status === 'failed' ? btn({ label: 'Try again', act: 'identify.retry', arg: p.id, emphasis: 'tertiary', size: 'compact', ariaLabel: `Try identifying photo ${n} again (1 credit)` }) : '';
  return lightCard(`<div class="light-card__row"><span class="light-card__icon"${manual ? ' data-tone="neutral"' : ''}>${icon(manual ? 'user' : 'leaf')}</span><div class="light-card__names"><div class="light-card__common">${esc(row.name)}</div><div class="light-card__sci">${esc(row.sci || (manual ? 'Scientific name not set' : ''))}</div><div class="light-card__caption">${source}</div></div></div>${added}${healthLine(ident, row, n)}<div class="light-card__foot">${details}${change}${retry}</div>`, null, `Identification for photo ${n}: ${row.name}`);
}
function healthLine(ident, row, n) {
  const a = action(); if (!a.health) return '';
  const h = ident.health;
  if (!row) return `<div class="light-card__status">${icon('heartPulse')} Health: add a plant entry first</div>`;
  if (!h || ['invalidated', 'stale'].includes(h.status)) return `<div class="light-card__status">${icon('heartPulse')} Health not checked ${btn({ label: 'Check health', act: 'health.check', arg: ident.photoId, emphasis: 'tertiary', size: 'compact', ariaLabel: `Check the health of photo ${n} (1 credit)` })}</div>`;
  if (h.status === 'checking') return `<div class="light-card__status">${icon('loader', 'spin')} Checking health…</div>`;
  if (h.status === 'queued') return `<div class="light-card__status" data-tone="warning">${icon('wifiOff')} Health check queued (offline) ${btn({ label: 'Cancel', act: 'health.cancelQueued', arg: ident.id, emphasis: 'tertiary', size: 'compact', ariaLabel: `Cancel the queued health check for photo ${n}` })}</div>`;
  if (h.status === 'credit-limit') return `<div class="light-card__status" data-tone="warning">${icon('alert')} No credits left for a health check</div>`;
  if (h.status === 'failed') return `<div class="light-card__status" data-tone="warning">${icon('alert')} Health check didn’t go through ${btn({ label: 'Try again', act: 'health.check', arg: ident.photoId, emphasis: 'tertiary', size: 'compact' })}</div>`;
  const top = h.predictions[0]; const healthy = h.healthyScore >= 0.6;
  const txt = healthy ? 'Looks healthy · suggestion' : `Possible issue: ${top ? top.name : 'unknown'} · suggestion`;
  return `<div class="light-card__status" data-tone="${healthy ? 'success' : 'warning'}">${icon(healthy ? 'check' : 'alert')} ${esc(txt)} ${h.included ? '<span>· note added to Details</span>' : btn({ label: 'Include', act: 'health.include', arg: ident.id, emphasis: 'tertiary', size: 'compact', ariaLabel: `Include the health suggestion for photo ${n} as a note in Details` })}</div>`;
}

/* ---------- Details ---------- */
function fieldFor(inp, d) {
  const id = `f-${inp.key}`; const v = d.fields[inp.key];
  const label = `<label class="field-label" for="${id}">${esc(inp.title)}${inp.unit && !inp.title.includes('(') ? ` (${inp.unit})` : ''}${inp.required ? '<span class="req" aria-hidden="true">*</span>' : ''}</label>`;
  if (inp.type === 'number') return `<div class="field">${label}<input class="control" type="number" inputmode="${inp.decimal ? 'decimal' : 'numeric'}" min="0" ${inp.decimal ? 'step="0.1"' : 'step="1"'} id="${id}" data-bind="field" data-key="${inp.key}" value="${esc(v)}" placeholder="${esc(inp.placeholder || '')}" ${inp.required ? 'required' : ''} aria-describedby="${id}-hint"><p class="hint" id="${id}-hint">${esc(inp.hint || '')}</p></div>`;
  if (inp.type === 'band' || inp.type === 'select') return `<div class="field">${label}<select class="control control-select" id="${id}" data-bind="field" data-key="${inp.key}" ${inp.required ? 'required' : ''}><option value="">${esc(inp.placeholder || 'Select')}</option>${inp.options.map((o) => `<option value="${esc(o)}" ${v === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select><p class="hint"></p></div>`;
  if (inp.type === 'multi') return `<fieldset class="field"><legend class="field-label">${esc(inp.title)}${inp.required ? '<span class="req" aria-hidden="true">*</span>' : ''}</legend><div class="chips">${inp.options.map((o) => `<button type="button" class="chip" aria-pressed="${v.includes(o)}" data-act="field.toggle" data-arg="${arg({ key: inp.key, option: o })}">${esc(o)}</button>`).join('')}</div><p class="hint">${esc(inp.hint || '')}</p></fieldset>`;
  return '';
}
function originText(row) {
  const idents = identsSupporting(row);
  const photoNums = idents.map((i) => photoIndexOf(i.photoId) + 1).filter((n) => n > 0);
  const photos = photoNums.length ? `photo${photoNums.length > 1 ? 's' : ''} ${photoNums.join(' and ')}` : '';
  if (row.nameOrigin === 'plan-copy') return `Copied from Existing plants`;
  if (row.nameOrigin === 'manual') {
    const orig = idents.map((i) => taxonById(i.originalTaxonId)).find(Boolean) || (row.correctedFromTaxonId ? taxonById(row.correctedFromTaxonId) : null);
    return `Your entry${photos ? ` · ${photos}` : ''}${orig ? ` · Kindwise suggested ${orig.common}` : ''}`;
  }
  const changed = idents.find((i) => i.originalTaxonId && i.selectedTaxonId && i.originalTaxonId !== i.selectedTaxonId);
  return `Suggested by Kindwise from ${photos || 'a removed photo'}${changed ? ` · you changed it from ${taxonById(changed.originalTaxonId).common}` : ''}${row.previousManualName ? ` · you first wrote ${row.previousManualName}` : ''}`;
}
function plantRow(row, sec, d) {
  const idents = identsSupporting(row);
  const a = action();
  const healthIdent = a.health ? idents.find((i) => i.health && i.health.status === 'suggested') : null;
  const stale = row.stale ? `<div class="notice" data-tone="warning">${icon('alert')}<div class="grow"><strong>Photo changed.</strong> This entry came from the earlier photo. Keep it as your own entry, remove it, or identify the new photo.<div class="row">${btn({ label: 'Keep as mine', act: 'stale.keep', arg: row.id, emphasis: 'secondary', size: 'compact' })}${btn({ label: 'Remove entry', act: 'stale.remove', arg: row.id, emphasis: 'secondary', size: 'compact', tone: 'danger' })}${btn({ label: 'Identify again', act: 'stale.reidentify', arg: row.id, emphasis: 'secondary', size: 'compact' })}</div></div></div>` : '';
  const measure = sec.measure ? `<div class="field"><label class="field-label" for="q-${row.id}">${esc(sec.measure.label)} <span style="font-weight:400;color:rgb(var(--text-sub-600))">(optional, ${esc(sec.measure.unit)})</span></label><div class="measure-row"><input class="control" type="number" inputmode="${sec.measure.integer ? 'numeric' : 'decimal'}" min="0" step="${sec.measure.integer ? '1' : '0.1'}" id="q-${row.id}" data-bind="row.quantity" data-row="${row.id}" value="${esc(row.quantity)}" placeholder="Leave empty if unknown" aria-describedby="q-${row.id}-hint"><span class="unit" aria-hidden="true">${esc(sec.measure.unit)}</span></div><p class="hint" id="q-${row.id}-hint">Empty means unknown, not zero.</p></div>` : '';
  const health = row.health ? `<div class="health-block"><div class="ttl">${icon('heartPulse')} Health note <span class="pill" data-tone="warning">suggestion</span></div><label class="visually-hidden" for="h-${row.id}">Health note for ${esc(row.name)}</label><textarea class="control" id="h-${row.id}" data-bind="row.health" data-row="${row.id}" rows="2">${esc(row.health.text)}</textarea><p class="fine">${row.health.origin === 'gardener' ? 'Your observation.' : `Suggested by Kindwise from ${photoLabel(S.idents[row.health.identId] ? S.idents[row.health.identId].photoId : '')}${row.health.origin === 'edited' ? ', edited by you' : ''}.`} A suggestion, not a diagnosis. It does not say any treatment was done.</p>${btn({ label: 'Remove note', act: 'health.remove', arg: row.id, emphasis: 'tertiary', size: 'compact', cls: 'self-start', ariaLabel: `Remove the health note from ${row.name}` })}</div>` : healthIdent && !healthIdent.health.included ? `<div class="health-block"><div class="ttl">${icon('heartPulse')} Health suggestion</div><p class="fine">Kindwise ${healthIdent.health.healthyScore >= 0.6 ? 'thinks this plant looks healthy' : `suggests a possible issue: ${esc(healthIdent.health.predictions[0].name)}`} in ${photoLabel(healthIdent.photoId)}. Include it as a note if it matches what you saw.</p><div>${btn({ label: 'Include as a note', act: 'health.include', arg: healthIdent.id, emphasis: 'secondary', size: 'compact' })}</div></div>` : '';
  const plan = sec.allowPlanCopy ? (d.plants.some((r) => r.section === 'planned' && r.fromObserved === row.id) ? `<span class="pill" data-tone="success">${icon('check')} In planting plan</span>` : btn({ label: 'Add to planting plan', act: 'row.plan', arg: row.id, emphasis: 'secondary', size: 'compact', icon: 'plus', ariaLabel: `Add ${row.name} to the planting plan` })) : '';

    <p class="meta" id="n-${row.id}-meta">${icon(row.nameOrigin === 'manual' ? 'user' : 'leaf')}${row.sci ? `<em>${esc(row.sci)}</em> ·` : ''} ${originText(row)}</p>
    ${idents.length ? `<div class="supports">Photos: ${idents.map((i) => { const p = photoById(i.photoId); return p ? thumb(p, ` role="img" aria-label="photo ${photoIndexOf(p.id) + 1}"`) : ''; }).join('')}</div>` : ''}
    ${stale}${measure}
    <div class="field"><label class="field-label" for="o-${row.id}">Notes <span style="font-weight:400;color:rgb(var(--text-sub-600))">(optional)</span></label><textarea class="control" id="o-${row.id}" data-bind="row.notes" data-row="${row.id}" rows="2" placeholder="Anything you noticed about this plant">${esc(row.notes)}</textarea></div>

function plantSection(sec, d) {

    ${rows.length ? `<ul class="plant-rows">${rows.map((r) => plantRow(r, sec, d)).join('')}</ul>` : `<p class="section-hint">Nothing here yet. ${sec.manualOnly ? 'Use Add to planting plan on an existing plant, or add one by hand.' : 'Identify a plant in a photo, or add one by hand.'}</p>`}
    ${al ? `<div class="alloc" data-tone="${al.tone === 'ok' ? 'ok' : al.tone}" role="status">${icon(al.tone === 'error' ? 'alert' : 'scale')}<span>${esc(al.text)}</span></div>` : ''}
    <div>${btn({ label: sec.manualOnly ? 'Add planned plant' : 'Add plant by hand', act: 'row.add', arg: sec.key, emphasis: 'secondary', size: 'sm', icon: 'plus' })}</div>
  </fieldset>`;
}
function renderDetails() {
  const d = draft(), a = action();
  return `${formInfo(a.details.title, a.details.description, 'file')}${noticeList(d)}
    <div class="field"><label class="field-label" for="f-time">Time Spent (hours)</label><input class="control" type="number" inputmode="decimal" step="0.5" min="0" id="f-time" data-bind="field" data-key="timeSpentHours" value="${esc(d.fields.timeSpentHours)}" placeholder="e.g., 1.5 for 1h 30m" aria-describedby="f-time-hint"><p class="hint" id="f-time-hint">Enter hours spent on this work (decimals OK)</p></div>
    ${a.inputs.map((inp) => fieldFor(inp, d)).join('')}
    ${a.sections.map((sec) => plantSection(sec, d)).join('')}
    <div class="switch-row"><div style="display:flex;gap:8px;min-width:0">${icon('mapPin')}<div><span id="loc-label" class="field-label">Share Location</span><p class="hint" style="min-block-size:auto" aria-live="polite">${d.fields.shareLocation ? 'Location captured (about 100 m). It will be published with this work.' : 'Share approximate location (about 100 m). It will be published with this work.'}</p></div></div><button type="button" class="switch" role="switch" aria-checked="${d.fields.shareLocation}" aria-labelledby="loc-label" data-act="loc.toggle"></button></div>
    <div class="field"><label class="field-label" for="f-feedback">Feedback</label><textarea class="control" id="f-feedback" rows="4" data-bind="field" data-key="feedback" placeholder="${esc(a.details.feedbackPlaceholder)}">${esc(d.fields.feedback)}</textarea></div>`;
}

/* ---------- Review ---------- */
function formCard(label, value, ic) { return `<div class="form-card"><div class="form-card__head">${icon(ic || 'file')}<span>${esc(label)}</span></div><div class="form-card__body">${esc(value)}</div></div>`; }
function gardenCard() { return `<div class="garden-card"><span class="avatar" aria-hidden="true"></span><div><strong>${esc(GARDEN.name)}</strong><span>${esc(GARDEN.place)}</span></div></div>`; }
function plantCaption(photoId, plants) {
  const names = plants.filter((r) => r.supports.some((id) => S.idents[id] && S.idents[id].photoId === photoId)).map((r) => r.name);
  return names.length ? names.join(', ') : 'No plant entry';
}
function reviewPlant(row, photos, plants, sectionTitle, unit) {
  const idents = row.supports.map((id) => S.idents[id]).filter(Boolean);
  const thumbs = idents.map((i) => { const p = photos.find((x) => x.id === i.photoId); return p ? thumb(p, ` role="img" aria-label="photo ${photos.indexOf(p) + 1}"`) : ''; }).join('');
  const qty = row.quantity !== '' ? `${fmtNum(Number(row.quantity))} ${unit || ''}` : (unit ? 'amount not entered (unknown)' : '');
  return `<div class="review-plant">${thumbs ? `<div class="thumbs">${thumbs}</div>` : ''}<div class="body"><strong>${esc(row.name)}${row.sci ? ` <em style="font-weight:400">· ${esc(row.sci)}</em>` : ''}</strong>${esc(sectionTitle)}${qty ? ` · ${esc(qty)}` : ''}<br>${esc(originText(row))}${row.notes ? `<br>“${esc(row.notes)}”` : ''}${row.health ? `<br><span class="pill" data-tone="warning">Health note</span> ${esc(row.health.text)} <span style="color:rgb(var(--text-soft-400))">(${row.health.origin === 'gardener' ? 'your observation' : 'Kindwise suggestion, included by you'}; no treatment recorded)</span>` : ''}</div></div>`;
}
function renderReview() {

    ${blockers.map((b) => `<div class="notice" data-tone="error" role="alert">${icon('alert')}<div class="grow">${esc(b)} ${btn({ label: 'Edit details', act: 'nav.go', arg: 'details', emphasis: 'tertiary', size: 'compact' })}</div></div>`).join('')}
    ${pending.length ? `<div class="notice" data-tone="info">${icon('info')}<div class="grow">${pending.map((i) => `${photoLabel(i.photoId)}`).join(' and ')} ${pending.length > 1 ? 'are' : 'is'} still being identified. Submitting now is fine: the result arrives separately and will not change what you submit.</div></div>` : ''}
    <h3 class="section-title">Garden</h3>${gardenCard()}
    ${d.photos.length ? `<h3 class="section-title">Media</h3><div class="media-strip" role="region" aria-label="Photos, scrolls sideways" tabindex="0">${d.photos.map((p, i) => `<figure><div class="art">${artSvg(PHOTOS[p.fixture].art, p.seed)}<span class="stand-in" aria-hidden="true">Stand-in</span></div><figcaption>Photo ${i + 1} · ${esc(plantCaption(p.id, d.plants))}</figcaption></figure>`).join('')}</div>` : ''}
    <h3 class="section-title">Details</h3>${formCard('Action', a.title, 'external')}${details.map(([l, v, i]) => formCard(l, v, i)).join('')}
    ${a.sections.length ? `<h3 class="section-title">Plants</h3>${d.plants.length ? a.sections.map((sec) => d.plants.filter((r) => r.section === sec.key).map((r) => reviewPlant(r, d.photos, d.plants, sec.title, sec.measure ? sec.measure.unit : '')).join('')).join('') : '<p class="section-hint">No plant entries. That is fine; plant entries are optional.</p>'}${a.sections.map((sec) => { const al = allocation(d, sec); return al && al.tone !== 'error' ? `<div class="alloc" data-tone="${al.tone}">${icon('scale')}<span>${esc(al.text)}</span></div>` : ''; }).join('')}` : ''}
    ${d.fields.feedback ? formCard('Description', d.fields.feedback, 'pencil') : ''}
    <div class="notice" data-tone="info">${icon('lock')}<div class="grow"><strong>Published with your work:</strong> the photos, plant names, amounts and notes above. Kindwise suggestions stay labelled as suggestions. Nothing is sent to Kindwise by submitting.</div></div>
    <div style="display:flex;gap:8px">${btn({ label: 'Edit photos', act: 'nav.go', arg: 'media', emphasis: 'tertiary', size: 'sm', icon: 'image' })}${btn({ label: 'Edit details', act: 'nav.go', arg: 'details', emphasis: 'tertiary', size: 'sm', icon: 'pencil' })}</div>`;
}

/* ---------- Saved work ---------- */
function workCtx(work) { return { actionId: work.actionId, fields: work.fields, plants: work.plants, photos: work.photos, identSnapshot: work.identSnapshot }; }
function statusPill(status) { const tone = status === 'approved' ? 'success' : status === 'rejected' ? 'error' : 'warning'; const label = status === 'approved' ? 'Approved' : status === 'rejected' ? 'Rejected' : 'Pending review'; return `<span class="pill" data-tone="${tone}">${icon(status === 'approved' ? 'check' : status === 'rejected' ? 'close' : 'clock')} ${label} (simulated)</span>`; }
function laterResultCard(work, lr) {
  const ident = S.idents[lr.identId]; const t = taxonById(lr.taxonId); const n = work.photos.findIndex((p) => p.id === lr.photoId) + 1;
  let what = '';
  if (lr.part === 'health') { const h = ident && ident.health; const top = h && h.predictions[0]; what = h && h.healthyScore >= 0.6 ? `Health check for photo ${n}: looks healthy (suggestion).` : `Health check for photo ${n}: possible ${top ? top.name.toLowerCase() : 'issue'} (suggestion).`; }

}
function renderSaved() {
