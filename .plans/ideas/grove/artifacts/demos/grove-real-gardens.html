 function restore(s){const j=s?.modelContent?.realGardenJourney;if(j?.version!==1||!valid(j.current))return;current={...j.current};trail=Array.isArray(j.trail)?j.trail.filter(v=>valid(v.state)).slice(-15):[];}

 function back(){const prev=trail.pop();current=prev?.state||{...current,screen:'overview'};render(true,prev?.focus);save();}
 function home(){current={...current,screen:'overview',record:null,source:null};trail=[];render(true,'area-'+g().lead);save();}
 const button=(key,txt,cls='')=>`<button type="button" class="cursor-interaction ${cls}" data-key="${key}">${txt}</button>`;

 function areaEntries(){return Object.entries(g().areas).filter(([,a])=>current.lens==='next'||!a.future);}

 function sourceView(){const s=source[current.source],c=g().connection;const r=current.record&&g().records[current.record];return heading(s.title,'The source behind this part of the garden graph.')+`<div class="gv-story">${miniMap({name:s.title,status:s.type.split(' · ')[0]},r||g().records[c.to],r?(r.future?'informs proposal ↓':'documents ↓'):c.predicate,'Context stays connected while you read.',!r||!!r.future)}<article class="gv-detail" aria-label="Source detail"><div class="gv-eyebrow"><span class="gv-badge">${s.type}</span></div><h2>${s.title}</h2><p class="gv-source-meta">${s.date}</p><div class="gv-source-body">${s.quote?`<blockquote>“<mark>${s.quote}</mark>”</blockquote>`:''}<p>${s.text}</p></div><p class="gv-context">${s.limit}</p><div class="gv-source-list">${s.url ? `<a href="${s.url}" target="_blank" rel="noopener noreferrer">Open original source ↗</a>` : '<p>Synthetic fixture · no original source</p>'}</div>${button('back','← Back to '+(trail.length?label(trail[trail.length-1].state):'garden'),'gv-primary')}</article></div>`;}
 function render(animate=false,focusKey=null){picker.value=current.garden;nav.innerHTML=`${current.screen==='overview'?'':button('back','← Back','gv-back')}<div class="gv-breadcrumb">${current.screen==='overview'?'<strong aria-current="page">Garden overview</strong>':button('home','Garden overview')+' <span>/</span> '+(current.screen==='area'?`<strong aria-current="page">${g().areas[current.area].name}</strong>`:button('area-crumb',g().areas[current.area].name)+' <span>/</span> <strong aria-current="page">'+label(current)+'</strong>')}</div>`;main.innerHTML=({overview,area,record,connection,source:sourceView}[current.screen])();main.classList.toggle('gv-enter',animate);draw();if(animate){announce.textContent=g().name+' · '+label(current);if(focusKey)[...root.querySelectorAll('[data-key]')].find(e=>e.dataset.key===focusKey)?.focus();}}
 function curve(a,b,mode){const k=design.curvature;return mode==='arch'?[a,[a[0]+(b[0]-a[0])*.2,a[1]-60*k],[b[0]-(b[0]-a[0])*.2,b[1]-60*k],b]:[a,[a[0]+(b[0]-a[0])*.15+25*k,a[1]+(b[1]-a[1])*.68],[a[0]+(b[0]-a[0])*.8-20*k,a[1]+(b[1]-a[1])*.2],b];}
 function path(p){return `M${p[0]} C${p[1]} ${p[2]} ${p[3]}`;}
 function filament(p){const left=[],right=[];for(let i=0;i<=24;i++){const t=i/24,u=1-t,x=u*u*u*p[0][0]+3*u*u*t*p[1][0]+3*u*t*t*p[2][0]+t*t*t*p[3][0],y=u*u*u*p[0][1]+3*u*u*t*p[1][1]+3*u*t*t*p[2][1]+t*t*t*p[3][1],dx=3*u*u*(p[1][0]-p[0][0])+6*u*t*(p[2][0]-p[1][0])+3*t*t*(p[3][0]-p[2][0]),dy=3*u*u*(p[1][1]-p[0][1])+6*u*t*(p[2][1]-p[1][1])+3*t*t*(p[3][1]-p[2][1]),len=Math.hypot(dx,dy)||1,w=3*(1-t)+.3;left.push([x-dy/len*w,y+dx/len*w]);right.push([x+dy/len*w,y-dx/len*w]);}return 'M'+left.map(v=>v.join(',')).join(' L')+' L'+right.reverse().map(v=>v.join(',')).join(' L')+' Z';}
 function draw(){const map=main.querySelector('[data-map]');if(!map)return;const w=map.clientWidth,h=map.clientHeight,narrow=w<480,type=map.dataset.map;let pos={},edges=[];
  if(type==='story'){pos={from:[.44,.22],to:[.56,.76]};edges=[['from','to',map.dataset.suggested==='true'?'new':'']];}
  else {const entries=type==='overview'?areaEntries():itemIDs().map(id=>[id,g().records[id]]);const slots=narrow?[[.37,.12],[.66,.31],[.34,.71],[.66,.88]]:[[.24,.24],[.77,.25],[.23,.77],[.79,.76]];pos.center=[.5,.5];entries.forEach(([id,r],i)=>{pos[id]=slots[i];edges.push(['center',id,r.future?'plan':'']);});const c=g().connection;if(type==='area'&&g().areas[current.area].connection&&current.lens==='next'){edges.push([c.from,c.to,'new','arch']);const b=map.querySelector('.gv-connection');b.style.left=w*.5+'px';b.style.top=h*(narrow?.60:.89)+'px';}}
  const points={};for(const[id,[x,y]]of Object.entries(pos)){const n=map.querySelector(`[data-node="${id}"]`);const px=Math.max(n.offsetWidth/2+8,Math.min(w-n.offsetWidth/2-8,x*w));points[id]=[px,y*h];n.style.left=px+'px';n.style.top=y*h+'px';}
  const svgEl=map.querySelector('svg');svgEl.setAttribute('viewBox',`0 0 ${w} ${h}`);svgEl.innerHTML=edges.filter(([a,b])=>points[a]&&points[b]).map(([a,b,s,mode])=>{const p=curve(points[a],points[b],mode);return `${s?'':`<path class="gv-filament" d="${filament(p)}"/>`}<path class="gv-thread ${s||''}" d="${path(p)}"/>`;}).join('');
