<div id="grove-architecture">
  <style>
    #grove-architecture { display:grid; gap:calc(var(--font-size-base) * .8); color:var(--foreground); }
    #grove-architecture .ga-heading { display:grid; gap:calc(var(--font-size-base) * .25); padding-inline-end:100px; }
    #grove-architecture .ga-options { display:grid; gap:calc(var(--font-size-base) * .65); margin-top:calc(var(--font-size-base) * .65); }
    #grove-architecture .ga-toggles { display:flex; flex-wrap:wrap; gap:calc(var(--font-size-base) * .8); }
    #grove-architecture .ga-scene { display:block; width:100%; overflow:visible; }
    #grove-architecture .ga-scene text { fill:var(--foreground); }
    #grove-architecture .ga-scene .ga-secondary { fill:var(--muted-foreground); }
    #grove-architecture .ga-scene .ga-strong { font-weight:500; }
    #grove-architecture .ga-scene .ga-rule { stroke:var(--border); stroke-width:1; fill:none; }
    #grove-architecture .ga-scene .ga-edge { stroke:color-mix(in srgb,var(--foreground) 50%,var(--background)); stroke-width:1; fill:none; vector-effect:non-scaling-stroke; }
    #grove-architecture .ga-scene .ga-face { fill:var(--background); stroke:color-mix(in srgb,var(--foreground) 45%,var(--background)); stroke-width:1; vector-effect:non-scaling-stroke; }
    #grove-architecture .ga-scene .ga-side { fill:color-mix(in srgb,var(--foreground) 6%,var(--background)); stroke:color-mix(in srgb,var(--foreground) 45%,var(--background)); stroke-width:1; vector-effect:non-scaling-stroke; }
    #grove-architecture .ga-scene .ga-mark { fill:color-mix(in srgb,var(--viz-series-1) 12%,var(--background)); }
    #grove-architecture .ga-scene .ga-ink { fill:none; stroke:color-mix(in srgb,var(--foreground) 25%,var(--background)); stroke-width:1; vector-effect:non-scaling-stroke; }
    #grove-architecture .ga-scene .ga-flow { fill:none; stroke:var(--viz-series-1); stroke-width:1.6; vector-effect:non-scaling-stroke; }
    #grove-architecture .ga-scene .ga-wait { fill:none; stroke:var(--border); stroke-width:1.2; stroke-dasharray:4 5; vector-effect:non-scaling-stroke; }
    #grove-architecture .ga-result { overflow-wrap:anywhere; }
    @media (max-width:420px) { #grove-architecture .ga-heading { padding-inline-end:90px; } }
  </style>
  <div class="ga-heading">
    <h2>Grove, from local to shared</h2>
    <div class="text-small text-muted">Proposed architecture · synthetic example · no live sharing</div>
    <div class="text-small">Preferred optional adapters: Solid storage · Yjs co-editing</div>
  </div>
  <div class="viz-controls">
    <label class="form-label">Sharing context
      <select class="form-select" id="ga-audience">
        <option value="local">Local only</option>
        <option value="community" selected>Community review</option>
        <option value="partner">Named partner summary</option>
        <option value="public">Public release</option>
      </select>
    </label>
    <label class="form-label">Collaboration approach
      <select class="form-select" id="ga-engine">
        <option value="records" selected>Encrypted records first</option>
        <option value="yjs">Yjs · preferred optional co-editing</option>
        <option value="keyhive">Automerge + Keyhive · research only</option>
      </select>
    </label>
  </div>
  <details>
    <summary>Optional connections</summary>
    <div class="ga-options">
      <div class="viz-controls">
        <label class="form-label">Hosted storage
          <select class="form-select" id="ga-storage">
            <option value="none">No hosted storage</option>
            <option value="solid" selected>Solid Pod · preferred optional</option>
            <option value="edv">EDV · research alternative</option>
          </select>
        </label>
      </div>
      <div class="ga-toggles">
        <label class="form-check"><input class="form-check-input" id="ga-passkey" type="checkbox" checked><span class="form-check-label">Existing passkey, if supported</span></label>
        <label class="form-check"><input class="form-check-input" id="ga-atproto" type="checkbox" checked><span class="form-check-label">ATProto / Certified</span></label>
        <label class="form-check"><input class="form-check-input" id="ga-ethereum" type="checkbox" checked><span class="form-check-label">Ethereum garden</span></label>
      </div>
    </div>
  </details>
  <label class="form-check"><input class="form-check-input" id="ga-approved" type="checkbox"><span class="form-check-label">Revision + audience approved (example)</span></label>
  <svg class="ga-scene" role="img" aria-labelledby="ga-title ga-desc">
    <title id="ga-title">Capture, review and share across Grove's privacy boundaries</title>
    <desc id="ga-desc">Local identity and device keys protect capture and review. Only an approved selection crosses into an encrypted community context. Hosted storage is optional and receives ciphertext. A separately approved public projection may connect to ATProto or Ethereum.</desc>
  </svg>
  <div class="ga-result" id="ga-result" aria-live="polite"></div>
  <div class="text-small text-muted">Continuous: active example flow · dotted: optional or awaiting approval · ID: private account association</div>
  <script>
    (() => {
      const root=document.getElementById('grove-architecture');
      const scene=root.querySelector('.ga-scene');
      const result=root.querySelector('#ga-result');
      const fields={audience:root.querySelector('#ga-audience'),engine:root.querySelector('#ga-engine'),storage:root.querySelector('#ga-storage'),passkey:root.querySelector('#ga-passkey'),atproto:root.querySelector('#ga-atproto'),ethereum:root.querySelector('#ga-ethereum'),approved:root.querySelector('#ga-approved')};
      const enums={audience:['local','community','partner','public'],engine:['records','yjs','keyhive'],storage:['none','solid','edv']};
      let state={audience:'community',engine:'records',storage:'solid',passkey:true,atproto:true,ethereum:true,approved:false};
      const ns='http://www.w3.org/2000/svg';
      const measure=document.createElement('canvas').getContext('2d');
      let normal=14,small=12,width=736,narrow=false,step=22,smallStep=19;
      const probe=document.createElement('span');probe.className='text-small';probe.style.visibility='hidden';probe.style.position='absolute';probe.textContent='M';root.append(probe);
      function svg(tag,attrs={},text){const n=document.createElementNS(ns,tag);for(const[k,v]of Object.entries(attrs))n.setAttribute(k,String(v));if(text!==undefined)n.textContent=text;return n;}
      function hydrate(value){
        const v=value?.modelContent?.groveArchitecture;
        if(!v||![1,2].includes(v.version))return;
        for(const[k,values]of Object.entries(enums))if(values.includes(v[k]))state[k]=v[k];
        for(const k of ['passkey','atproto','ethereum','approved'])if(typeof v[k]==='boolean')state[k]=v[k];
        if(v.version===1||state.audience==='local')state.approved=false;
      }
      function controls(){
        for(const[k,e]of Object.entries(fields)){if(e.type==='checkbox')e.checked=state[k];else e.value=state[k];}
        fields.approved.disabled=state.audience==='local';
      }
      function wrap(text,max,secondary=false){
        const style=getComputedStyle(secondary?probe:root);measure.font=`${secondary?small:normal}px ${style.fontFamily}`;
        const lines=[];let line='';
        for(const word of text.split(/\s+/)){
          if(measure.measureText(word).width>max){
            if(line){lines.push(line);line='';}
            let part='';for(const c of word){if(part&&measure.measureText(part+c).width>max){lines.push(part);part=c;}else part+=c;}line=part;
          }else if(line&&measure.measureText(line+' '+word).width>max){lines.push(line);line=word;}else line+=(line?' ':'')+word;
        }
        if(line)lines.push(line);return lines;
      }
      function textBlock(g,text,x,y,max,secondary=false,center=false,strong=false){
        const lines=wrap(text,max,secondary);const s=secondary?smallStep:step;
        lines.forEach((line,i)=>g.append(svg('text',{x,y:y+i*s,'text-anchor':center?'middle':'start',class:[secondary?'ga-secondary text-small':'',strong?'ga-strong':''].join(' ')},line)));
        return lines.length*s;
      }
      function path(g,d,cls='ga-edge',arrow=false){g.append(svg('path',{d,class:cls,...(arrow?{'marker-end':`url(#ga-arrow-${cls==='ga-flow'?'active':'idle'})`}:{})}));}
      function object(g,kind,cx,y,active){
        const shapes=svg('g',{'aria-hidden':'true','data-object':kind});
        const mark=active?'ga-mark':'ga-side';
        const rect=(x,yy,w,h,cls='ga-face',rx=0)=>shapes.append(svg('rect',{x,y:yy,width:w,height:h,rx,class:cls}));
        if(kind==='phone'){
          rect(cx-23,y,46,70,'ga-side',6);rect(cx-19,y+7,38,55,'ga-face',2);rect(cx-14,y+15,28,13,mark,1);
          path(shapes,`M ${cx-12} ${y+37} h 24 M ${cx-12} ${y+43} h 20 M ${cx-12} ${y+49} h 24 M ${cx-5} ${y+66} h 10`,'ga-ink');
        }else if(kind==='laptop'){
          rect(cx-42,y+8,84,51,'ga-side',3);rect(cx-37,y+13,74,39,'ga-face',1);rect(cx-30,y+20,27,23,mark,1);
          path(shapes,`M ${cx+5} ${y+23} h 24 M ${cx+5} ${y+30} h 20 M ${cx+5} ${y+37} h 24`,'ga-ink');
          shapes.append(svg('path',{d:`M ${cx-42} ${y+59} l -8 8 h 100 l -8 -8 Z`,class:'ga-side'}));
        }else if(kind==='vault'){
          rect(cx-42,y+12,84,47,'ga-face',1);shapes.append(svg('ellipse',{cx,cy:y+12,rx:42,ry:10,class:'ga-face'}));
          path(shapes,`M ${cx-42} ${y+35} a 42 10 0 0 0 84 0 M ${cx-42} ${y+57} a 42 10 0 0 0 84 0`,'ga-ink');
          rect(cx-25,y+26,50,8,mark);rect(cx-25,y+43,50,8,mark);
        }else if(kind==='credential'){
          rect(cx-45,y+12,90,48,'ga-side',3);rect(cx-40,y+7,90,48,'ga-face',3);rect(cx-31,y+17,22,24,mark,2);
          path(shapes,`M ${cx+1} ${y+20} h 36 M ${cx+1} ${y+29} h 28 M ${cx+1} ${y+38} h 36`,'ga-ink');
        }else if(kind==='server'){
          rect(cx-37,y+2,74,63,'ga-side',2);
          [8,27,46].forEach(yy=>{rect(cx-31,y+yy,62,14,'ga-face',1);rect(cx-25,y+yy+4,28,6,mark);path(shapes,`M ${cx+19} ${y+yy+7} h 5`,'ga-ink');});
        }else if(kind==='bundle'){
          rect(cx-35,y+3,66,53,'ga-side',1);rect(cx-28,y+10,66,53,'ga-face',1);rect(cx-21,y+20,52,31,mark,1);
          path(shapes,`M ${cx-13} ${y+30} h 36 M ${cx-13} ${y+38} h 36 M ${cx-13} ${y+46} h 22`,'ga-ink');
        }else{
          shapes.append(svg('path',{d:`M ${cx-29} ${y} h 43 l 15 15 v 53 h -58 Z`,class:'ga-face'}));
          path(shapes,`M ${cx+14} ${y} v 15 h 15`,'ga-edge');rect(cx-20,y+22,40,11,mark);
          path(shapes,`M ${cx-19} ${y+41} h 38 M ${cx-19} ${y+49} h 32 M ${cx-19} ${y+57} h 38`,'ga-ink');
        }
        g.append(shapes);return {cx,top:y,bottom:y+70,left:cx-50,right:cx+50,mid:y+35};
      }
      function row(g,items,y,cols){
        const gap=36,pad=24,cell=(width-pad*2-gap*(cols-1))/cols;const nodes={};let bottom=y;
        const positions=narrow?items:items;
        positions.forEach((item,i)=>{
          const top=narrow?bottom:y;const cx=narrow?65:pad+cell*i+gap*i+cell/2;
          const shape=object(g,item.kind,cx,top,item.active);
          const x=narrow?131:cx,max=narrow?width-155:cell;
          let ty=narrow?top+normal:top+92;
          ty+=textBlock(g,item.title,x,ty,max,false,!narrow,true);
          for(const line of item.lines)ty+=textBlock(g,line,x,ty+2,max,true,!narrow,false)+2;
          nodes[item.id]={...shape,captionBottom:ty,id:item.id};
          bottom=narrow?Math.max(top+83,ty+14):Math.max(bottom,ty+8);
        });
        return {nodes,bottom};
      }
      function heading(g,label,y){
        const h=textBlock(g,label,16,y+normal,width-32,false,false,true);
        return y+h+23;
      }
      function neighbor(g,a,b,active=true,reverse=false){
        if(!narrow){const from=reverse?b:a,to=reverse?a:b;path(g,`M ${from.cx+(from.cx<to.cx?61:-61)} ${from.mid} H ${to.cx+(from.cx<to.cx?-61:61)}`,active?'ga-flow':'ga-wait',true);}
        else {const from=reverse?b:a,to=reverse?a:b;const down=from.top<to.top;path(g,`M ${from.cx} ${down?from.bottom+6:from.top-6} V ${down?to.top-9:to.bottom+9}`,active?'ga-flow':'ga-wait',true);}
      }
      function outer(g,a,b,active=true){
        if(narrow){path(g,`M ${a.left-5} ${a.mid} H 6 V ${b.mid} H ${b.left-5}`,active?'ga-flow':'ga-wait',true);return;}
        const lane=width-10;path(g,`M ${a.right+9} ${a.mid} H ${lane} V ${b.mid} H ${b.right+10}`,active?'ga-flow':'ga-wait',true);
      }
      function branch(g,a,b,active=true){
        if(narrow){path(g,`M ${a.left-7} ${a.mid} H 9 V ${b.mid} H ${b.left-8}`,active?'ga-flow':'ga-wait',true);}
        else{const rail=Math.min(a.top,b.top)-13;path(g,`M ${a.cx} ${a.top-7} V ${rail} H ${b.cx} V ${b.top-7}`,active?'ga-flow':'ga-wait',true);}
      }
      function render(){
        const css=getComputedStyle(root);normal=parseFloat(css.fontSize)||14;small=parseFloat(getComputedStyle(probe).fontSize)||12;
        step=Math.max(normal*1.5,20);smallStep=Math.max(small*1.5,18);width=Math.max(280,Math.round(root.getBoundingClientRect().width));narrow=width<600;
        scene.querySelectorAll('g,defs').forEach(e=>e.remove());
        const defs=svg('defs');
        for(const type of ['active','idle']){
          const marker=svg('marker',{id:`ga-arrow-${type}`,refX:8,refY:5,markerWidth:10,markerHeight:10,orient:'auto',markerUnits:'userSpaceOnUse'});
          marker.append(svg('path',{d:'M 1 1 L 8 5 L 1 9',fill:'none',stroke:type==='active'?'var(--viz-series-1)':'var(--border)','stroke-width':1.4}));defs.append(marker);
        }
        scene.append(defs);const links=svg('g',{'aria-hidden':'true'}),g=svg('g',{'aria-hidden':'true'});scene.append(links,g);
        const sharing=state.audience!=='local'&&state.approved;
        const releasing=state.audience==='public'&&sharing;
        let y=heading(g,'LOCAL · your phone + laptop',0);
        const identity=row(g,[
          {id:'unlock',kind:'credential',active:true,title:state.passkey?'Existing passkey · optional':'Local unlock + recovery',lines:state.passkey?['PRF unlock, if supported','Offline reuse/recovery: unproven']:['Protected local recovery path','No service account required']},
          {id:'identity',kind:'vault',active:true,title:'Local identity + encrypted vault',lines:['ID · member + community context','Separate device keys + scoped grants']}
        ],y,2);neighbor(links,identity.nodes.unlock,identity.nodes.identity,true);y=identity.bottom+22;
        const local=row(g,[
          {id:'capture',kind:'phone',active:true,title:'Capture',lines:['Knowledge + impact evidence','Dexie: save before AI / sync']},
          {id:'review',kind:'laptop',active:true,title:'Review',lines:['Human review + source context','Optional Pi Durable / local Gemma']},
          {id:'share',kind:'bundle',active:true,title:'Share',lines:['Revision · audience · purpose',state.audience==='local'?'Kept on your devices':state.approved?'Approved selection':'Audience approval required']}
        ],y,3);neighbor(links,local.nodes.capture,local.nodes.review,true);neighbor(links,local.nodes.review,local.nodes.share,true);y=local.bottom+25;
        if(!narrow){const a=identity.nodes.identity,b=local.nodes.capture;path(links,`M ${a.right+9} ${a.mid} H ${width-10} V ${b.top-13} H ${b.cx} V ${b.top-8}`,'ga-flow',true);}
        else neighbor(links,identity.nodes.identity,local.nodes.capture,true);
        path(g,`M 16 ${y-9} H ${width-18}`,'ga-rule');
        const boundary=state.audience==='partner'?'BETWEEN COMMUNITIES · named recipients':'COMMUNITY · granted devices only';
        y=heading(g,boundary,y);
        const engine=state.engine==='records'?['Encrypted records + receipts','Yjs preferred if co-editing is needed']:state.engine==='yjs'?['Yjs: preferred optional co-editing','Grove encrypts + verifies writers']:['Automerge + Keyhive: research','EXPERIMENTAL · synthetic only'];
        const policy={id:'policy',kind:'document',active:sharing,title:'Community policy',lines:['Scoped roles, keys + recovery','Account links grant no access']};
        const members={id:'members',kind:'laptop',active:sharing,title:state.audience==='partner'?'Partner review':'Member review',lines:[state.audience==='partner'?'Fresh encrypted summary':'Granted devices decrypt',...engine]};
        const storage={id:'storage',kind:'server',active:sharing&&state.storage!=='none',title:state.storage==='solid'?'Optional Solid Pod':state.storage==='edv'?'EDV · research alternative':'No hosted storage required',lines:state.storage==='none'?['File / WebRTC; relay if needed','Async delivery needs a reachable copy']:state.storage==='solid'?['Preferred storage adapter','Operator receives ciphertext only','ID · WebID login is separate']:['Research alternative to Solid','Operator receives ciphertext only','Service access ≠ decryption keys']};
        const community=row(g,narrow?[members,policy,storage]:[storage,policy,members],y,3);
        if(narrow)neighbor(links,community.nodes.members,community.nodes.policy,sharing,true);else neighbor(links,community.nodes.policy,community.nodes.members,sharing);
        branch(links,community.nodes.members,community.nodes.storage,sharing&&state.storage!=='none');
        outer(links,local.nodes.share,community.nodes.members,sharing);
        y=community.bottom+25;path(g,`M 16 ${y-9} H ${width-18}`,'ga-rule');
        y=heading(g,'PUBLIC · publish by choice',y);
        const release={id:'release',kind:'document',active:releasing,title:'New public projection',lines:['New approval before upload','Raw sources + keys stay private']};
        const at={id:'atproto',kind:'server',active:releasing&&state.atproto,title:state.atproto?'Optional ATProto / Certified':'ATProto disconnected',lines:state.atproto?['ID · personal / group AT DID','Chosen publisher + service roles']:['No account required','Private sharing still works']};
        const eth={id:'ethereum',kind:'document',active:releasing&&state.ethereum,title:state.ethereum?'Optional Ethereum':'Ethereum disconnected',lines:state.ethereum?['ID · member account / GardenAccount','Existing garden roles checked']:['No wallet required','Local identity still works']};
        const pub=row(g,narrow?[release,at,eth]:[eth,at,release],y,3);
        outer(links,community.nodes.members,pub.nodes.release,releasing);
        if(narrow)neighbor(links,pub.nodes.release,pub.nodes.atproto,releasing&&state.atproto);else neighbor(links,pub.nodes.atproto,pub.nodes.release,releasing&&state.atproto,true);
        branch(links,pub.nodes.release,pub.nodes.ethereum,releasing&&state.ethereum);
        const height=pub.bottom+5;scene.setAttribute('width',width);scene.setAttribute('height',height);scene.setAttribute('viewBox',`0 0 ${width} ${height}`);
        const core=state.audience==='local'?'Local capture and review; nothing leaves the devices.':!state.approved?'Sharing paused: approve this revision and audience.':state.audience==='partner'?'Named partner gets a fresh encrypted summary; private draft history stays local.':state.audience==='public'?(state.atproto||state.ethereum?'Only the approved public projection reaches selected destinations.':'Public projection approved; no publication destination selected.'):'Selected records reach granted community devices for review.';
        const mode=state.engine==='keyhive'?' Keyhive remains experimental research; recovery and revocation are unproven.':state.engine==='yjs'?' Yjs is preferred for optional co-editing; Grove owns encryption, permissions and recovery.':' Encrypted records first; Yjs is preferred when co-editing is needed.';
        result.textContent=core+mode;
        scene.querySelector('#ga-desc').textContent=`${core}${mode} Solid is the preferred optional storage adapter; EDV is a research alternative. Identity and private keys remain local. Passkey ${state.passkey?'enabled as a proposed optional unlock':'not required'}. Storage: ${state.storage}. ATProto ${state.atproto?'optional connection selected':'disconnected'}. Ethereum ${state.ethereum?'optional connection selected':'disconnected'}. Local community roles, content keys, service logins and public garden roles are independent. Dashed routes are optional or awaiting approval. This is a proposed architecture, not running Grove software.`;
        scene.dataset.audience=state.audience;scene.dataset.engine=state.engine;scene.dataset.sharing=String(sharing);scene.dataset.releasing=String(releasing);
      }
      function save(){try{window.openai?.setWidgetState?.({modelContent:{groveArchitecture:{version:2,...state}},privateContent:null})?.catch(()=>{});}catch{}}
      root.addEventListener('change',event=>{
        const key=Object.keys(fields).find(k=>fields[k]===event.target);if(!key)return;
        const old=state[key];state[key]=fields[key].type==='checkbox'?fields[key].checked:fields[key].value;
        if(['audience','storage','atproto','ethereum'].includes(key)&&old!==state[key])state.approved=false;
        if(state.audience==='local')state.approved=false;
        controls();render();save();
      });
      hydrate(window.openai?.widgetState);controls();render();
      window.addEventListener('openai:set_globals',event=>{const v=event.detail?.globals?.widgetState;if(v){hydrate(v);controls();render();}});
      let priorWidth=0;new ResizeObserver(()=>{const w=Math.round(root.getBoundingClientRect().width);if(w!==priorWidth){priorWidth=w;render();}}).observe(root);
    })();
  </script>
</div>
