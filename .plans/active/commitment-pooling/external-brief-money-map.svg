<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="2200" viewBox="0 0 1100 1100" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 Z" fill="#AC9F87"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 Z" fill="#A19884"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="1100" fill="#FBF8F2"/>

  <!-- title -->
  <text x="550" y="88" text-anchor="middle" font-size="22" font-weight="700" fill="#2A2722">Where value lives, and how we know it moved</text>

  <!-- LEFT panel: Arbitrum -->
  <rect x="50" y="190" width="390" height="630" rx="16" fill="none" stroke="#2A2722" stroke-width="1.5"/>
  <text x="245" y="226" text-anchor="middle" font-size="15" font-weight="700" fill="#2A2722">Arbitrum — proof &amp; coordination</text>

  <!-- commitments and register -->
  <rect x="115" y="330" width="260" height="58" rx="12" fill="#FFFFFF" stroke="#A19884" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="245" y="354" text-anchor="middle" font-size="13" font-weight="600" fill="#3B372E">commitments &amp; register</text>
  <text x="245" y="372" text-anchor="middle" font-size="10.5" fill="#6E6857">August</text>

  <!-- settlement record pair -->
  <text x="245" y="456" text-anchor="middle" font-size="10.5" fill="#8A8578">the settlement record</text>

  <rect x="85" y="474" width="320" height="58" rx="12" fill="#FFFFFF" stroke="#A19884" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="245" y="498" text-anchor="middle" font-size="13" font-weight="600" fill="#3B372E">Reported</text>
  <text x="245" y="516" text-anchor="middle" font-size="10.5" fill="#6E6857">an executor recorded a Celo tx — not proof</text>

  <path d="M 245 534 L 245 586" fill="none" stroke="#AC9F87" stroke-width="2.25" marker-end="url(#arrow)"/>

  <rect x="85" y="592" width="320" height="58" rx="12" fill="#DFEBDE" stroke="#4C7A57" stroke-width="2"/>
  <text x="245" y="616" text-anchor="middle" font-size="13" font-weight="600" fill="#24422E">Oracle-verified ✓</text>
  <text x="245" y="634" text-anchor="middle" font-size="10.5" fill="#4C6B54">finalized receipt verified — no human override</text>

  <!-- RIGHT panel: Celo -->
  <rect x="660" y="190" width="390" height="630" rx="16" fill="none" stroke="#2A2722" stroke-width="1.5"/>
  <text x="855" y="226" text-anchor="middle" font-size="15" font-weight="700" fill="#2A2722">Celo — where G$ lives</text>

  <rect x="715" y="290" width="280" height="58" rx="12" fill="#DFEBDE" stroke="#4C7A57" stroke-width="2"/>
  <text x="855" y="314" text-anchor="middle" font-size="13" font-weight="600" fill="#24422E">House of Alignment stream</text>
  <text x="855" y="332" text-anchor="middle" font-size="10.5" fill="#4C6B54">upstream — not a Green Goods action</text>

  <path d="M 855 350 L 855 367" fill="none" stroke="#AC9F87" stroke-width="2.25" marker-end="url(#arrow)"/>

  <rect x="735" y="372" width="240" height="48" rx="12" fill="#DFEBDE" stroke="#4C7A57" stroke-width="2"/>
  <text x="855" y="401" text-anchor="middle" font-size="13" font-weight="600" fill="#24422E">Dev Guild working capital</text>

  <path d="M 855 422 L 855 445" fill="none" stroke="#AC9F87" stroke-width="2.25" marker-end="url(#arrow)"/>
  <text x="867" y="438" font-size="10.5" fill="#8A8578">route 1</text>

  <rect x="735" y="450" width="240" height="48" rx="12" fill="#FFFFFF" stroke="#A19884" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="855" y="479" text-anchor="middle" font-size="13" font-weight="600" fill="#3B372E">protocol treasury</text>

  <path d="M 855 500 L 855 523" fill="none" stroke="#AC9F87" stroke-width="2.25" marker-end="url(#arrow)"/>
  <text x="867" y="516" font-size="10.5" fill="#8A8578">route 2</text>

  <rect x="735" y="528" width="240" height="48" rx="12" fill="#FFFFFF" stroke="#A19884" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="855" y="557" text-anchor="middle" font-size="13" font-weight="600" fill="#3B372E">garden accounts</text>

  <!-- gated last arrow -->
  <path d="M 855 578 L 855 643" fill="none" stroke="#A19884" stroke-width="2.25" stroke-dasharray="5 4" marker-end="url(#arrowMuted)"/>
  <text x="867" y="598" font-size="10.5" fill="#6E6857">sponsored-account gate —</text>
  <text x="867" y="612" font-size="10.5" fill="#6E6857">until it passes, member</text>
  <text x="867" y="626" font-size="10.5" fill="#6E6857">delivery waits</text>

  <rect x="735" y="648" width="240" height="48" rx="12" fill="#FFFFFF" stroke="#A19884" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="855" y="677" text-anchor="middle" font-size="13" font-weight="600" fill="#3B372E">members</text>

  <!-- no bridge, ever -->
  <path d="M 656 340 L 448 340" fill="none" stroke="#AC9F87" stroke-width="2.25" marker-end="url(#arrow)"/>
  <g stroke="#A65D57" stroke-width="2.5" stroke-linecap="round">
    <line x1="545" y1="333" x2="559" y2="347"/>
    <line x1="545" y1="347" x2="559" y2="333"/>
  </g>
  <text x="552" y="368" text-anchor="middle" font-size="11" font-weight="600" fill="#8A4A44">no bridged G$, ever</text>

  <!-- oracle check arc -->
  <path d="M 660 640 Q 520 420 409 621" fill="none" stroke="#AC9F87" stroke-width="2.25" marker-end="url(#arrow)"/>
  <text x="550" y="448" text-anchor="middle" font-size="10.5" fill="#6E6857">Chainlink Functions</text>
  <text x="550" y="463" text-anchor="middle" font-size="10.5" fill="#6E6857">checks the finalized</text>
  <text x="550" y="478" text-anchor="middle" font-size="10.5" fill="#6E6857">Celo receipt</text>

  <!-- legend -->
  <g>
    <rect x="332" y="880" width="26" height="16" rx="4" fill="#DFEBDE" stroke="#4C7A57" stroke-width="2"/>
    <text x="366" y="893" font-size="12" fill="#2A2722">Built — live</text>

    <rect x="486" y="880" width="26" height="16" rx="4" fill="#FFFFFF" stroke="#A19884" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="520" y="893" font-size="12" fill="#2A2722">Planned — gated</text>

    <rect x="661" y="880" width="26" height="16" rx="4" fill="#FFFFFF" stroke="#A65D57" stroke-width="2"/>
    <text x="695" y="893" font-size="12" fill="#2A2722">not allowed</text>
  </g>

  <text x="550" y="1056" text-anchor="middle" font-size="10.5" fill="#8A8578">Green Goods · Commitment Pooling — v1 (2026-07)</text>
</svg>
