<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="2000" viewBox="0 0 1000 1000" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="use-cases-title use-cases-desc">
  <title id="use-cases-title">Three ways a community Need becomes action</title>
  <desc id="use-cases-desc">Three garden-agnostic journeys show a problem and desired outcome becoming a Request or Offer commitment, followed by proof and confirmation. The mutual-aid journey moves no token, the shared-project journey uses baseline and work evidence, and the rewarded journey keeps G dollar settlement on Celo with an authenticated acknowledgment required for confirmation.</desc>
  <defs>
    <marker id="use-cases-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 Z" fill="#988D77"/>
    </marker>
  </defs>
  <rect width="1000" height="1000" fill="#FBF8F2"/>

  <text x="500" y="56" text-anchor="middle" font-size="34" font-weight="700" fill="#2A2722">Three ways a Need becomes action</text>
  <text x="500" y="88" text-anchor="middle" font-size="18" fill="#6E6857">the Need names the problem · the commitment is a Request or Offer</text>

  <g font-size="17" font-weight="700" fill="#6E6857">
    <text x="205" y="142" text-anchor="middle">1 · NEED</text>
    <text x="500" y="142" text-anchor="middle">2 · COMMITMENT</text>
    <text x="795" y="142" text-anchor="middle">3 · PROOF AND CLOSE</text>
  </g>

  <g fill="none" stroke="#988D77" stroke-width="2.5" marker-end="url(#use-cases-arrow)">
    <path d="M 330 265 H 370"/><path d="M 625 265 H 665"/>
    <path d="M 330 505 H 370"/><path d="M 625 505 H 665"/>
    <path d="M 330 745 H 370"/><path d="M 625 745 H 665"/>
  </g>

  <!-- Mutual aid -->
  <rect x="40" y="170" width="920" height="190" rx="18" fill="#F1ECE2" stroke="#988D77" stroke-width="2"/>
  <text x="70" y="205" font-size="21" font-weight="700" fill="#2A2722">Mutual aid · no token moves</text>
  <g>
    <rect x="75" y="225" width="255" height="104" rx="12" fill="#FFFFFF" stroke="#988D77" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="202" y="255" text-anchor="middle" font-size="17" fill="#2A2722">Neighbors lack reliable</text><text x="202" y="278" text-anchor="middle" font-size="17" fill="#2A2722">rides to market</text>
    <text x="202" y="312" text-anchor="middle" font-size="14" font-weight="700" fill="#6E6857">PLANNED NEED RECORD</text>
    <rect x="370" y="225" width="255" height="104" rx="12" fill="#FFFFFF" stroke="#988D77" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="497" y="255" text-anchor="middle" font-size="17" font-weight="700" fill="#2A2722">OFFER</text><text x="497" y="280" text-anchor="middle" font-size="17" fill="#2A2722">Eight rides this month</text>
    <text x="497" y="312" text-anchor="middle" font-size="14" font-weight="700" fill="#6E6857">PLANNED</text>
    <rect x="665" y="225" width="260" height="104" rx="12" fill="#FFFFFF" stroke="#988D77" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="795" y="254" text-anchor="middle" font-size="16" fill="#2A2722">Recipient group confirms</text><text x="795" y="278" text-anchor="middle" font-size="16" fill="#2A2722">the rides were provided</text>
    <text x="795" y="312" text-anchor="middle" font-size="14" font-weight="700" fill="#6E6857">PLANNED · NO REWARD</text>
  </g>

  <!-- Shared project -->
  <rect x="40" y="410" width="920" height="190" rx="18" fill="#F1ECE2" stroke="#988D77" stroke-width="2"/>
  <text x="70" y="445" font-size="21" font-weight="700" fill="#2A2722">Shared project · built evidence rails</text>
  <g>
    <rect x="75" y="465" width="255" height="104" rx="12" fill="#FFFFFF" stroke="#988D77" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="202" y="495" text-anchor="middle" font-size="17" fill="#2A2722">The school path floods</text><text x="202" y="518" text-anchor="middle" font-size="17" fill="#2A2722">after rain</text>
    <text x="202" y="552" text-anchor="middle" font-size="14" font-weight="700" fill="#6E6857">PLANNED NEED RECORD</text>
    <rect x="370" y="465" width="255" height="104" rx="12" fill="#FFFFFF" stroke="#988D77" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="497" y="495" text-anchor="middle" font-size="17" font-weight="700" fill="#2A2722">REQUEST</text><text x="497" y="520" text-anchor="middle" font-size="17" fill="#2A2722">One drainage work day</text>
    <text x="497" y="552" text-anchor="middle" font-size="14" font-weight="700" fill="#6E6857">PLANNED</text>
    <rect x="665" y="465" width="260" height="104" rx="12" fill="#DFEBDE" stroke="#4C7A57" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="795" y="494" text-anchor="middle" font-size="16" fill="#24422E">Baseline + approved work</text><text x="795" y="518" text-anchor="middle" font-size="16" fill="#24422E">then eligible confirmation</text>
    <text x="795" y="552" text-anchor="middle" font-size="14" font-weight="700" fill="#24422E">BUILT RAILS · PLANNED LINK</text>
  </g>

  <!-- Rewarded outcome -->
  <rect x="40" y="650" width="920" height="210" rx="18" fill="#F1ECE2" stroke="#988D77" stroke-width="2"/>
  <text x="70" y="685" font-size="21" font-weight="700" fill="#2A2722">Rewarded outcome · settlement separately gated</text>
  <g>
    <rect x="75" y="705" width="255" height="124" rx="12" fill="#FFFFFF" stroke="#988D77" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="202" y="737" text-anchor="middle" font-size="17" fill="#2A2722">New seedlings lack</text><text x="202" y="760" text-anchor="middle" font-size="17" fill="#2A2722">reliable irrigation</text>
    <text x="202" y="809" text-anchor="middle" font-size="14" font-weight="700" fill="#6E6857">PLANNED NEED RECORD</text>
    <rect x="370" y="705" width="255" height="124" rx="12" fill="#FFFFFF" stroke="#988D77" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="497" y="737" text-anchor="middle" font-size="17" font-weight="700" fill="#2A2722">OFFER OR REQUEST</text><text x="497" y="760" text-anchor="middle" font-size="16" fill="#2A2722">Install a water line</text><text x="497" y="783" text-anchor="middle" font-size="16" fill="#2A2722">with declared G$ reward</text>
    <text x="497" y="809" text-anchor="middle" font-size="14" font-weight="700" fill="#6E6857">PLANNED</text>
    <rect x="665" y="705" width="260" height="124" rx="12" fill="#FFFFFF" stroke="#988D77" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="795" y="735" text-anchor="middle" font-size="16" fill="#2A2722">Work + Dispatched</text><text x="795" y="759" text-anchor="middle" font-size="16" fill="#2A2722">authenticated ack → Confirmed</text><text x="795" y="783" text-anchor="middle" font-size="16" fill="#2A2722">G$ remains on Celo</text>
    <text x="795" y="809" text-anchor="middle" font-size="14" font-weight="700" fill="#6E6857">PLANNED · EVIDENCE-GATED</text>
  </g>

  <g>
    <rect x="218" y="900" width="26" height="18" rx="5" fill="#DFEBDE" stroke="#4C7A57" stroke-width="2"/>
    <text x="255" y="915" font-size="16" fill="#2A2722">Built rail</text>
    <rect x="405" y="900" width="26" height="18" rx="5" fill="#FFFFFF" stroke="#988D77" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="442" y="915" font-size="16" fill="#2A2722">Planned or gated</text>
  </g>
  <text x="500" y="968" text-anchor="middle" font-size="16" fill="#6E6857">Green Goods · Commitment Pooling — v1 (2026-07)</text>
</svg>
