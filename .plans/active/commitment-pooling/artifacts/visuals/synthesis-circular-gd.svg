<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1800" viewBox="0 0 900 900" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="circular-gd-title circular-gd-desc">
  <title id="circular-gd-title">A circular G dollar economy: the pilot hypothesis</title>
  <desc id="circular-gd-desc">Four-block Green Goods circulation loop from the House of Alignment to the GG protocol pool, garden accounts, and gardeners, with separate return paths from gardeners and garden accounts back to the protocol pool. The pool coordinates claimable services and commitments while G$ remains on its separate Celo rail.</desc>
  <defs>
    <marker id="circular-gd-arrow-solid" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 Z" fill="#988D77"/>
    </marker>
    <marker id="circular-gd-arrow-gated" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 Z" fill="#8A6D3B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="900" fill="#FBF8F2"/>

  <text x="450" y="44" text-anchor="middle" font-size="29" font-weight="700" fill="#2A2722">A circular G$ economy: the pilot hypothesis</text>
  <text x="450" y="72" text-anchor="middle" font-size="17" fill="#6E6857">G$ stays on Celo. The pooling module coordinates claims and never holds value.</text>

  <!-- ============ arrows ============ -->

  <!-- A · House of Alignment to GG protocol pool · confirmed upstream relationship -->
  <path d="M 330 179 L 566 179" fill="none" stroke="#988D77" stroke-width="2.5" marker-end="url(#circular-gd-arrow-solid)"/>

  <!-- B · GG protocol pool to Garden accounts · gated -->
  <path d="M 790 258 L 790 568" fill="none" stroke="#8A6D3B" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#circular-gd-arrow-gated)"/>

  <!-- C · Garden accounts to Gardeners · gated -->
  <path d="M 566 640 L 334 640" fill="none" stroke="#8A6D3B" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#circular-gd-arrow-gated)"/>

  <!-- D · return · Gardeners to GG protocol pool · gated -->
  <path d="M 180 572 C 200 440, 380 320, 566 232" fill="none" stroke="#8A6D3B" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#circular-gd-arrow-gated)"/>

  <!-- E · return · Garden accounts to GG protocol pool · gated -->
  <path d="M 650 572 L 650 262" fill="none" stroke="#8A6D3B" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#circular-gd-arrow-gated)"/>

  <!-- ============ arrow labels ============ -->

  <g font-size="15" fill="#6E6857" text-anchor="middle">
    <!-- A · above the line -->
    <text x="450" y="144">supports the protocol</text>
    <text x="450" y="162">pool’s G$ rail</text>

    <!-- B · on the line -->
    <rect x="736" y="338" width="108" height="71" rx="8" fill="#FBF8F2"/>
    <text x="790" y="360">services or</text>
    <text x="790" y="378">commitments</text>
    <text x="790" y="396">are claimed</text>

    <!-- C · above the line -->
    <text x="450" y="586">fulfilled commitments</text>
    <text x="450" y="604">reward eligible</text>
    <text x="450" y="622">contributors</text>

    <!-- D · on the curve -->
    <rect x="235" y="349" width="152" height="71" rx="8" fill="#FBF8F2"/>
    <text x="311" y="371">people use G$ for</text>
    <text x="311" y="389">Green Goods</text>
    <text x="311" y="407">services</text>

    <!-- E · on the line -->
    <rect x="574" y="428" width="152" height="71" rx="8" fill="#FBF8F2"/>
    <text x="650" y="450">gardens support</text>
    <text x="650" y="468">services and seed</text>
    <text x="650" y="486">new commitments</text>
  </g>

  <!-- ============ blocks ============ -->

  <!-- 1 · House of Alignment · top left -->
  <g>
    <rect x="30" y="129" width="300" height="100" rx="12" fill="#FFFFFF" stroke="#988D77" stroke-width="2"/>
    <text x="180" y="170" text-anchor="middle" font-size="21" font-weight="600" fill="#3B372E">House of Alignment</text>
    <text x="180" y="196" text-anchor="middle" font-size="16" fill="#6E6857">G$ support stream on Celo</text>
  </g>

  <!-- 2 · GG protocol pool · top right -->
  <g>
    <rect x="570" y="100" width="300" height="158" rx="12" fill="#FFFFFF" stroke="#988D77" stroke-width="2"/>
    <text x="720" y="141" text-anchor="middle" font-size="21" font-weight="600" fill="#3B372E">GG protocol pool</text>
    <text x="720" y="167" text-anchor="middle" font-size="16" fill="#6E6857">claimable services and</text>
    <text x="720" y="186" text-anchor="middle" font-size="16" fill="#6E6857">commitments live here</text>
    <path d="M 620 199 L 820 199" stroke="#988D77" stroke-opacity="0.35" stroke-width="1"/>
    <text x="720" y="217" text-anchor="middle" font-size="14" fill="#6E6857">value stays on the</text>
    <text x="720" y="233" text-anchor="middle" font-size="14" fill="#6E6857">separate Celo rail</text>
  </g>

  <!-- 3 · Garden accounts · bottom right -->
  <g>
    <rect x="570" y="572" width="300" height="135" rx="12" fill="#FFFFFF" stroke="#988D77" stroke-width="2"/>
    <text x="720" y="613" text-anchor="middle" font-size="21" font-weight="600" fill="#3B372E">Garden accounts</text>
    <text x="720" y="639" text-anchor="middle" font-size="16" fill="#6E6857">gardens claim work and</text>
    <text x="720" y="658" text-anchor="middle" font-size="16" fill="#6E6857">receive separately</text>
    <text x="720" y="677" text-anchor="middle" font-size="16" fill="#6E6857">routed support</text>
  </g>

  <!-- 4 · Gardeners · bottom left -->
  <g>
    <rect x="30" y="572" width="300" height="135" rx="12" fill="#FFFFFF" stroke="#988D77" stroke-width="2"/>
    <text x="180" y="613" text-anchor="middle" font-size="21" font-weight="600" fill="#3B372E">Gardeners</text>
    <text x="180" y="639" text-anchor="middle" font-size="16" fill="#6E6857">fulfilled commitments</text>
    <text x="180" y="658" text-anchor="middle" font-size="16" fill="#6E6857">reward eligible</text>
    <text x="180" y="677" text-anchor="middle" font-size="16" fill="#6E6857">contributors</text>
  </g>

  <!-- ============ legend ============ -->
  <g font-size="16" fill="#2A2722">
    <path d="M 240 765 L 272 765" fill="none" stroke="#988D77" stroke-width="2.5" marker-end="url(#circular-gd-arrow-solid)"/>
    <text x="288" y="770">Solid: confirmed upstream funding relationship</text>

    <path d="M 240 793 L 272 793" fill="none" stroke="#8A6D3B" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#circular-gd-arrow-gated)"/>
    <text x="288" y="798">Dashed: planned or evidence gated</text>
  </g>

  <text x="450" y="868" text-anchor="middle" font-size="16" fill="#6E6857">Green Goods · Commitment Pooling · v1 (2026-08)</text>
</svg>
