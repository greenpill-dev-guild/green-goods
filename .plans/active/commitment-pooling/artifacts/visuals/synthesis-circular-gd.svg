<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1800" viewBox="0 0 900 900" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="circular-gd-title circular-gd-desc">
  <title id="circular-gd-title">A circular G dollar economy</title>
  <desc id="circular-gd-desc">A Celo flow moves from the House of Alignment stream to the Green Goods protocol treasury, garden accounts, and gardeners. A return leg on the right closes the selected circulation loop: gardens spend the G$ they earn on Green Goods team services — support sessions, onboarding, and workshops — with compatibility under the House of Alignment circulation mandate still in confirmation with GoodDollar. Local merchant and store routes are explicitly unmodeled. Gardener delivery remains gated.</desc>
  <defs>
    <marker id="circular-gd-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 Z" fill="#988D77"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="900" fill="#FBF8F2"/>

  <text x="450" y="46" text-anchor="middle" font-size="29" font-weight="700" fill="#2A2722">A circular G$ economy — circulation, not extraction</text>

  <!-- center thesis -->
  <text x="450" y="440" text-anchor="middle" font-size="19" font-weight="600" fill="#24422E">value circulates</text>
  <text x="450" y="460" text-anchor="middle" font-size="19" font-weight="600" fill="#24422E">instead of draining out</text>

  <!-- funded flow arrows on the orbit -->
  <g fill="none" stroke="#988D77" stroke-width="2.25" marker-end="url(#circular-gd-arrow)">
    <path d="M 539.9 232.5 A 240 240 0 0 1 633.8 300.7"/>
    <path d="M 689.4 471.7 A 240 240 0 0 1 653.5 582.2"/>
    <path d="M 508.1 687.9 A 240 240 0 0 1 391.9 687.9"/>
    <!-- return leg: gardens spend earned G$ back up on Green Goods team services.
         Routed outside the orbit on the right so it reads as a distinct movement
         rather than another step in the clockwise flow. -->
    <path d="M 683 641 C 790 625, 812 470, 726 407"/>
  </g>

  <!-- House of Alignment stream · top -->
  <g>
    <rect x="365" y="185" width="170" height="60" rx="12" fill="#FFFFFF" stroke="#988D77" stroke-width="2"/>
    <text x="450" y="210" text-anchor="middle" font-size="19" font-weight="600" fill="#3B372E">House of Alignment</text>
    <text x="450" y="228" text-anchor="middle" font-size="19" font-weight="600" fill="#3B372E">stream (Celo)</text>
  </g>
  <!-- note on the arrow into the protocol treasury -->
  <text x="632" y="252" text-anchor="middle" font-size="15" fill="#6E6857">streams directly —</text>
  <text x="632" y="266" text-anchor="middle" font-size="15" fill="#6E6857">upstream fact</text>

  <!-- Green Goods protocol treasury · upper right -->
  <g>
    <rect x="578" y="357" width="200" height="48" rx="12" fill="#FFFFFF" stroke="#988D77" stroke-width="2"/>
    <text x="678" y="386" text-anchor="middle" font-size="19" font-weight="600" fill="#3B372E">GG protocol treasury</text>
  </g>

  <!-- garden accounts · lower right -->
  <g>
    <rect x="501" y="625" width="180" height="48" rx="12" fill="#FFFFFF" stroke="#988D77" stroke-width="2"/>
    <text x="591" y="654" text-anchor="middle" font-size="18" font-weight="600" fill="#3B372E">garden accounts</text>
  </g>

  <!-- gardeners · lower left -->
  <g>
    <rect x="254" y="625" width="110" height="48" rx="12" fill="#FFFFFF" stroke="#988D77" stroke-width="2"/>
    <text x="309" y="654" text-anchor="middle" font-size="19" font-weight="600" fill="#3B372E">gardeners</text>
  </g>
  <!-- note on the arrow into gardeners -->
  <text x="450" y="728" text-anchor="middle" font-size="15" fill="#6E6857">sponsored-account</text>
  <text x="450" y="742" text-anchor="middle" font-size="15" fill="#6E6857">gate applies</text>

  <!-- Explicitly outside the selected model: no connecting arrow. -->
  <g>
    <rect x="92" y="345" width="260" height="72" rx="12" fill="#FFFFFF" stroke="#988D77" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="222" y="371" text-anchor="middle" font-size="18" font-weight="600" fill="#3B372E">Local merchant / store routes</text>
    <text x="222" y="395" text-anchor="middle" font-size="16" fill="#6E6857">not modeled in this architecture</text>
  </g>

  <!-- return-leg label, placed below the arc's start so it never crosses the stroke -->
  <text x="780" y="692" text-anchor="middle" font-size="16" font-weight="600" fill="#3B372E">gardens spend G$ on</text>
  <text x="780" y="712" text-anchor="middle" font-size="16" font-weight="600" fill="#3B372E">Green Goods services</text>
  <text x="780" y="734" text-anchor="middle" font-size="14" fill="#6E6857">support sessions · onboarding</text>
  <text x="780" y="750" text-anchor="middle" font-size="14" fill="#6E6857">· workshops</text>
  <text x="780" y="774" text-anchor="middle" font-size="14" fill="#8B642D">GoodDollar alignment</text>
  <text x="780" y="790" text-anchor="middle" font-size="14" fill="#8B642D">in confirmation</text>

  <text x="450" y="868" text-anchor="middle" font-size="16" fill="#6E6857">Green Goods · Commitment Pooling — v1 (2026-08)</text>
</svg>
