<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1800" viewBox="0 0 900 900" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="900" height="900" fill="#FBF8F2"/>

  <text x="450" y="46" text-anchor="middle" font-size="23" font-weight="700" fill="#2A2722">Three tiers of commitment pooling</text>

  <!-- Tier 1 · base step, largest -->
  <g>
    <rect x="70" y="515" width="290" height="185" rx="12" fill="#FFFFFF" stroke="#A19884" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="215" y="585" text-anchor="middle" font-size="13" font-weight="600" fill="#3B372E">Tier 1 — Mutual aid</text>
    <text x="215" y="611" text-anchor="middle" font-size="10.5" fill="#6E6857">no money at all</text>
    <text x="215" y="627" text-anchor="middle" font-size="10.5" fill="#6E6857">confirmation is the settlement</text>
    <text x="215" y="643" text-anchor="middle" font-size="10.5" fill="#6E6857">Planned · August</text>
  </g>

  <!-- Tier 2 · middle step -->
  <g>
    <rect x="360" y="330" width="260" height="185" rx="12" fill="#FFFFFF" stroke="#A19884" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="490" y="398" text-anchor="middle" font-size="13" font-weight="600" fill="#3B372E">Tier 2 — Paid work</text>
    <text x="490" y="424" text-anchor="middle" font-size="10.5" fill="#6E6857">G$ settles fulfilled</text>
    <text x="490" y="440" text-anchor="middle" font-size="10.5" fill="#6E6857">commitments on Celo</text>
    <text x="490" y="456" text-anchor="middle" font-size="10.5" fill="#6E6857">operator-executed · Planned · August</text>
  </g>

  <!-- Tier 3 · top step, lighter and clearly gated -->
  <g>
    <rect x="620" y="155" width="240" height="175" rx="12" fill="#FFFFFF" stroke="#BFB5A1" stroke-width="2" stroke-dasharray="4 5"/>
    <text x="740" y="216" text-anchor="middle" font-size="13" font-weight="600" fill="#6E6857">Tier 3 — Borrow-and-repay</text>
    <text x="740" y="240" text-anchor="middle" font-size="10.5" fill="#8A8578">interest-free advances, records-only</text>
    <text x="740" y="256" text-anchor="middle" font-size="10.5" fill="#8A8578">no credit scores</text>
    <text x="740" y="272" text-anchor="middle" font-size="10.5" fill="#8A8578">designed · evidence-gated</text>
  </g>

  <text x="450" y="780" text-anchor="middle" font-size="12.5" fill="#6E6857">Most of the loop runs on Tier 1 — money is the optional layer.</text>

  <text x="450" y="868" text-anchor="middle" font-size="10.5" fill="#8A8578">Green Goods · Commitment Pooling — v1 (2026-07)</text>
</svg>
