    <path d="M 0 -5 C -5 -10, -11 -11, -17 -9 L -17 6 C -11 4, -5 5, 0 10 Z"/>
    <path d="M 0 -5 C 5 -10, 11 -11, 17 -9 L 17 6 C 11 4, 5 5, 0 10 Z"/>
    <path d="M 0 -5 L 0 10"/>
  </g>
  <!-- motif · session record -->
  <g transform="translate(611,253)" fill="none" stroke="#988D77" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M -11 -14 L 6 -14 L 13 -7 L 13 14 L -11 14 Z"/>
    <path d="M 6 -14 L 6 -7 L 13 -7"/>
    <path d="M -5 -1 L 7 -1"/>
    <path d="M -5 5 L 7 5"/>
  </g>
  <!-- motif · replenished pool -->
  <g transform="translate(833,248)" stroke="#4C7A57" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 0 -18 C 4.5 -12.5, 6 -10, 6 -7 A 6 6 0 0 1 -6 -7 C -6 -10, -4.5 -12.5, 0 -18 Z" fill="none"/>
    <path d="M -16 3 C -13 14, 13 14, 16 3 Z" fill="#DFEBDE"/>
    <path d="M -21 3 L -17.5 3" fill="none" stroke-opacity="0.55"/>
    <path d="M 17.5 3 L 21 3" fill="none" stroke-opacity="0.55"/>
  </g>

  <g font-size="17" fill="#3B372E" text-anchor="middle">
    <text x="167" y="320">Reliable hub</text>
    <text x="167" y="343">infrastructure and</text>
    <text x="167" y="366">climate learning</text>

    <text x="389" y="320">August to December</text>
    <text x="389" y="343">climate education</text>
    <text x="389" y="366">series</text>

    <text x="611" y="320">Sessions, attendance,</text>
    <text x="611" y="343">and course completion</text>

    <text x="833" y="320">Skills applied;</text>
    <text x="833" y="343">gardeners paid or</text>
    <text x="833" y="366">pool replenished</text>
  </g>

