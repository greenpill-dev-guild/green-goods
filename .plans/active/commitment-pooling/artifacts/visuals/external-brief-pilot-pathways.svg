  <g font-size="17" fill="#3B372E" text-anchor="middle">
    <text x="167" y="772">Long-term</text>
    <text x="167" y="795">agroecosystem</text>
    <text x="167" y="818">co-stewardship</text>

    <text x="389" y="772">Plant, maintain,</text>
    <text x="389" y="795">mentor, and observe</text>

