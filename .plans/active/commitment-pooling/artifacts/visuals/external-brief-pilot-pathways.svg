<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="2000" viewBox="0 0 1000 1000" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="pilot-pathways-title pilot-pathways-desc">
  <title id="pilot-pathways-title">Three grounded pilot pathways</title>
  <desc id="pilot-pathways-desc">Three pilot pathways read left to right through the same four stages: Need, Commitment, Evidence, and Outcome or support. The first pathway is Tech and Sun Hub, Awka. The second is Muizenberg and Deep South Circles. The third is AgroforestDAO and Redemption Hill. Small line drawings above each stage show solar infrastructure, learning, records, replenishment, mapped hotspots, recycling, sorted waste, a circle of people, hillside contours, a seedling, seasonal growth rings, and an agroforest. A closing note records that direct support and outcome-linked settlement remain separate rails.</desc>

  <rect x="0" y="0" width="1000" height="1000" fill="#FBF8F2"/>

  <!-- title -->
  <text x="500" y="68" text-anchor="middle" font-size="34" font-weight="700" fill="#2A2722">Three grounded pilot pathways</text>

  <!-- stage headings -->
  <g font-size="17" font-weight="600" fill="#6E6857" text-anchor="middle">
    <text x="167" y="132">Need</text>
    <text x="389" y="132">Commitment</text>
    <text x="611" y="132">Evidence</text>
    <text x="833" y="132">Outcome or support</text>
  </g>
  <path d="M 56 152 L 944 152" stroke="#988D77" stroke-opacity="0.3" stroke-width="1"/>

  <!-- band separators -->
  <g stroke="#988D77" stroke-opacity="0.22" stroke-width="1">
    <path d="M 200 398 L 800 398"/>
    <path d="M 200 624 L 800 624"/>
  </g>

  <!-- ================= pathway 1 · Tech & Sun Hub, Awka ================= -->
  <circle cx="62" cy="195" r="4.5" fill="#4C7A57"/>
  <text x="80" y="202" font-size="23" font-weight="600" fill="#2A2722">Tech &amp; Sun Hub, Awka</text>

