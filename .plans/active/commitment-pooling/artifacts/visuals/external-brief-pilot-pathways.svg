  <!-- closing note -->
  <text x="500" y="890" text-anchor="middle" font-size="18" fill="#3B372E">Direct support and outcome-linked settlement remain separate rails.</text>
  <text x="500" y="950" text-anchor="middle" font-size="15" fill="#6E6857">Green Goods · Commitment Pooling — v1 (2026-08)</text>
</svg>
