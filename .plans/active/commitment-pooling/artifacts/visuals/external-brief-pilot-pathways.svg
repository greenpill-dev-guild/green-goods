        fill="none" stroke="#988D77" stroke-width="1.8" stroke-linecap="round"/>
  <g fill="none" stroke="#988D77" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 273 281.5 L 279 286.5 L 273 291.5"/>
    <path d="M 495 280.5 L 501 285.5 L 495 290.5"/>
    <path d="M 717 280 L 723 285 L 717 290"/>
  </g>
  <g fill="#FBF8F2" stroke="#988D77" stroke-width="1.6">
    <circle cx="167" cy="291" r="5"/>
    <circle cx="389" cy="282" r="5"/>
    <circle cx="611" cy="289" r="5"/>
    <circle cx="833" cy="281" r="5"/>
  </g>

  <!-- motif · solar hub -->
  <g transform="translate(167,255)" fill="none" stroke="#988D77" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M -17 -11 L 13 -15 L 19 -3 L -11 1 Z"/>
    <path d="M -7 -12.3 L -1 -0.3"/>
    <path d="M 3 -13.7 L 9 -1.7"/>
    <path d="M 4 -1 L 4 13"/>
    <path d="M -10 13 L 18 13"/>
  </g>
  <!-- motif · learning -->
