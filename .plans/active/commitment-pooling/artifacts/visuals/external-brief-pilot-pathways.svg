    <path d="M -6.2 9.3 L -11.3 6.5 L -11.4 12.3"/>
  </g>
  <!-- motif · sorted waste, return check -->
  <g transform="translate(611,477)" fill="none" stroke="#988D77" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(-9,1)">
      <path d="M -5 -2 L -3.8 9 L 3.8 9 L 5 -2 Z"/>
      <path d="M -6.8 -3 L 6.8 -3"/>
      <path d="M -1.8 -3 L -1.8 -5.5 L 1.8 -5.5 L 1.8 -3"/>
    </g>
    <g transform="translate(9,1)">
      <path d="M -5 -2 L -3.8 9 L 3.8 9 L 5 -2 Z"/>
      <path d="M -6.8 -3 L 6.8 -3"/>
      <path d="M -1.8 -3 L -1.8 -5.5 L 1.8 -5.5 L 1.8 -3"/>
    </g>
    <path d="M -15 -13 C -6 -21, 6 -21, 15 -13"/>
    <path d="M 9.3 -14.1 L 15 -13 L 13.3 -18.6"/>
  </g>
  <!-- motif · circle of people -->
  <g transform="translate(833,480)" fill="none">
    <circle cx="0" cy="0" r="13" stroke="#988D77" stroke-opacity="0.4" stroke-width="1.2"/>
    <g stroke="#4C7A57" stroke-width="1.5">
      <circle cx="0" cy="-13" r="3.1"/>
      <circle cx="10.16" cy="-8.11" r="3.1"/>
      <circle cx="12.67" cy="2.89" r="3.1"/>
      <circle cx="5.64" cy="11.71" r="3.1"/>
      <circle cx="-5.64" cy="11.71" r="3.1"/>
      <circle cx="-12.67" cy="2.89" r="3.1"/>
      <circle cx="-10.16" cy="-8.11" r="3.1"/>
    </g>
  </g>

  <g font-size="17" fill="#3B372E" text-anchor="middle">
    <text x="167" y="546">Waste hotspots and</text>
    <text x="167" y="569">youth-led local action</text>

    <text x="389" y="546">Cleanup, mapping, and</text>
    <text x="389" y="569">recycling follow-up</text>

    <text x="611" y="546">Site baseline,</text>
    <text x="611" y="569">waste sorted, and</text>
    <text x="611" y="592">return check</text>

    <text x="833" y="546">Cleaner sites and</text>
    <text x="833" y="569">stronger youth</text>
    <text x="833" y="592">leadership</text>
  </g>

  <!-- ================= pathway 3 · AgroforestDAO / Redemption Hill ================= -->
  <circle cx="62" cy="647" r="4.5" fill="#4C7A57"/>
  <text x="80" y="654" font-size="23" font-weight="600" fill="#2A2722">AgroforestDAO / Redemption Hill</text>

  <path d="M 125 741 L 167 741 C 267 741, 289 733, 389 733 C 489 733, 511 742, 611 742 C 711 742, 733 735, 833 735 L 875 735"
