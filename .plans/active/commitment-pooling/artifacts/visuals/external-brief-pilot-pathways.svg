    <path d="M -9 16 L -5 16" fill="none" stroke="#988D77" stroke-opacity="0.6"/>
    <path d="M 4 16 L 8 16" fill="none" stroke="#988D77" stroke-opacity="0.6"/>
    <path d="M 0 13 C 0 6, 0 2, 0 -4" fill="none" stroke="#4C7A57"/>
    <path d="M 0 3 C -6 1, -10 -4, -9 -9 C -4 -9, 0 -3, 0 3 Z" fill="#DFEBDE" stroke="#4C7A57"/>
    <path d="M 0 -1 C 6 -3, 10 -8, 9 -13 C 4 -13, 0 -7, 0 -1 Z" fill="#DFEBDE" stroke="#4C7A57"/>
