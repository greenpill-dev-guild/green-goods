<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="2000" viewBox="0 0 1000 1000" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="1000" fill="#FBF8F2"/>

  <!-- title -->
  <text x="500" y="90" text-anchor="middle" font-size="23" font-weight="700" fill="#2A2722">One loop, five roles</text>
  <text x="500" y="116" text-anchor="middle" font-size="12.5" fill="#6E6857">who does what across the commitment loop</text>

  <!-- Gardener column -->
  <g>
    <rect x="40" y="210" width="168" height="52" rx="12" fill="#DFEBDE" stroke="#4C7A57" stroke-width="2"/>
    <text x="124" y="241" text-anchor="middle" font-size="13" font-weight="600" fill="#24422E">Gardener</text>
    <text x="124" y="330" text-anchor="middle" font-size="10.5" fill="#2A2722">makes and takes up</text>
    <text x="124" y="346" text-anchor="middle" font-size="10.5" fill="#2A2722">promises</text>
    <text x="124" y="423" text-anchor="middle" font-size="10.5" fill="#2A2722">does the work</text>
    <text x="124" y="500" text-anchor="middle" font-size="10.5" fill="#2A2722">captures evidence</text>
    <text x="124" y="516" text-anchor="middle" font-size="10.5" fill="#2A2722">— even offline</text>
  </g>

  <!-- Operator column -->
  <g>
    <rect x="228" y="210" width="168" height="52" rx="12" fill="#DFEBDE" stroke="#4C7A57" stroke-width="2"/>
    <text x="312" y="241" text-anchor="middle" font-size="13" font-weight="600" fill="#24422E">Operator</text>
    <text x="312" y="330" text-anchor="middle" font-size="10.5" fill="#2A2722">seeds commitments</text>
    <text x="312" y="346" text-anchor="middle" font-size="10.5" fill="#2A2722">from confirmed needs</text>
    <text x="312" y="423" text-anchor="middle" font-size="10.5" fill="#2A2722">approves work</text>
    <text x="312" y="500" text-anchor="middle" font-size="10.5" fill="#2A2722">executes settlement</text>
    <text x="312" y="516" text-anchor="middle" font-size="10.5" fill="#2A2722">from the garden account</text>
  </g>

  <!-- Evaluator column -->
  <g>
    <rect x="416" y="210" width="168" height="52" rx="12" fill="#DFEBDE" stroke="#4C7A57" stroke-width="2"/>
    <text x="500" y="241" text-anchor="middle" font-size="13" font-weight="600" fill="#24422E">Evaluator</text>
    <text x="500" y="330" text-anchor="middle" font-size="10.5" fill="#2A2722">records baseline</text>
    <text x="500" y="346" text-anchor="middle" font-size="10.5" fill="#2A2722">and delta</text>
    <text x="500" y="423" text-anchor="middle" font-size="10.5" fill="#2A2722">reviews methodology</text>
    <text x="500" y="508" text-anchor="middle" font-size="10.5" fill="#2A2722">exports CSV/JSON lineage</text>
  </g>

  <!-- Funder column -->
  <g>
    <rect x="604" y="210" width="168" height="52" rx="12" fill="#DFEBDE" stroke="#4C7A57" stroke-width="2"/>
    <text x="688" y="241" text-anchor="middle" font-size="13" font-weight="600" fill="#24422E">Funder</text>
    <text x="688" y="338" text-anchor="middle" font-size="10.5" fill="#2A2722">donates directly</text>
    <text x="688" y="415" text-anchor="middle" font-size="10.5" fill="#2A2722">buys impact-certificate</text>
    <text x="688" y="431" text-anchor="middle" font-size="10.5" fill="#2A2722">fractions</text>
    <text x="688" y="500" text-anchor="middle" font-size="10.5" fill="#2A2722">deposits into</text>
    <text x="688" y="516" text-anchor="middle" font-size="10.5" fill="#2A2722">supporter vaults</text>
  </g>

  <!-- Community column -->
  <g>
    <rect x="792" y="210" width="168" height="52" rx="12" fill="#DFEBDE" stroke="#4C7A57" stroke-width="2"/>
    <text x="876" y="241" text-anchor="middle" font-size="13" font-weight="600" fill="#24422E">Community member</text>
    <text x="876" y="330" text-anchor="middle" font-size="10.5" fill="#2A2722">names Requests,</text>
    <text x="876" y="346" text-anchor="middle" font-size="10.5" fill="#2A2722">Offers, Initiatives</text>
    <text x="876" y="423" text-anchor="middle" font-size="10.5" fill="#2A2722">confirms received help</text>
    <text x="876" y="508" text-anchor="middle" font-size="10.5" fill="#2A2722">gives testimony</text>
  </g>

  <!-- bottom caption -->
  <text x="500" y="668" text-anchor="middle" font-size="12" fill="#6E6857">No one confirms their own promise — confirmation always comes from the person who received the help.</text>

  <!-- legend -->
  <g>
    <rect x="379" y="740" width="26" height="16" rx="4" fill="#DFEBDE" stroke="#4C7A57" stroke-width="2"/>
    <text x="413" y="753" font-size="12" fill="#2A2722">Built — all five roles live today</text>
  </g>

  <text x="500" y="956" text-anchor="middle" font-size="10.5" fill="#8A8578">Green Goods · Commitment Pooling — v1 (2026-07)</text>
</svg>
