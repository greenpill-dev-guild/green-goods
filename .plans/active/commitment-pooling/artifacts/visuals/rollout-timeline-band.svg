<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="2000" viewBox="0 0 1000 1000" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="timeline-title timeline-desc">
  <title id="timeline-title">Commitment Pooling four phases and two operational checkpoints</title>
  <desc id="timeline-desc">Four native phases run from Scope and Design on July 22 through Build on July 31, Release on August 12, and Follow On and Hardening on September 30. The July dry run and September Community and evidence delivery are separately labeled operational checkpoints. The two September closures happen in parallel.</desc>
  <defs>
    <marker id="timeline-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 Z" fill="#988D77"/>
    </marker>
  </defs>

  <rect width="1000" height="1000" fill="#FBF8F2"/>
  <text x="500" y="56" text-anchor="middle" font-size="34" font-weight="700" fill="#2A2722">Four phases + operational checkpoints</text>
  <text x="500" y="88" text-anchor="middle" font-size="18" fill="#6E6857">phase dates describe planning state · checkpoints describe field evidence</text>

  <text x="70" y="133" font-size="17" font-weight="700" fill="#6E6857">NATIVE PHASES</text>
  <text x="675" y="133" font-size="17" font-weight="700" fill="#8B642D">OPERATIONAL CHECKPOINTS</text>

  <g fill="none" stroke="#988D77" stroke-width="3" marker-end="url(#timeline-arrow)">
    <path d="M 345 282 L 345 321"/>
    <path d="M 345 457 L 345 496"/>
    <path d="M 345 632 L 345 671"/>
  </g>

  <g>
    <rect x="60" y="155" width="570" height="127" rx="16" fill="#FFFFFF" stroke="#988D77" stroke-width="2"/>
    <rect x="82" y="176" width="102" height="34" rx="10" fill="#F1ECE2" stroke="#988D77" stroke-width="1.5"/>
    <text x="133" y="199" text-anchor="middle" font-size="19" font-weight="700" fill="#2A2722">Jul 22</text>
    <text x="210" y="203" font-size="26" font-weight="700" fill="#2A2722">Scope and Design</text>
    <text x="82" y="245" font-size="20" fill="#6E6857">Specs, prototype, acceptance, and scope agree.</text>

    <rect x="60" y="330" width="570" height="127" rx="16" fill="#FFFFFF" stroke="#988D77" stroke-width="2"/>
    <rect x="82" y="351" width="102" height="34" rx="10" fill="#F1ECE2" stroke="#988D77" stroke-width="1.5"/>
    <text x="133" y="374" text-anchor="middle" font-size="19" font-weight="700" fill="#2A2722">Jul 31</text>
    <text x="210" y="378" font-size="26" font-weight="700" fill="#2A2722">Build</text>
    <text x="82" y="411" font-size="20" fill="#6E6857">Implementation + QA GREEN;</text>
    <text x="82" y="437" font-size="20" fill="#6E6857">authorized non-value broadcast.</text>

    <rect x="60" y="505" width="570" height="127" rx="16" fill="#FFFFFF" stroke="#988D77" stroke-width="2"/>
    <rect x="82" y="526" width="102" height="34" rx="10" fill="#F1ECE2" stroke="#988D77" stroke-width="1.5"/>
    <text x="133" y="549" text-anchor="middle" font-size="19" font-weight="700" fill="#2A2722">Aug 12</text>
    <text x="210" y="553" font-size="26" font-weight="700" fill="#2A2722">Release</text>
    <text x="82" y="595" font-size="20" fill="#6E6857">User-facing rollout + bounded production proof.</text>

    <rect x="60" y="680" width="570" height="147" rx="16" fill="#FFFFFF" stroke="#988D77" stroke-width="2"/>
    <rect x="82" y="701" width="102" height="34" rx="10" fill="#F1ECE2" stroke="#988D77" stroke-width="1.5"/>
    <text x="133" y="724" text-anchor="middle" font-size="19" font-weight="700" fill="#2A2722">Sep 30</text>
    <text x="210" y="728" font-size="25" font-weight="700" fill="#2A2722">Follow On / Hardening</text>
    <text x="82" y="770" font-size="20" fill="#6E6857">Evidence-backed promote/defer decisions only.</text>
    <text x="82" y="799" font-size="17" fill="#6E6857">Closes in parallel with the separately labeled checkpoint.</text>
  </g>

  <g>
    <path d="M 650 394 L 678 394" fill="none" stroke="#8A6D3B" stroke-width="2.5" stroke-dasharray="6 5"/>
    <rect x="680" y="320" width="270" height="148" rx="16" fill="#FFFFFF" stroke="#8A6D3B" stroke-width="2.5" stroke-dasharray="7 5"/>
    <text x="704" y="351" font-size="18" font-weight="700" fill="#8B642D">JUL 31</text>
    <text x="704" y="384" font-size="23" font-weight="700" fill="#2A2722">July dry run</text>
    <text x="704" y="419" font-size="18" fill="#6E6857">Mandates + readiness</text>
    <text x="704" y="445" font-size="18" fill="#6E6857">matrix with explicit gaps.</text>

    <path d="M 650 754 L 678 754" fill="none" stroke="#8A6D3B" stroke-width="2.5" stroke-dasharray="6 5"/>
    <rect x="680" y="676" width="270" height="158" rx="16" fill="#FFFFFF" stroke="#8A6D3B" stroke-width="2.5" stroke-dasharray="7 5"/>
    <text x="704" y="707" font-size="18" font-weight="700" fill="#8B642D">SEP 30</text>
    <text x="704" y="740" font-size="22" font-weight="700" fill="#2A2722">Community + evidence</text>
    <text x="704" y="775" font-size="18" fill="#6E6857">September testimony +</text>
    <text x="704" y="801" font-size="18" fill="#6E6857">source-backed evidence.</text>
  </g>

  <g>
    <rect x="252" y="875" width="24" height="18" rx="5" fill="#FFFFFF" stroke="#988D77" stroke-width="2"/>
    <text x="288" y="890" font-size="17" fill="#2A2722">native phase</text>
    <rect x="485" y="875" width="24" height="18" rx="5" fill="#FFFFFF" stroke="#8A6D3B" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="521" y="890" font-size="17" fill="#2A2722">operational checkpoint</text>
  </g>

  <text x="500" y="960" text-anchor="middle" font-size="16" fill="#6E6857">Green Goods · Commitment Pooling — v1 (2026-08)</text>
</svg>
