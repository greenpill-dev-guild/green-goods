<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="2000" viewBox="0 0 1000 1000" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 Z" fill="#AC9F87"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="1000" fill="#FBF8F2"/>

  <text x="500" y="46" text-anchor="middle" font-size="23" font-weight="700" fill="#2A2722">Go-to-community sequence</text>

  <!-- serpentine band: stops 1-3 read left to right, curve down, stops 4-6 continue right to left -->
  <g fill="none" stroke="#AC9F87" stroke-width="2.25" marker-end="url(#arrow)">
    <path d="M 80 380 L 800 380 A 140 185 0 0 1 800 750"/>
    <path d="M 786 750 L 90 750"/>
  </g>

  <!-- stop dots -->
  <g fill="#FFFFFF" stroke="#A19884" stroke-width="2.5">
    <circle cx="170" cy="380" r="6"/>
    <circle cx="450" cy="380" r="6"/>
    <circle cx="700" cy="380" r="6"/>
    <circle cx="700" cy="750" r="6"/>
    <circle cx="450" cy="750" r="6"/>
    <circle cx="170" cy="750" r="6"/>
  </g>

  <!-- 1 · Jul 16 -->
  <text x="170" y="322" text-anchor="middle" font-size="13" font-weight="600" fill="#2A2722">Outreach begins ·</text>
  <text x="170" y="340" text-anchor="middle" font-size="13" font-weight="600" fill="#2A2722">facilitation-kit review</text>
  <text x="170" y="403" text-anchor="middle" font-size="11" font-weight="600" fill="#2A2722">→ Jul 16</text>
  <text x="170" y="431" text-anchor="middle" font-size="10.5" fill="#6E6857">outreach started;</text>
  <text x="170" y="446" text-anchor="middle" font-size="10.5" fill="#6E6857">open questions logged</text>

  <!-- 2 · Jul 16–30 -->
  <text x="450" y="322" text-anchor="middle" font-size="13" font-weight="600" fill="#2A2722">Co-design sessions ·</text>
  <text x="450" y="340" text-anchor="middle" font-size="13" font-weight="600" fill="#2A2722">mandate confirmation</text>
  <text x="450" y="403" text-anchor="middle" font-size="11" font-weight="600" fill="#2A2722">Jul 16–30</text>
  <text x="450" y="431" text-anchor="middle" font-size="10.5" fill="#6E6857">corrected mandates; language findings;</text>
  <text x="450" y="446" text-anchor="middle" font-size="10.5" fill="#6E6857">join-request decision evidence</text>
  <text x="450" y="464" text-anchor="middle" font-size="9.5" fill="#8A8578">COM-3 kickoff due Jul 30</text>

  <!-- 3 · Jul 31 -->
  <text x="700" y="340" text-anchor="middle" font-size="13" font-weight="600" fill="#2A2722">Dry-run checkpoint</text>
  <text x="700" y="403" text-anchor="middle" font-size="11" font-weight="600" fill="#2A2722">Jul 31</text>
  <text x="700" y="431" text-anchor="middle" font-size="10.5" fill="#6E6857">readiness matrix with explicit gaps;</text>
  <text x="700" y="446" text-anchor="middle" font-size="10.5" fill="#6E6857">no inflated launch claim</text>

  <!-- 4 · Aug 31 -->
  <text x="700" y="708" text-anchor="middle" font-size="13" font-weight="600" fill="#2A2722">Release checkpoint</text>
  <text x="700" y="773" text-anchor="middle" font-size="11" font-weight="600" fill="#2A2722">Aug 31</text>
  <text x="700" y="801" text-anchor="middle" font-size="10.5" fill="#6E6857">tested runbook; oracle-verified</text>
  <text x="700" y="816" text-anchor="middle" font-size="10.5" fill="#6E6857">settlement proof where relevant</text>

  <!-- 5 · Sep 30 -->
  <text x="450" y="708" text-anchor="middle" font-size="13" font-weight="600" fill="#2A2722">Community checkpoint</text>
  <text x="450" y="773" text-anchor="middle" font-size="11" font-weight="600" fill="#2A2722">Sep 30</text>
  <text x="450" y="801" text-anchor="middle" font-size="10.5" fill="#6E6857">observed task completion;</text>
  <text x="450" y="816" text-anchor="middle" font-size="10.5" fill="#6E6857">recovery-path evidence</text>

  <!-- 6 · Dec 31 -->
  <text x="170" y="708" text-anchor="middle" font-size="13" font-weight="600" fill="#2A2722">Hardening review</text>
  <text x="170" y="773" text-anchor="middle" font-size="11" font-weight="600" fill="#2A2722">Dec 31</text>
  <text x="170" y="801" text-anchor="middle" font-size="10.5" fill="#6E6857">evidence-backed</text>
  <text x="170" y="816" text-anchor="middle" font-size="10.5" fill="#6E6857">promote/defer decisions</text>

  <text x="500" y="968" text-anchor="middle" font-size="10.5" fill="#8A8578">Green Goods · Commitment Pooling — v1 (2026-07)</text>
</svg>
