<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="2000" viewBox="0 0 1000 1000" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="timeline-title timeline-desc">
  <title id="timeline-title">Commitment Pooling four phases and two operational checkpoints</title>
  <desc id="timeline-desc">The four native phases are Scope and Design closing July 20, Build closing July 31, Release on August 12, and Follow On and Hardening due December 31. The July 31 dry run and September 30 Community and evidence delivery are separately labeled operational checkpoints.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 Z" fill="#AC9F87"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="1000" fill="#FBF8F2"/>

  <text x="500" y="46" text-anchor="middle" font-size="23" font-weight="700" fill="#2A2722">Four phases + operational checkpoints</text>
  <text x="500" y="70" text-anchor="middle" font-size="11" fill="#6E6857">phase dates describe planning state; checkpoints describe field evidence</text>

  <!-- serpentine band: stops 1-3 read left to right, curve down, stops 4-6 continue right to left -->
  <g fill="none" stroke="#AC9F87" stroke-width="2.25" marker-end="url(#arrow)">
    <path d="M 80 380 L 800 380 A 140 185 0 0 1 800 750"/>
    <path d="M 786 750 L 90 750"/>
  </g>

  <!-- stop dots -->
  <g stroke-width="2.5">
    <circle cx="170" cy="380" r="7" fill="#2A2722" stroke="#2A2722"/>
    <circle cx="450" cy="380" r="7" fill="#2A2722" stroke="#2A2722"/>
    <circle cx="700" cy="380" r="7" fill="#FFFFFF" stroke="#B98A3E" stroke-dasharray="3 2"/>
    <circle cx="700" cy="750" r="7" fill="#2A2722" stroke="#2A2722"/>
    <circle cx="450" cy="750" r="7" fill="#FFFFFF" stroke="#B98A3E" stroke-dasharray="3 2"/>
    <circle cx="170" cy="750" r="7" fill="#2A2722" stroke="#2A2722"/>
  </g>

  <!-- 1 · native phase -->
  <text x="170" y="304" text-anchor="middle" font-size="9" font-weight="700" fill="#6E6857">NATIVE PHASE</text>
  <text x="170" y="325" text-anchor="middle" font-size="13" font-weight="600" fill="#2A2722">Scope and Design</text>
  <text x="170" y="403" text-anchor="middle" font-size="11" font-weight="600" fill="#2A2722">Jul 20</text>
  <text x="170" y="431" text-anchor="middle" font-size="10.5" fill="#6E6857">specs, prototype and</text>
  <text x="170" y="446" text-anchor="middle" font-size="10.5" fill="#6E6857">acceptance agree</text>

  <!-- 2 · native phase -->
  <text x="450" y="304" text-anchor="middle" font-size="9" font-weight="700" fill="#6E6857">NATIVE PHASE</text>
  <text x="450" y="325" text-anchor="middle" font-size="13" font-weight="600" fill="#2A2722">Build</text>
  <text x="450" y="403" text-anchor="middle" font-size="11" font-weight="600" fill="#2A2722">Jul 31</text>
  <text x="450" y="431" text-anchor="middle" font-size="10.5" fill="#6E6857">implementation + QA GREEN;</text>
  <text x="450" y="446" text-anchor="middle" font-size="10.5" fill="#6E6857">not a live claim</text>

  <!-- 3 · operational checkpoint -->
  <text x="700" y="304" text-anchor="middle" font-size="9" font-weight="700" fill="#8B642D">OPERATIONAL CHECKPOINT</text>
  <text x="700" y="325" text-anchor="middle" font-size="13" font-weight="600" fill="#2A2722">July dry run</text>
  <text x="700" y="403" text-anchor="middle" font-size="11" font-weight="600" fill="#2A2722">Jul 31</text>
  <text x="700" y="431" text-anchor="middle" font-size="10.5" fill="#6E6857">mandates and readiness</text>
  <text x="700" y="446" text-anchor="middle" font-size="10.5" fill="#6E6857">matrix with explicit gaps</text>

  <!-- 4 · native phase -->
  <text x="700" y="690" text-anchor="middle" font-size="9" font-weight="700" fill="#6E6857">NATIVE PHASE</text>
  <text x="700" y="711" text-anchor="middle" font-size="13" font-weight="600" fill="#2A2722">Release</text>
  <text x="700" y="773" text-anchor="middle" font-size="11" font-weight="600" fill="#2A2722">Aug 12</text>
  <text x="700" y="801" text-anchor="middle" font-size="10.5" fill="#6E6857">authorized deployment +</text>
  <text x="700" y="816" text-anchor="middle" font-size="10.5" fill="#6E6857">bounded production proof</text>

  <!-- 5 · operational checkpoint -->
  <text x="450" y="674" text-anchor="middle" font-size="9" font-weight="700" fill="#8B642D">OPERATIONAL CHECKPOINT</text>
  <text x="450" y="695" text-anchor="middle" font-size="13" font-weight="600" fill="#2A2722">Community + evidence</text>
  <text x="450" y="773" text-anchor="middle" font-size="11" font-weight="600" fill="#2A2722">Sep 30</text>
  <text x="450" y="801" text-anchor="middle" font-size="10.5" fill="#6E6857">September testimony +</text>
  <text x="450" y="816" text-anchor="middle" font-size="10.5" fill="#6E6857">source-backed evidence packet</text>

  <!-- 6 · native phase -->
  <text x="170" y="674" text-anchor="middle" font-size="9" font-weight="700" fill="#6E6857">NATIVE PHASE</text>
  <text x="170" y="695" text-anchor="middle" font-size="13" font-weight="600" fill="#2A2722">Follow On / Hardening</text>
  <text x="170" y="773" text-anchor="middle" font-size="11" font-weight="600" fill="#2A2722">Dec 31</text>
  <text x="170" y="801" text-anchor="middle" font-size="10.5" fill="#6E6857">evidence-backed</text>
  <text x="170" y="816" text-anchor="middle" font-size="10.5" fill="#6E6857">promote/defer only</text>

  <text x="500" y="968" text-anchor="middle" font-size="10.5" fill="#8A8578">Green Goods · Commitment Pooling — v1 (2026-07)</text>
</svg>
