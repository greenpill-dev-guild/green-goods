<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1800" viewBox="0 0 900 900" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="ownership-map-title ownership-map-desc">
  <title id="ownership-map-title">Commitment Pooling documentation system</title>
  <desc id="ownership-map-desc">Three complementary truth surfaces support one six-section external document. The repository plan hub owns execution, specification, evidence, prototype, and visual truth; Linear owns current delivery status; and the Google Doc is the single source of truth for the external narrative. No external prose is mirrored in the repository.</desc>
  <defs>
    <marker id="ownership-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 Z" fill="#988D77"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="900" fill="#FBF8F2"/>

  <text x="450" y="44" text-anchor="middle" font-size="29" font-weight="700" fill="#2A2722">One document, three truth surfaces</text>
  <text x="450" y="72" text-anchor="middle" font-size="16" fill="#6E6857">each source owns one distinct kind of truth</text>

  <!-- truth surfaces -->
  <g>
    <rect x="50" y="104" width="240" height="102" rx="14" fill="#FFFFFF" stroke="#988D77" stroke-width="2"/>
    <text x="170" y="137" text-anchor="middle" font-size="20" font-weight="700" fill="#2A2722">Repo plan hub</text>
    <text x="170" y="164" text-anchor="middle" font-size="15" fill="#6E6857">specs + evidence + artifacts</text>
    <text x="170" y="186" text-anchor="middle" font-size="14" fill="#6E6857">implementers and agents</text>

    <rect x="330" y="104" width="240" height="102" rx="14" fill="#FFFFFF" stroke="#988D77" stroke-width="2"/>
    <text x="450" y="137" text-anchor="middle" font-size="20" font-weight="700" fill="#2A2722">Linear</text>
    <text x="450" y="164" text-anchor="middle" font-size="15" fill="#6E6857">current delivery status</text>
    <text x="450" y="186" text-anchor="middle" font-size="14" fill="#6E6857">the team</text>

    <rect x="610" y="104" width="240" height="102" rx="14" fill="#FFFFFF" stroke="#988D77" stroke-width="2"/>
    <text x="730" y="137" text-anchor="middle" font-size="20" font-weight="700" fill="#2A2722">Google Doc</text>
    <text x="730" y="164" text-anchor="middle" font-size="15" fill="#6E6857">external narrative</text>
    <text x="730" y="186" text-anchor="middle" font-size="14" fill="#6E6857">partners, funders, gardens</text>
  </g>

  <g fill="none" stroke="#988D77" stroke-width="2.25" marker-end="url(#ownership-arrow)">
    <path d="M 290 155 H 322"/>
    <path d="M 570 155 H 602"/>
  </g>

  <!-- Google Doc tab set -->
  <rect x="50" y="246" width="800" height="486" rx="18" fill="#F1ECE2" stroke="#988D77" stroke-width="2"/>
  <text x="450" y="282" text-anchor="middle" font-size="21" font-weight="700" fill="#2A2722">Canonical external document · sections in order</text>
  <text x="450" y="307" text-anchor="middle" font-size="15" fill="#6E6857">all external prose is authored and maintained here</text>

  <g>
    <rect x="76" y="336" width="356" height="94" rx="12" fill="#FFFFFF" stroke="#988D77" stroke-width="2"/>
    <text x="96" y="369" font-size="18" font-weight="700" fill="#2A2722">00 Start Here</text>
    <text x="96" y="397" font-size="15" fill="#6E6857">Orientation and reading guide</text>

    <rect x="468" y="336" width="356" height="94" rx="12" fill="#FFFFFF" stroke="#988D77" stroke-width="2"/>
    <text x="488" y="369" font-size="18" font-weight="700" fill="#2A2722">01 External Brief</text>
    <text x="488" y="397" font-size="15" fill="#6E6857">Shareable project overview</text>

    <rect x="76" y="456" width="356" height="94" rx="12" fill="#FFFFFF" stroke="#988D77" stroke-width="2"/>
    <text x="96" y="489" font-size="17" font-weight="700" fill="#2A2722">02 GE Learnings &amp; Full Flywheel</text>
    <text x="96" y="517" font-size="15" fill="#6E6857">Background, learnings, and design choices</text>

    <rect x="468" y="456" width="356" height="94" rx="12" fill="#FFFFFF" stroke="#988D77" stroke-width="2"/>
    <text x="488" y="489" font-size="18" font-weight="700" fill="#2A2722">03 Use Cases &amp; Scenarios</text>
    <text x="488" y="517" font-size="15" fill="#6E6857">Garden journeys and mechanism examples</text>

    <rect x="76" y="576" width="356" height="94" rx="12" fill="#FFFFFF" stroke="#988D77" stroke-width="2"/>
    <text x="96" y="609" font-size="17" font-weight="700" fill="#2A2722">04 External Doc &amp; Rollout Plan</text>
    <text x="96" y="637" font-size="15" fill="#6E6857">Audiences, sequence, and claim rules</text>

    <rect x="468" y="576" width="356" height="94" rx="12" fill="#FFFFFF" stroke="#988D77" stroke-width="2"/>
    <text x="488" y="609" font-size="18" font-weight="700" fill="#2A2722">05 Sources &amp; Citations</text>
    <text x="488" y="637" font-size="15" fill="#6E6857">Linked evidence and retired claims</text>
  </g>

  <text x="450" y="777" text-anchor="middle" font-size="17" font-weight="600" fill="#2A2722">Reconcile facts; do not duplicate prose</text>
  <text x="450" y="804" text-anchor="middle" font-size="15" fill="#6E6857">Specs and evidence stay in the repo · status stays in Linear · external language stays in the Doc.</text>

  <text x="450" y="868" text-anchor="middle" font-size="15" fill="#6E6857">Green Goods · Commitment Pooling — v1.2 (2026-07)</text>
</svg>
