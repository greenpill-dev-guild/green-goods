<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1800" viewBox="0 0 900 900" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="900" height="900" fill="#FBF8F2"/>

  <text x="450" y="46" text-anchor="middle" font-size="22" font-weight="700" fill="#2A2722">Documentation set — every artifact has one home</text>

  <text x="190" y="96" text-anchor="middle" font-size="10.5" fill="#8A8578">Artifacts</text>
  <text x="720" y="96" text-anchor="middle" font-size="10.5" fill="#8A8578">Home surface</text>

  <!-- connectors: artifact -> the surface that owns it -->
  <g fill="none" stroke="#AC9F87" stroke-width="2">
    <path d="M 300 172 C 430 172 490 209 620 209"/>
    <path d="M 300 246 C 430 246 490 209 620 209"/>
    <path d="M 300 320 C 430 320 490 320 620 320"/>
    <path d="M 300 394 C 430 394 490 542 620 542"/>
    <path d="M 300 468 C 430 468 490 542 620 542"/>
    <path d="M 300 542 C 430 542 490 542 620 542"/>
    <path d="M 300 616 C 430 616 490 542 620 542"/>
    <path d="M 300 690 C 430 690 490 542 620 542"/>
  </g>

  <!-- artifact chips -->
  <g>
    <rect x="80" y="150" width="220" height="44" rx="12" fill="#FFFFFF" stroke="#A19884" stroke-width="2"/>
    <text x="190" y="176.5" text-anchor="middle" font-size="13" font-weight="600" fill="#3B372E">External brief</text>

    <rect x="80" y="224" width="220" height="44" rx="12" fill="#FFFFFF" stroke="#A19884" stroke-width="2"/>
    <text x="190" y="250.5" text-anchor="middle" font-size="13" font-weight="600" fill="#3B372E">Operator onboarding guide</text>

    <rect x="80" y="298" width="220" height="44" rx="12" fill="#FFFFFF" stroke="#A19884" stroke-width="2"/>
    <text x="190" y="324.5" text-anchor="middle" font-size="13" font-weight="600" fill="#3B372E">Use-case pack</text>

    <rect x="80" y="372" width="220" height="44" rx="12" fill="#FFFFFF" stroke="#A19884" stroke-width="2"/>
    <text x="190" y="398.5" text-anchor="middle" font-size="13" font-weight="600" fill="#3B372E">Canonical synthesis</text>

    <rect x="80" y="446" width="220" height="44" rx="12" fill="#FFFFFF" stroke="#A19884" stroke-width="2"/>
    <text x="190" y="472.5" text-anchor="middle" font-size="13" font-weight="600" fill="#3B372E">Evaluator architecture note</text>

    <rect x="80" y="520" width="220" height="44" rx="12" fill="#FFFFFF" stroke="#A19884" stroke-width="2"/>
    <text x="190" y="546.5" text-anchor="middle" font-size="13" font-weight="600" fill="#3B372E">Funder/collaborator note</text>

    <rect x="80" y="594" width="220" height="44" rx="12" fill="#FFFFFF" stroke="#A19884" stroke-width="2"/>
    <text x="190" y="620.5" text-anchor="middle" font-size="13" font-weight="600" fill="#3B372E">FAQ &amp; glossary</text>

    <rect x="80" y="668" width="220" height="44" rx="12" fill="#FFFFFF" stroke="#A19884" stroke-width="2"/>
    <text x="190" y="694.5" text-anchor="middle" font-size="13" font-weight="600" fill="#3B372E">Member one-pager</text>
  </g>

  <!-- surface chips -->
  <g>
    <rect x="620" y="187" width="200" height="44" rx="12" fill="#DFEBDE" stroke="#4C7A57" stroke-width="2"/>
    <text x="720" y="207" text-anchor="middle" font-size="13" font-weight="600" fill="#24422E">Repo plan hub</text>
    <text x="720" y="222" text-anchor="middle" font-size="10" fill="#4C7A57">execution truth</text>

    <rect x="620" y="298" width="200" height="44" rx="12" fill="#DFEBDE" stroke="#4C7A57" stroke-width="2"/>
    <text x="720" y="318" text-anchor="middle" font-size="13" font-weight="600" fill="#24422E">Google Doc</text>
    <text x="720" y="333" text-anchor="middle" font-size="10" fill="#4C7A57">external canonical</text>

    <rect x="620" y="520" width="200" height="44" rx="12" fill="#DFEBDE" stroke="#4C7A57" stroke-width="2"/>
    <text x="720" y="540" text-anchor="middle" font-size="13" font-weight="600" fill="#24422E">Linear</text>
    <text x="720" y="555" text-anchor="middle" font-size="10" fill="#4C7A57">internal records</text>
  </g>

  <text x="450" y="782" text-anchor="middle" font-size="12" fill="#6E6857">A claim has exactly one home; the other two surfaces link to it rather than restating it.</text>
  <text x="450" y="806" text-anchor="middle" font-size="12" fill="#6E6857">Corrections flow repo → Linear → Google Doc. Never hand-edit a mirror on its own.</text>

  <text x="450" y="868" text-anchor="middle" font-size="10.5" fill="#8A8578">Green Goods · Commitment Pooling — v1 (2026-07)</text>
</svg>
