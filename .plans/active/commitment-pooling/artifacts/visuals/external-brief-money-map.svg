<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="2200" viewBox="0 0 1100 1100" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="money-map-title money-map-desc">
  <title id="money-map-title">Where value lives and how movement is proven</title>
  <desc id="money-map-desc">A stacked map separates Arbitrum proof and coordination from Celo G dollar movement. Arbitrum records commitments, reported transactions, and oracle-verified receipts. Celo holds the House of Alignment stream, protocol treasury, garden accounts, and gated member delivery. G dollars never bridge to Arbitrum.</desc>
  <defs>
    <marker id="money-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 Z" fill="#988D77"/>
    </marker>
    <marker id="money-arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 Z" fill="#988D77"/>
    </marker>
  </defs>

  <rect width="1100" height="1100" fill="#FBF8F2"/>
  <text x="550" y="56" text-anchor="middle" font-size="36" font-weight="700" fill="#2A2722">Where value lives, and how we know it moved</text>
  <text x="550" y="92" text-anchor="middle" font-size="19" fill="#6E6857">proof and coordination stay separate from the G$ settlement rail</text>

  <!-- Arbitrum proof panel -->
  <rect x="55" y="135" width="990" height="350" rx="18" fill="#FFFFFF" stroke="#2A2722" stroke-width="2"/>
  <text x="90" y="180" font-size="27" font-weight="700" fill="#2A2722">Arbitrum — proof &amp; coordination</text>
  <text x="90" y="211" font-size="18" fill="#6E6857">A report is a claim. Only the finalized-receipt check turns it into proof.</text>

  <g fill="none" stroke="#988D77" stroke-width="3" marker-end="url(#money-arrow)">
    <path d="M 350 329 L 407 329"/>
    <path d="M 670 329 L 727 329"/>
  </g>
  <text x="700" y="277" text-anchor="middle" font-size="17" fill="#6E6857">Chainlink Functions checks the finalized Celo receipt</text>

  <rect x="90" y="285" width="260" height="90" rx="14" fill="#FFFFFF" stroke="#988D77" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="220" y="311" text-anchor="middle" font-size="21" font-weight="700" fill="#3B372E"><tspan x="220">Commitments +</tspan><tspan x="220" dy="25">register</tspan></text>
  <text x="220" y="362" text-anchor="middle" font-size="17" fill="#6E6857">planned · August</text>

  <rect x="410" y="285" width="260" height="90" rx="14" fill="#FFFFFF" stroke="#988D77" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="540" y="321" text-anchor="middle" font-size="23" font-weight="700" fill="#3B372E">Reported</text>
  <text x="540" y="351" text-anchor="middle" font-size="18" fill="#6E6857">Celo tx recorded · not proof</text>

  <rect x="730" y="285" width="280" height="90" rx="14" fill="#DFEBDE" stroke="#4C7A57" stroke-width="2.5"/>
  <text x="870" y="321" text-anchor="middle" font-size="23" font-weight="700" fill="#24422E">Oracle-verified ✓</text>
  <text x="870" y="351" text-anchor="middle" font-size="18" fill="#4C6B54">no human override</text>

  <text x="550" y="437" text-anchor="middle" font-size="19" font-weight="600" fill="#2A2722">Arbitrum stores evidence state; it never holds or bridges G$.</text>

  <!-- explicit no-bridge boundary -->
  <line x1="120" y1="520" x2="980" y2="520" stroke="#A65D57" stroke-width="2.5"/>
  <rect x="392" y="499" width="316" height="42" rx="12" fill="#FBF8F2"/>
  <g stroke="#A65D57" stroke-width="3" stroke-linecap="round">
    <line x1="417" y1="509" x2="435" y2="527"/>
    <line x1="417" y1="527" x2="435" y2="509"/>
  </g>
  <text x="452" y="526" font-size="20" font-weight="700" fill="#8A4A44">No bridged G$, ever</text>

  <!-- Celo value panel -->
  <rect x="55" y="565" width="990" height="365" rx="18" fill="#FFFFFF" stroke="#2A2722" stroke-width="2"/>
  <text x="90" y="610" font-size="27" font-weight="700" fill="#2A2722">Celo — where G$ lives and moves</text>
  <text x="90" y="641" font-size="18" fill="#6E6857">The upstream stream lands in the protocol treasury, then follows one funding route.</text>

  <g fill="none" stroke="#988D77" stroke-width="3" marker-end="url(#money-arrow)">
    <path d="M 295 754 L 322 754"/>
    <path d="M 535 754 L 562 754"/>
  </g>
  <path d="M 775 754 L 802 754" fill="none" stroke="#988D77" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#money-arrow-muted)"/>

  <rect x="85" y="700" width="210" height="108" rx="14" fill="#DFEBDE" stroke="#4C7A57" stroke-width="2.5"/>
  <text x="190" y="738" text-anchor="middle" font-size="21" font-weight="700" fill="#24422E">House of Alignment</text>
  <text x="190" y="765" text-anchor="middle" font-size="18" fill="#4C6B54">upstream stream</text>
  <text x="190" y="790" text-anchor="middle" font-size="16" fill="#4C6B54">not a GG action</text>

  <rect x="325" y="700" width="210" height="108" rx="14" fill="#DFEBDE" stroke="#4C7A57" stroke-width="2.5"/>
  <text x="430" y="738" text-anchor="middle" font-size="21" font-weight="700" fill="#24422E">GG protocol</text>
  <text x="430" y="765" text-anchor="middle" font-size="21" font-weight="700" fill="#24422E">treasury</text>

  <rect x="565" y="700" width="210" height="108" rx="14" fill="#FFFFFF" stroke="#988D77" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="670" y="750" text-anchor="middle" font-size="22" font-weight="700" fill="#3B372E">Garden accounts</text>
  <text x="670" y="781" text-anchor="middle" font-size="17" fill="#6E6857">planned · gated</text>

  <rect x="805" y="700" width="210" height="108" rx="14" fill="#FFFFFF" stroke="#988D77" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="910" y="750" text-anchor="middle" font-size="22" font-weight="700" fill="#3B372E">Members</text>
  <text x="910" y="781" text-anchor="middle" font-size="17" fill="#6E6857">sponsored-account gate</text>

  <text x="550" y="875" text-anchor="middle" font-size="18" fill="#6E6857">If the member-delivery gate fails, garden funding can continue while that member leg waits.</text>

  <g>
    <rect x="300" y="975" width="28" height="20" rx="5" fill="#DFEBDE" stroke="#4C7A57" stroke-width="2"/>
    <text x="341" y="992" font-size="18" fill="#2A2722">Built / Oracle-verified</text>
    <rect x="565" y="975" width="28" height="20" rx="5" fill="#FFFFFF" stroke="#988D77" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="606" y="992" font-size="18" fill="#2A2722">Planned / gated</text>
  </g>

  <text x="550" y="1070" text-anchor="middle" font-size="16" fill="#6E6857">Green Goods · Commitment Pooling — v1.2 (2026-07)</text>
</svg>
