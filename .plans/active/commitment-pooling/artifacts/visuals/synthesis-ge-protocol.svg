<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 800 800" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="ge-title ge-desc">
  <title id="ge-title">Six protocol functions adapted by Green Goods</title>
  <desc id="ge-desc">A two-row grid presents curation, valuation, limitation, exchange, route, and repair as six distinct protocol functions.</desc>
  <rect x="0" y="0" width="800" height="800" fill="#FBF8F2"/>

  <text x="400" y="46" text-anchor="middle" font-size="23" font-weight="700" fill="#2A2722">Six protocol functions Green Goods adapts</text>
  <text x="400" y="70" text-anchor="middle" font-size="11" fill="#6E6857">community judgment, bounded exchange, and explicit recovery</text>

  <!-- Curation -->
  <g>
    <rect x="55" y="120" width="210" height="205" rx="12" fill="#FFFFFF" stroke="#2A2722" stroke-width="2"/>
    <text x="160" y="202" text-anchor="middle" font-size="13" font-weight="600" fill="#2A2722">Curation</text>
    <text x="160" y="228" text-anchor="middle" font-size="10.5" fill="#6E6857">the community decides which</text>
    <text x="160" y="244" text-anchor="middle" font-size="10.5" fill="#6E6857">commitments belong in the pool</text>
  </g>

  <!-- Valuation -->
  <g>
    <rect x="295" y="120" width="210" height="205" rx="12" fill="#FFFFFF" stroke="#2A2722" stroke-width="2"/>
    <text x="400" y="202" text-anchor="middle" font-size="13" font-weight="600" fill="#2A2722">Valuation</text>
    <text x="400" y="228" text-anchor="middle" font-size="10.5" fill="#6E6857">human judgment compares</text>
    <text x="400" y="244" text-anchor="middle" font-size="10.5" fill="#6E6857">contributions and outcomes</text>
  </g>

  <!-- Limitation -->
  <g>
    <rect x="535" y="120" width="210" height="205" rx="12" fill="#FFFFFF" stroke="#2A2722" stroke-width="2"/>
    <text x="640" y="202" text-anchor="middle" font-size="13" font-weight="600" fill="#2A2722">Limitation</text>
    <text x="640" y="228" text-anchor="middle" font-size="10.5" fill="#6E6857">caps keep one member or asset</text>
    <text x="640" y="244" text-anchor="middle" font-size="10.5" fill="#6E6857">from dominating the pool</text>
  </g>

  <!-- Exchange -->
  <g>
    <rect x="55" y="365" width="210" height="205" rx="12" fill="#FFFFFF" stroke="#2A2722" stroke-width="2"/>
    <text x="160" y="447" text-anchor="middle" font-size="13" font-weight="600" fill="#2A2722">Exchange</text>
    <text x="160" y="473" text-anchor="middle" font-size="10.5" fill="#6E6857">pooled commitments are drawn on</text>
    <text x="160" y="489" text-anchor="middle" font-size="10.5" fill="#6E6857">and honored over time</text>
  </g>

  <!-- Route -->
  <g>
    <rect x="295" y="365" width="210" height="205" rx="12" fill="#FFFFFF" stroke="#2A2722" stroke-width="2"/>
    <text x="400" y="447" text-anchor="middle" font-size="13" font-weight="600" fill="#2A2722">Route</text>
    <text x="400" y="473" text-anchor="middle" font-size="10.5" fill="#6E6857">commitments and support follow</text>
    <text x="400" y="489" text-anchor="middle" font-size="10.5" fill="#6E6857">declared community pathways</text>
  </g>

  <!-- Repair -->
  <g>
    <rect x="535" y="365" width="210" height="205" rx="12" fill="#FFFFFF" stroke="#2A2722" stroke-width="2"/>
    <text x="640" y="447" text-anchor="middle" font-size="13" font-weight="600" fill="#2A2722">Repair</text>
    <text x="640" y="473" text-anchor="middle" font-size="10.5" fill="#6E6857">disputes, defaults, and recovery</text>
    <text x="640" y="489" text-anchor="middle" font-size="10.5" fill="#6E6857">restore bounded participation</text>
  </g>

  <text x="400" y="650" text-anchor="middle" font-size="10.5" fill="#8A8578">Six-function framing from the current cited protocol source — adapted clean-room by Green Goods.</text>

  <text x="400" y="772" text-anchor="middle" font-size="10.5" fill="#8A8578">Green Goods · Commitment Pooling — v1 (2026-07)</text>
</svg>
