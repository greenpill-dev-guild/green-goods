<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 800 800" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="800" height="800" fill="#FBF8F2"/>

  <text x="400" y="46" text-anchor="middle" font-size="23" font-weight="700" fill="#2A2722">The four primitives Green Goods adapts</text>

  <!-- Curation -->
  <g>
    <rect x="70" y="105" width="310" height="245" rx="12" fill="#FFFFFF" stroke="#2A2722" stroke-width="2"/>
    <text x="225" y="217" text-anchor="middle" font-size="13" font-weight="600" fill="#2A2722">Curation</text>
    <text x="225" y="243" text-anchor="middle" font-size="10.5" fill="#6E6857">the community decides which</text>
    <text x="225" y="259" text-anchor="middle" font-size="10.5" fill="#6E6857">commitments belong in the pool</text>
  </g>

  <!-- Valuation -->
  <g>
    <rect x="420" y="105" width="310" height="245" rx="12" fill="#FFFFFF" stroke="#2A2722" stroke-width="2"/>
    <text x="575" y="217" text-anchor="middle" font-size="13" font-weight="600" fill="#2A2722">Valuation</text>
    <text x="575" y="243" text-anchor="middle" font-size="10.5" fill="#6E6857">human judgment prices contributions</text>
    <text x="575" y="259" text-anchor="middle" font-size="10.5" fill="#6E6857">relative to each other</text>
  </g>

  <!-- Limitation -->
  <g>
    <rect x="70" y="385" width="310" height="245" rx="12" fill="#FFFFFF" stroke="#2A2722" stroke-width="2"/>
    <text x="225" y="497" text-anchor="middle" font-size="13" font-weight="600" fill="#2A2722">Limitation</text>
    <text x="225" y="523" text-anchor="middle" font-size="10.5" fill="#6E6857">caps keep any one member</text>
    <text x="225" y="539" text-anchor="middle" font-size="10.5" fill="#6E6857">or asset from dominating</text>
  </g>

  <!-- Exchange -->
  <g>
    <rect x="420" y="385" width="310" height="245" rx="12" fill="#FFFFFF" stroke="#2A2722" stroke-width="2"/>
    <text x="575" y="497" text-anchor="middle" font-size="13" font-weight="600" fill="#2A2722">Exchange</text>
    <text x="575" y="523" text-anchor="middle" font-size="10.5" fill="#6E6857">pooled commitments are drawn on</text>
    <text x="575" y="539" text-anchor="middle" font-size="10.5" fill="#6E6857">and honored over time</text>
  </g>

  <text x="400" y="700" text-anchor="middle" font-size="10.5" fill="#8A8578">Grassroots Economics' commitment-pooling protocol (Ruddick 2023) — adapted clean-room by Green Goods.</text>

  <text x="400" y="772" text-anchor="middle" font-size="10.5" fill="#8A8578">Green Goods · Commitment Pooling — v1 (2026-07)</text>
</svg>
