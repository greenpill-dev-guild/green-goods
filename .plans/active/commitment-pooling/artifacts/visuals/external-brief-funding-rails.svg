<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="2000" viewBox="0 0 1000 1000" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="funding-rails-title funding-rails-desc">
  <title id="funding-rails-title">Funding follows delivered outcomes, not promises</title>
  <desc id="funding-rails-desc">Impact-certificate sales, supporter-vault yield, direct donations, and planned G dollar settlement converge on delivered and confirmed outcomes. Solid green surfaces are built; dashed surfaces are planned.</desc>
  <defs>
    <marker id="funding-rails-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 Z" fill="#988D77"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="1000" fill="#FBF8F2"/>

  <!-- title -->
  <text x="500" y="88" text-anchor="middle" font-size="32" font-weight="700" fill="#2A2722">Funding follows delivered outcomes, not promises</text>

  <!-- Rail 1: Impact certificates -->
  <rect x="44" y="194" width="310" height="88" rx="12" fill="#DFEBDE" stroke="#4C7A57" stroke-width="2"/>
  <text x="199" y="222" text-anchor="middle" font-size="20" font-weight="600" fill="#24422E">Impact certificates</text>
  <text x="199" y="249" text-anchor="middle" font-size="17" fill="#4C6B54">funders buy fractions of delivered work</text>
  <text x="199" y="273" text-anchor="middle" font-size="16" fill="#4C6B54">marketplace Built · bundling Planned</text>
  <rect x="230" y="164" width="164" height="28" rx="8" fill="#FFFFFF" stroke="#988D77" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="312" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#6E6857">bundling Planned</text>

  <!-- Rail 2: Supporter vaults -->
  <rect x="44" y="374" width="310" height="88" rx="12" fill="#DFEBDE" stroke="#4C7A57" stroke-width="2"/>
  <text x="199" y="402" text-anchor="middle" font-size="20" font-weight="600" fill="#24422E">Supporter vaults</text>
  <text x="199" y="429" text-anchor="middle" font-size="17" fill="#4C6B54">principal stays yours</text>
  <text x="199" y="452" text-anchor="middle" font-size="17" fill="#4C6B54">yield buys certificate fractions</text>

  <!-- yield loop -->
  <path d="M 445 379 A 13 13 0 1 1 432 366" fill="none" stroke="#988D77" stroke-width="2.25" marker-end="url(#funding-rails-arrow)"/>
  <text x="454" y="383" font-size="16" fill="#6E6857">yield loop</text>

  <!-- Rail 3: Direct support and G$ settlement -->
  <text x="231" y="548" text-anchor="middle" font-size="21" font-weight="600" fill="#2A2722">Direct support + G$ settlement</text>
  <rect x="44" y="566" width="130" height="70" rx="12" fill="#DFEBDE" stroke="#4C7A57" stroke-width="2"/>
  <text x="109" y="608" text-anchor="middle" font-size="20" font-weight="600" fill="#24422E">donations</text>
  <rect x="188" y="566" width="230" height="70" rx="12" fill="#FFFFFF" stroke="#988D77" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="303" y="594" text-anchor="middle" font-size="17" font-weight="600" fill="#3B372E">G$ pays members for</text>
  <text x="303" y="619" text-anchor="middle" font-size="17" font-weight="600" fill="#3B372E">fulfilled commitments</text>

  <!-- converging arrows -->
  <path d="M 358 238 C 480 238 620 320 718 368" fill="none" stroke="#988D77" stroke-width="2.25" marker-end="url(#funding-rails-arrow)"/>
  <path d="M 358 418 C 480 418 600 410 718 400" fill="none" stroke="#988D77" stroke-width="2.25" marker-end="url(#funding-rails-arrow)"/>
  <path d="M 422 601 C 520 601 635 503 718 440" fill="none" stroke="#988D77" stroke-width="2.25" marker-end="url(#funding-rails-arrow)"/>

  <!-- destination node -->
  <rect x="726" y="330" width="230" height="140" rx="12" fill="#DFEBDE" stroke="#4C7A57" stroke-width="2"/>
  <text x="841" y="390" text-anchor="middle" font-size="22" font-weight="700" fill="#24422E">Delivered, confirmed</text>
  <text x="841" y="420" text-anchor="middle" font-size="22" font-weight="700" fill="#24422E">outcomes</text>

  <!-- caption -->
  <text x="500" y="724" text-anchor="middle" font-size="19" fill="#6E6857">Buying a fraction funds work that already happened and was confirmed.</text>

  <!-- legend -->
  <g>
    <rect x="292" y="768" width="26" height="16" rx="4" fill="#DFEBDE" stroke="#4C7A57" stroke-width="2"/>
    <text x="326" y="782" font-size="17" fill="#2A2722">Built — live today</text>

    <rect x="487" y="768" width="26" height="16" rx="4" fill="#FFFFFF" stroke="#988D77" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="521" y="782" font-size="17" fill="#2A2722">Planned — August / September</text>
  </g>

  <text x="500" y="956" text-anchor="middle" font-size="16" fill="#6E6857">Green Goods · Commitment Pooling — v1.1 (2026-07)</text>
</svg>
