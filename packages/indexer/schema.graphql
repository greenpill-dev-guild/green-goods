enum Capital {
  SOCIAL
  MATERIAL
  FINANCIAL
  LIVING
  INTELLECTUAL
  EXPERIENTIAL
  SPIRITUAL
  CULTURAL
  UNKNOWN
}

enum Domain {
  SOLAR
  AGRO
  EDU
  WASTE
  UNKNOWN
}

# Retained for compatibility with existing helper mappings.
enum WeightScheme {
  LINEAR
  EXPONENTIAL
  POWER
}

# Retained for compatibility with existing helper mappings.
enum PoolType {
  HYPERCERT
  ACTION
}

enum DisbursementState {
  UNKNOWN
  QUEUED
  DISPATCHED
  CONFIRMED
  FAILED
  CANCELLED
}

enum DisbursementKind {
  UNKNOWN
  CONTRIBUTOR_CONSIDERATION
  FUNDING
  LOAN_PRINCIPAL
  GARDEN_BENEFICIARY
}

enum FundingRoute {
  UNKNOWN
  NONE
  PROTOCOL_TO_GARDEN
}

enum CommitmentSettlementFlow {
  UNKNOWN
  INTERNAL
  PROTOCOL_TO_GARDEN
  GARDEN_TO_PROTOCOL
  GARDEN_TO_GARDEN
}

enum CommitmentPayoutPlanStatus {
  DRAFT
  PENDING
  PARTIAL
  COMPLETE
  FAILED
}

type SettlementConfiguration {
  id: ID!
  chainId: Int!
  role: String!
  gardenerDeliveryEnabled: Boolean
  protocolGarden: String
  gDollarToken: String!
  hatsModule: String
  commitmentPoolingModule: String
  localContract: String!
  localRouter: String!
  localChainSelector: BigInt!
  remoteChainSelector: BigInt
  remoteEvmChainId: Int
  activePeer: String
  previousPeer: String
  previousPeerExpiresAt: BigInt
  protocolVersion: Int!
  dispatcher: String
  batchSizeLimit: Int!
  maxTransferAmount: BigInt
  maxBatchAmount: BigInt
  maxFeeBps: Int
  maxFeeAmount: BigInt
  periodDuration: Int
  maxPeriodAmount: BigInt
  feeReserveMinimum: BigInt!
  nativeFeeBalance: BigInt!
  feeReserveLow: Boolean!
  peerConfigured: Boolean!
  paused: Boolean!
  pendingPayoutPlanEntityIds: [String!]!
  updatedAt: Int!
}

type CommitmentPayoutPlan {
  id: ID!
  chainId: Int!
  payoutPlanId: BigInt!
  commitmentId: BigInt!
  commitmentEntityId: String!
  providerGarden: String!
  providerGardenId: String!
  payerGarden: String!
  payerGardenId: String!
  settlementFlow: CommitmentSettlementFlow!
  source: String!
  token: String!
  payoutKind: DisbursementKind!
  declaredAmount: BigInt!
  gardenRetainedAmount: BigInt!
  contributorPayoutTotal: BigInt!
  beneficiaryGarden: String
  beneficiaryGardenId: String
  beneficiaryRecipient: String
  beneficiaryAmount: BigInt!
  beneficiaryDisbursementId: BigInt
  beneficiaryDisbursementEntityId: String
  recognitionContributorCount: Int!
  payablePayoutCount: Int!
  preparedPayoutCount: Int!
  confirmedPayoutCount: Int!
  failedPayoutCount: Int!
  cancelledPayoutCount: Int!
  recognitionSnapshotHash: String!
  paymentSnapshotHash: String!
  paymentSnapshotVersion: Int!
  latestEditReasonCID: String
  finalized: Boolean!
  status: CommitmentPayoutPlanStatus!
  disbursementEntityIds: [String!]!
  createdBy: String!
  createdAt: Int!
  finalizedAt: Int
  updatedAt: Int!
}

type Disbursement {
  id: ID!
  chainId: Int!
  disbursementId: BigInt!
  garden: String!
  gardenId: String!
  executorGarden: String!
  executorGardenId: String!
  commitmentId: BigInt
  commitmentEntityId: String
  payoutPlanId: BigInt
  payoutPlanEntityId: String
  contributor: String
  contributorEntityId: String
  settlementFlow: CommitmentSettlementFlow
  kind: DisbursementKind!
  fundingRoute: FundingRoute!
  source: String!
  recipient: String!
  token: String!
  amount: BigInt!
  state: DisbursementState!
  batchId: BigInt
  batchEntityId: String
  reasonCID: String
  attempt: Int!
  executionKey: String
  commandMessageId: String
  dispatchedAt: Int
  celoExecutionTx: String
  acknowledgmentMessageId: String
  confirmedAt: Int
  failureCode: Int
  cancelledFromState: DisbursementState
  createdAt: Int!
  updatedAt: Int!
}

type Action {
  id: ID!
  chainId: Int!
  ownerAddress: String! # Address
  startTime: BigInt!
  endTime: BigInt!
  title: String!
  slug: String! # On-chain slug (e.g., "waste.cleanup_event")
  instructions: String!
  capitals: [Capital!]!
  media: [String!]!
  domain: Domain!
  createdAt: Int!
}

# Tracks which domains are enabled for each garden.
type GardenDomains {
  id: ID! # chainId-gardenAddress
  chainId: Int!
  garden: String! # Garden address
  domainMask: Int! # Bitmask: bit 0=Solar, 1=Agro, 2=Edu, 3=Waste
  domains: [Domain!]!
  updatedAt: Int!
}

type Garden {
  id: ID! # Address
  chainId: Int!
  tokenAddress: String! # Address
  tokenID: BigInt!
  name: String!
  description: String!
  location: String!
  bannerImage: String!
  openJoining: Boolean!
  initialized: Boolean! # false for placeholder entities created by createDefaultGarden()
  createdAt: Int!

  gardeners: [String!]! # Address
  operators: [String!]! # Address
  evaluators: [String!]! # Address
  owners: [String!]! # Address
  funders: [String!]! # Address
  communities: [String!]! # Address

  # Karma GAP Integration
  gapProjectUID: String # Karma GAP project attestation UID (bytes32)
}

enum VaultEventType {
  DEPOSIT
  WITHDRAW
  HARVEST
  EMERGENCY_PAUSED
}

type GardenVault {
  id: ID! # chainId-garden-asset
  chainId: Int!
  garden: String! # Garden address
  asset: String! # Asset address
  vaultAddress: String! # Vault contract address
  totalDeposited: BigInt!
  totalWithdrawn: BigInt!
  totalHarvestCount: Int!
  donationAddress: String
  depositorCount: Int!
  paused: Boolean!
  createdAt: Int!
}

type GardenVaultIndex {
  id: ID! # chainId-garden
  chainId: Int!
  garden: String!
  assets: [String!]!
}

type VaultAddressIndex {
  id: ID! # chainId-vaultAddress
  chainId: Int!
  vaultAddress: String!
  garden: String!
  asset: String!
}

type VaultDeposit {
  id: ID! # chainId-vault-depositor
  chainId: Int!
  garden: String! # Garden address
  asset: String! # Asset address
  vaultAddress: String! # Vault contract address
  depositor: String! # Depositor address
  shares: BigInt!
  totalDeposited: BigInt!
  totalWithdrawn: BigInt!
}

type VaultEvent {
  id: ID! # chainId-txHash-logIndex
  chainId: Int!
  garden: String! # Garden address
  asset: String! # Asset address
  vaultAddress: String! # Vault contract address
  eventType: VaultEventType!
  actor: String! # Caller/sender
  amount: BigInt
  shares: BigInt
  txHash: String!
  timestamp: Int!
}

type Gardener {
  id: ID! # Smart account address
  chainId: Int!
  createdAt: Int!
  firstGarden: String
  gardens: [String!]!

  # Identity (from Gardener smart contract on mainnet or L2)
  owner: String

  # ENS Identity (from mainnet Gardener contract)
  ensName: String
  passkeyCredentialId: String
  claimedAt: Int

  # Profile data stored in ENS text records (mainnet only).
  # Not populated by Envio handlers; resolved client-side from ENS resolver reads.
  ensAvatar: String
  ensDescription: String
  ensTwitter: String
  ensGithub: String
  ensEmail: String
}

type YieldAllocation {
  id: ID! # chainId-txHash-logIndex
  chainId: Int!
  garden: String! # Garden address
  asset: String! # Asset address
  cookieJarAmount: BigInt!
  fractionsAmount: BigInt!
  juiceboxAmount: BigInt!
  totalAmount: BigInt!
  txHash: String!
  timestamp: Int!
}

enum HypercertStatus {
  ACTIVE
  CLAIMED
  SOLD
  UNKNOWN
}

type Hypercert {
  id: ID! # chainId-tokenId
  chainId: Int!
  tokenId: BigInt!
  garden: String! # Garden address
  metadataUri: String! # IPFS URI (ipfs://...)
  mintedAt: Int!
  mintedBy: String! # Operator address who minted
  txHash: String!
  totalUnits: BigInt!
  claimedUnits: BigInt!
  attestationCount: Int!
  attestationUIDs: [String!]! # EAS attestation UIDs bundled into this hypercert
  status: HypercertStatus!
  createdAt: Int!
  updatedAt: Int!
}

type HypercertClaim {
  id: ID! # chainId-hypercertTokenId-claimant
  chainId: Int!
  hypercertId: String! # Reference to parent Hypercert
  claimant: String! # Address who claimed
  units: BigInt!
  claimedAt: Int!
  txHash: String!
}

type GreenWillBadgeDefinition {
  id: ID! # chainId-badgeId
  chainId: Int!
  badgeId: String!
  slug: String!
  metadataURI: String!
  validator: String # Legacy field name; stores the onchain source contract for eligibility checks.
  authorizedIssuer: String
  unlockLock: String
  claimable: Boolean!
  active: Boolean!
  holderCount: Int!
  grantCount: Int!
  updatedAt: Int!
}

type GreenWillBadgeGrant {
  id: ID! # chainId-txHash-logIndex
  chainId: Int!
  badgeId: String!
  owner: String!
  sourceRef: String!
  issuer: String!
  unlockTokenId: BigInt!
  txHash: String!
  timestamp: Int!
}

type GreenWillBadgeOwnership {
  id: ID! # chainId-badgeId-owner
  chainId: Int!
  badgeId: String!
  owner: String!
  sourceRef: String!
  issuer: String!
  unlockTokenId: BigInt!
  issuedAt: Int!
  definitionId: String!
  lastGrantId: String!
}

type CampaignCookieJar {
  id: ID! # chainId-jarAddress
  chainId: Int!
  factoryAddress: String! # CookieJarFactory address
  jarAddress: String! # CookieJar address
  creator: String! # Factory caller
  rawMetadata: String!
  metadataKind: String
  metadataVersion: Int
  slug: String
  title: String
  description: String
  image: String
  externalUrl: String
  sourceGardens: [String!]!
  operatorPolicy: String
  extraAllowlist: [String!]!
  isValidCampaign: Boolean!
  createdAt: Int!
  metadataUpdatedAt: Int!
  txHash: String!
}

