  actionUID: BigInt # null until creationSeen
  requiredCount: Int # null until creationSeen
  approvedCount: Int! # incremented by ApprovedWorkCounted.requirementIndex
  approvalBlockNumber: BigInt # independent cumulative approved-count snapshot cursor
  approvalLogIndex: Int
  createdAt: Int # CommitmentCreated timestamp; null until creationSeen
  updatedAt: Int!
}

