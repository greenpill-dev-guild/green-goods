# Docker Compose for running the full indexer stack
# Use this on macOS if you encounter the system-configuration crate panic
#
# Usage:
#   cd packages/indexer
#   docker compose -f docker-compose.indexer.yaml up --build       # one-shot build + run
#   docker compose -f docker-compose.indexer.yaml watch            # hot-reload mode
#   docker compose -f docker-compose.indexer.yaml up --watch       # build + run + watch in one
#
# In `watch` mode, edits to ./src and ./config.yaml are synced into the indexer
# container and the service is restarted automatically. Edits to ./schema.graphql,
# ./Dockerfile, or ./package.json trigger a full rebuild because Envio v3
# codegen runs in the image build.
#
# This runs:
#   - PostgreSQL (port 3008)
#   - Hasura GraphQL Engine (port 3006)
#   - Green Goods Indexer (port 3007)

services:
  # PostgreSQL database
  envio-postgres:
    image: postgres:17.10
    restart: always
    ports:
      - "${ENVIO_PG_PORT:-3008}:5432"
    volumes:
      - indexer_db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${ENVIO_PG_PASSWORD:-testing}
      POSTGRES_USER: ${ENVIO_PG_USER:-postgres}
      POSTGRES_DB: ${ENVIO_PG_DATABASE:-envio-dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - indexer-network

  # Hasura GraphQL Engine
  graphql-engine:
    image: hasura/graphql-engine:v2.43.0
    ports:
      - "${HASURA_EXTERNAL_PORT:-3006}:8080"
    user: "1001:1001"
    depends_on:
      envio-postgres:
        condition: service_healthy
    restart: always
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://${ENVIO_PG_USER:-postgres}:${ENVIO_PG_PASSWORD:-testing}@envio-postgres:5432/${ENVIO_PG_DATABASE:-envio-dev}
      HASURA_GRAPHQL_ENABLE_CONSOLE: ${HASURA_GRAPHQL_ENABLE_CONSOLE:-true}
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup, http-log, webhook-log, websocket-log, query-log
      HASURA_GRAPHQL_NO_OF_RETRIES: 10
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET:-testing}
      HASURA_GRAPHQL_STRINGIFY_NUMERIC_TYPES: "true"
      PORT: 8080
      HASURA_GRAPHQL_UNAUTHORIZED_ROLE: public
    healthcheck:
      test: timeout 1s bash -c ':> /dev/tcp/127.0.0.1/8080' || exit 1
      interval: 5s
      timeout: 2s
      retries: 50
      start_period: 5s
    networks:
      - indexer-network

  # Green Goods Indexer
  indexer:
    build:
      context: ../..
      dockerfile: packages/indexer/Dockerfile
    ports:
      - "${INDEXER_EXTERNAL_PORT:-3007}:9898"
    depends_on:
      graphql-engine:
        condition: service_healthy
    # Surface incompatible saved state instead of hiding it in a restart loop.
    restart: "no"
    # Envio tracks its entity tables in Hasura on fresh init but leaves its
    # internal envio_* progress tables untracked, which local smoke proofs query.
    # The tracker waits for the schema, backfills what is missing, then exits.
    command:
      - sh
      - -c
      - "./scripts/track-hasura-tables.sh & exec bun run start"
    environment:
      # Database connection (use Docker network hostname)
      ENVIO_PG_HOST: envio-postgres
      ENVIO_PG_PORT: 5432
      ENVIO_PG_USER: ${ENVIO_PG_USER:-postgres}
      ENVIO_PG_PASSWORD: ${ENVIO_PG_PASSWORD:-testing}
      ENVIO_PG_DATABASE: ${ENVIO_PG_DATABASE:-envio-dev}
      # Hasura connection
      # Envio POSTs to this URL directly (no path appended), so it must be the
      # full metadata endpoint. A bare origin returns 404 and table tracking fails.
      HASURA_GRAPHQL_ENDPOINT: http://graphql-engine:8080/v1/metadata
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET:-testing}
      # Envio HyperSync API token. Required for reliable live Arbitrum catch-up.
      ENVIO_API_TOKEN: ${ENVIO_API_TOKEN:-}
      ENVIO_HYPERSYNC_CLIENT_TIMEOUT_MILLIS: ${ENVIO_HYPERSYNC_CLIENT_TIMEOUT_MILLIS:-120000}
      ENVIO_HYPERSYNC_CLIENT_MAX_RETRIES: ${ENVIO_HYPERSYNC_CLIENT_MAX_RETRIES:-0}
    develop:
      watch:
        # Handler TS edits: sync to container and restart envio.
        - action: sync+restart
          path: ./src
          target: /app/packages/indexer/src
          ignore:
            - "**/*.test.ts"
            - "**/*.spec.ts"
            - "**/__tests__/**"
        # Indexer config: envio re-reads on startup.
        - action: sync+restart
          path: ./config.yaml
          target: /app/packages/indexer/config.yaml
        # Schema changes need codegen, which runs in the image.
        - action: rebuild
          path: ./schema.graphql
        # Image-shape changes always force a rebuild.
        - action: rebuild
          path: ./Dockerfile
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ../../bun.lock
        - action: rebuild
          path: ../../package.json
        - action: rebuild
          path: ../../bunfig.toml
        - action: rebuild
          path: ../../patches
    networks:
      - indexer-network

volumes:
  indexer_db_data:

networks:
  indexer-network:
    name: ${INDEXER_NETWORK_NAME:-green_goods_indexer_network}
