    <script id="boot-theme">
      // Set theme before render to prevent flash
      (function() {
        var stored = 'system';
        try {
          stored = localStorage.getItem('theme') || 'system';
        } catch (_) {
          // Denied storage falls back to the OS scheme, as getTheme() does.
        }
        var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var isDark = stored === 'dark' || (stored === 'system' && systemDark);
        var resolved = isDark ? 'dark' : 'light';
        document.documentElement.dataset.theme = resolved;

        // Point the theme-color meta at the selected theme, so the browser
        // chrome matches the app instead of the OS scheme. Shared theme.ts
        // keeps it current after boot.
        var meta = document.querySelector('meta[name="theme-color"]');
        var color = meta && meta.dataset[resolved];
        if (color) meta.content = color;
      })();
    </script>
    <script id="boot-presentation-detector">
      (function () {
        var LOCAL_QUERY_PARAM = "presentation";
        var LOCAL_STORAGE_KEY = "gg-local-presentation-mode";
        var PUBLIC_PATHS = [
          "/",
          "/actions",
          "/cookies",
          "/fund",
          "/gardens",
          "/glossary",
          "/impact",
          "/landing",
          "/vaults",
        ];
        // "/landing" redirects to "/" (config/routes.tsx), so it boots the
        // fullscreen home hero; reporting ceremony pages have no hero; every
        // other website path mounts a banner hero.
        var HOME_HERO_PATHS = ["/", "/landing"];
        var FOCUSED_PREFIX = "/agent/reporting/";
        // The home page and the four navigation pages write their English title
        // as three lines. Every other title wraps on its own.
        var THREE_LINE_TITLE_PATHS = HOME_HERO_PATHS.concat([
          "/actions",
          "/fund",
          "/gardens",
          "/impact",
        ]);

        function isLocalHostname(hostname) {
          var normalized = String(hostname || "").toLowerCase();
          return (
            normalized === "localhost" ||
            normalized.slice(-10) === ".localhost" ||
            normalized === "127.0.0.1" ||
            normalized === "0.0.0.0" ||
            normalized === "::1" ||
            normalized === "[::1]"
          );
        }

        function normalizePathname(pathname) {
          var normalized = String(pathname || "/").replace(/\/+$/, "");
          return normalized || "/";
        }

        function effectivePathname(url) {
          if (url.hash && url.hash.indexOf("#/") === 0) {
            try {
              return new URL(url.hash.slice(1), url.origin).pathname;
            } catch (_) {
              return url.pathname;
            }
          }
          return url.pathname;
        }

        function isProductionPublicWebsiteUrl(url) {
          if (isLocalHostname(url.hostname)) return false;
          var pathname = normalizePathname(effectivePathname(url));
          return (
            PUBLIC_PATHS.indexOf(pathname) !== -1 ||
            pathname.indexOf("/gardens/") === 0 ||
            pathname.indexOf(FOCUSED_PREFIX) === 0
          );
        }

        function heroVariantForUrl(url) {
          var pathname = normalizePathname(effectivePathname(url));
          if (pathname.indexOf(FOCUSED_PREFIX) === 0) return "focused";
          return HOME_HERO_PATHS.indexOf(pathname) !== -1 ? "fullscreen" : "banner";
        }

        function readLocalOverride(url) {
          if (!isLocalHostname(url.hostname)) return null;

          var storage = null;
          try {
            storage = window.sessionStorage;
          } catch (_) {
            storage = null;
          }

          var queryValue = url.searchParams.get(LOCAL_QUERY_PARAM);
          if (queryValue === "auto") {
            if (storage) storage.removeItem(LOCAL_STORAGE_KEY);
            return null;
          }
          if (queryValue === "website" || queryValue === "pwa") {
            if (storage) storage.setItem(LOCAL_STORAGE_KEY, queryValue);
            return queryValue;
          }

          var storedValue = storage ? storage.getItem(LOCAL_STORAGE_KEY) : null;
          return storedValue === "website" || storedValue === "pwa" ? storedValue : null;
        }

        function matchesDisplayMode(query) {
          return typeof window.matchMedia === "function" && window.matchMedia(query).matches;
        }

        function isStandalone() {
          return (
            matchesDisplayMode("(display-mode: window-controls-overlay)") ||
            matchesDisplayMode("(display-mode: standalone)") ||
            matchesDisplayMode("(display-mode: fullscreen)") ||
            navigator.standalone === true
          );
        }

        function hasMobileDeviceSignals() {
          if (navigator.userAgentData && navigator.userAgentData.mobile === true) return true;
          var platform =
            (navigator.userAgentData && navigator.userAgentData.platform) ||
            navigator.platform ||
            "";
          if (/android|iphone|ipad|ipod/i.test(platform)) return true;

          var userAgent = navigator.userAgent || "";
          if (/windows phone|android|iPad|iPhone|iPod/i.test(userAgent)) return true;
          return /Macintosh/.test(userAgent) && navigator.maxTouchPoints > 1;
        }

        var mode = "website";
        var heroVariant = "fullscreen";
        var threeLineTitle = false;
        try {
          var url = new URL(window.location.href);
          var localOverride = readLocalOverride(url);
          if (isProductionPublicWebsiteUrl(url)) {
            mode = "website";
          } else if (localOverride) {
            mode = localOverride;
          } else if (isStandalone() || (isLocalHostname(url.hostname) && hasMobileDeviceSignals())) {
            mode = "pwa";
          }
          heroVariant = heroVariantForUrl(url);
          threeLineTitle =
            THREE_LINE_TITLE_PATHS.indexOf(normalizePathname(effectivePathname(url))) !== -1;
        } catch (_) {
          mode = isStandalone() ? "pwa" : "website";
        }

        document.documentElement.dataset.bootPresentation = mode;
        if (mode === "website") {
          document.documentElement.dataset.bootHero = heroVariant;
          if (threeLineTitle) document.documentElement.dataset.bootTitle = "three-lines";
        }
      })();
    </script>
    <style id="boot-fallback-styles">
      #boot-fallback[hidden],
      #boot-fallback [hidden] {
        display: none !important;
      }

      #boot-fallback {
        --boot-canvas: var(--color-bg-weak-50, #fafaf9);
        --boot-card: var(--color-bg-weak-50, #fafaf9);
        --boot-ink: var(--color-text-strong-950, #1f2a24);
        --boot-muted: var(--color-text-sub-600, #6f756f);
        --boot-line: var(--color-stroke-soft-200, #d7d2c7);
        --boot-deep: var(--color-editorial-deep, #2d2118);
        --boot-deep-fg: var(--color-editorial-deep-fg, #f5f0e8);
        --boot-action: var(--color-primary-action, #1a7544);
        --boot-action-fg: var(--color-primary-action-foreground, #ffffff);
        position: fixed;
        inset: 0;
        z-index: 9999;
        min-height: 100vh;
        box-sizing: border-box;
        background: var(--boot-canvas);
        color: var(--boot-ink);
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      [data-theme="dark"] #boot-fallback {
        --boot-canvas: var(--color-bg-weak-50, #161412);
        --boot-card: var(--color-bg-weak-50, #161412);
        --boot-ink: var(--color-text-strong-950, #f5f0e8);
        --boot-muted: var(--color-text-sub-600, #c5beb4);
        --boot-line: var(--color-stroke-soft-200, #453d35);
        --boot-deep: var(--color-editorial-deep, #120d09);
      }

      /* The loader stays up until auth is ready, then hands off to html, body,
         and SplashScaffold, which all paint bg-white-0; taking the same token
         leaves the handoff seamless. The dark action fallback mirrors the PWA's
         mint/ink pair even when the stylesheet never arrives (DL-088). */
      html[data-boot-presentation="pwa"] #boot-fallback {
        --boot-canvas: var(--color-bg-white-0, #ffffff);
      }

      html[data-boot-presentation="pwa"][data-theme="dark"] #boot-fallback {
        --boot-canvas: var(--color-bg-white-0, #0c0a09);
        --boot-action: var(--color-primary-action, #c2f5da);
        --boot-action-fg: var(--color-primary-action-foreground, #0c0a09);
      }

      .boot-editorial-shell {
        position: relative;
        min-height: 100vh;
        overflow: hidden;
        background: var(--boot-deep);
      }

      /* GEOMETRY SYNC: the editorial skeleton below mirrors the container
         equation of SiteHeader.tsx and PublicEditorialHero.tsx in plain CSS
         (this renders before Tailwind loads). Each mirrored declaration names
         its Tailwind class; bootFallbackGeometry.test.ts fails when either
         side changes — update both together. */
      .boot-editorial-header {
        position: absolute;
        inset: 0 0 auto;
        z-index: 2;
        box-sizing: border-box;
        padding: 0 24px; /* px-6 */
      }

      .boot-editorial-header-row {
        display: flex;
        height: 64px; /* h-16 */
        max-width: 1280px; /* max-w-7xl */
        margin: 0 auto;
        align-items: center;
        justify-content: space-between;
      }

      .boot-editorial-logo {
        display: block;
        width: auto;
        height: 32px;
      }

      .boot-editorial-nav,
      .boot-editorial-actions {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .boot-editorial-menu {
        display: none;
        width: 40px;
        height: 40px;
        align-items: center;
        justify-content: center;
      }

      .boot-editorial-menu::before,
      .boot-editorial-menu::after {
        position: absolute;
        width: 22px;
        height: 2px;
        content: "";
        background: rgb(245 240 232 / 0.78);
      }

      .boot-editorial-menu::before {
        transform: translateY(-4px);
      }

      .boot-editorial-menu::after {
        transform: translateY(4px);
      }

      .boot-editorial-hero {
        position: relative;
        display: flex;
        flex-direction: column; /* flex-col */
        justify-content: flex-end; /* justify-end */
        min-height: 100vh;
        min-height: 100svh; /* min-h-[100svh] */
        box-sizing: border-box;
        padding-top: 88px; /* pt-22 */
        padding-bottom: 56px; /* pb-14 */
        background:
          radial-gradient(circle at 72% 22%, rgb(245 240 232 / 0.08), transparent 34%),
          linear-gradient(145deg, var(--boot-deep), #18291f 62%, #23382b);
      }

      /* Card position replicates the hero's container equation wrapper for
         wrapper (rail → gutter → centered column → left-aligned card) instead
         of viewport offsets, so wide screens can't drift the card. */
      .boot-editorial-card-rail {
        position: absolute;
        right: 0;
        bottom: 56px; /* as pb-14 */
        left: 0;
        z-index: 1;
        box-sizing: border-box;
        padding: 0 24px; /* px-6 */
      }

      /* The hero's rail sits in the hero's flow under its header clearance,
         as the loaded card does, so a card too tall for the hero grows the
         hero instead of sliding under the header. The recovery rail, outside
         the hero, keeps the viewport-anchored offsets above. */
      .boot-editorial-hero .boot-editorial-card-rail {
        position: relative;
        bottom: auto;
      }

      .boot-editorial-card-column {
        max-width: 1280px; /* max-w-7xl */
        margin: 0 auto;
      }

      .boot-editorial-card {
        max-width: 496px; /* max-w-[31rem] */
        box-sizing: border-box;
        padding: 24px; /* p-6 */
        background: var(--boot-card); /* bg-bg-weak-50 */
        box-shadow: 0 30px 80px -30px rgb(18 13 9 / 0.35);
      }

      .boot-skeleton {
        display: block;
        overflow: hidden;
        background:
          linear-gradient(
            100deg,
            transparent 20%,
            rgb(245 240 232 / 0.16) 42%,
            transparent 64%
          ),
          rgb(245 240 232 / 0.14);
        background-position: 120% 0, 0 0;
        background-size: 220% 100%, 100% 100%;
      }

      .boot-editorial-card .boot-skeleton {
        background:
          linear-gradient(
            100deg,
            transparent 20%,
            rgb(255 255 255 / 0.42) 42%,
            transparent 64%
          ),
          color-mix(in srgb, var(--boot-line) 72%, transparent);
        background-position: 120% 0, 0 0;
        background-size: 220% 100%, 100% 100%;
      }

      /* Card content mirrors the hero's real line boxes so the skeleton card's
         height equals the loaded card's at every band. Each bar occupies one
         line-height of the type it stands in for: EditorialHeading display
         scale × leading-[1.04] (home overrides md/lg), EditorialLede
         text-base/md:text-lg × leading-[1.6]. Home hero composition is
         title + lede + actions (no kicker); banner heroes drop the actions.
         Line counts follow the measured wrap thresholds of the real hero
         copy (2026-08-29): title 3→2 at 378px, back to 3 from 768px; lede
         8→7→6→5→4 at 348/364/424/488px, 5 in the md band, 4 from 1024px.
         The home page and the four navigation pages write their English
         title as three lines, so there the title keeps its third bar. */
      .boot-editorial-card {
        --boot-title-lh: 31.2px; /* text-3xl × 1.04 */
        --boot-lede-lh: 25.6px; /* text-base × 1.6 */
      }

      .boot-skeleton-title-group,
      .boot-skeleton-lede-group {
        display: flex;
        flex-direction: column;
      }

      .boot-skeleton-lede-group {
        margin-top: 16px; /* mt-4 */
      }

      .boot-skeleton-title-line {
        height: calc(var(--boot-title-lh) * 0.72);
        margin-block: calc(var(--boot-title-lh) * 0.14);
      }

      .boot-skeleton-lede-line {
        height: calc(var(--boot-lede-lh) * 0.6);
        margin-block: calc(var(--boot-lede-lh) * 0.2);
      }

      .boot-skeleton-title-line:nth-child(1) { width: 94%; }
      .boot-skeleton-title-line:nth-child(2) { width: 76%; }
      .boot-skeleton-title-line:nth-child(3) { width: 58%; }
      .boot-skeleton-lede-line:nth-child(1) { width: 100%; }
      .boot-skeleton-lede-line:nth-child(2) { width: 98%; }
      .boot-skeleton-lede-line:nth-child(3) { width: 96%; }
      .boot-skeleton-lede-line:nth-child(4) { width: 90%; }
      .boot-skeleton-lede-line:nth-child(5) { width: 97%; }
      .boot-skeleton-lede-line:nth-child(6) { width: 94%; }
      .boot-skeleton-lede-line:nth-child(7) { width: 85%; }
      .boot-skeleton-lede-line:nth-child(8) { width: 62%; }

      /* In-band wrap steps: viewport = measured content width + 96px
         (24px gutter + 24px card padding per side below 640px). */
      @media (min-width: 348px) {
        .boot-skeleton-lede-line[data-line="8"] {
          display: none;
        }
      }

      @media (min-width: 364px) {
        .boot-skeleton-lede-line[data-line="7"] {
          display: none;
        }
      }

      /* data-boot-title is stamped by the boot-presentation detector, and the
         fallback's lang by its controller. Other pages and languages wrap on
         their own, to two lines in this band. */
      @media (min-width: 378px) {
        .boot-skeleton-title-line[data-line="3"] {
          display: none;
        }

        [data-boot-title="three-lines"] #boot-fallback[lang="en"] .boot-skeleton-title-line[data-line="3"] {
          display: block;
        }
      }

      @media (min-width: 424px) {
        .boot-skeleton-lede-line[data-line="6"] {
          display: none;
        }
      }

      @media (min-width: 488px) {
        .boot-skeleton-lede-line[data-line="5"] {
          display: none;
        }
      }

      .boot-skeleton-action {
        width: 148px;
        height: 44px; /* hero actions row (pill height) */
        margin-top: 24px; /* mt-6 */
        border-radius: 999px;
      }

      /* Most banner heroes render no actions row (GardenDetail is the
         exception); drop it so banner card heights match. */
      [data-boot-hero="banner"] .boot-editorial-card .boot-skeleton-action {
        display: none;
      }

      .boot-skeleton-nav {
        width: 62px;
        height: 12px;
      }

      .boot-skeleton-cta {
        width: 96px;
        height: 40px;
        border-radius: 999px;
      }

      @media (prefers-reduced-motion: no-preference) {
        .boot-skeleton {
          animation: boot-skeleton-sweep
            calc(
              var(--spring-effects-slow-duration, 500ms) +
              var(--spring-effects-slow-duration, 500ms) +
              var(--spring-effects-slow-duration, 500ms) +
              var(--spring-effects-slow-duration, 500ms)
            )
            var(--spring-effects-easing, ease-in-out) infinite;
        }
      }

      @keyframes boot-skeleton-sweep {
        to {
          background-position: -120% 0, 0 0;
        }
      }

      .boot-editorial-recovery {
        color: var(--boot-ink);
      }

      .boot-editorial-recovery h1 {
        margin: 0;
        max-width: 520px;
        font-family: Fraunces, Georgia, serif;
        font-size: clamp(2rem, 5vw, 3.5rem);
        font-weight: 500;
        line-height: 1.04;
        letter-spacing: -0.02em;
      }

      .boot-editorial-recovery p {
        margin: 18px 0 0;
        max-width: 480px;
        color: var(--boot-muted);
        font-size: 1rem;
        line-height: 1.6;
      }

      .boot-reload-button {
        min-height: 44px;
        margin-top: 24px;
        border: 0;
        border-radius: 999px;
        padding: 0 20px;
        background: var(--boot-action);
        color: var(--boot-action-fg);
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      .boot-reload-button:focus-visible {
        outline: 3px solid var(--boot-action);
        outline-offset: 3px;
      }

      .boot-reload-button[aria-disabled="true"] {
        cursor: wait;
        opacity: 0.72;
      }

      /* GEOMETRY SYNC: the installed app's loading scene mirrors SplashScaffold.tsx
         slot for slot in plain CSS (this renders before Tailwind loads), so the
         logo and the line under it are where sign-in and the could-not-open
         screen draw them and nothing moves on handover. Each mirrored
         declaration names its Tailwind class; bootFallbackGeometry.test.ts fails
         when either side changes, so update both together. Mirrored sizes and the
         logo breakpoint use rem, as Tailwind does, so browser text settings
         scale both scenes together. Every slot is reserved in every state:
         the 11:9 split depends on the block's height. */
      .boot-pwa-shell {
        position: relative;
        display: flex; /* flex */
        flex-direction: column; /* flex-col */
        align-items: center; /* items-center */
        min-height: 100vh; /* min-h-screen */
        box-sizing: border-box;
        padding: 0.5rem 1rem; /* py-2 px-4 */
        overflow-x: hidden;
        overflow-y: auto;
        background: var(--boot-canvas);
        color: var(--boot-ink);
        text-align: center;
      }

      /* Shared anchor: free space splits 11:9 above and below the block. */
      .boot-pwa-shell::before {
        flex-grow: 11;
        /* The upper spacer's 45% remainder lowers the block by 4px. */
        flex-basis: calc(4px * 20 / 9);
        content: "";
      }

      .boot-pwa-shell::after {
        flex-grow: 9;
        content: "";
      }

      .boot-pwa-content {
        display: flex;
        width: 100%; /* w-full */
        max-width: 24rem; /* max-w-sm */
        flex-direction: column;
        align-items: center;
      }

      .boot-pwa-logo-slot {
        flex-shrink: 0;
        margin-bottom: 1rem; /* mb-4 */
      }

      .boot-pwa-content img {
        display: block;
        width: auto; /* w-auto */

         stamped by the boot-presentation detector): short image plate with the
         card spilling below it onto the canvas, mirroring the hero's banner
         variant. The plate's height is a minimum and the rail stays in its

      [data-boot-hero="focused"] .boot-editorial-shell {

    <script id="boot-fallback-controller">
      (function () {
        var root = document.getElementById("root");
        var fallback = document.getElementById("boot-fallback");
        var website = document.getElementById("boot-fallback-website");
        var websiteSkeleton = document.getElementById("boot-website-skeleton");
        var websiteRecovery = document.getElementById("boot-website-recovery");
        var websiteRecoveryTitle = document.getElementById("boot-website-recovery-title");
        var websiteRecoveryBody = document.getElementById("boot-website-recovery-body");
        var websiteReload = document.getElementById("boot-website-reload");
        var pwa = document.getElementById("boot-fallback-pwa");
        var pwaMessage = document.getElementById("boot-pwa-message");
        var pwaNote = document.getElementById("boot-pwa-note");
        var pwaReload = document.getElementById("boot-pwa-reload");
        var presentation = document.documentElement.dataset.bootPresentation || "website";
        var copy = {
          en: {
            applying: "Updating Green Goods…",
            applyingAction: "Updating…",
            loading: "Green Goods is loading.",
            offline: "You’re offline.",
            offlineNote: "Saved screens may still be available.",
            retry: "Try Again",
            stalled: "Green Goods couldn’t update.",
            stalledNote: "Close every Green Goods window, then open the app again.",
            updateWaiting: "An update is waiting.",
            updateWaitingNote: "Close every Green Goods window, then open the app again.",
            update: "Green Goods needs an update.",
            updateAction: "Update App",
            websiteRecoveryTitle: "This page is taking longer than expected.",
            websiteRecoveryBody: "Reload to try again.",
            reload: "Reload",
          },
          es: {
            applying: "Actualizando Green Goods…",
            applyingAction: "Actualizando…",
            loading: "Green Goods se está cargando.",
            offline: "Estás sin conexión.",
            offlineNote: "Las pantallas guardadas pueden seguir disponibles.",
            retry: "Intentar de nuevo",
            stalled: "Green Goods no se pudo actualizar.",
            stalledNote: "Cierra todas las ventanas de Green Goods y vuelve a abrir la app.",
            updateWaiting: "Hay una actualización pendiente.",
            updateWaitingNote: "Cierra todas las ventanas de Green Goods y vuelve a abrir la app.",
            update: "Green Goods necesita actualizarse.",
            updateAction: "Actualizar app",
            websiteRecoveryTitle: "Esta página está tardando más de lo esperado.",
            websiteRecoveryBody: "Recarga para intentarlo de nuevo.",
            reload: "Recargar",
          },
          pt: {
            applying: "Atualizando o Green Goods…",
            applyingAction: "Atualizando…",
            loading: "Green Goods está carregando.",
            offline: "Você está offline.",
            offlineNote: "As telas salvas ainda podem estar disponíveis.",
            retry: "Tentar novamente",
            stalled: "O Green Goods não pôde atualizar.",
            stalledNote: "Feche todas as janelas do Green Goods e abra o app novamente.",
            updateWaiting: "Há uma atualização pendente.",
            updateWaitingNote: "Feche todas as janelas do Green Goods e abra o app novamente.",
            update: "O Green Goods precisa atualizar.",
            updateAction: "Atualizar app",
            websiteRecoveryTitle: "Esta página está demorando mais do que o esperado.",
            websiteRecoveryBody: "Recarregue para tentar novamente.",
            reload: "Recarregar",
          },
        };

        // The choice the app makes once it runs: the stored language, else the first
        // browser language with copy here, else English.
        function bootLanguage() {
          var stored = null;
          try {
            stored = window.localStorage.getItem("gg-language");
          } catch (error) {
            // Storage can be blocked. The browser language still applies.
          }
          var browser =
            navigator.languages && navigator.languages.length
              ? navigator.languages
              : [navigator.language];
          var candidates = stored ? [stored] : browser;
          for (var index = 0; index < candidates.length; index += 1) {
            var tag = String(candidates[index] || "")
              .toLowerCase()
              .slice(0, 2);
            if (Object.prototype.hasOwnProperty.call(copy, tag)) return tag;
          }
          return "en";
        }

        var language = bootLanguage();
        var labels = copy[language];
        // This shell declares the language of its own copy. The page's language is not its to set.
        if (fallback) fallback.lang = language;
        var timer;
        var updateTimer;
        var observer;
        var recoveryTimer;
        var recoveryRegistration;
        var recoveryInstallingWorker;
        var recoveryInFlight = false;

        var PWA_RECOVERY_TIMEOUT_MS = 15000;

        function hasAppContent() {
          return root && root.children.length > 0;
        }

        // The installed app's scene says one thing on the line under the logo
        // and, where there is more, a quiet note under the action. Every slot
        // keeps its place; only what is in it changes.
        function setPwaCopy(line, note) {
          if (pwaMessage) pwaMessage.textContent = line;
          if (pwaNote) {
            pwaNote.textContent = note || "";
            pwaNote.hidden = !note;
          }
        }

        function showFallback(kind) {
          if (!fallback || hasAppContent()) return;
          if (
            kind === "loading" &&
            ["recovery", "applying", "stalled"].indexOf(fallback.dataset.state) !== -1
          ) {
            return;
          }
          if (
            kind === "recovery" &&
            ["applying", "stalled"].indexOf(fallback.dataset.state) !== -1
          ) {
            return;
          }
          var isRecovery = kind === "recovery";
          fallback.hidden = false;
          fallback.dataset.presentation = presentation;
          fallback.dataset.state = isRecovery ? "recovery" : "loading";

          if (presentation === "pwa") {
            if (pwa) {
              pwa.hidden = false;
              pwa.setAttribute("role", isRecovery ? "alert" : "status");
              pwa.setAttribute("aria-live", isRecovery ? "assertive" : "polite");
              pwa.setAttribute("aria-busy", isRecovery ? "false" : "true");
            }
            if (website) website.hidden = true;
            setPwaCopy(isRecovery ? labels.update : labels.loading);
            if (pwaReload) {
              pwaReload.hidden = !isRecovery;
              pwaReload.setAttribute("aria-disabled", "false");
              pwaReload.textContent = labels.updateAction;
            }
            return;
          }

          if (website) {
            website.hidden = false;
            if (isRecovery) website.removeAttribute("aria-hidden");
            else website.setAttribute("aria-hidden", "true");
          }
          if (pwa) pwa.hidden = true;
          if (websiteSkeleton) websiteSkeleton.hidden = isRecovery;
          if (websiteRecovery) {
            websiteRecovery.hidden = !isRecovery;
            if (isRecovery) websiteRecovery.setAttribute("role", "alert");
          }
          if (websiteRecoveryTitle) {
            websiteRecoveryTitle.textContent = labels.websiteRecoveryTitle;
          }
          if (websiteRecoveryBody) {
            websiteRecoveryBody.textContent = labels.websiteRecoveryBody;
          }
          if (websiteReload) {
            websiteReload.hidden = !isRecovery;
            websiteReload.textContent = labels.reload;
          }
        }

        function removeRecoveryListeners() {
          if (recoveryTimer) {
            window.clearTimeout(recoveryTimer);
            recoveryTimer = undefined;
          }
          if (recoveryRegistration) {
            recoveryRegistration.removeEventListener("updatefound", handleUpdateFound);
          }
          if (recoveryInstallingWorker) {
            recoveryInstallingWorker.removeEventListener("statechange", handleInstallingStateChange);
          }
          recoveryRegistration = undefined;
          recoveryInstallingWorker = undefined;
        }

        function setPwaRecoveryState(kind, line, note) {
          if (!fallback || !pwa || !pwaMessage || !pwaReload) return;
          var isApplying = kind === "applying";
          var isAlert = kind === "stalled";

          fallback.dataset.state = kind;
          pwa.setAttribute("role", isAlert ? "alert" : "status");
          pwa.setAttribute("aria-live", isAlert ? "assertive" : "polite");
          pwa.setAttribute("aria-busy", isApplying ? "true" : "false");
          setPwaCopy(line, note);
          pwaReload.hidden = false;
          pwaReload.setAttribute("aria-disabled", isApplying ? "true" : "false");
          pwaReload.textContent = isApplying ? labels.applyingAction : labels.retry;
        }

        function setPwaLoadingState() {
          if (!fallback || !pwa || !pwaMessage || !pwaReload) return;
          fallback.hidden = false;
          fallback.dataset.state = "loading";
          pwa.setAttribute("role", "status");
          pwa.setAttribute("aria-live", "polite");
          pwa.setAttribute("aria-busy", "true");
          setPwaCopy(labels.loading);
          pwaReload.hidden = true;
          pwaReload.setAttribute("aria-disabled", "false");
          pwaReload.textContent = labels.updateAction;
        }

        // reason: "stalled", "updateWaiting" or "offline".
        function stallPwaRecovery(reason) {
          var key = reason || "stalled";
          removeRecoveryListeners();
          recoveryInFlight = false;
          setPwaRecoveryState("stalled", labels[key], labels[key + "Note"]);
          if (pwaReload) pwaReload.focus();
        }

        function activateWaitingWorker(worker) {
          if (!worker || !recoveryInFlight || !("serviceWorker" in navigator)) {
            stallPwaRecovery("stalled");
            return;
          }

          // A waiting worker activates when every page using the old worker is
          // closed. The boot scene must not force activation around the app's
          // quiescence handshake.
          stallPwaRecovery("updateWaiting");
        }

        function handleInstallingStateChange() {
          if (!recoveryInstallingWorker || !recoveryInFlight) return;

          if (recoveryInstallingWorker.state === "installed") {
            activateWaitingWorker(
              (recoveryRegistration && recoveryRegistration.waiting) || recoveryInstallingWorker
            );
          } else if (recoveryInstallingWorker.state === "redundant") {
            stallPwaRecovery("stalled");
          }
        }

        function watchInstallingWorker(worker) {
          if (!worker || !recoveryInFlight) return;
          if (recoveryInstallingWorker === worker) {
            handleInstallingStateChange();
            return;
          }
          if (recoveryInstallingWorker && recoveryInstallingWorker !== worker) {
            recoveryInstallingWorker.removeEventListener("statechange", handleInstallingStateChange);
          }
          recoveryInstallingWorker = worker;
          recoveryInstallingWorker.addEventListener("statechange", handleInstallingStateChange);
          handleInstallingStateChange();
        }

        function handleUpdateFound() {
          if (recoveryRegistration && recoveryRegistration.waiting) {
            activateWaitingWorker(recoveryRegistration.waiting);
            return;
          }
          if (recoveryRegistration && recoveryRegistration.installing) {
            watchInstallingWorker(recoveryRegistration.installing);
          }
        }

        async function recoverPwa() {
          if (recoveryInFlight || presentation !== "pwa") return;
          recoveryInFlight = true;
          setPwaRecoveryState("applying", labels.applying);
          recoveryTimer = window.setTimeout(function () {
            stallPwaRecovery("stalled");
          }, PWA_RECOVERY_TIMEOUT_MS);

          if (!("serviceWorker" in navigator)) {
            stallPwaRecovery("stalled");
            return;
          }

          try {
            recoveryRegistration = await navigator.serviceWorker.getRegistration();
            if (!recoveryInFlight) return;
            if (!recoveryRegistration) {
              stallPwaRecovery("stalled");
              return;
            }

            recoveryRegistration.addEventListener("updatefound", handleUpdateFound);

            if (recoveryRegistration.waiting) {
              activateWaitingWorker(recoveryRegistration.waiting);
              return;
            }
            if (recoveryRegistration.installing) {
              watchInstallingWorker(recoveryRegistration.installing);
              return;
            }
            if (navigator.onLine === false) {
              stallPwaRecovery("offline");
              return;
            }

            await recoveryRegistration.update();
            if (!recoveryInFlight) return;

            if (recoveryRegistration.waiting) {
              activateWaitingWorker(recoveryRegistration.waiting);
            } else if (recoveryRegistration.installing) {
              watchInstallingWorker(recoveryRegistration.installing);
            }
          } catch (_) {
            stallPwaRecovery(navigator.onLine === false ? "offline" : "stalled");
          }
        }

        function clearFallback() {
          if (!hasAppContent()) return;
          if (timer) window.clearTimeout(timer);
          if (updateTimer) window.clearTimeout(updateTimer);
          if (observer) observer.disconnect();
          removeRecoveryListeners();
          recoveryInFlight = false;
          if (fallback) {
            fallback.hidden = true;
            fallback.dataset.state = "cleared";
          }
        }

        function markReactMounted() {
          // Cancel the stale-assets timer the moment React calls in, whatever it
          // has painted. That timer exists to catch a bundle that never arrived,
          // and React running proves one did. A login waiting on auth
          // restoration renders nothing ON PURPOSE, so leaving it armed told the
          // installed PWA after 4.5s that it "needs the latest app files" and
          // offered an update that would reload the sign-in already in flight.
          if (updateTimer) window.clearTimeout(updateTimer);
          // Everything below is about CONTENT, not about the bundle. With an
          // empty root the boot surface has to stay up — and `timer`, which
          // raises it, has to stay armed — or a slow restore flashes blank.
          // The observer re-enters here as soon as React paints.
          if (!hasAppContent()) return;
          if (timer) window.clearTimeout(timer);
          if (observer) observer.disconnect();

          if (fallback && fallback.dataset.state === "cleared") return;

          if (presentation === "website") {
            clearFallback();
            return;
          }

          removeRecoveryListeners();
          recoveryInFlight = false;
          setPwaLoadingState();
        }

        function markBootFailed() {
          clearFallback();
        }

        function reloadWithCacheBust() {
          try {
            var url = new URL(window.location.href);
            url.searchParams.set("gg_reload", String(Date.now()));
            window.location.replace(url.toString());
          } catch (_) {
            window.location.reload();
          }
        }

        window.__GG_CLEAR_BOOT_FALLBACK = clearFallback;
        window.__GG_MARK_BOOT_FAILED = markBootFailed;
        window.__GG_MARK_REACT_MOUNTED = markReactMounted;

        if (websiteReload) websiteReload.addEventListener("click", reloadWithCacheBust);
        if (pwaReload) pwaReload.addEventListener("click", recoverPwa);

        window.addEventListener(
          "error",
          function (event) {
            var target = event && event.target;
            if (target && target.tagName === "SCRIPT" && target.type === "module") {
              showFallback("recovery");
            }
          },
          true
        );

        if (root && "MutationObserver" in window) {
          observer = new MutationObserver(function () {
            if (hasAppContent()) markReactMounted();
          });
          observer.observe(root, { childList: true });
        }

        if (presentation === "pwa") {
          showFallback("loading");
        } else {
          timer = window.setTimeout(function () {
            showFallback("loading");
          }, 200);
        }

        updateTimer = window.setTimeout(function () {
          showFallback("recovery");
        }, 4500);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
