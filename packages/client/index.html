    <meta

      name="description"
      content="Bring Community Impact Onchain"
    />
    <meta name="author" content="Green Goods" />

    <meta property="og:image" content="%BASE_URL%social-home-hero.png" />
    <meta property="og:image:alt" content="Green Goods homepage hero with headline and garden imagery" />
    <meta property="og:image:type" content="image/png" />

    <meta property="og:title" content="Green Goods" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://greengoods.app" />
    <meta property="og:description" content="Bring Community Impact Onchain" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:description" content="Bring Community Impact Onchain" />
    <meta name="twitter:title" content="Green Goods" />
    <meta name="twitter:site" content="greengoodsapp" />
    <meta name="twitter:creator" content="time_is_oba" />
    <meta name="twitter:image" content="%BASE_URL%social-home-hero.png" />
    <meta name="twitter:image:alt" content="Green Goods homepage hero with headline and garden imagery" />
    <link
      rel="apple-touch-icon"
      sizes="57x57"
      href="%BASE_URL%%PWA_APPLE_ICON_57%"
    />
    <link
      rel="apple-touch-icon"
      sizes="60x60"
      href="%BASE_URL%%PWA_APPLE_ICON_60%"
    />
    <link
      rel="apple-touch-icon"
      sizes="72x72"
      href="%BASE_URL%%PWA_APPLE_ICON_72%"
    />
    <link
      rel="apple-touch-icon"
      sizes="120x120"
      href="%BASE_URL%%PWA_APPLE_ICON_120%"
    />
    <link
      rel="apple-touch-icon"
      sizes="144x144"
      href="%BASE_URL%%PWA_APPLE_ICON_144%"
    />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%%PWA_APPLE_ICON_180%" />
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%%PWA_BROWSER_ICON%" />
    <meta name="msapplication-TileColor" content="%PWA_MS_TILE_COLOR%" />
    <meta
      name="msapplication-TileImage"
      content="%BASE_URL%%PWA_MS_TILE_IMAGE%"
    />
    <meta name="theme-color" content="%PWA_THEME_COLOR_LIGHT%" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="%PWA_THEME_COLOR_DARK%" media="(prefers-color-scheme: dark)" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter (sans, body + nav + UI). Loaded across browser + installed PWA. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <!-- Fraunces (editorial serif, public-browser headlines + stat numbers). -->
    <!-- To trial a different serif, swap the family below AND `--font-serif` in shared theme.css. -->
    <!-- See packages/client/DESIGN.browser.md → Typography → Serif options. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&display=swap" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&display=swap"
      rel="stylesheet"
    />

    <title>%PWA_APP_NAME%</title>
    <script>
      // Set theme before render to prevent flash
      (function() {
        var stored = localStorage.getItem('theme') || 'system';
        var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var isDark = stored === 'dark' || (stored === 'system' && systemDark);
        document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div
      id="boot-fallback"
      role="status"
      aria-live="polite"
      style="
        min-height: 100vh;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #fffdf7;
        color: #1f2a24;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        text-align: center;
      "
    >
      <div style="width: min(100%, 320px);">
        <img
          alt=""
          src="%BASE_URL%%PWA_BROWSER_ICON%"
          width="72"
          height="72"
          style="width: 72px; height: 72px; margin: 0 auto 20px; display: block;"
        />
        <p
          id="boot-fallback-message"
          style="margin: 0 0 16px; font-size: 16px; line-height: 1.5; font-weight: 650;"
        >
          Green Goods is loading.
        </p>
        <button
          id="boot-fallback-reload"
          type="button"
          hidden
          style="
            min-height: 44px;
            border: 0;
            border-radius: 999px;
            padding: 0 20px;
            background: #173f2a;
            color: #ffffff;
            font: inherit;
            font-weight: 700;
          "
        >
          Reload
        </button>
      </div>
    </div>
    <script>
      (function () {
        var root = document.getElementById("root");
        var fallback = document.getElementById("boot-fallback");
        var message = document.getElementById("boot-fallback-message");
        var reload = document.getElementById("boot-fallback-reload");
        var language = (document.documentElement.lang || navigator.language || "en")
          .toLowerCase()
          .slice(0, 2);
        var copy = {
          en: {
            loading: "Green Goods is loading.",
            update: "Green Goods needs the latest app files.",
            reload: "Reload",
          },
          es: {
            loading: "Green Goods se esta cargando.",
            update: "Green Goods necesita los archivos mas recientes.",
            reload: "Recargar",
          },
          pt: {
            loading: "Green Goods esta carregando.",
            update: "Green Goods precisa dos arquivos mais recentes.",
            reload: "Recarregar",
          },
        };
        var labels = copy[language] || copy.en;
        var timer;
        var updateTimer;
        var observer;

        function hasAppContent() {
          return root && root.children.length > 0;
        }

        function showFallback(kind) {
          if (!fallback || hasAppContent()) return;
          var isUpdate = kind === "update";
          fallback.hidden = false;
          fallback.style.display = "flex";
          if (message) message.textContent = isUpdate ? labels.update : labels.loading;
          if (reload) {
            reload.hidden = !isUpdate;
            reload.textContent = labels.reload;
          }
        }

        function clearFallback() {
          if (!hasAppContent()) return;
          if (timer) window.clearTimeout(timer);
          if (updateTimer) window.clearTimeout(updateTimer);
          if (observer) observer.disconnect();
          if (fallback) {
            fallback.hidden = true;
            fallback.style.display = "none";
          }
        }

        function reloadWithCacheBust() {
          try {
            var url = new URL(window.location.href);
            url.searchParams.set("gg_reload", String(Date.now()));
            window.location.replace(url.toString());
          } catch (_) {
            window.location.reload();
          }
        }

        window.__GG_CLEAR_BOOT_FALLBACK = clearFallback;

        if (reload) reload.addEventListener("click", reloadWithCacheBust);

        window.addEventListener(
          "error",
          function (event) {
            var target = event && event.target;
            if (target && target.tagName === "SCRIPT" && target.type === "module") {
              showFallback("update");
            }
          },
          true
        );

        document.addEventListener("gg-module-load-failed", function () {
          showFallback("update");
        });

        if (root && "MutationObserver" in window) {
          observer = new MutationObserver(function () {
            if (hasAppContent()) clearFallback();
          });
          observer.observe(root, { childList: true });
        }

        timer = window.setTimeout(function () {
          showFallback("loading");
        }, 1200);

        updateTimer = window.setTimeout(function () {
          showFallback("update");
        }, 4500);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
