# ═══════════════════════════════════════════════════════════════════════════════
# DEFAULT PROFILE — Local Iteration (No via_ir)
# ═══════════════════════════════════════════════════════════════════════════════
# Keep local builds on the fast pipeline (`via_ir = false`).
# Deployment/CI profiles below keep `via_ir = true` for production realism.
[profile.default]
solc = "0.8.28"
ffi = true
auto_detect_solc = false
block_timestamp = 1_680_220_800 # March 31, 2023 at 00:00 GMT
bytecode_hash = "none"
evm_version = "cancun"
fuzz = { runs = 1_000 }
gas_reports = []         # Disabled for speed
optimizer = true
optimizer_runs = 200     # Keep current optimizer behavior to avoid stack-depth regressions
verbosity = 1
libs = ['lib', 'node_modules', '../../node_modules']
out = '.generated/foundry/out/default'
script = "script"
src = 'src'
test = 'test'
via_ir = false
sparse_mode = true       # Only recompile changed files
broadcast = ".generated/foundry/broadcast"
fs_permissions = [
  { access = "read-write", path = "./" }
]
cache = true
cache_path = ".generated/foundry/cache/default"
extra_output_files = [
  "abi",
  "evm.bytecode"
]
additional_compiler_profiles = [
  { name = "via-ir", via_ir = true }
]

# Keep the local iteration profile mostly non-IR.
# Only contracts that still hit stack-depth limits use via_ir here.
[[profile.default.compilation_restrictions]]
paths = "src/registries/Action.sol"
via_ir = true

[[profile.default.compilation_restrictions]]
paths = "src/registries/Deployment.sol"
via_ir = true

[[profile.default.compilation_restrictions]]
paths = "src/modules/Karma.sol"
via_ir = true

[[profile.default.compilation_restrictions]]
paths = "src/modules/Octant.sol"
via_ir = true

[[profile.default.compilation_restrictions]]
paths = "src/mocks/Hats.sol"
via_ir = true

[[profile.default.compilation_restrictions]]
paths = "src/mocks/Juicebox.sol"
via_ir = true

# ═══════════════════════════════════════════════════════════════════════════════
# PRODUCTION PROFILE — Deployment Optimized (Smallest Bytecode)
# ═══════════════════════════════════════════════════════════════════════════════
# Use for: `FOUNDRY_PROFILE=production forge build` before mainnet deploy
# Uses via_ir = true (required) with minimal optimizer_runs for smallest bytecode
[profile.production]
via_ir = true            # Required for TBA/Kernel contracts
optimizer = true
optimizer_runs = 1       # Smallest bytecode (lower = smaller, but more gas per call)
gas_reports = ["*"]
verbosity = 2
bytecode_hash = "none"
out = ".generated/foundry/out/production"
cache_path = ".generated/foundry/cache/production"

# Release simulations receive the exact reviewed production library map, which makes Foundry
# emit already-linked artifacts. Keep those artifacts out of the unlinked production directory:
# the manifest builder must continue to see link references when it recomputes the identity lock.
[profile.release_simulation]
via_ir = true
optimizer = true
optimizer_runs = 1
gas_reports = ["*"]
verbosity = 2
bytecode_hash = "none"
out = ".generated/foundry/out/release-simulation"
cache_path = ".generated/foundry/cache/release-simulation"

# ═══════════════════════════════════════════════════════════════════════════════
# TEST PROFILE — Local + PR Testing (via_ir required, optimizer off for speed)
# ═══════════════════════════════════════════════════════════════════════════════
# Use for: `bun run test`. via_ir must stay on for the full suite: the CCIP
# settlement lane stores Client.EVMTokenAmount[] to storage, which only the IR
# pipeline supports (solc error 1834) — via_ir = false fails to compile even with
# per-path compilation_restrictions. Skipping the Yul optimizer is the speed lever.
[profile.test]
via_ir = true            # Required: CCIP settlement structs only compile under the IR pipeline
optimizer = false        # Skip Yul optimizer: cold compile 556s -> 195s, src-touch recompile 346s -> 80s (M4)
fuzz = { runs = 1_000 }  # Local/PR-friendly fuzz runs (nightly deep lane runs profile.ci at 10_000)
invariant = { runs = 16, depth = 96 }  # PR-loop caps; nightly deep lane restores 256x500 via profile.ci
verbosity = 1            # Quiet output for local iteration
out = ".generated/foundry/out/test"         # Separate artifacts to avoid stale non-via_ir cache
cache_path = ".generated/foundry/cache/test"

# ═══════════════════════════════════════════════════════════════════════════════
# CI PROFILE — Nightly Deep Fuzz + Invariants (scheduled lane, not the PR path)
# ═══════════════════════════════════════════════════════════════════════════════
# Used by .github/workflows/contracts-nightly.yml via `bun run test:deep`.
# PR CI runs profile.test (capped); this profile restores full fuzz/invariant
# depth with optimized bytecode so deep runs execute at realistic speed.
[profile.ci]
via_ir = true            # Required for full codebase compilation
optimizer = true
optimizer_runs = 200     # Balance between bytecode size and gas efficiency
fuzz = { runs = 10_000 }
invariant = { runs = 256, depth = 500 }  # Full depth; profile.test caps to 16x96 for the PR loop
verbosity = 3            # Traces for failing tests only; 4 traces passing tests and bloats logs
out = ".generated/foundry/out/ci"
cache_path = ".generated/foundry/cache/ci"

# ═══════════════════════════════════════════════════════════════════════════════
# E2E PROFILE — Integration Tests
# ═══════════════════════════════════════════════════════════════════════════════
[profile.e2e]
via_ir = true            # Required for full codebase
match_contract = "E2E"
verbosity = 3
out = ".generated/foundry/out/e2e"
cache_path = ".generated/foundry/cache/e2e"

# ═══════════════════════════════════════════════════════════════════════════════
# FORK PROFILE — Fork Tests Against Real Infrastructure
# ═══════════════════════════════════════════════════════════════════════════════
[profile.fork]
via_ir = true
gas_limit = 80_000_000
fuzz = { runs = 32 }
verbosity = 3
out = ".generated/foundry/out/fork"
cache_path = ".generated/foundry/cache/fork"

[etherscan]
  arbitrum = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api", chainId = "42161" }
  sepolia = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api", chainId = "11155111" }
  baseSepolia = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api", chainId = "84532" }
  celo = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api", chainId = "42220" }
  mainnet = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api", chainId = "1" }

[fmt]
  ignore = ["src/vendor/**"]
  bracket_spacing = true
  int_types = "long"
  line_length = 124
  multiline_func_header = "all"
  number_underscore = "thousands"
  quote_style = "double"
  tab_width = 4
  wrap_comments = true

[lint]
exclude_lints = [
  "mixed-case-function",
  "mixed-case-variable",
  "erc20-unchecked-transfer",
  "incorrect-shift"
]

# RPC endpoints for different networks
# IMPORTANT: Only add endpoints with guaranteed env vars here. Foundry eagerly resolves
# all [rpc_endpoints] at startup via StdCheats.rpcUrlStructs(), so missing env vars break
# ALL tests — not just fork tests. Fork tests load RPC URLs via vm.envString() instead.
# Deploy scripts use profile-specific eth_rpc_url (see [profile.*] sections below).
[rpc_endpoints]
localhost = "http://localhost:3009"

# Network-specific profiles
[profile.local]
eth_rpc_url = "http://localhost:3009"

[profile.arbitrum]
eth_rpc_url = "${ARBITRUM_RPC_URL}"

[profile.sepolia]
eth_rpc_url = "${SEPOLIA_RPC_URL}"

[profile.celo]
eth_rpc_url = "${CELO_RPC_URL}"
# NOTE: evm_version = "cancun" (from default profile) is safe for Celo.
# Celo L2 (migrated March 26, 2025) enables Shanghai + Cancun hardforks,
# so PUSH0 (EIP-3855) is fully supported. No paris fallback needed.

# See more config options https://github.com/foundry-rs/foundry/tree/master/config
