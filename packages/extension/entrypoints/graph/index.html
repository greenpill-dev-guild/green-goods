<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grove G0 graph</title>
    <style>
      :root { color-scheme: light; --ink: #2b2a26; --paper: #f8f5ee; --line: #d9d2c3; --moss: #3f6b3a; }
      html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; }
      #root { display: grid; grid-template-rows: auto 1fr; height: 100%; }
      header { display: flex; gap: 1rem; align-items: baseline; padding: 0.6rem 1rem; border-bottom: 1px solid var(--line); }
      header h1 { font-size: 1rem; margin: 0; color: var(--moss); }
      header code { font-size: 0.8rem; color: #6b665c; }
      main { display: grid; grid-template-columns: 1fr 24rem; min-height: 0; }
      #canvas { min-height: 0; }
      aside { border-left: 1px solid var(--line); padding: 0.8rem; overflow: auto; font-size: 0.85rem; }
      aside h2 { font-size: 0.85rem; margin: 0.8rem 0 0.3rem; }
      aside pre { background: #fff; border: 1px solid var(--line); padding: 0.5rem; white-space: pre-wrap; word-break: break-word; max-height: 14rem; overflow: auto; }
      aside button { margin: 0.2rem 0.2rem 0.2rem 0; }
      progress { width: 100%; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
